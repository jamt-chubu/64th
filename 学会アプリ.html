:39", "et": "09:48", "title": "臨地実習前技能修得到達度評価の成果と意義", "sub": "―学生の視点から―", "author": "森 琴音", "akana": "モリ コトネ", "affil": "東海学院大学", "pref": null, "co": ["浦瀬 美穂", "山本 初津恵", "篠田 貢一", "多和田 嘉明", "杉下 毅", "佐藤 恵彦"], "cokana": ["ウラセ ミホ", "ヤマモト ハツエ", "シノダ コウイチ", "タワダ ヨシアキ", "スギシタ ツヨシ", "サトウ シゲヒコ"], "chairs": ["乙訓 貴之（岐阜医療科学大学）"], "field": "学会", "cat1": "その他", "cat2": "その他", "no": 152, "pdf": "0152.pdf", "chkana": ["オトクニ タカユキ"], "body": "臨床検査技師養成所指導ガイドラインの改訂に伴い、本学では令和四年度入学生より新カリキュラムに基づく臨地実習を実施している。臨地実習前技能修得到達度評価（以下、臨地実習前評価）は、実習開始前に学生の知識・技術の到達度を客観的に確認し、実習の安全性と学習効果を高めることを目的として導入された。本研究では、臨地実習前評価の準備から評価試験、さらに臨地実習に至る一連の学修過程を整理し、学生の視点からその成果と意義を検討した。三年次夏季休暇には約三週間のプレ指導を受講し、後期に臨地実習前評価に臨んだ。本学では「必ず実施させる行為」「必ず見学させる行為」に該当する全項目について、筆記試験・実技試験・口頭試問を組み合わせて評価を行っている。評価項目は採血、一般検査、血液検査、生化学検査、生理検査、微生物検査、病理検査など多岐にわたり、学生は全科目の基本的手技について事前に指導を受けた。その後、三年次後期一月から約三か月間、各分野一週間から一か月の臨地実習を経験した。臨地実習前評価で基本的な知識と技術を確認していたことで、実習では落ち着いて検査を遂行できた。不合格となった項目や苦手分野については、実習前に重点的に予習を行うことができ、学修の方向性を明確にする契機となった。また、臨床現場では検査技術だけでなく、患者への話し方を工夫する接遇や誤りを防ぐ確認作業など、臨床検査技師として求められる総合的能力を体感した。臨地実習前評価は、知識・技術の向上のみならず、自身の学修度合いを客観的に把握し、主体的学習を促す点に大きな意義があると考えられた。事前評価によって基礎を固めたことで、臨地実習の充実度が高まり、実践的な学びの深化につながった。", "sid": "s9"}, {"kind": "一般演題", "day": 1, "ven": 2, "hall": "第２会場", "room": "第５会議室（２F）", "st": "09:48", "et": "09:57", "title": "DOACsがクロスミキシングテストに及ぼす影響とその回避策に関する検討", "sub": "", "author": "下田 彩加", "akana": "シモダ アヤカ", "affil": "学校法人修文学院 修文大学", "pref": null, "co": ["赤羽 愛生", "高橋 由衣", "保母 航輝", "都築 沙耶", "三矢 愛里", "帖佐 光洋"], "cokana": ["アカバ アイ", "タカハシ ユイ", "ホボ コウキ", "ツヅキ サヤ", "ミツヤ アイリ", "チョウサ ミツヒロ"], "chairs": ["乙訓 貴之（岐阜医療科学大学）"], "field": "学会", "cat1": "その他", "cat2": "その他", "no": 153, "pdf": "0153.pdf", "chkana": ["オトクニ タカユキ"], "body": "【目的】クロスミキシングテストは凝固因子欠損，凝固因子インヒビターそしてループスアンチコアグラント（LA）などの鑑別診断に極めて有用な検査方法である.しかしDOACs 服用患者血漿ではクロスミキシングテストの鑑別が困難である. 本研究では, 3種類の病態血漿を用いて4種類の DOACs をそれぞれ添加し, 活性化部分トロンボプラスチン時間（APTT）を用いたクロスミキシングテストの影響ついて調べた.さらにDOACs除去剤の有効性について検討を行った．\n\n【方法】正常血漿は健常者から得たプール血漿を用いた.被検血漿に LA陽性血漿, 第Ⅷ因子欠乏血漿, 第Ⅷ因子インヒビター血漿を用いた. 各DOACsはedoxaban, apixaban,rivaroxabanを400ng/mL, dabigatranを300 ng/mLに設定し各被検血漿に添加した. DOACs 除去剤には DOAC-STOP を用いて添付文書に従い薬剤除去を行った.クロスミキシングテスト実施方法は,即時反応では各混合比率を 6 ポイント用手法にて調整後，直ちにAPTTを測定した.また遅延反応では，即時反応と同様のサンプルを37℃，2時間加温後に APTT を測定した.APTT試薬は APTT-SPを用い，全自動血液凝固測定装置 ACL-TOPTM550 CTS で測定した. クロスミキシングテスト判定法は視覚的判定と数値判定法であるICAを用いた.\n\n【結果】DOACs含有血漿でのクロスミキシングテストの結果は, 視覚的判定では薬剤未処理での一致率50％, 薬剤除去後は 66.7％の結果であった. ICA判定では未処理での一致率33.3％, 薬剤除去後は, 全ての薬剤でLA血漿は即時・遅延で 20 以上, 第Ⅷ因子欠乏血漿は即時・遅延で 6 以下, 第Ⅷ因子インヒビター血漿は即時型 12以下, 遅延型で17以上となり, 一致率100％の結果であった.\n\n【考察】視覚的判定の結果は, 薬剤除去前後とも正確に判定することは困難であったが, ICA判定において薬剤除去前は第Ⅷ因子欠乏血漿と第Ⅷ因子インヒビター血漿で実際の疾患との乖離が認められたが, 薬剤除去後の判定では疾患と一致したことから, DOAC-Stop処理とICA判定を組み合わせることで正確な判定ができる可能性が示唆された.", "sid": "s9"}], LINKS={"guide": {"s38": "18_2_特別講演_あり_4.pdf", "s33": "18_3_会長基調講演_あり_1.pdf", "s72": "18_4_日臨技企画_あり_1.pdf", "s8": "19_2_支部シンポジウム_あり_2.pdf", "s46": "19_3_学会シンポジウム_あり_1.pdf", "s35": "20_2_WS1_あり_1.pdf", "s47": "20_3_WS2_あり_1.pdf", "s49": "20_4_WS3_あり_1.pdf", "s57": "20_5_WS4_あり_1.pdf", "s58": "20_6_WS5_あり_1.pdf", "s18": "22_2_生物化学輸血_あり_1.pdf", "s37": "22_3_生理総合_あり_1.pdf", "s51": "22_4_血液病理遺伝子_あり_1.pdf", "s75": "22_5_微生物一般_あり_1.pdf", "s17": "24_2_学生フォーラム_あり_2.pdf", "s28": "25_2_ランチョンセミナー_あり_2.pdf", "s29": "25_2_ランチョンセミナー_あり_2.pdf", "s30": "25_2_ランチョンセミナー_あり_2.pdf", "s31": "25_2_ランチョンセミナー_あり_2.pdf", "s32": "25_2_ランチョンセミナー_あり_2.pdf", "s34": "24_3_キャリアボードゲーム_あり_2.pdf", "s36": "24_3_キャリアボードゲーム_あり_2.pdf", "s40": "25_3_スイーツセミナー_あり_1.pdf", "s41": "25_3_スイーツセミナー_あり_1.pdf", "s67": "25_2_ランチョンセミナー_あり_2.pdf", "s68": "25_2_ランチョンセミナー_あり_2.pdf", "s69": "25_2_ランチョンセミナー_あり_2.pdf", "s70": "25_2_ランチョンセミナー_あり_2.pdf", "s71": "25_2_ランチョンセミナー_あり_2.pdf", "s76": "25_3_スイーツセミナー_あり_1.pdf"}, "ginfo": {"sbus1": "08_2_シャトルバス時刻表_なし_1.pdf", "sbus2": "08_2_シャトルバス時刻表_なし_1.pdf", "s6": "31_企業展示紹介_あり_1.pdf", "s43": "33_学会情報交換会案内_なし_1.pdf", "s45": "31_企業展示紹介_あり_1.pdf", "s54": "29_検査と健康展_あり_1.pdf"}, "info": [{"label": "ご挨拶（学会長）", "file": "07_1_ご挨拶（森本学会長）_あり_1.pdf"}, {"label": "ご挨拶（日臨技会長）", "file": "07_2_ご挨拶（長沢会長）_あり_1.p   const stripe=`repeating-linear-gradient(to bottom,transparent 0,transparent ${hourPx-1}px,#f1f5f9 ${hourPx-1}px,#f1f5f9 ${hourPx}px)`;
  for(const v of vens){
    let c='';
    SESS.filter(s=>s.day===day&&s.ven===v).forEach(s=>{
      const top=(mins(s.start)-T0)*px, ht=Math.max((mins(s.end)-mins(s.start))*px-3,17);
      // パネル高さに応じて表示要素を段階的に省略（見切れ防止）
      const showTime = ht>=34, showSub = ht>=64 && s.sub && s.cat!=='general';
      const tiny = ht<34;
      c+=`<div class="sess bg-${s.cat}${tiny?' tiny':''}" style="top:${top}px;height:${ht}px" title="${esc(s.time+' '+s.title+(s.sub?' '+s.sub:''))}" onclick="openModal('${s.id}')">
        ${favs.has(s.id)?'<span class="star">★</span>':''}${hasMemo(s.id)?'<span class="memodot">📝</span>':''}${guideOf(s.id)?'<span class="doc">📄</span>':''}
        ${showTime?`<span class="tm">${s.time}</span><br>`:''}<span class="t">${esc(s.title)}</span>${showSub?'<br><span class="sb">'+esc(s.sub)+'</span>':''}</div>`;
    });
    h+=`<div class="vencol" style="height:${TOTAL}px;background:${stripe}">${c}</div>`;
  }
  tl.innerHTML=h;
  sizeGrid();
  const now=new Date();
  if(localISO(now)===DAYDATE[day]){
    const m=now.getHours()*60+now.getMinutes();
    if(m>=T0&&m<=END){const l=document.createElement('div');l.className='nowline';l.style.top=(m-T0)*px+30+'px';l.style.gridColumn='1 / -1';tl.appendChild(l);}
  }
}

function nowInfo(){
  const n=new Date(), iso=localISO(n);
  const d=Object.keys(DAYDATE).find(k=>DAYDATE[k]===iso);
  if(!d) return null;
  const m=n.getHours()*60+n.getMinutes(), dd=+d;
  const live=SESS.concat(BLOCKS.filter(b=>b.cat!=='info'))
                 .filter(s=>s.day===dd&&mins(s.start)<=m&&m<mins(s.end))
                 .sort((a,b)=>(a.ven||9)-(b.ven||9));
  const next=SESS.filter(s=>s.day===dd&&mins(s.start)>m).sort((a,b)=>mins(a.start)-mins(b.start));
  const nt=next.length?mins(next[0].start):null;
  return {day:dd,m,live,next:nt!==null?next.filter(s=>mins(s.start)===nt):[]};
}

addEventListener('DOMContentLoaded',()=>{
  const top=document.getElementById('mtop'), box=document.querySelector('.modalbox');
  if(!top||!box) return;
  let y0=null;
  top.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;box.style.transition='';},{passive:true});
  top.addEventListener('touchmove',e=>{
    if(y0===null)return;
    const dy=Math.max(0,e.touches[0].clientY-y0);
    box.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  top.addEventListener('touchend',e=>{
    if(y0===null)return;
    const dy=Math.max(0,(e.changedTouches[0].clientY)-y0);
    box.style.transition='transform .18s ease'; box.style.transform='';
    y0=null;
    if(dy>70) closeModal();
  });
});

   ${memoBox('p'+a.no)}`;
  document.getElementById('modal').scrollTop=0;
  document.getElementById('ovl').classList.add('show');
}
// --- メモ ---
function memoBox(id){
  const v=memos[id]||'';
  return `<div class="memowrap">
    <div class="memolab">📝 メモ<span class="memostat" id="memostat-${id}">${v?'保存済み':''}</span></div>
    <textarea class="memoin" id="memo-${id}" rows="3" placeholder="気づいた点・質問・フォローしたいことなど"
      oninput="onMemo('${id}')" onblur="flushMemo('${id}')">${v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
  </div>`;
}
let memoTimer=null, memoPending=null;
function onMemo(id){
  const st=document.getElementById('memostat-'+id);
  if(st) st.textContent='入力中…';
  memoPending=id;
  clearTimeout(memoTimer);
  memoTimer=setTimeout(()=>flushMemo(id),400);
}
function flushMemo(id){
  clearTimeout(memoTimer);
  const el=document.getElementById('memo-'+(id||memoPending)); if(!el)return;
  setMemo(id||memoPending,el.value);
  const st=document.getElementById('memostat-'+(id||memoPending));
  if(st) st.textContent=el.value.trim()?'保存済み':'';
  memoPending=null; updateBadge();
}

// --- 記録の書き出し ---
function rowsForExport(){
  const rows=[];
  SESS.concat(BLOCKS).forEach(s=>{
    if(!favs.has(s.id)&&!hasMemo(s.id)) return;
    rows.push({day:s.day,time:s.time,ven:s.ven?VENUES[s.ven-1].n:(s.area||''),
      kind:CATS[s.cat]||'案内',no:'',title:s.title+(s.sub?' '+s.sub:''),
      who:(s.chair||'').replace(/座長[:：]/g,''),affil:'',field:'',
      fav:favs.has(s.id)?'★':'',memo:memos[s.id]||''});
  });
  PAPERS.forEach(a=>{
    const id='p'+a.no;
    if(!favs.has(id)&&!hasMemo(id)) return;
    rows.push({day:a.day,time:a.st+'-'+a.et,ven:a.hall,kind:'一般演題',no:a.no,title:a.title,
      who:a.author+(a.co.length?'、'+a.co.join('、'):''),affil:a.affil,field:a.field||'',
      fav:favs.has(id)?'★':'',memo:memos[id]||''});
  });
  rows.sort((x,y)=>x.day-y.day||String(x.time).localeCompare(String(y.time)));
  return rows;
}
function dl(name,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);
}
function exportCSV(){
  const rows=rowsForExport();
  if(!rows.length){alert('メモ・★ともに登録がありません。');return;}
  const H=['日付','時刻','会場','区分','演題番号','タイトル','演者・座長','所属','分野','★','メモ'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[H.map(q).join(',')];
  rows.forEach(r=>lines.push([r.day===1?'10/31(土)':'11/1(日)',r.time,r.ven,r.kind,r.no,r.title,r.who,r.affil,r.field,r.fav,r.memo].map(q).join(',')));
  // ExcelでUTF-8を正しく開くためBOM付き・CRLF
  dl(`令和8年度中部圏支部医学検査学会_メモ_${stamp()}.csv`,'﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;}
function exportBackup(){
  dl(`令和8年度中部圏支部医学検査学会_バックアップ_${stamp()}.json`,
     JSON.stringify({v:1,app:'jamt64',saved:new Date().toISOString(),favs:[...favs],memos},null,1),
     'application/json');
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(o.app!=='jamt64') throw 0;
      const nf=(o.favs||[]).filter(x=>!favs.has(x)).length;
      const nm=Object.keys(o.memos||{}).filter(k=>!hasMemo(k)).length;
      if(!confirm(`読み込みますか？\n★ ${nf}件・メモ ${nm}件 を追加します（既存は保持）`)) {input.value='';return;}
      (o.favs||[]).forEach(x=>favs.add(x));
      Object.entries(o.memos||{}).forEach(([k,v])=>{ if(!hasMemo(k)) memos[k]=v; });
      saveFavs(); saveMemos(); renderAll();
      alert('読み込みました。');
    }catch(e){alert('このファイルは読み込めません。');}
    input.value='';
  };
  r.readAsText(f);
}

   `<h2 style="margin-top:0">💡 このアプリの使い方</h2>

let mapZoom=1;
function drawMap(v){
  const f=LINKS.floor[String(v)]; if(!f)return;
  const vn=VENUES[v-1];
  document.getElementById('lbhead').textContent=`${vn.n}（${vn.r}・${vn.f}）への案内`;
  const img=document.getElementById('lbimg');
  mapZoom=1; img.classList.remove('zoomed'); img.style.width='';
  img.src=MAPDIR+enc(f);
  const sc=document.getElementById('lbscroll'); sc.scrollTop=0; sc.scrollLeft=0;
  document.getElementById('lightbox').classList.add('show');
}
function zoomMap(d){
  const img=document.getElementById('lbimg');
  // 倍率1のときは「画面に収まる大きさ」。その表示幅を基準に拡大する
  if(mapZoom===1){ img.classList.remove('zoomed'); img.style.width=''; img.dataset.base=img.clientWidth; }
  mapZoom=Math.min(4,Math.max(1,mapZoom+d*0.5));
  if(mapZoom===1){ img.classList.remove('zoomed'); img.style.width=''; }
  else { img.classList.add('zoomed'); img.style.width=Math.round(img.dataset.base*mapZoom)+'px'; }
}
function renderAll(){updateBadge();if(view==='grid')renderGrid();else if(view==='list')renderList();else if(view==='idx')renderIdx();else if(view==='my')renderMy();else if(view==='info')renderInfo();}
