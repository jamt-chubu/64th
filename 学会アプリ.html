と下肢静脈エコー検査を行っている。本研究の目的は、術前下肢静脈エコー検査件数の増加に伴い、現状を把握して DVT検出率や Dダイマーの有用性を再評価し、下肢静脈エコー検査の必要性について検討することである。\n\n【対象と方法】2023年4月～2026年3月に人工膝関節全置換術(TKA)および人工膝関節単類置換術(UKA)の術前検査として D ダイマーの測定と下肢静脈エコーを施行した607件を対象とした。下肢静脈エコー結果によりDVT群と非DVT群の2群に分け、年齢や性別、膝手術の既往およびDダイマー値について比較検討した。\n\n【結果】DVT群と非DVT群のDダイマー値は2.94±3.20と1.28±1.61μg/mLでありDVT群で有意に高値であった(P＜0.01)。また、高齢で女性が有意に多く、置換手術の既往がある患者に高率に認められた(P＜0.01)。DVTに関連する因子についての多変量解析では、Ｄダイマーが最も有意であり、オッズ比1.32であった(P＜0.01)。DダイマーによるDVTの検出能についてROC解析の結果、cut-off値は0.9μg/mLで感度71％、特異度68％、陽性的中率27％、陰性的中率93％であった。\n\n【考察と結語】Dダイマーは DVT群で有意に高値を示し、ROC解析では陰性的中率 93％と除外診断としての有用性が支持された。しかし、Dダイマー値が基準値以下であっても血栓を有する症例もみられたため、Dダイマー単独ではDVTを見逃すリスクがあることも示された。Dダイマーを測定し、一定の基準値を超える症例に対して下肢エコーを施行するという二段階検査が、効率的かつ実践的であると考えられる。また、高齢女性や置換手術の既往がある患者はDVTのリスクが高いため、臨床的判断により積極的なエコー検査が必要であると考えられた。 連絡先 058—239—8111（1500）", "sid": "s61"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:09", "et": "11:18", "title": "脂肪肝指標ATI Gradingと血液データの関連性", "sub": "", "author": "大島 康平", "akana": "オオシマ コウヘイ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["石田 秀和", "渡邉 颯真", "出口 和樹", "髙田 彩永", "伊藤 亜子", "大澤 徳子", "菊地 良介"], "cokana": ["イシダ ヒデカズ", "ワタナベ ソウマ", "デグチ カズキ", "タカダ アヤエ", "イトウ アコ", "オオザワ ノリコ", "キクチ リョウスケ"], "chairs": ["元地 進（医療法人社団 浅ノ川 浅ノ川総合病院）"], "field": "生理", "cat1": "統計学", "cat2": "その他の超音波", "no": 97, "pdf": "0097.pdf", "chkana": ["モトチ ススム"], "body": "【はじめに】超音波検査におけるattenuation imaging（ATI）は，脂肪肝を非侵襲的かつ定量的に評価可能な手法として臨床応用が進んでいるが，ATI値に影響を及ぼす因子については十分に解明されていない。脂肪肝の病態には性差が関与することが報告されており，ATIに関連する因子についても男女で異なる可能性が考えられる。そこで本研究では，中等度以上の脂肪肝をアウトカムとして男女別解析を行い，ATI高値に関連する因子について検討した。\n\n【対象と方法】腹部超音波検査時にATIを測定した182例（男性74例，女性108例）を対象とした。ATI GradingはG1〜G4に分類し，中等度以上の脂肪肝であるG3+G4をアウトカムとした。ATIに関連する因子候補として，年齢，性別，BMI，血液検査データとの関連を検証した。G3+G4群をアウトカムとして単変量ロジスティック回帰分析を行い，有意項目を用いて多変量ロジスティック回帰分析を実施した。群間比較にはMann–Whitney U検定およびχ²検定を用いた。\n\n【結果】182例中，G3+G4群は116例，G1+G2群は66例であった。そのうち男性はG3+G4群で36例（48.6%），G1+G2群で38例（51.4%）であり，女性はG3+G4群で80例（74.1%），G1+G2群で28例（25.9%）であった。まず，全例を対象にG3+G4群と G1+G2 群の比較を行った結果，ALT，γ-GT，FIB-4index，HDL-C，PLT，UN/Creに有意差を認めた。次に，G3+G4群をアウトカムとしてロジスティック回帰分析を行った結果，単変量解析では女性，TG，PLTが有意な関連因子として抽出され，多変量解析においても同様に女性，TG，PLTが独立した関連因子であった。性差の関与が示唆されたため男女別解析を行った。その結果，男性では単変量解析でALT, TG, HDL-C が有意因子として抽出され，多変量解析では TG およびHDL-Cが独立した関連因子であった。一方，女性では単変量解析，多変量解析ともにPLTのみが有意な関連因子であった。\n\n【考察】ATI高値に関連する因子には性差が認められ，男性では脂質代謝関連指標，女性ではPLTが独立した関連因子として抽出された。ATI評価においては，性別による病態背景の違いを考慮する必要性が示唆された。連絡先：058-230-6000 内線 7261", "sid": "s61"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:18", "et": "11:27", "title": "腹部超音波による肝硬度測定（Vs）と各種肝線維化マーカーの相関性に関する検討", "sub": "", "author": "佐藤 結佳", "akana": "サトウ ユイカ", "affil": "社会医療法人 蘇西厚生会 松波総合病院", "pref": "岐阜県", "co": ["檜谷 彩", "山本 彩夏", "松原 愛", "神谷 敏之", "後藤 幸雄", "長屋 麻紀", "菊地 良介"], "cokana": ["ヒノキダニ アヤ", "ヤマモト アヤカ", "マツバラ アイ", "カミヤ トシユキ", "ゴトウ ユキオ", "ナガヤ マキ", "キクチ リョウスケ"], "chairs": ["元地 進（医療法人社団 浅ノ川 浅ノ川総合病院）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "その他の超音波", "no": 98, "pdf": "0098.pdf", "chkana": ["モトチ ススム"], "body": "【背景】腹部超音波検査（AUS）による剪断波速度（Vs）を用いた肝硬度評価は、簡便かつ非侵襲的であり、日常診療で広く用いられている。Vsと各種の肝線維化マーカーとの関連性については、まだ十分な検討がなされていない。\n\n【目的】当院外来でAUSによる肝硬度測定を施行した症例を対象に、VsとFIB-4 index（以下FIB-4）や各種の血清肝線維化マーカーとの相関を検討した。\n\n【対象と方法】2025年11月～2026年3月にAUSで肝硬度測定を施行した486例中、肝臓移植後例を除外した21～93歳の男性234人、女性232人を対象とした。FUJI FILM社製ARIETTA750LEおよび850SEを用い、SWI（Shear WaveImaging）にてVsを測定した。Vsと肝線維化マーカー（FIB-4、M2BPGi、ヒアルロン酸）の相関解析を行い、さらに疾患別（HBV関連、HCV関連、MAFLD）、性別、年齢別でも検討した。\n\n【結果】VsとFIB-4にはrs=0.466の正の相関が認められた。疾患別の解析では、各疾患群で有意差は認められなかった。一方、性別による解析では女性群で有意な相関が認められた。また、年齢層別の解析では 65歳未満では相関が高く、65歳以上では低かった。さらに、一部の症例で測定されたM2BPGiについてもVsとrs=0.597の正の相関が認められた。\n\n【考察】Vsと肝線維化マーカーとして広く用いられているFIB-4との間に有意な正の相関が認められた。これは、Vsが非侵襲的に肝線維化の程度を反映し、日常診療におけるスクリーニングや経過観察に有用である可能性が示唆された。疾患別解析で有意差が認められなかったことは、症例数が限られていることが大きいと思われるが、全例で相関が認められたことから、肝疾患の成因に関わらず幅広く有用であると考えられた。一方、女性群でより有意な相関（p=0.018）が認められたが、男性では生活習慣が影響している可能性も推定された。さらに、FIB-4は年齢を含む計算式であるため、留意が必要である。\n\n【結論】AUSで測定したVsが、肝線維化マーカーであるFIB-4や M2BPGiと正の相関を示すことを明らかにした。Vsは非侵襲的な肝線維化評価の指標として、日常診療に貢献しうると考えられた。", "sid": "s61"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:27", "et": "11:36", "title": "精巣超音波検査を契機に診断し得たリヒター症候群の１例", "sub": "", "author": "出口 和樹", "akana": "デグチ カズキ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["髙田 彩永", "渡邉 颯真", "大島 康平", "伊藤 亜子", "関根 綾子", "大澤 徳子", "菊地 良介"], "cokana": ["タカダ アヤエ", "ワタナベ ソウマ", "オオシマ コウヘイ", "イトウ アコ", "セキネ アヤコ", "オオザワ ノリコ", "キクチ リョウスケ"], "chairs": ["元地 進（医療法人社団 浅ノ川 浅ノ川総合病院）"], "field": "生理", "cat1": "症例", "cat2": "その他の超音波", "no": 99, "pdf": "0099.pdf", "chkana": ["モトチ ススム"], "body": "【はじめに】リヒター症候群は，小リンパ球性リンパ腫／慢性リンパ性白血病（chronic lymphocytic leukemia/smalllymphocytic lymphoma：CLL/SLL）が，びまん性大細胞型B細胞性リンパ腫（diffuse large B-cell lymphoma：DLBCL）などの高悪性度リンパ腫へ形質転換する病態である。今回我々は，精巣超音波検査を契機に診断し得たリヒター症候群の１例を経験したので報告する。\n\n【症例】70歳代男性。CLL/SLLの治療後，当院血液内科にて経過観察中であった。頻尿の自覚症状が出現したため，泌尿器科へ紹介となった。\n\n【超音波検査】左精巣の腫大と圧痛を認め，超音波検査にて左精巣内に 43×43mm大の腫瘤性病変を認めた。腫瘤は境界明瞭で辺縁はやや不整，内部エコーは不均一であった。また，精巣外浸潤所見は認めなかった。カラードプラ法にて腫瘤内部に豊富な血流シグナルを認めた。\n\n【PET-CT検査】左精巣にFDG集積を伴う腫瘤性病変を認めた。内部に壊死あるいは嚢胞変性を反映する集積欠損域を伴っており，超音波検査所見と併せて悪性リンパ腫が疑われた。後日，高位精巣摘除術が施行された。\n\n【病理組織検査】病理組織診断では，大型異型リンパ球様細胞がびまん性に増殖していた。免疫染色では CD20，CD79a，MUM1，BCL6が陽性，CD3，CD5，CD10が陰性であったことから，DLBCLと診断された。CLL/SLLの既往および臨床経過を踏まえ，リヒター症候群と臨床的に診断された。\n\n【考察】リヒター症候群の発生頻度は，CLL/SLL患者の約2～8%と報告されており，リヒター症候群へ形質転換した際，腫瘤を形成しやすい部位はリンパ節，骨髄や肝臓などである。精巣に腫瘤が形成される頻度は極めて稀であり，症例報告は限られている。CLL/SLL患者の経過観察中において，他の臓器で悪性を疑う腫瘤性病変を認めた場合は，リヒター症候群による形質転換も念頭において超音波検査を行うことが重要である。連絡先：058-230-6000 内線 7261", "sid": "s61"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:40", "et": "11:49", "title": "非浸潤性乳管癌における乳腺超音波所見と病理所見の乖離に関する検討", "sub": "", "author": "小林 優", "akana": "コバヤシ ユウ", "affil": "岐阜市民病院", "pref": "岐阜県", "co": ["佐々木 祐子", "石丸 亜希子", "布施 倫代", "日比 奈央実", "長屋 麻紀", "後藤 美香"], "cokana": ["ササキ ユウコ", "イシマル アキコ", "フセ ミチヨ", "ヒビ ナオミ", "ナガヤ マキ", "ゴトウ ミカ"], "chairs": ["塩﨑 真弓（国立大学法人 富山大学附属病院）"], "field": "生理", "cat1": "症例", "cat2": "その他の超音波", "no": 100, "pdf": "0100.pdf", "chkana": ["シオザキ マユミ"], "body": "【背景】乳腺超音波検査は非侵襲的で繰り返し施行可能であり、日常診療においても有用な検査法である。しかし、病変の性状や大きさによっては典型的な悪性所見を示さず、評価が困難な場合がある。なかでも非浸潤性乳管癌(ductalcarcinoma in situ：DCIS)は、乳腺超音波検査において悪性所見を示さないことがあり、画像評価に難渋する症例をしばしば経験する。近年早期乳癌に対する低侵襲治療が普及し、より正確な画像評価が求められているが、病理診断と超音波検査所見が一致しない症例が存在する課題がある。\n\n【方法】2025年 1月から 2026年 3月までに、当院で摘出標本よる病理診断においてDCISと診断された11症例のうち、臨床検査技師が乳腺超音波検査を実施した9症例を対象とした。そのうち、乳腺超音波検査でカテゴリー2-3aと判定され、腫瘤径10mm以下または低エコー域を認め評価に難渋した3症例について後方視的に超音波所見を検討した。乳腺超音波診断ガイドラインに基づいて評価した。さらに、病理組織像と対比し、超音波画像所見の特徴について検討した。\n\n【結果】3症例を対象とした結果、超音波所見からは共通する明らかな悪性所見は認めなった。しかし、超音波画像を再評価すると、形状や境界、低エコー域の判断において悪性を示唆する所見が認められた。また、乳腺超音波検査のカテゴリー分類上は悪性を示唆しにくい症例を認めた。\n\n【考察】DCISは乳腺超音波検査において、典型的な悪性所見を示さない場合があり、特に小病変や非腫瘤性病変では評価に注意を要すると考えられた。微細な形状変化や低エコー域を慎重に評価することが、DCISの見逃し防止につながる可能性が示唆された。", "sid": "s65"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:49", "et": "11:58", "title": "血管エコー検査を契機に巨細胞性動脈炎と診断された一例", "sub": "", "author": "三上 彩花", "akana": "ミカミ アヤカ", "affil": "富山赤十字病院", "pref": "富山県", "co": ["西田 秦剛", "手丸 恵美", "門島 璃奈", "宮脇 美月", "髙田 ちづる", "山岸 拓巳", "本木 直樹"], "cokana": ["ニシダ ヤスタカ", "テマル エミ", "カドシマ リナ", "ミヤワキ ミヅキ", "タカタ チヅル", "ヤマギシ タクミ", "モトキ ナオキ"], "chairs": ["塩﨑 真弓（国立大学法人 富山大学附属病院）"], "field": "生理", "cat1": "症例", "cat2": "その他の超音波", "no": 101, "pdf": "0101.pdf", "chkana": ["シオザキ マユミ"], "body": "【はじめに】超音波検査は非侵襲的で痛みもなく比較的短時間で様々な臓器を検査できる。今回、造影 CTで所見は認めなかったが、血管エコー検査を契機に巨細胞性動脈炎と診断された一例を経験したので報告する。\n\n【事例】68歳男性。咽頭痛で近医耳鼻科を受診し対症療法となる。そこから右耳下～右後頭部の腫脹・疼痛が出現し、抗菌薬を処方されるが疼痛悪化。さらに、発熱、頭痛も出現したため近医内科を受診。頭痛継続、炎症反応の改善が認められないため当院内科に紹介となった。紹介時の単純ＣＴでは唾液腺腫大やリンパ節腫大等は認めず、抗菌薬が部分的に奏効している可能性を考えて急性唾液腺炎を念頭にABPC/SBTでの治療が始められた。しかし治療開始5日後には、視覚障害や右側頭動脈の怒張が顕在化、圧痛も認めるようになった。巨細胞性動脈炎も鑑別の1つに挙げられるため頸動脈エコー、造影ＣＴを実施。エコー検査にて右側頭動脈優位にdark haloを認めた。後日生検を行い、巨細胞性動脈炎の診断に至りＰＳＬでの治療が開始された。\n\n【考察】巨細胞性動脈炎は難病に指定され、患者数も2017年の全国疫学調査で約 3,200人と少ない疾患である。咽頭痛から始まり頭痛、側頭動脈の怒張や視覚障害が徐々に顕在化した本症例のように、その症状も多岐にわたるため、耳鼻科、歯科、眼科で初診となることも珍しくはない。そのため、巨細胞性動脈炎を早期に鑑別疾患に挙げることは難しいと思われる。巨細胞性動脈炎の分類基準の1つに「側頭動脈の異常」がある。エコー検査での感度は約40％と言われ、発症初期にはdark haloを認めないこともある。しかし、本症例では造影 CTでは得られなかった所見をエコー検査で得ることができ確定診断に繋げることができた。今回、側頭動脈の怒張と視覚障害を契機に血管エコーを実施するに至ったが、エコー検査の簡便さから内科に関わらず他科でも積極的に検査を取り入れることで早期に診断へと繋げられる可能性を秘めていると考えられた。", "sid": "s65"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:58", "et": "12:07", "title": "超音波検査が診断に有用であったSubcutaneous Dermoid cystの2例", "sub": "", "author": "増田 柚紀", "akana": "マスダ ユズキ", "affil": "社会福祉法人 恩賜財団 済生会 松阪総合病院", "pref": "三重県", "co": ["福本 義輝", "林 豊", "中川 真理子", "小宮 彩加", "堀内 明子", "古川 万葉", "欠田 成人"], "cokana": ["フクモト ヨシテル", "ハヤシ ユタカ", "ナカガワ マリコ", "コミヤ アヤカ", "ホリウチ アキコ", "フルカワ マハ", "カケダ マサト"], "chairs": ["塩﨑 真弓（国立大学法人 富山大学附属病院）"], "field": "生理", "cat1": "その他", "cat2": "その他の超音波", "no": 102, "pdf": "0102.pdf", "chkana": ["シオザキ マユミ"], "body": "【はじめに】類皮嚢胞(Dermoid cyst)は、胎生期に外胚葉が迷入することにより発生する先天性の嚢胞性病変であり全身に発生しうる。多くは直腸部分や卵巣に認められ、頭頸部領域の発生例は比較的稀である。頭頸部領域に生じる皮下類皮嚢胞(Subcutaneous Dermoid cyst : SDC)は、胎生期の顔面閉鎖時に骨の縫合線に沿って皮膚が迷入して生じるとされ、内部に毛髪や皮脂腺、汗腺などの皮膚付属器を有することが特徴とされている。発生部位としては、眉毛外側など眼周囲が最も多く、直径１∼４cm程度の皮膚色や暗青色を示す軟部腫瘤であり、手術にて切除となる症例も存在する。今回我々は、超音波検査が診断に有用であり、切除に至った SDCの２症例を経験したので報告する。【症例 1】20歳代男性、左眉毛外側に母指頭大の腫瘤を認め受診。超音波検査では、境界明瞭な嚢胞性病変として描出され、内部に線状高エコーおよび乳頭状の高エコー像をわずかに認めた。【症例 2】30歳代女性、右耳後部に鶏卵大の腫瘤を認め受診。超音波検査では、境界明瞭な嚢胞性病変として描出され、内部に線状高エコーおよび嚢胞壁に沿って広基性に広がる高エコー像を認めた。\n\n【考察】SDCの特徴的な超音波所見として、嚢胞内部に毛髪を反映した線状高エコーや、脱落した上皮や分泌物、脂肪などを反映した高エコー像がある。今回経験した２症例ともに、嚢胞内部に線状高エコーと分泌物などを疑う高エコー像を認めたことは本疾患の診断に有用な所見であったと考える。また、本2症例における内部エコーの形態の差異は、内容物の粘稠度や構成成分が関係している可能性が考えられた。SDCと鑑別すべき腫瘤性病変として、表皮嚢腫や毛母腫が挙げられる。表皮嚢腫は角質の貯留により内部に低～高エコーが充満している像として描出され、毛母腫は成長に伴い石灰化やそれに伴う後方エコー減衰を呈することが多く、内部は不均一な低エコーが充満した像を示す。表皮嚢腫や毛母腫には、毛髪を反映する線状高エコーを認めない点でSDCとの鑑別が可能と考えられる。\n\n【結語】超音波検査による腫瘤内部の評価が診断に有用であったSDCの２症例を経験した。(0598-51-2626 内線261)", "sid": "s65"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "12:07", "et": "12:16", "title": "超音波による体脂肪分布の評価の可能性：内臓脂肪・皮下脂肪・異所性脂肪の基礎的検討", "sub": "", "author": "野村 晴輝", "akana": "ノムラハルキ", "affil": "藤田医科大学・大学院・医療科学研究科", "pref": null, "co": ["刑部 恵介", "杉本 恵子", "前田 圭介", "鯉江 瑞希", "澤田 美空", "井戸 捺海", "市野 直浩"], "cokana": ["オサカベ ケイスケ", "スギモト ケイコ", "マエダ ケイスケ", "コイエ ミズキ", "サワダ ミク", "イド ナツミ", "イチノ ナオヒロ"], "chairs": ["塩﨑 真弓（国立大学法人 富山大学附属病院）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "その他の超音波", "no": 103, "pdf": "0103.pdf", "chkana": ["シオザキ マユミ"], "body": "【目的】体脂肪は内臓脂肪や皮下脂肪、異所性脂肪の分布が慢性代謝性疾患の発症に重要とされている。超音波検査では内臓脂肪厚(VFT)、皮下脂肪厚(SFT)に加え、近年では、異所性脂肪に起因する肝臓の脂肪化を超音波減衰係数（iATT）として評価可能となった。そこで本研究では一般集団を対象に各種体脂肪に関する基礎的検討を行った。\n\n【対象・方法】2022～2024年某地域住民健診受診者のうち、腹囲径 70cm 以上 100cm 未満であった 461 例(男性 218 例、平均年齢64.6±11.6歳)を対象とした。使用装置は富士フイルムメディカル社製 ARIETTA 850を用いた。VFT(㎜)は臍部付近で腹直筋後鞘から椎体前面までの左右・中央の3箇所を測定し、平均値を算出した。SFT(㎜)はVFTと同断面で計測した。iATT(dB/cm/MHz)は右肋間走査、息止め条件下にて5回計測し中央値を用いた。対象は腹囲径70/80/90㎝台(152例/188例/121例)の3群に分け比較検討を行った。\n\n【結果】各腹囲群の VFT は男性：51.5/67.1/76.3、女性：46.5/56.6/68.4、SFTは男性：9.8/13.9/15.3、女性：12.1/13.3/15.6、iATTは男性：0.54/0.66/0.76、女性：0.62/0.67/0.77であった。性差の比較：VFTは、全腹囲群で男性が有意に高値を示した(p=0.0008, p<0.0001, p=0.0101)。SFTとiATTでは70㎝台にのみ男性で有意に低値を示した(SFT：p=0.0217, iATT値：p=0.0004)。腹囲間の比較：腹囲 70㎝台と 80㎝台、80㎝台と 90㎝台の VFTは男女共に腹囲の増加に伴い有意に高値を示した(各群p<0.0001)。SFTでは70㎝台と80㎝台の間のみ男女共に有意差を認めた(男性：p<0.0001, 女性：p=0.0178)。iATTは男女共に腹囲の増加に伴い有意に高値を示した(男性：p<0.0001, p=0.0001,女性：p=0.0061,p=0.0054)。\n\n【考察】SFTはVFTやiATTとは異なり80cm台と90cm台の間において有意な増加を認めず、仰臥位計測による皮下脂肪の背側偏位の影響が考えられた。また、腹囲70㎝台の女性ではVFTが低値、SFTは高値と皮下脂肪型を呈したが、iATTは同腹囲の男性に比べ高値であり、肝臓への異所性脂肪が沈着している可能性が高いことが示唆された。したがって、特に女性においては腹囲が小さい（痩せ型）集団であってもiATTの測定の重要性が示唆された。", "sid": "s65"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "15:50", "et": "15:59", "title": "尿沈渣分析装置の測定画像を契機に迅速な報告に至った尿酸アンモニウム結晶の検出例", "sub": "", "author": "内田 彩", "akana": "ウチダ アヤ", "affil": "学校法人藤田学園 藤田医科大学岡崎医療センター", "pref": "愛知県", "co": ["山口 高明", "長谷川 瞳", "西井 智香子", "北川 文彦"], "cokana": ["ヤマグチ タカアキ", "ハセガワ ヒトミ", "ニシイ チカコ", "キタガワ フミヒコ"], "chairs": ["林 和樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "一般", "cat1": "症例", "cat2": "尿沈渣", "no": 104, "pdf": "0104.pdf", "chkana": ["ハヤシ カズキ"], "body": "【背景】近年、尿沈渣への自動分析装置の導入が進んでいるが、画像法による解析の有用性は十分に検証されていない。今回、自動分析装置の測定画像から尿酸アンモニウム結晶を疑い、鏡検による確認を行い迅速な臨床報告に至った症例を経験した。\n\n【対象】症例は 50歳代女性。下腹部痛を主訴に救急外来を受診し、回盲部腫瘍疑いにて入院となった。入院後は絶食管理となっていた。\n\n【評価】尿検体の画像解析機能を有する尿沈渣分析装置 AI-4510（アークレイマーケティング株式会社）にて測定後、測定画像を確認したところ、尿酸アンモニウム結晶が疑われる構造物を認めたため、鏡検による再評価を行った。\n\n【結果】鏡検において棘状突起を有する球状構造物を認め、溶解試験の結果により尿酸アンモニウム結晶と判断した。尿 pHは6.0と弱酸性であり、尿ケトン体定性は（２＋）であった。生化学検査ではAlb 3.8 g/dL、CRP 6.56 mg/dLであった。\n\n【考察】尿酸アンモニウム結晶は一般にアルカリ尿で出現しやすいとされるが、本症例では弱酸性尿で認められた。入院中の絶食管理に伴うケトーシスや代謝状態の変化により酸性尿酸アンモニウム結晶が産生された可能性が考えられる。本症例からAI-4510における測定画像の確認は、見落とし防止の観点からも有用性が高いことが示唆された。\n\n【結論】今回、AI-4510における測定画像の確認を契機に、迅速に酸性尿酸アンモニウム結晶の報告に至った症例を経験した。酸性尿酸アンモニウム結晶の検出は、結石形成の前兆や腎後性急性腎不全のリスクを示す重要な所見で早期発見・対処により腎機能障害の予防につながる。画像法における尿沈渣の画像解析は、希少成分の検出補助として有用である可能性が示唆された。", "sid": "s39"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "15:59", "et": "16:08", "title": "便中シャルコー・ライデン結晶の検出が診断契機となった好酸球性十二指腸炎の１例", "sub": "", "author": "大江 可奈子", "akana": "オオエ カナコ", "affil": "医療法人 豊田会 刈谷豊田総合病院", "pref": "愛知県", "co": ["伊藤 英史", "吉田 光徳", "西尾 祐貴", "宮本 康平", "大嶋 剛史"], "cokana": ["イトウ エイジ", "ヨシダ ミツノリ", "ニシオ ユウキ", "ミヤモト コウヘイ", "オオシマ タケシ"], "chairs": ["林 和樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "一般", "cat1": "症例", "cat2": "その他の一般", "no": 105, "pdf": "0105.pdf", "chkana": ["ハヤシ カズキ"], "body": "【はじめに】シャルコー・ライデン結晶（Charcot-Leydencrystal：CLC）は、喘息をはじめとしたアレルギー疾患や寄生虫感染症などで認められる、好酸球性炎症を示唆する古典的所見である。今回、便中CLCの報告を契機に好酸球性消化管疾患（EGIDs）を疑い、好酸球性十二指腸炎の診断に至った症例を経験したため報告する。\n\n【症例】14歳、女性。第1病日：腹痛と下痢が出現した。第2病日：近医を受診したが症状改善なく、同日当院救急外来を受診した。血液検査では炎症反応の上昇は認めず、腸炎または機能性腹痛として内服加療された。第8病日：右下腹部痛の増悪を認め、精査目的に入院となった。入院時の血液検査ではWBC 7100/µl、好酸球21.3％、好酸球数1512/µl、CRP 0.02mg/dlであった。尿検査、CT検査、MRI検査では明らかな異常所見を認めなかった。\n\n【経過】好酸球増多が持続していることから、寄生虫感染症を含めた鑑別を目的に便検査が追加された。便潜血・便中好酸球・寄生虫卵はいずれも陰性であったが、集卵法による鏡検中に CLCを認めた。CLCは好酸球由来結晶であり、寄生虫感染のみならずEGIDsなどの好酸球性疾患でも認められることを臨床側へ報告したところ、炎症性腸疾患などの下部消化管疾患に加え、EGIDsも鑑別にあげられた。EGIDsでは症状部位と病変部位が一致しない場合があることから、下腹部症状主体ではあったものの、上部消化管を含めた内視鏡検査が施行された。生検では十二指腸粘膜を中心に好酸球浸潤を認め、好酸球性十二指腸炎と診断された。\n\n【考察】便中 CLCは EGIDsに特異的な所見ではないものの、好酸球増多を伴う消化器症状症例においては、上部消化管を含めた精査を検討する契機となり得る。また、集卵法は直接法と比較して背景残渣が少なく観察性に優れ、検体量も多いことから、CLC検出率向上に寄与した可能性が考えられた。\n\n【結語】好酸球増多を認める消化器症状症例では、寄生虫感染症の鑑別のみならず、CLC検出を含めた便検査を実施することがEGIDs診断の一助となる可能性が示唆された。連絡先：0566-21-2450", "sid": "s39"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "16:08", "et": "16:17", "title": "沈渣に出現する結晶の長期保存標本作成の検討", "sub": "", "author": "辻 愛琳", "akana": "ツジ アイリ", "affil": "", "pref": "愛知県", "co": ["長嶌 和子", "作石 敏明", "寺島 みさき", "星 雅人"], "cokana": ["ナガシマ カズコ", "サクイシ トシアキ", "テラシマ ミサキ", "ホシ マサト"], "chairs": ["林 和樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "一般", "cat1": "基礎研究（検討）", "cat2": "尿沈渣", "no": 106, "pdf": "0106.pdf", "chkana": ["ハヤシ カズキ"], "body": "【はじめに】尿沈渣検査における結晶成分の同定は重要な観察項目の一つであり、検査者には各種結晶の形態学的特徴を理解することが求められる。しかし、尿沈渣の通常標本は長期保存に適しておらず、教育や目合わせなどの精度管理に活用しづらいという課題がある。そこで本研究では、尿沈渣中に出現する各種結晶を長期間保存可能な標本として作製する方法を検討した。\n\n【検討方法】尿沈渣中に出現した結晶のうち、尿酸結晶、シュウ酸カルシウム結晶、リン酸カルシウム結晶、リン酸アンモニウムマグネシウム結晶、炭酸カルシウム結晶、アシクロビル結晶、薬物結晶、シスチン結晶、ビリルビン結晶、コレステロール結晶の計11種類を対象とした。観察対象とする結晶を明瞭に確認できるよう、背景に他の成分が少なく、対象結晶が比較的多く出現している検体を選択し、標本を作製した。標本作製は、尿沈渣30 μLをスライドガラス上に滴下し、約 2 cm の楕円状に塗抹した後、冷風にて乾燥させ、乾燥後、マリノールを用いて封入し、標本とした。作製した標本について、特定の結晶にマーキングを行い、封入直後から3ヶ月後まで、結晶の形態および色調変化の有無を経時的に観察した。\n\n【結果】作製した全ての結晶標本において、封入後3ヶ月間は結晶の形態および色調変化を認めなかった。一方、標本背景には雪華模様の結晶様構造物が出現した。この構造物は多くの標本で封入直後から認められた。また、厚みを有する結晶では、封入後の結晶全体への焦点合わせが困難で、一部が不鮮明に観察された。\n\n【まとめ】本研究より、尿沈渣中の結晶成分を長期間保存可能な標本として作製できる可能性が強く示された。背景に出現する雪華模様の結晶様構造物への対処、厚みを有する結晶における観察性向上に向けた検討を継続し、教育用標本および技師間差確認用の目合わせ標本としての活用を目指したい。連絡先：0562-93-2300", "sid": "s39"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "16:20", "et": "16:29", "title": "一般検査を契機に病理部連携で発見された皮膚原発Hypomelanotic melanoma胸膜転移症例", "sub": "", "author": "宇野 晃太郎", "akana": "ウノ コウタロウ", "affil": "岐阜大学医学部附属病院 検査部", "pref": "岐阜県", "co": ["上野 嘉彦", "加藤 洋平", "石田 真理子", "岡 有希", "中川 篤", "菊地 良介"], "cokana": ["ウエノ ヨシヒコ", "カトウ ヨウヘイ", "イシダ マリコ", "オカ アキ", "ナカガワ アツシ", "キクチ リョウスケ"], "chairs": ["井上 佳（独立行政法人地域医療機能推進機構 四日市羽津医療センター）"], "field": "一般", "cat1": "症例", "cat2": "その他の一般", "no": 107, "pdf": "0107.pdf", "chkana": ["イノウエ ケイ"], "body": "【背景】悪性黒色腫はメラノサイト由来の悪性腫瘍であり，本邦における罹患率は1.12人/10 万人で希少がんに分類される。また，無色素ないし低色素性メラノーマ（Hypomelanotic melanoma）は，全メラノーマの 2-20%程度とされる。さらに，皮膚原発メラノーマの胸腔内転移および胸水貯留症例は報告があるものの，胸水一般検査での遭遇は稀である。今回，胸水一般検査を契機に病理部との連携から発見に至った皮膚原発低色素性メラノーマの一例を経験したので報告する。\n\n【症例】70代男性。20XX年直腸癌で左半結腸切除術施行。20XX+2年7月，右上背部2×3cm大の隆起した腫瘤を自覚し，前医にて悪性黒色腫と診断された。20XX+3年 5月に当院にて皮膚原発巣切除および腋窩リンパ節郭清術が施行され，同年6月より化学療法が開始された。20XX+3年10月CTにて肺，骨および肝臓に腫瘤像を認め，同年11月に乾性咳嗽と胸水貯留を認めたため，胸水一般検査が実施された。提出された胸水は黄色・微混濁様で，計算盤上に大型の由来不明細胞が散見された。ギムザ染色標本では，孤在性〜小集塊状に出現する N/C 比の高い成熟リンパ球の3-4倍程度の細胞を多数認め，核分裂像や 2核以上の多核細胞も散見された。これより病理部と顕微鏡によるディカッションおよび手術材料（右上背部皮膚）HE染色標本における組織像所見の情報提供を受けた。後日，病理細胞診による細胞所見では，ギムザ染色標本と同様の異型細胞を認め，メラニン色素陰性であるものの，核内封入体を認めたことから，悪性黒色腫が強く疑われた。\n\n【考察】低色素性メラノーマは色素欠乏により形態学的鑑別が困難であり，体腔液検体においては他がん細胞との鑑別を要する。本症例では，胸水一般検査における異型細胞の指摘を契機に，速やかに病理部と情報共有を行ったことで，適切な結果報告に結びついた。\n\n【結語】胸水一般検査において悪性黒色腫細胞に遭遇する機会は少なく，また本症例のような典型的所見に乏しい場合においては，部門間連携による情報共有が重要であり，臨床検査技師の果たす役割は大きいと考えられた。連絡先：058-230-6000", "sid": "s42"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "16:29", "et": "16:38", "title": "非典型的な形態を示し判断に苦慮した日本住血吸虫症の一例", "sub": "", "author": "川井 孝太", "akana": "カワイ コウタ", "affil": "磐田市立総合病院", "pref": "静岡県", "co": ["北村 文香", "久米 彩也香", "岩﨑 琢真", "熊谷 慧人", "上村 のり子", "久留島 幸路"], "cokana": ["キタムラ アヤカ", "クメ サヤカ", "イワザキ タクマ", "クマガイ ケイト", "ウエムラ ノリコ", "クルシマ ユキジ"], "chairs": ["井上 佳（独立行政法人地域医療機能推進機構 四日市羽津医療センター）"], "field": "一般", "cat1": "症例", "cat2": "その他の一般", "no": 108, "pdf": "0108.pdf", "chkana": ["イノウエ ケイ"], "body": "【はじめに】近年、静岡県だけでなく海外渡航の増加や在日外国人の増加、食生活の変貌などによる日本の国際化が進んでいる。今回、非典型的な形態を示し判断に苦慮した寄生虫感染症を経験し一般検査部門だけでなく多部門との連携により総合的に判断し診断に繋げることができた症例を経験したので報告する。\n\n【症例】フィリピン国籍，40代女性。四肢に内出血痕が多発し前医を受診。高度な腎機能低下を認め当院腎臓内科へ初回受診、末期腎不全に対して透析目的で入院となった。腎動脈エコーを施行したところ、肝実質にびまん性に線状･帯状の高エコーが網目状になっており日本住血吸虫症が疑われたため便中寄生虫卵検査や下部内視鏡検査が施行された。\n\n【血液検査】WBC 7500/μL,RBC 277×104/μL,Hb 7.9g/dL,Ht24.1%,Ret 4.15%,TP 6.2g/dL,ALB 3.5g/dL,BUN 75mg/dL,CRE9.46mg/dL,UA 11.4mg/dL\n\n【エコー検査】肝実質にはびまん性に線状･帯状の高エコーが網目になっており、日本住血吸虫症の典型例と類似している。\n\n【寄生虫卵検査】虫卵様の形態を示すものが観察されたが日本住血吸虫卵に特徴的な突起がなく非典型的だったが多部門の結果も考慮し日本住血吸虫卵陽性疑いと判断し医師へ報告した。\n\n【まとめ】日本住血吸虫卵に特徴的な突起物や虫卵内容物が非典型的な形態を示した症例を経験した。一般検査部門だけでなく多部門連携がとれた症例だった。\n\n【考察】形態検査では、典型的な形態を示していないものも多い。寄生虫卵検査は陽性例などを見る機会が減少しており判断に苦慮することも多いように感じる。標本上の情報だけでなく多部門と連携し総合的に判断することで臨床へ付加価値の高い検査結果が報告できると思う。磐田市立総合病院 0538-38-5000", "sid": "s42"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "16:38", "et": "16:47", "title": "お好み焼き粉から発生したダニによるアレルギーの1例", "sub": "", "author": "熊谷 慧人", "akana": "クマガイ ケイト", "affil": "磐田市立総合病院", "pref": "静岡県", "co": ["川井 孝太", "池田 美紀", "久米 彩也香", "北村 文香", "岩﨑 琢真", "上村 のり子", "久留島 幸路"], "cokana": ["カワイ コウタ", "イケダ ミキ", "クメ サヤカ", "キタムラ アヤカ", "イワザキ タクマ", "ウエムラ ノリコ", "クルシマ ユキジ"], "chairs": ["井上 佳（独立行政法人地域医療機能推進機構 四日市羽津医療センター）"], "field": "一般", "cat1": "症例", "cat2": "その他の一般", "no": 109, "pdf": "0109.pdf", "chkana": ["イノウエ ケイ"], "body": "【はじめに】当院（病床数500床、市立基幹病院）の一般検査部門では、尿検査、体腔液検査、寄生虫検査を行っている。今回、姉妹でお好み焼きを摂取し発症したアレルギー症例でダニを検出し、パンケーキ症候群として報告例のある事例を経験したので報告する。【症例】姉(10代) 主訴：喘鳴・全身発疹。既往歴：果物アレルギー、花粉症。妹(10代) 主訴:呼吸苦、手足の膨疹、顔面浮腫。既往無し。自宅でお好み焼きを摂取後、姉は咽頭違和感と結膜充血、全身性の発疹、意識混濁を認め、妹は、手足の膨疹、顔面浮腫が出現した。自宅でアレロック1錠内服したが、呼吸苦症状が出現したため、姉妹共に、前医を受診し症状の改善がないため当院に救急搬送された。当院到着時、全身性発疹が残るがバイタルに異常はなく、管理目的で入院となった。\n\n【検査結果】姉 WBC 9900/µL,Hb 13.5g/dL,TP 7.0g/dL,ALB 4.3g/dL,LD299U/L,CRP 0.02mg/dL,IgE 1468,ダニ1 >=100クラス,IgE抗体価 <0.10UA/mL妹 WBC 12700/µL,Hb 13.0g/dL, TP 7.3g/dL,ALB 4.8g/dL,LD255U/L,CRP 0.02mg/dL,IgE 182,ダニ 1 36.4 クラス,IgE 抗体価 <0.10UA/mL\n\n【お好み焼き粉の鏡検】お好み焼き粉からダニを検出した。\n\n【まとめ】開封後、長期保存されたお好み焼き粉から発生したダニによるアレルギーの症例を経験した。自施設で可能な検査方法を部門担当者と臨床医で話し合い、お好み焼き粉からダニを検出し報告することで、早期診断・治療に繋げることできた。【考察】パンケーキ症候群などのアレルギー疾患では、アレルギー検査が一般的だが院内で実施している施設は少なく結果報告まで時間がかかってしまう。本症例では、一般検査担当者と臨床医がコミュニケーションをとり、検査方法を模索したことで迅速にダニの検出ができたため、アレルギー検査結果を待たずに診断につなげることができた。今後も診断に有用な検査結果報告を継続するために、経験した内容や検査方法などの情報を技師間で共有し知識や技術の向上につなげていきたい。磐田市立総合病院 0538-38-5000", "sid": "s42"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "13:40", "et": "13:49", "title": "当院におけるRhD陰性患者の緊急輸血対応４例の検討", "sub": "", "author": "細野 裕未奈", "akana": "ホソノ ユミナ", "affil": "岐阜大学医学部附属病院 輸血・細胞治療部", "pref": "岐阜県", "co": ["浅野 栄太", "日比 由佳", "植村 円香", "大舘 紗那", "佐藤 弦士朗", "中村 信彦"], "cokana": ["アサノ エイタ", "ヒビ ユカ", "ウエムラ マドカ", "オオダチ サナ", "サトウ ゲンシロウ", "ナカムラ ノブヒコ"], "chairs": ["谷口 容（独立行政法人 国立病院機構 金沢医療センター）"], "field": "輸血", "cat1": "症例", "cat2": "輸血", "no": 110, "pdf": "0110.pdf", "chkana": ["タニグチ ヨウ"], "body": "【はじめに】大量出血時の緊急輸血は、迅速な製剤確保と供給が重要である。特に RhD 陰性患者では、RhD 陰性赤血球製剤の確保に時間を要し、対応に苦慮することがある。今回、当院で経験したRhD陰性患者に対する緊急輸血対応症例について検討した。\n\n【対象・方法】2015年から2025年までの10年間に当院の救急部で緊急輸血対応を行った症例のうち、患者血液型判明後にRhD陰性赤血球製剤を手配した4症例を対象とした。出血原因、血液型検査結果、輸血製剤の使用状況、RhD陰性赤血球製剤への切替経過を後方視的に検討した。\n\n【結果】4例の内訳は、外傷3例、産婦人科1例で、平日日勤帯2例、時間外2例であった。初回検査でRhD陰性と判明された症例が3例、weakD症例が1例であった。全例で緊急対応としてRhD陽性赤血球製剤の依頼が行われ、2例では実際にRhD陽性赤血球製剤が投与されたが、いずれも最終的に RhD 陰性赤血球製剤へ切り替えることができた。初期対応は在庫状況により異なり、同日他患者用に準備されていた RhD 陰性血を活用して速やかに対応できた症例があった一方、手配に時間を要した症例も認めた。weakD症例では、赤血球はRhD陰性血へ切り替えたが、FFPは在庫不足のためRhD陽性製剤を投与した。\n\n【考察】RhD 陰性患者の緊急輸血でも、最終的な RhD陰性赤血球製剤への切り替えは可能であったが、初期対応では RhD 陽性赤血球製剤の投与や院内在庫の調整を要する場合があった。緊急時のRhD陰性製剤確保には、院内在庫運用、供給体制、対応手順の整備と情報共有が重要と考えられた。(輸血・細胞治療部：058-230-7266)", "sid": "s74"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "13:49", "et": "13:58", "title": "安全性向上を目的とした無菌的分割製剤運用の改善", "sub": "－臨床ニーズへの対応－", "author": "杢屋 拓海", "akana": "モクヤ タクミ", "affil": "聖隷浜松病院 臨床検査部", "pref": "静岡県", "co": ["岡本 拓真", "鈴木 健太", "中島 裕美", "古川 沙也加", "大石 洋美", "宮崎 恵子", "直田 健太郎"], "cokana": ["オカモト タクマ", "スズキ ケンタ", "ナカシマ ヒロミ", "フルカワ サヤカ", "オオイシ ヒロミ", "ミヤザキ ケイコ", "ナオダ ケンタロウ"], "chairs": ["谷口 容（独立行政法人 国立病院機構 金沢医療センター）"], "field": "輸血", "cat1": "その他", "cat2": "輸血", "no": 111, "pdf": "0111.pdf", "chkana": ["タニグチ ヨウ"], "body": "【背景】1回輸血量の少ない新生児では、血液製剤の有効活用と安全性確保が課題である。令和8年2月発行の「輸血療法実践ガイド」では血液製剤の院内分割が有用であることが明記され、令和8年度診療報酬改定では無菌的分割製剤作成加算が新設された。当院では2012年度より血液製剤（RBC、PC、FFP）の無菌分割を実施しており、これまでに複数ドナーからの曝露機会の低減や廃棄血削減に取り組んできた。\n\n【目的】臨床ニーズに応じた無菌的分割製剤の運用改善の取り組みとその有用性について報告する。\n\n【取り組み】①NICUでは、従来3〜4分割した血液製剤を病棟で複数回シリンジ分割していたが、バッグ汚染による感染リスクや PDA認証未実施下での誤投与リスクが懸念されていた。そこで分割可能な最小容量を検討し、2021年11月より分割数をRBC2単位は10分割、PC10単位は8分割に固定して依頼分割数を統一した。これにより、1バッグあたりシリンジ分割1回で投与する運用へ変更した。②ICUでは、ルート感染が疑われた患児の症例を契機に、輸血バッグからの感染対策としてシリンジ分割を廃止したいとの要望を受けた。そこでICU看護師と運用検討を行い、2024年12月より分割製剤の使用をICU患児へ拡大した。さらにRBCやPCに加えてFFPを持続投与する症例が多いため、融解後24時間以内かつ1バッグ6時間以内投与の制限を踏まえ、4分割対応とした。\n\n【成果】分割製剤のPDA認証を可能としたことで、看護師からは確認作業や輸血管理の負担が軽減され、誤投与リスク低減につながったと好意的な意見が得られた。また、バッグ汚染による感染症例も発生していない。2025年度の分割依頼件数は149件（前年度85件）と増加し、本取り組みが臨床現場で高く評価されたことが示唆される。\n\n【結語】臨床ニーズに応じた無菌的分割製剤の運用改善は感染リスク低減と新生児輸血の安全性向上に寄与したと考えられる。今後も臨床現場と連携し、安全な輸血医療の実現に努めたい。 連絡先：053-474-2632", "sid": "s74"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "13:58", "et": "14:07", "title": "クリオシール院内作製導入における輸血部主導の体制構築と運用経験", "sub": "", "author": "山崎 涼介", "akana": "ヤマザキ リョウスケ", "affil": "聖隷福祉事業団 総合病院 聖隷三方原病院 臨床検査部", "pref": "静岡県", "co": ["内山 大樹", "吉田 隣生", "石戸谷 典明", "栗田 哲至", "福田 淳", "棚橋 雅幸"], "cokana": ["ウチヤマ ダイキ", "ヨシダ リンキ", "イシドヤ ノリアキ", "クリタ サトシ", "フクダ アツシ", "タナハシ マサユキ"], "chairs": ["谷口 容（独立行政法人 国立病院機構 金沢医療センター）"], "field": "輸血", "cat1": "チーム医療", "cat2": "輸血", "no": 112, "pdf": "0112.pdf", "chkana": ["タニグチ ヨウ"], "body": "【はじめに】自己フィブリン糊（以下、クリオシール）は、患者自己血由来のフィブリノゲンにトロンビンを添加して調製される血漿分画製剤であり、術中の止血補助や組織接着、肺切除面からの空気漏れ防止を目的として使用される。自己血由来であることから、同種血由来製剤と比較して感染症伝播やアレルギー反応のリスク低減が期待される。近年、周術期医療における輸血部門の業務拡大に伴い、院内での安定した製剤供給体制の構築が求められている。\n\n【目的】2025年1月、当院呼吸器外科よりクリオシール院内作製導入の要望があり、同年4月からの運用開始に向けて輸血部における作製体制を構築したため、その導入経過および運用状況について報告する。\n\n【経過】導入に際し、旭化成メディカル社による輸血部技師向け勉強会にて、作製原理、機器操作、安全管理について知識習得を行った。さらに、同社と共に呼吸器外科医師に対して、概要、自己血貯血方法、輸血依頼手順等に関する説明会を開催、看護部へ作製に際しての説明と自己血採血に対しての協力依頼を実施、また使用部署である手術部に対しても概要と使用方法の説明会を実施した。設備面では、作製機器導入に伴う電源工事および設置環境整備を実施し、輸血部内で作製手技トレーニングを行い、工程の標準化を目的として手順書を作成した。\n\n【結果】クリオシール院内作製の要望に迅速に対応し、約3ヶ月で運用開始することが出来た。体制整備を経て、2025年4月より運用を開始し、2026年5月時点で、呼吸器外科に加え脳神経外科、消化器外科へ対象診療科を拡大し、63件作製し使用した。運用開始後、重大な機器トラブルや作製不備は認めず、安定した供給体制を継続している。\n\n【考察】クリオシール導入において、診療科との情報共有、作製工程の標準化、環境整備が重要であった。特に技師による手順書整備および作製技術の均一化が安全かつ安定した運用に寄与したと考える。輸血部門が中心となって体制構築を行うことで、多診療科への対応が可能となり、周術期医療への貢献に繋がった。今後は他の診療科への適応拡大を進め、品質管理体制の更なる強化を図りたい。連絡先:053-436-1251", "sid": "s74"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "14:07", "et": "14:16", "title": "当院における胎児輸血実施状況と輸血部・検査部の対応", "sub": "", "author": "棚橋 高大", "akana": "タナハシ タカヒロ", "affil": "", "pref": "岐阜県", "co": ["福岡 玲", "仲本 知代", "後藤 雪乃", "川嶋 文恵", "大西 紀之", "長屋 麻紀"], "cokana": ["フクオカ レイ", "ナカモト トモヨ", "ゴトウ ユキノ", "カワシマ フミエ", "オオニシ ノリユキ", "ナガヤ マキ"], "chairs": ["谷口 容（独立行政法人 国立病院機構 金沢医療センター）"], "field": "輸血", "cat1": "症例", "cat2": "輸血", "no": 113, "pdf": "0113.pdf", "chkana": ["タニグチ ヨウ"], "body": "【はじめに】胎児輸血は胎児重症貧血に対し、赤血球製剤輸血を行うものである。国内では1965年に金岡らが初めて報告し、2010～2014年の5年間に64症例に対して97回の胎児輸血が行われた。【当院の実施状況】当院は岐阜県下唯一の総合周産期母子医療センターであり、2019年6月～2026年5月の6年間に16症例に対し、計17回の胎児輸血を実施している。患者（母体）の居住地は岐阜県が9名、愛知県4名、滋賀県2名、石川県1名で県内のみならず県外からも患者を受け入れている。胎児輸血実施時の母体年齢中央値は33歳、胎児週数中央値は22週であった。輸血理由は双胎児間輸血症候群が9例、パルボウィルスB19感染が6例、臓器発達不全に伴うものが1例であった。パルボウィルスB19感染に伴う輸血は国内の感染状況と連動しており、感染流行を認めた2019年～2020年が4件、2025年が 2件であった。【輸血部・検査部の対応】輸血部は医師から胎児輸血の依頼を受けると、血液センターへ製剤を発注する。当院では胎児輸血製剤は全てO型RhD(-)を使用し、交差血は母親の血液としている。担当者は製剤納品予定時刻の確認、医師への伝達、納品後の入庫および製剤血液型確認を行い、製剤を払い出す。同時進行で交差適合試験を実施する。また胎児輸血実施歴は電子カルテおよび輸血システムを利用し、児の出生後も記録管理している。検査部では輸血開始前に赤血球製剤のHt値を測定し、報告する。輸血量の目安はこのHt値から算出される。輸血は数回に分けて行われ、輸血毎に検体が提出される。担当者はHb、Ht値を測定し報告する。輸血、検体提出、測定、報告を繰り返し、推定式を用いた理論値による輸血上限量を設定し、途中の臍帯血Hb、 Ht値を確認し輸血終了としている。また輸血後は胎児の血液型が確定出来なくなるため、輸血前臍帯血で血液型検査を実施する。【まとめ】胎児輸血は入院当日に輸血が実施される場合もある。製剤準備、払い出し、検査、報告を迅速に行わなければならず、医師と検査技師の緊密な連携が必要となる。現在、胎児輸血の対応経験を持つ要員は限られており、今後多くの担当者が業務を行えるようマニュアル整備や教育を行いたい。\n\n【連絡先】 058-246-1111(内線2675:棚橋)", "sid": "s74"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "14:20", "et": "14:29", "title": "夜勤帯に遭遇したABO抗原減弱症例を契機とした血液型判定手順の見直し", "sub": "", "author": "大前 有美", "akana": "オオマエ ユミ", "affil": "大垣市民病院", "pref": "岐阜県", "co": ["鳥居 知美", "田中 典子", "多賀 みゆき", "藤塚 菜穂"], "cokana": ["トリイ トモミ", "タナカ ノリコ", "タガ ミユキ", "フジツカ ナホ"], "chairs": ["水野 友靖（小牧市民病院）"], "field": "輸血", "cat1": "管理・教育", "cat2": "輸血", "no": 114, "pdf": "0114.pdf", "chkana": ["ミズノ トモヤス"], "body": "【はじめに】白血病や骨髄異形成症候群などの血液疾患では赤血球の ABO血液型抗原が一時的に減弱し、オモテ検査に影響を及ぼすことが知られている。今回、夜勤帯で白血病による抗原減弱に気付けず判定を実施し、血液型判定に影響を及ぼした一例を経験したので報告する。\n\n【症例】60代女性、一週間前に発熱あり。4日後に体動困難となり他院に搬送。その際の検査にて Hb 3.6g/dL, WBC200,000/μL, Blast 95%,Plt 20,000/μL,LDH 1285U/L であり、急性白血病が疑われたため精査加療目的で当院を受診。\n\n【検査結果・経過】全自動輸血検査装置(ORTHO VISION)で 実 施 し た 血 液 型 検 査 に て 、 抗 A(0), 抗 B(0), 抗D(4+),Control(0),A1赤血球(0),B赤血球(3+),不規則抗体は陰性であった。夜勤帯の技師が試験管法を行ったところ、抗A(0),抗B(0),A1赤血球(1+),B赤血球(3+)となったためO型RhD陽性として血液型を確定した。翌日の日勤帯に出勤した輸血担当技師が検査結果を確認したところ追加検査が必要と判断し精査を実施した。結果は抗A1レクチン(0),抗Hレクチン(1+), 抗A吸着解離試験陽性,A型糖転移酵素活性は64倍(対照256倍),A1赤血球との間接抗グロブリン試験陰性であり抗Aは保有していなかった。追加検査の結果より疾患による抗原減弱か亜型を疑い、血液センターに検査を依頼し、血液型が確定するまではRBCはO型RhD陽性、FFP及びPCはAB型RhD陽性で対応する方針とした。血液センターの検査結果は「亜型もしくは疾患による抗原減弱の疑い」であった。貧血が進行し複数回輸血を行っており血液型の確定が困難となったが、当院受診から 8ヶ月後、「A型RhD陽性」として結果が確定された。\n\n【結語】当院では血液型判定において再検基準を設け、オモテウラ不一致の場合は輸血担当技師に連絡することになっている。しかし今回、夜勤者はウラ検査の反応のみに着目し検査を進めてしまった。オモテ検査とウラ検査を総合的に評価することの重要性を再認識し、夜勤者には判定基準及び不一致時の対応フローの周知を行った。今後も教育を継続し血液型判定の精度向上と安全な輸血医療の実践に繋げていきたい。 連絡先―0584-81-3341（内線1171）", "sid": "s78"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "14:29", "et": "14:38", "title": "0.8%セルスクリーンJ-Albaを用いた不規則抗体検査の比較検討", "sub": "", "author": "永田 直輝", "akana": "ナガタ ナオキ", "affil": "JA愛知厚生連 海南病院", "pref": "愛知県", "co": ["畔地 里佳", "三枝 泰志", "山森 理絵", "竹川 幸身", "樋口 昌哉", "山口 桂", "窪田 裕樹"], "cokana": ["アゼチ リカ", "サエグサ タイシ", "ヤマモリ リエ", "タケカワ ユキミ", "ヒグチ マサヤ", "ヤマグチ カツラ", "クボタ ユウキ"], "chairs": ["水野 友靖（小牧市民病院）"], "field": "輸血", "cat1": "試薬・機器", "cat2": "輸血", "no": 115, "pdf": "0115.pdf", "chkana": ["ミズノ トモヤス"], "body": "【はじめに】当院の不規則抗体スクリーニング検査(以下SCR)は、バイオビュースクリーンJ(以下BVSJ)を用いてカラム凝集法で実施している。低イオン強度溶液(以下LISS)を反応増強剤として用いた間接抗グロブリン法(以下 LISS-IAT)とフィシンを用いた酵素2段法の二法を採用している。しかし、酵素法は非特異反応の多さや一部の臨床的意義のある抗体を検出できないなどの理由から赤血球型検査ガイドライン改訂5版ではSCRで実施する意義は低いとされている。今回、業務効率化およびコスト削減を目的に、高感度で酵素法を必要としない0.8%セルスクリーンJ-Alba(以下CSJ)のSCRにおける有用性を比較、検討したので報告する。\n\n【対象･方法】機器はOrtho Visionを使用し、計36件を対象にCSJによるSCRを実施した。内訳は、現行のBVSJにて①LISS-IATのみ陽性:2件、②酵素法のみ陽性:26件、③両方ともに陽性：1件、④過去に抗体保有歴あり(現在陰性):1件、⑤陰性検体：6件である。追加検査は BVSJ未処理血球を用いて試験管法にてPEG-IAT及びブロメリン1段法を実施した。\n\n【結果】BVSJ と CSJ の判定一致率は、①100％(2/2)、③100％(1/1)、④100％(1/1)、⑤100％(6/6)であった。②酵素法のみ陽性であった 26 件との一致率は 11.5％(3/26)にとどまり、残り23件はCSJで陰性となった。追加検査の結果、23件は非特異反応であることが示唆された。しかし、②の中で酵素法及びPEG-IATで抗E抗体を認めた1件にて、CSJでは陰性を示す結果となった。\n\n【考察】CSJはBVSJと同等の検出感度を有し、BVSJの酵素法で多発していた非特異反応を軽減できるため、業務効率化への高い有用性が期待された。しかし、酵素法及びPEG-IATで陽性を呈する抗E抗体がCSJで検出されない症例を1件認めた。抗E抗体は臨床的意義が高いため、CSJの使用については十分留意する必要があると考える。連絡先:0567-65-2511(内線:6350)", "sid": "s78"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "14:38", "et": "14:47", "title": "赤血球製剤オーダー予測における時系列分析の性能評価", "sub": "", "author": "永澤 昌大", "akana": "ナガサワ マサヒロ", "affil": "地方独立行政法人 静岡市立静岡病院", "pref": "静岡県", "co": ["木明 琢磨", "中野 李柚"], "cokana": ["キアキ タクマ", "ナカノ モユ"], "chairs": ["水野 友靖（小牧市民病院）"], "field": "輸血", "cat1": "統計学", "cat2": "輸血", "no": 116, "pdf": "0116.pdf", "chkana": ["ミズノ トモヤス"], "body": "【目的】血液製剤オーダーを予測できれば緊急時に在庫不足や供給時間の遅れを引き起こすことはない.AB型赤血球製剤のオーダー頻度は低いが不定期に発生する.これまで客観的指標として自己回帰移動平均(以下ARMA)モデルを用い製剤管理に活用できるか検討したが次数の変動,季節性を考慮できず課題が残った.今回,ARMA,季節変動自己回帰移動平均(以下SARIMA)及びLong Short-Term Memory(以下 LSTM)モデルを用い,血液製剤オーダー予測における有用性を後ろ向きに評価したので報告する.\n\n【方法】2021年6月1日から2026年3月31日までのAB型赤血球製剤オーダーデータを対象とした.2021年6月1日から 2025年 3月 31日までを学習期間,2025年 4月 1日から2026 年 3 月 31 日までを評価期間とした.ARMA およびSARIMAはモデル選択を 1回/月,LSTMでは再学習を 1回/月実施した.各モデルとも実測値を順次追加し1日先ローリング予測を行った.モデルの予測精度の評価として平均絶対誤差(以下MAE),二乗平均平方根誤差(以下RMSE）,一致率を算出した.\n\n【結果】ARMA の MAE は 2.161,RMSE は 3.249,一致率は18.9%であった.SARIMAのMAEは2.023,RMSEは3.408,一致率は 30.1%であり,最も高い予測精度を示した.LSTM のMAE は 2.167,RMSE は 3.190, 一 致 率 は 15.1% で あ った.RMSEはLSTMが最も低値を示し,SARIMAではMAEが低値,一致率で高値となった.\n\n【考察】SARIMAは ARMAと比較して一致率が高く,特に季節変動や曜日変動を伴うオーダー変化に対して高い追従性を示した.一方,複雑な非線形パターンの学習が可能であるが,一般に十分な学習データ量を必要とする LSTM は本検討のような単一施設における比較的少数のオーダーデータでは十分な学習が行えず,その性能を発揮できなかった可能性が考えられる.\n\n【結論】本検討より血液製剤オーダー予測は,年次・週次・曜日・季節性を含む複雑な時系列パターンを反映できるSARIMA が予測性能に優れていた.今後は前向き検討を通じて実運用下での有用性を評価する必要がある.連絡先054-253-3125(内線5420)", "sid": "s78"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "14:47", "et": "14:56", "title": "輸血・細胞治療部への手術用新鮮凍結血漿管理の業務集約化とその効果", "sub": "", "author": "田中 由美", "akana": "タナカ ユミ", "affil": "三重大学医学部附属病院", "pref": "三重県", "co": ["角屋 佳苗", "丸山 美津子", "河島 健太郎", "枩永 莉奈", "加藤 結菜", "白本 裕平", "大石 晃嗣"], "cokana": ["カドヤ カナエ", "マルヤマ ミツコ", "カワシマ ケンタロウ", "マツナガ リナ", "カトウ ユイナ", "ハクモト ユウヘイ", "オオイシ コウシ"], "chairs": ["水野 友靖（小牧市民病院）"], "field": "輸血", "cat1": "チーム医療", "cat2": "管理・運営", "no": 117, "pdf": "0117.pdf", "chkana": ["ミズノ トモヤス"], "body": "【背景】 当院では手術部や高度救命救急センターに血液製剤専用フリーザーが設置されている。また臨床現場スタッフが新鮮凍結血漿（FFP-LR）の融解作業を行ってきた。しかし、手術部では、血液製剤の保管方法やFFP融解装置による融解方法等の不備が発生し、貴重な血液製剤を廃棄せざるを得ない事例が発生していた。また特に、緊急時の多忙な状況下での人員不足による業務負担が問題になっていた。\n\n【業務集約までの経緯】 手術部における諸問題について相談を受け、2024年9月、麻酔科医師2名、臨床工学技士2名、手術部看護師3名、輸血・細胞治療部医師1名、臨床検査技師1名での臨時ミーティングを実施した。同年11月より一部の術式を除き、輸血・細胞治療部でFFP-LRを融解・搬送する体制を試験的に導入した。2026年5月からは手術部での専用フリーザー使用を完全に中止し、手術部すべてのFFP-LR管理を輸血・細胞治療部へ集約化した。\n\n【結果】改善すべき点としてあげられたのは、手術部で使用しているFFP-LR融解装置はかなり老朽化していること、FFP-LR融解装置の適正な使用方法について、現場スタッフ全員への周知が難しいことであった。今回、業務のタスクシフト・シェアが実現した結果、臨床現場スタッフの業務負担軽減に貢献できるようになった。これにより、臨床現場の各専門職が本来業務に集中できる環境が整ったと考えられる。さらに血液製剤管理の集約化は、FFP-LR融解装置の管理台数の削減や患者間の血液製剤取違いの防止にもなった。\n\n【結語】手術用FFP-LR管理の輸血・細胞治療部への集約化は、血液製剤の安全管理のみならず、輸血・細胞治療部への信頼向上や医療者間のコミュニケーション活性化という副次的効果をもたらした。今後も積極的な臨床への貢献と提案を継続していきたい。三重大学医学部附属病院 輸血・細胞治療部059-231-5175", "sid": "s78"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "14:40", "et": "14:49", "title": "GENECUBE低温域ピークで診断した皮膚M. haemophilum感染症", "sub": "", "author": "倉内 環来", "akana": "クラウチ タマキ", "affil": "藤田医科大学病院", "pref": "愛知県", "co": ["東本 祐紀", "村山 元秀", "小島 奏汰", "濱岸 真奈美", "星 雅人"], "cokana": ["ヒガシモト ユウキ", "ムラヤマ モトヒデ", "コジマ カナタ", "ハマギシ マナミ", "ホシ マサト"], "chairs": ["濱田 智博（豊橋市民病院）"], "field": "遺伝子、染色体", "cat1": "症例", "cat2": "抗酸菌", "no": 118, "pdf": "0118.pdf", "chkana": ["ハマダ トモヒロ"], "body": "【はじめに】Mycobacterium haemophilum は易感染患者における皮膚感染症などを引き起こすことが知られている。至適発育温度は25～30℃で、発育にヘミンや鉄を必要とする。通常の37℃抗酸菌培養条件では検出が難しく、ヒツジ血液寒天培地やチョコレート寒天培地などによる低温培養が必要である。今回、GENECUBE MTBで皮膚組織から通常より低温域で検出ピークを認めたことを契機に培養条件を見直し、M. haemophilum と同定した皮膚感染症の一例を経験したので報告する。\n\n【症例】患者は50歳代、女性。約10年前に腎移植を受け、免疫抑制剤を継続服用中であった。全身の紅斑精査のため皮膚組織生検が施行されたが、初回検体では確定診断に至らず、通院下にて繰り返し皮膚組織生検が提出された。\n\n【臨床微生物学的検査】皮膚組織に対して GENECUBEMTBを実施したところ、通常の結核菌群とは異なる低温域に検出ピークを認め、結核菌群の確定には至らなかった。さらに複数回提出された皮膚組織でチールネルゼン染色陽性を認めたこと、通常の抗酸菌培養では発育を認めなかったことから、M. haemophilumを含む非結核性抗酸菌を疑い、ポアメディア® 羊血液寒天培地Ｍ70（栄研化学）を用いた30℃低温培養を開始した。培養開始から約6週間後に灰色の微小コロニーの発育を認め、MALDI バイオタイパー（Mycobacteria version 7, Bruker）にて、M. haemophilum と同定した。\n\n【考察・結語】M. haemophilum はGENECUBE MTBの融解曲線解析において低温域で検出ピークを示すことが報告されている。その要因として、MTBのプローブ結合領域とM. haemophilumの遺伝子領域に類似性があるためと考えられている。本症例は融解曲線での低温域検出ピークを契機に、M. haemophilum を含む非結核性抗酸菌を疑い低温培養を追加することでM. haemophilumを同定することができた。皮膚病変を有する易感染患者でGENECUBE MTBの融解曲線解析に低温域ピークを認めた場合には、M. haemophilumを念頭に低温培養やヘミン・鉄を含む培地を考慮した培養条件の追加を検討する必要がある。藤田医科大学病院 0562-93-2304（内線2304）", "sid": "s79"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "14:49", "et": "14:58", "title": "AmoyDx®肺癌マルチ遺伝子検査の院内実施シミュレーション", "sub": "", "author": "松尾 奈緒", "akana": "マツオ ナオ", "affil": "安城更生病院", "pref": "愛知県", "co": ["情家 千裕", "永田 篤志"], "cokana": ["ジョウケ チヒロ", "ナガタ アツシ"], "chairs": ["濱田 智博（豊橋市民病院）"], "field": "遺伝子、染色体", "cat1": "遺伝子検査", "cat2": "その他の病理", "no": 119, "pdf": "0119.pdf", "chkana": ["ハマダ トモヒロ"], "body": "【はじめに】AmoyDx®肺癌マルチ遺伝子検査は、腫瘍組織から抽出したDNA中の遺伝子変異、RNA中の融合遺伝子などを検出することにより、非小細胞癌患者への分子標的薬の適応判定を目的として行われる検査である。現在、当院ではこれらの検査を外部委託にて実施している。今回は、理研ジェネシスのAmoyDx®肺癌マルチ遺伝子PCRパネルを用いて院内で検査を実施した場合のシミュレーションを行った。\n\n【方法】2022年4月から2025年9月までの期間に、当院にて AmoyDx®肺癌マルチ遺伝子検査を実施した非小細胞癌患者から遺伝子変異陽性となった手術材料検体6件を抽出した。同一ブロックから厚さ 5 µmに切り出した切片に対して理研ジェネシスのAmoyDx®肺癌マルチ遺伝子PCRパネル並びに当検査室が所持しているコバス z480 を用いて検査を実施し、検査結果の外部委託結果との一致率、操作性、Turnaround Time ; TATを確認した。\n\n【結果】外部委託結果との陽性一致率は 100%であり、外部委託時と同様の結果が得られた。操作性においては薄切して提出するだけで検査室の作業が完了となる外部委託に比べるとDNAとRNAの抽出やパネル使用時の細かなピペット操作などがやや煩雑であった。TATについては、外部委託時の結果報告所要日数が10~14日であることに対し、院内実施時はDNAおよびRNA抽出操作 (第一工程)と試薬調製並びにPCRパネルへの試薬・検体分注(第二工程)、それぞれに一日ずつを要し、結果報告日数は2日となった。\n\n【考察】AmoyDx®肺癌マルチ遺伝子 PCRパネルを用いた検査を院内で実施した場合、検査結果報告日数は大幅に短縮できるが、試薬のコストや検査人員を考えると複数検体を同時に検査する必要があることが分かった。ピペット操作をはじめとした細かい手作業が必要なことから専従で検査を実施する要員の確保及び研修、臨床との AmoyDx®肺癌マルチ遺伝子検査に提出する検体数の調整、報告希望日数のすり合わせなどが今後の課題と考える。院内導入の可否については、今回のシミュレーション結果や臨床側の要望等も考慮した上で、慎重に検討を重ねていきたい。\n\n【連絡先】0566-75-2111 病理細胞検査室 内線(2461)", "sid": "s79"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "14:58", "et": "15:07", "title": "microRNA抽出効率向上を目的とした添加溶液の検討", "sub": "", "author": "上野 静紅", "akana": "ウエノ シズク", "affil": "社会医療法人大雄会 医科学研究所", "pref": "愛知県", "co": ["鈴木 健太郎"], "cokana": ["スズキ ケンタロウ"], "chairs": ["濱田 智博（豊橋市民病院）"], "field": "遺伝子、染色体", "cat1": "遺伝子検査", "cat2": "染色体", "no": 120, "pdf": "0120.pdf", "chkana": ["ハマダ トモヒロ"], "body": "【目的】microRNA (miRNA)は、癌をはじめとする各種疾患の診断や病態把握に有用なバイオマーカーとして注目されている。しかし、臨床検体、特にホルマリン固定パラフィン包埋(FFPE)組織では、核酸の断片化や収量低下により、解析に十分な量と質の miRNAを安定して得ることが困難な場合がある。そこで本研究では、miRNA抽出効率の向上を目的として、市販 miRNA抽出キットに添加可能な各種溶液の有用性を検討した。\n\n【対象および方法】対象は合成 miR-21および大腸癌患者由来 FFPE組織切片10例とした。抽出にはHigh Pure miRNA Isolation Ki（t Roche）を用い、キット付属のBinding Enhancerの代替として、1,4-ジオキサン、2-ブタノール、2-プロパノール、アセトニトリル、ポリエチレングリコール (PEG) 600、1000、1540、2000、テトラエチレングリコールジメチルエーテル、テトラヒドロフランを100～600 µL添加した。抽出後の核酸溶液について、miR-21を標的としたstem-loop RT-qPCRを行い、crossing point (Cp) 値によりmiRNA収量を評価した。\n\n【結果】合成 miR-21を用いた検討では、各添加溶液の至適添加量は200～500 µLであり、未添加時と比較したΔCp値は1.04～2.50であった。特にPEG 1540およびPEG 2000は少量の添加で良好なCp値低下を示した。さらにFFPE組織を用いた検討では、市販キット標準法でのCp値が20.56±4.26であったのに対し、PEG 1540添加では18.15±2.26、PEG 2000添加では17.73±3.26となり、miR-21回収効率の向上が認められた。\n\n【考察】市販 miRNA抽出キットに特定の添加溶液を加えることで、miRNA抽出効率が向上する可能性が示された。特に PEG1540および PEG 2000は FFPE組織においても有用であり、臨床検体を用いた miRNAの抽出方法として、検査精度の向上に寄与する可能性が示唆された。連絡先 – 0586-53-3661", "sid": "s79"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "15:07", "et": "15:16", "title": "Ｒａｐｉｄ－ＮｅｏにおけるＦＧＦＲ３変異評価と運用改善への取り組み", "sub": "", "author": "西野 綾音", "akana": "ニシノ アヤネ", "affil": "社会医療法人厚生会 中部国際医療センター", "pref": "岐阜県", "co": ["澤田 清矢", "幅 菜摘", "鈴木 敦"], "cokana": ["サワダ セイヤ", "ハバ ナツミ", "スズキ アツシ"], "chairs": ["濱田 智博（豊橋市民病院）"], "field": "遺伝子、染色体", "cat1": "遺伝子検査", "cat2": "その他", "no": 121, "pdf": "0121.pdf", "chkana": ["ハマダ トモヒロ"], "body": "【背景・目的】FGFR3遺伝子異常を有する尿路上皮癌に対し、エルダフィチニブが2025年7月に適応承認された。これに伴い、FGFR3異常検出の重要性が高まっている。がん遺伝子パネル検査は網羅的解析が可能であるが、ターゲット領域のカバレッジ等の影響により低頻度変異の検出が困難な場合がある。当院で実施しているがん遺伝子パネル検査（Rapid-Neo）において、FGFR3変異の見落としが疑われた症例を契機に、同変異の検出状況を後ろ向きに検討し、当該領域の検査特性の評価および運用改善を目的とした。\n\n【方法】2022年 1月から 2026年 1月までに Rapid-Neoを実施した尿路上皮癌 62症例を対象とし、ゲノムブラウザ（Genome-Jack）を用いてFGFR3領域の精査を行った。評価対象は、同剤のコンパニオン診断対象である4種の一塩基変異（p.R248C、p.S249C、p.G370C、p.Y373C）および2種の融合遺伝子（FGFR3-TACC3v1、FGFR3-TACC3v3）とした。\n\n【結果】62 症例中、自動解析の判定基準（VD≧10、VAF≧4％）を満たす変異が検出された症例は5例、未検出症例は57例であったが、未検出症例のうち10例には検出限界未満（VD＜10）の変異リードが認められた。これは全尿路上皮癌症例の16.1％に相当した。このうち、その後コンパニオン診断が実施された1例ではFGFR3変異陽性と判定され、追加精査結果との整合が確認された。\n\n【考察】本検査におけるFGFR3ホットスポット領域は、カバレッジ等の影響により変異検出が困難となり得る領域であることが示唆された。そのため自動解析の判定に加え、ゲノムブラウザを用いた目視精査を行うことで、検出限界未満の変異リードを持つ症例を抽出できることから、結果を補完する上で有用と考えられた。\n\n【結語】本検討を契機に、尿路上皮癌症例に対してゲノムブラウザを用いたFGFR3の追加精査を導入した。院内NGS検査の利点を活かし、検査特性を踏まえた補完的評価を行うことで臨床へより有用な情報提供が可能になると考える。連絡先：0574-66-1100(内線 8100)", "sid": "s79"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "08:50", "et": "08:59", "title": "当院におけるパニック値報告後対応の可視化に向けた運用体制の構築", "sub": "", "author": "羽田野 美奈子", "akana": "ハタノ ミナコ", "affil": "社会医療法人 蘇西厚生会 松波総合病院", "pref": "岐阜県", "co": ["後藤 真美", "後藤 幸雄", "森本 剛史", "菊地 良介"], "cokana": ["ゴトウ マミ", "ゴトウ ユキオ", "モリモト ツヨシ", "キクチ リョウスケ"], "chairs": ["林 裕介（総合病院中津川市民病院）"], "field": "チーム医療", "cat1": "システム化", "cat2": "その他", "no": 122, "pdf": "0122.pdf", "chkana": ["ハヤシ ユウスケ"], "body": "【背景】パニック値は生命に危険を及ぼす可能性のある異常値であり、迅速かつ適切な対応を要する。当院では従来、パニック値発生時に依頼医師へ電話報告を行っていたが、報告後の対応内容が電子カルテに記載されているかの確認は実施していなかった。今回、『臨床検査「パニック値」運用に関する提言書』への対応及び ISO15189認定取得を契機として、臨床検査技師による報告後確認体制を整備した。\n\n【目的】パニック値報告後の医師対応を可視化することを目的に、電子カルテ記載確認を含む新たな報告体制を構築し、その運用内容と課題を検討した。\n\n【運用変更】従来20項目を対象としていたパニック値報告のうち、医療安全管理室担当医師と協議の上、電子カルテ記載確認の対象を、致死的となる可能性がある緊急性の高いK、Glu、PT-INR、Hb、PLTの5項目に限定し、併せてKの報告上限値を5.7mEq/Lから6.0mEq/Lへ変更した。対象項目について、臨床検査技師が依頼医師へ電話報告後、電子カルテ上で処置内容の記載有無を確認し、ClinicalSupporting Systemに記録した。さらに、医療安全管理室担当医師が処置内容の妥当性を確認する運用とした。\n\n【結果】新体制導入後、電子カルテ記載確認の対象件数は月平均約50件となり、従来のパニック値報告件数（月平均約200件）の約1/4であった。これにより、検査業務への過度な負担を回避しつつ、パニック値報告後の医師対応及びカルテ記載状況を把握可能な体制が整備された。\n\n【考察】対象項目を限定することで、日常検査業務に配慮した現実的な運用が可能となった。一方で、電子カルテの記載様式は医師間で差異があり、処置内容の確認に時間を要する症例も認めた。今後は記載様式の標準化、記載率の集計・評価を進め、医療安全委員会と連携しながら、パニック値対応の質向上に努めたい。連絡先：058-388-0111 内線 2235", "sid": "s4"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "08:59", "et": "09:08", "title": "当院における臨床検査技師による静脈路確保のタスクシフト／シェアの取り組み", "sub": "", "author": "稲葉 奈津美", "akana": "イナバ ナツミ", "affil": "地方独立行政法人知多半島総合医療機構 知多半島総合医療センター", "pref": "愛知県", "co": ["山崎 章子"], "cokana": ["ヤマザキ アキコ"], "chairs": ["林 裕介（総合病院中津川市民病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "その他", "no": 123, "pdf": "0123.pdf", "chkana": ["ハヤシ ユウスケ"], "body": "【はじめに】法改正により、2021年 10月 1日から臨床検査技師の業務範囲が新たに拡大された。その1つとして静脈路確保がある。当院の臨床検査技師による採血時における静脈路確保の取り組みについて報告する。\n\n【背景】当院は、2025年4月に新病院に移転し、それに伴い採血室と中央処置室が隣接し、ほぼすべての診療科の採血、処置を行っている。そのため、中央処置室の業務量が増加し看護師の業務負担が増加した。\n\n【目的】看護師の業務負担軽減、患者動線の最適化、技師のスキル拡大と多職種連携の強化などを目指し、新病院開院時より臨床検査技師による静脈路確保を開始することとした。\n\n【取り組み】新病院開院時より臨床検査技師による静脈路確保を実施できるよう2024年夏から研修を開始した。まず看護師による静脈路確保の手技の指導をリーダー技師が受け、次にリーダー技師による模擬血管を使用した実技指導を全技師に行った。その後看護師立ち合いの元、患者に静脈路確保を行った。新病院開院の2025年4月の時点では、採血室勤務の技師21名中６名が研修を終了し手技を獲得できた。現在では12名の技師が手技を獲得し業務を行っている。\n\n【結果】開院当初は、採血時の静脈路確保は看護師と分担して行っていたが、現在ではすべてを臨床検査技師が行っている。その件数は2025年5月に1月当たり33件であったが、2025年12月は67件に増加した。また、2026年３月からは、採血と同日に造影検査がある場合の静脈路確保においても患者負担軽減のため採血室で行うようになったため2026年4月の件数は、119件と著増した。\n\n【まとめ】今後も静脈路確保ができる技師を育成し、患者サービス向上、業務効率化を達成する体制を整えていきたい。連絡先 知多半島総合医療センター 臨床検査技術科0569-89-0515", "sid": "s4"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:08", "et": "09:17", "title": "救急外来診察室における診療支援", "sub": "～救急外来常駐の検査技師として～", "author": "東 さくら", "akana": "ヒガシ サクラ", "affil": "医療法人 豊田会 刈谷豊田総合病院", "pref": "愛知県", "co": ["伊藤 英史", "磯部 勇太", "宮本 康平", "西尾 祐貴", "大嶋 剛史"], "cokana": ["イトウ エイジ", "イソベ ユウタ", "ミヤモト コウヘイ", "ニシオ ユウキ", "オオシマ タケシ"], "chairs": ["林 裕介（総合病院中津川市民病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "その他", "no": 124, "pdf": "0124.pdf", "chkana": ["ハヤシ ユウスケ"], "body": "【はじめに】救急外来では、重症患者や救急搬送患者への対応に人的資源が集中するため、ウォークイン（診察室）患者への迅速な介入が困難となる場合がある。院内トリアージを実施しているものの、診察や検査の過程で早期介入の必要性が判明する症例も存在する。このため、ウォークイン患者に対しても適時適切な医療提供が求められている。当院では臨床検査技師が救急外来に常駐し、診察室における診療支援を行っていることから、その業務内容および取り組みについて報告する。\n\n【業務内容】検査前準備、電解質輸液のルート作成および静脈路確保、採血、POCT（血液ガス・血糖測定）、各種検体採取、心電図検査、検査案内などの診療支援業務を実施している。さらに、検査結果の確認および報告を行うとともに、採取容器、必要検体量、残検体による追加検査の可否など、検査に関する問い合わせ対応も行っている。\n\n【取り組み】診察室における診療支援として、初療室業務と並行し診察室側の繁忙時には、看護師と連携しながら、前述した検査関連業務を中心とした一連の診療業務を主体的に実施している。検査結果は救急外来に設置した検査システムにより確認し、特に血液ガス分析については電解質異常や代謝異常の早期把握が可能であることから、異常値を認めた際には速やかに臨床医へ報告している。これらの取り組みにより検査および結果報告の迅速化が図られ、診療早期に重症度の再評価が可能となり、結果として優先順位の見直しおよび早期治療介入につながった症例が認められた。\n\n【まとめ】救急外来に臨床検査技師が常駐し、看護師とともに診察室における診療業務に関与することで、ウォークイン患者への対応の迅速化が図られた。本取り組みは救急外来における診療の質向上に加え、タスクシフト・シェアの推進および人的資源の有効活用につながる可能性が示唆された。連絡先：0566-25-2948", "sid": "s4"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:17", "et": "09:26", "title": "血液培養陽性感染性心内膜炎（IE）25症例の検討 -微生物検査室とASTの役割-", "sub": "", "author": "高森 亮輔", "akana": "タカモリ リョウスケ", "affil": "富山県立中央病院", "pref": "富山県", "co": ["重松 良実", "宮寺 志保", "中村 雅彦", "町村 和世", "松岡 百子"], "cokana": ["カサマツ ヨシミ", "ミヤデラ シホ", "ナカムラ マサヒコ", "マチムラ カズヨ", "マツオカ モモコ"], "chairs": ["林 裕介（総合病院中津川市民病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "その他の微生物", "no": 125, "pdf": "0125.pdf", "chkana": ["ハヤシ ユウスケ"], "body": "[背景]感染性心内膜炎（IE）は高い死亡率を伴う重篤な感染症で、早期診断および適切な抗菌薬治療が重要である。血液培養を中心とした微生物検査室からの迅速報告とAST（Antimicrobial Stewardship Team）による抗菌薬適正使用支援はIE診療において重要と考えられる。今回、血液培養陽性 IE症例を対象に微生物検査室と ASTの役割について、プロセス評価を含めて検討した。[方法]2022年7月～2025年12月までに当院で経験した血液培養陽性 IE 25例を後方視的に解析した。患者背景、起因菌、血液培養陽性時の微生物検査室対応、AST介入率、血液培養複数セット採取率、適正抗菌薬選択率、de-escalation実施率、心エコー実施率、手術実施率、AST介入回数、転帰等を調査した。[結果]年齢分布は24歳から95歳、平均は72.2±16.2歳、中央値は76歳、8割が男性であった。65歳以上の患者が7割を占めていた。血液培養からの検出菌は、レンサ球菌群（41%）、腸球菌（22%）、MSSA（19%）、CNS（18%）であった。血液培養陽性時の微生物検査室からのグラム染色結果報告は全例で24時間以内であった。AST介入率は84％であった。血液培養複数セット採取率は 100％、適正抗菌薬選択率は100％、de-escalation実施率は72％であった。心エコー実施率100％、手術実施率56％であった。AST介入回数は、平均3.4±2.7回、中央値3回であった。転帰は、回復退院が84％、死亡が16％であった。[考察] 血液培養は感染性心内膜炎診断の要であり、当院では全例で複数セット採取が行われ、血液培養陽性時には微生物検査室から速やかにグラム染色結果が報告されていた。さらに AST が高率に介入し、適正抗菌薬選択や de-escalationにつながっていたことから、微生物検査室とASTの連携は IE 診療における抗菌薬適正使用支援に有用であると考えられた。一方で、IEは重篤な合併症を伴う症例も多く、本検討では検査室・AST介入と臨床転帰との直接的な関連は明らかにできなかった。今後は介入時期や介入内容の詳細な評価を行うとともに、症例数を増やして検討する必要がある。連絡先：076-424-1531", "sid": "s4"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:30", "et": "09:39", "title": "法的脳死判定を初めて実施した一例", "sub": "", "author": "西田 昂平", "akana": "ニシダ コウヘイ", "affil": "社会医療法人 杏嶺会 一宮西病院", "pref": "愛知県", "co": ["林 晃司", "清水 結都", "南 裕貴", "佐々木 真奈美", "藤本 伸吾", "堀出 剛"], "cokana": ["ハヤシ コウジ", "シミズ ユイト", "ミナミ ヒロキ", "ササキ マナミ", "フジモト シンゴ", "ホリデ ツヨシ"], "chairs": ["林 健太（JA愛知厚生連 豊田厚生病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "その他", "no": 126, "pdf": "0126.pdf", "chkana": ["ハヤシ ケンタ"], "body": "【はじめに】法的脳死判定は厳密な手順と多職種の協力が求められる医療行為である。今回、初めて携わる機会を得た法的脳死判定の運用と課題を報告する。\n\n【当院背景】2024年度より法的脳死判定の運用開始に向けて準備が開始された。2025 年度に運用開始の準備が整い、名古屋掖済会病院の連携体制構築事業に加入後、JOTの確認を経て運用開始となった。\n\n【症例】10代男性。搬送時、Vfと判断され電気ショック実施、その後HR40程度。GCS1/1/1、瞳孔散大5/5mm、対光反射直接間接ともになし、角膜反射なし、咳反射が残っていた。蘇生後脳症と診断されたが、バッキングもあり完全な全脳死には該当しない状態であった。\n\n【経過】搬送から48時間経過した脳CTにおいては皮髄境界が不明瞭化した状態がはっきりしているが、一部明瞭な部分も存在し、下顎呼吸様の反射が認められた。搬送から84時間経過した頃、sBP50台に急激に低下、心エコーではEF20％程度となり脳浮腫、低酸素脳症の進行が確認された。また、バッキングや吃逆も消失した。その後、脳幹反射の確認および高感度脳波を実施し、脳死とされうる状態であると判断された。ご家族の意思が確認され、第一回法的脳死判定および第二回法的脳死判定を実施後、ご家族様立会いのもと死亡宣告となった。\n\n【考察】高感度脳波測定は通常の脳波検査との違い、機器間や電極間距離の測定や環境によるノイズの除去が重要であることが学べた。また、脳幹反応の消失や無呼吸テストなど法的脳死判定に必要な検査を多数実施する必要がある。そのため、医師と情報共有を行い時間に追われないように余裕をもって事前準備を行う必要があると感じた。\n\n【まとめ】法的脳死判定を経験したことによって得たスキルや知見を共有し要員を育てることで、いつでも対応できるような体制を準備しておくことが重要である。そのために不安点の洗い出しを行い、確実にかつ円滑に検査を終えられるような体制を整えていく予定である。連絡先:0586-48-0070", "sid": "s12"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:39", "et": "09:48", "title": "内視鏡室で関わった高度凝固能異常を伴う消化管出血の一症例", "sub": "", "author": "脇坂 典子", "akana": "ワキザカ ノリコ", "affil": "公立羽咋病院", "pref": "石川県", "co": ["飯田 智奈都", "堀 雪子", "山内 和美"], "cokana": ["イイダ チナツ", "ホリ ユキコ", "ヤマウチ カズミ"], "chairs": ["林 健太（JA愛知厚生連 豊田厚生病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "その他", "no": 127, "pdf": "0127.pdf", "chkana": ["ハヤシ ケンタ"], "body": "【はじめに】内視鏡業務に2013年より携わり、多職種で連携・協力し、安全かつ質の高い検査・治療の提供を心がけている。今回、高度凝固能異常を伴う消化管出血の一症例を経験した。本症例を通じ、検査専門職として事前検査や結果を把握すること、スタッフ間における情報共有の重要性を再認識したため報告する。\n\n【症例】83才女性、要介護5、ADL全介助（施設入所）。＜既往歴＞パーキンソン症候群、慢性硬膜下血腫術後、胃瘻造設後、PT-INR過延長の既往（vit K欠乏疑い）。＜現病歴＞X月X日、前日からの大量下血、血圧低下にて救急搬送。10日前より発熱嘔吐、炎症反応高値あり絶食の上抗生剤投与。抗血栓薬・抗凝固薬内服なし。＜来院後の経過＞来院時BP62/39、暗赤色便多量。ドパミン開始。緊急内視鏡依頼あるも、内視鏡医より輸血しバイタル安定後に施行する旨と胃瘻チューブからの血液吸引有無確認の指示あり救急室にて直接救急医に報告。その際、採血提出あり検査室へ搬送、担当技師へ患者情報共有。採血結果Hb 8.1 g/dl（10日前：Hb 14 g/dl）、PT-INR 26.43、APTT 106.5秒と貧血および高度凝固能異常ありパニック値報告がされ、過去にも同様の凝固異常がありvit K欠乏疑いにてvitK2製剤が投与された。患者血液型は RBC製剤院内在庫がある血液型であり、即交差適合試験が進められ輸血開始後に上部内視鏡施行。十二指腸潰瘍あり潰瘍底の露出血管から活動性出血を認め止血処置が行われた。処置後入院しRBC製剤計4単位輸血。翌日採血Hb 12.0g/dl、PT-INR 1.22、APTT 30.8秒と改善。\n\n【考察】本症例は抗血栓薬や抗凝固薬の内服はなく、vitK2投与で凝固能が改善したことから絶食と抗生剤投与によるvit K欠乏が示唆された。今回、凝固・血液型採血が事前にされ、その搬送に直接関わり検査担当技師と患者情報共有、内視鏡スタッフとパニック値や輸血に向けた進捗状況共有、救急看護師と検査室・内視鏡室双方の状況を共有することで安全に緊急内視鏡に望むことができた。\n\n【結語】検査技師は検査科と内視鏡室双方の状況を把握できる存在である。事前検査や結果の把握に努め、なされていない場合等は積極的に行動し情報共有に努めたい。連絡先：0767-22-1220（内線1360）", "sid": "s12"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:48", "et": "09:57", "title": "臨床検査技師主導による直腸肛門機能検査導入の取り組みと運用の実際", "sub": "", "author": "髙島 麻倭子", "akana": "タカシマ マイコ", "affil": "一般財団法人 芙蓉協会 聖隷沼津病院", "pref": "静岡県", "co": [], "cokana": [], "chairs": ["林 健太（JA愛知厚生連 豊田厚生病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "心電図・その他生理学検査", "no": 128, "pdf": "0128.pdf", "chkana": ["ハヤシ ケンタ"], "body": "【背景】近年の医療情勢におけるタスク・シフト/シェアの推進に伴い、法改正によって臨床検査技師の業務範囲が拡大された。一方で、各医療機関では、拡大業務を円滑に導入し、チーム医療へどのように貢献していくかが課題となっている。\n\n【目的】当院では、医師からの要望を受け、これまで未実施であった直腸肛門機能検査を臨床検査技師主導で導入した。本報告では、その導入プロセスおよび運用の実際について報告する。\n\n【方法】まず、当院医師を対象に「臨床検査技師の拡大業務として実施を希望する項目」に関するアンケート調査を実施した。その結果、未実施であった直腸肛門機能検査への要望が高かったことから、新規導入を決定した。導入にあたり、①医師との協議による実施項目の選定および年間予測件数の算出、②先進施設の見学による情報収集、③デモ機を用いた説明会の開催および担当技師の選定・技術習得、④プライバシーに配慮した検査環境の整備、⑤電子カルテおよびオーダーシステムの構築、を実施した。さらに、外来看護師や医療クラークと連携し、患者説明用リーフレットの作成を含め、予約受付から検査実施、結果報告までの運用フローを整備した。\n\n【結果】医師のニーズを明確化したうえで、多職種との連携を図りながら人的資源、設備、システム面の課題を計画的に解決したことで、直腸肛門機能検査の運用を開始することができた。運用開始後は大きなトラブルもなく、円滑な検査体制を維持できている。\n\n【今後の展望】新規検査の導入においては、医師のニーズ把握に加え、多職種との連携による運用体制の構築が重要であった。今後は、実施日の拡大、担当技師の育成・増員、および当院独自の基準値設定を進めることで、さらなる診療支援への貢献を目指したい。（連絡先：055-952-1000）", "sid": "s12"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:57", "et": "10:06", "title": "当院における心臓カテーテル検査業務へのタスクシフトの実践", "sub": "", "author": "竹村 洸祐", "akana": "タケムラ コウスケ", "affil": "社会医療法人 蘇西厚生会 松波総合病院", "pref": "岐阜県", "co": ["古賀 翔馬", "神谷 敏之", "橋本 あゆみ", "後藤 幸雄"], "cokana": ["コガ ショウマ", "カミヤ トシユキ", "ハシモト アユミ", "ゴトウ ユキオ"], "chairs": ["林 健太（JA愛知厚生連 豊田厚生病院）"], "field": "チーム医療", "cat1": "チーム医療", "cat2": "その他", "no": 129, "pdf": "0129.pdf", "chkana": ["ハヤシ ケンタ"], "body": "【緒言】近年、医師の働き方改革や医療の効率化を背景に、多職種連携によるタスクシフト・シェアリングが推進されている。心臓カテーテル検査は、手技中の迅速な判断、正確な生理学的データの把握、機器操作、多職種間の情報共有が求められる領域であり、臨床検査技師の専門性を活かしやすい分野である。\n\n【目的】当院では20年以上にわたり、臨床検査技師が心臓カテーテル検査業務に参画してきた。本発表では、当院における業務内容と役割の変遷を整理し、タスクシフト・シェアリングの観点から有用性と課題を検討する。\n\n【方法】当院の心臓カテーテル検査において臨床検査技師が担当してきた業務を、検査前、検査中、検査後に分類した。また、業務範囲の変遷、多職種との連携体制、教育体制、業務拡大に伴う課題について整理した。\n\n【結果】臨床検査技師は、ポリグラフ操作、心電図および血行動態モニタリング、検査記録、冠動脈内画像診断や生理学的評価の補助、データ管理、機器トラブル対応などに関与していた。これらの業務を担うことで、医師が手技に集中できる環境整備、検査の円滑な進行、多職種間の情報共有に寄与していた。また、カテーテル検査で得られる解剖学的知識や血行動態の理解は、心エコーや血管エコーなど他の生理検査業務にも活かされ、臨床検査技師の専門性向上につながっていた。\n\n【考察】心臓カテーテル検査における臨床検査技師の参画は、単なる業務補助ではなく、循環器検査に関する専門性を活かしたチーム医療の一部であると考えられる。一方で、業務範囲の明確化、標準化された教育体制、緊急時対応の習熟、責任分担の整理は今後の課題である。\n\n【結語】当院における20年以上の実践から、心臓カテーテル検査業務への臨床検査技師の参画は、チーム医療の質向上とタスクシフト・シェアリングの推進に寄与する可能性が示唆された。今後は、業務内容の標準化と教育体制の整備により、より安全で質の高い医療提供体制の構築に貢献できると考えられる。連絡先：松波総合病院超音波検査室P H S：3205", "sid": "s12"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:00", "et": "11:09", "title": "当院における尿分注ミス軽減へ向けた取り組み", "sub": "", "author": "長谷川 圭", "akana": "ハセガワ ケイ", "affil": "三重県厚生農業協同組合連合会 松阪中央総合病院", "pref": "三重県", "co": ["大川 一正", "山口 幸代", "寺本 麻菜美", "大西 沙希", "川口 恵利奈", "前田 玲那", "上阪 浩矛"], "cokana": ["オオカワ カズマサ", "ヤマグチ サチヨ", "テラモト マナミ", "オオニシ サキ", "カワグチ エリナ", "マエダ レイナ", "ウエサカ ヒロム"], "chairs": ["福田 由里子（岐阜赤十字病院）"], "field": "その他", "cat1": "その他", "cat2": "その他", "no": 130, "pdf": "0130.pdf", "chkana": ["フクタ ユリコ"], "body": "【はじめに】検体検査室における医療安全の取り組みの中で、インシデントの原因を分析し、予防することは重要である。尿検体の分注ミスは、医療現場における重要なインシデントの一つであり、誤った診断や治療につながる可能性があるため、医療安全管理上の重要な課題として認識されている。今回、我々は尿検体の分注ミス軽減のため、運用の見直しを行ったので報告する。\n\n【背景】当院の検体検査部門では8名の技師が従事しており、外来診療が集中する午前中の繁忙時間帯における尿分注工程において、取り違えや分注漏れ等のヒヤリハットが散見されていた。これらの人的ミスは、誤報告に直結する重大なリスクであるが、自動分注機の導入はコスト面や設置スペースの制約から困難な状況にある。そのため、限られた人員や予算と既存の設備条件下で、いかに尿分注ミスを減らすかが課題であった。\n\n【目的】限られた人員や予算内での工夫を行い、尿の分注ミスを軽減すること。\n\n【方法】8名の技師にそれぞれ異なる色の蛍光ペンを割り当て、分注後のラベルにマーキングを行う。これにより、誰が分注したかを一目で判別できる簡易的なトレーサビリティ体系を構築し、実際に運用を行った。\n\n【結果】新しい運用の導入後、インシデント発生件数は現在0件と激減した。技師の当事者意識向上と注意力の維持に有効であった。\n\n【考察】マーキングという痕跡を残す作業が心理的なブレーキとなり、多忙時の注意散漫を防ぐ効果があったと考えられる。また、エラー発生時の責任の所在が可視化されることで、組織全体の医療安全に対する意識が強化されたと考えられる。 連絡先0598-21-5252(内線：3327)", "sid": "s60"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:09", "et": "11:18", "title": "血管穿刺行為における痛みとしびれの時間差について", "sub": "23件の医療訴訟判決文の分析から", "author": "吉田 淳一郎", "akana": "ヨシダ ジュンイチロウ", "affil": "岡崎市民病院", "pref": "愛知県", "co": ["天野 剛介", "稲吉 雅美", "足立 郁美", "野口 和希子"], "cokana": ["アマノ コウスケ", "イナヨシ マサミ", "アダチ イクミ", "ノグチ ワキコ"], "chairs": ["福田 由里子（岐阜赤十字病院）"], "field": "その他", "cat1": "その他", "cat2": "その他", "no": 131, "pdf": "0131.pdf", "chkana": ["フクタ ユリコ"], "body": "【背景と目的】採血や静脈路確保は日常的に行われる手技であるが、神経損傷やCRPSなどの合併症が報告されており、医療紛争につながる場合がある。今回、静脈採血や静脈路確保など(以下、穿刺行為)で合併症が発生し、患者が病院や診療所など(以下、穿刺施設)を訴えた事件について、穿刺行為により患者に痛みとしびれが生じた場合、穿刺施設側が患者の痛みとしびれを認識し得た時期と割合について調べた。【方法および対象】裁判所ウェブサイトおよびLEX/DBインターネットを用いた。検索式は(採血OR点滴OR静脈路OR注射OR留置針)AND(神経OR CRPS ORカウザルギーOR合併症OR後遺)とした。検索期間は指定しなかった。事件の経緯が詳細に記載される第一審のみ(23件)を対象とした。対象判例の判決日は1996年5月～2024年10月であった。【結果】痛みについては23件中、1件で施設側が認識し得た時期が不明であった。不明例を除く22件中、穿刺行為中に施設側が患者の痛みを認識し得たものは77.3%(17/22件)、当日中は 81.8%(18/22件)、3日以内では100%(22/22件)であった。しびれについては23件中、8件で施設側が認識し得た時期が不明であった。不明例を除く15件中、穿刺行為中に施設側が患者のしびれを認識し得たものは20.0%(3/15件)、当日中は53.3%(8/15件)、3日以内では 73.3%(11/15件)であった。【考察・結語】痛みは穿刺中 77.3%、3 日以内で 100%施設側が認識し得たのに対し、しびれは穿刺中20.0%、3日以内は73.3%にとどまった。穿刺直後にはしびれとして明確に訴えられず、通常と異なる痛みとして表現される例がある可能性が示唆された。したがって、しびれの有無のみで判断せず、痛みの性状確認や経過観察・受診勧奨が重要と考えられた。なお、本研究は医療訴訟判決文に基づくため、症状表現や認識時期が訴訟上の主張・記録内容の影響を受ける可能性がある。また、症状の出現時期・性状、説明内容、経過観察や受診勧奨の有無を記録することは、神経障害発生時の医療安全上の振り返りに有用であり、医療紛争発生時の事実確認にも重要と考えられた。連絡先―0564-21-8111(代表)", "sid": "s60"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:18", "et": "11:27", "title": "QCサークル活動を用いた採血後の血液漏れ事例の低減", "sub": "", "author": "小栗 あずさ", "akana": "オグリ アズサ", "affil": "聖隷浜松病院", "pref": "静岡県", "co": ["小池 洋桜", "伊勢谷 夏海", "水野 章吾", "加藤 好洋", "宮崎 恵子", "直田 健太郎"], "cokana": ["コイケ ミオ", "イセヤ ナツミ", "ミズノ ショウゴ", "カトウ ヨシヒロ", "ミヤザキ ケイコ", "ナオダ ケンタロウ"], "chairs": ["福田 由里子（岐阜赤十字病院）"], "field": "その他", "cat1": "その他", "cat2": "その他", "no": 132, "pdf": "0132.pdf", "chkana": ["フクタ ユリコ"], "body": "【はじめに】当院臨床検査部では2015年度よりQuality Control(以下 QC)サークル活動を導入している。QCサークル活動とは業務やサービスなどの質の管理・改善を継続的に行う小グループでの活動である。今回は、業務上の課題として採血後の止血不良に着目した。採血後に患者による十分な圧迫止血が実施されないことで、止血テープから血液漏れが散見され、その都度止血テープの貼り直しや血液で汚れた腕や指、床や衣服の清掃等の対応が必要となり、業務負担の一因となっていた。そこで採血後の止血テープ貼り直し件数の減少を目的として取り組んだQCサークル活動について報告する。\n\n【活動目標】2025年6月の2週間で27件の止血テープの貼り直しを実施し、貼り直し対応にかかる時間は1件あたり約3分のため、対応に約 81 分の時間を要していた。活動目標は貼り直し件数を50%削減とした。\n\n【取り組み】止血テープの貼り直し件数が多いことに対し、特性要因図を用いて重要要因を解析した。その結果、止血材料不良や、止血に対して患者の認識が甘いことなどが挙げられた。止血材料の水分吸収量を検証し、現行品より吸収量の多い止血材料に変更した。また、止血に対しての認識向上のため採血室や待合に止血啓蒙ポスターを掲示した。\n\n【効果】本活動により、止血テープの貼り直し件数は 2週間で27件から4件と、約 85%減少し、目標であった 50%削減を達成できた。年間換算では約 27 時間の業務削減効果が見込まれた。また、止血材料の変更によりコスト低減に繋がる可能性が示唆された。\n\n【結語】今回の取り組みにより、止血テープの貼り直し件数の減少に一定の効果が認められた。今後も患者サービスおよび業務効率の向上を目指したい。連絡先 053-474-2222(代表)", "sid": "s60"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:30", "et": "11:39", "title": "臨床検査科職員における生成AIに関する意識調査と取り組み", "sub": "", "author": "中嶋 萌夏", "akana": "ナカシマ モエカ", "affil": "日本赤十字社愛知医療センター 名古屋第二病院", "pref": "愛知県", "co": ["野村 辰記", "坂本 悠斗", "上瀬 佳菜", "寺本 侑弘", "原 祐樹", "杉野 裕志"], "cokana": ["ノムラ タツキ", "サカモト ユウト", "ジョウセ カナ", "テラモト ユキヒロ", "ハラ ユウキ", "スギノ ヒロシ"], "chairs": ["河内 誠（安城更生病院）"], "field": "その他", "cat1": "その他", "cat2": "その他", "no": 133, "pdf": "0133.pdf", "chkana": ["カワチ マコト"], "body": "【背景】近年の生成AI技術の発展は、医療現場の業務効率化やDX推進に大きな可能性をもたらしている。臨床検査部門でも日常業務などへの活用が期待される。一方、生成AIに対する認知度や理解度、実際の活用状況には差があることが予想された。そこで、認知度や活用状況を明らかにするために当院の臨床検査科職員の生成 AIに対する意識調査を実施した。\n\n【方法】現状を定量的に把握するために生成AIに関するアンケート調査を実施した。主要な調査項目は、「入職からの年数」、「生成AIを知っているか」、「知っている生成AI」、「生成 AIをどの程度理解しているか」、「使用したことがあるか」、「使用頻度はどれぐらいか」、「使用頻度の高い生成AI」、「生成AIの使用用途」、「今後、業務などに活用したいか」の9項目である。\n\n【結果】61名中50名から回答を得た（回収率81.2%）。生成 AIについては全員が知っており、42名（84％）は使用経験があった。これら42名のうち5名は日常的に使用していた。使用頻度は「週2-3回以上」と回答した職員が13名（26％）と最も多く、次いで「週1回程度」と回答した職員が10名（20%）であった。週1回以上は使用している職員26名のうち17名は入職10年以上の職員であった。主に使用する生成AIはchatGPTが37名（74%）と最も多く、2番目にGeminiが14名（28%）であった。複数の生成AIを使用していることが多かった。使用用途は情報検索が最も多く、文章添削や文章作成での使用が2番目に多かった。業務への活用については47名（94％）が「積極的に活用したい」あるいは「機会があれば使いたい」と回答した。\n\n【結論】当院職員における生成AIに対する現状の認知度や活用状況を明らかにした。予想以上に生成AIが使用されており、業務における活用に対して前向きにとらえていることが分かった。すでに2026年度は年間を通じた生成AI勉強会を実施しており、勉強会実施前後での理解度の変化等についてもモニタリングしていく予定である。連絡先：052-832-1121(内線30818)", "sid": "s63"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:39", "et": "11:48", "title": "HBV・HCV報告支援システムの構築と業務効率化への取り組み", "sub": "", "author": "小林 彩夏", "akana": "コバヤシ アヤカ", "affil": "社会医療法人 宏潤会 大同病院", "pref": "愛知県", "co": ["久野 敬子", "廣田 優美", "堀江 史織"], "cokana": ["クノ ケイコ", "ヒロタ ユミ", "ホリエ シオリ"], "chairs": ["河内 誠（安城更生病院）"], "field": "その他", "cat1": "システム化", "cat2": "肝炎ウイルス", "no": 134, "pdf": "0134.pdf", "chkana": ["カワチ マコト"], "body": "【はじめに】肝炎ウイルスは、症状のないまま肝硬変や肝がんへ移行する場合もあり、HBV・HCV陽性患者への適切な受診推奨及び経過管理が重要である。当院では、HBs抗原または HCV抗体陽性患者に対し、検査技師が前歴確認、医師への連絡及び受診状況の追跡を行っている。年間では、HBs抗原陽性247件、HCV抗体陽性174件（2024年3月～2025年 2月）であった。一連の報告業務は、Excelを用いた陽性患者リストに手入力し管理していたため、業務負担の増大や確認漏れが課題であった。そこで今回、当院検査技師が独自に HBV・HCV報告支援システムを構築したので、その取り組みについて報告する。\n\n【方法】Microsoft Accessを用いて、報告支援システムを構築した。検査日と患者IDを入力することで、電子カルテ情報から結果、過去の陽性歴及び DNA定量検査値を自動抽出した。また、患者カルテより病名登録歴や治療薬使用歴、該当の記載を抽出し、前歴の有無や報告の要否を判定できる機能を実装した。さらに、確認者の入力欄及び受診推奨状況の管理機能を設けた。後追いについては、検査日以降の消化器内科受診または予約状況を抽出し精査の有無を確認できる仕組み、精査未確認患者リストを設けた。\n\n【結果】システム導入により、カルテ記載や過去検査値の確認作業が自動化され、陽性患者の抽出から報告までの業務が技師間で統一化された。また、後追い管理に必要な情報が一覧化され、確認漏れの防止が可能となった。\n\n【考察】HBs抗原及び HCV抗体陽性報告が統一化されたことで、従来の手作業による確認業務が大幅に削減され、業務効率の向上が得られた。また、カルテ記載の見落としが最小化され、ヒューマンエラー発生リスク低下も期待される。これにより、肝炎ウイルス陽性患者拾い上げ及び対応の検査技師主体での運用が容易となる可能性が示唆された。\n\n【結語】今回のシステム導入は、報告精度の向上及び検査技師間の業務統一化に寄与したと言える。この結果を受け、今後は他の感染症項目についてもシステム構築を目指していきたい。 連絡先：052-611-6261（内線：7214）", "sid": "s63"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:48", "et": "11:57", "title": "Excel VBAを活用したNST対象患者リスト作成業務の自動化とその効果", "sub": "", "author": "山﨑 大央", "akana": "ヤマザキ ヒロナカ", "affil": "静岡赤十字病院", "pref": "静岡県", "co": ["大畑 美幸", "田中 晴佳", "黒山 祥文"], "cokana": ["オオハタ ミユキ", "タナカ ハルカ", "クロヤマ ヨシフミ"], "chairs": ["河内 誠（安城更生病院）"], "field": "情報システム", "cat1": "システム化", "cat2": "栄養サポートチーム(NST)", "no": 135, "pdf": "0135.pdf", "chkana": ["カワチ マコト"], "body": "【はじめに】病院内における臨床検査技師の仕事は、検査にとどまらず、チーム医療（NST、ICT）やISO15189関連など多岐にわたる。これらの業務を効率化することは、ルーチン検査業務の質向上につながる。当院ではNSTの業務として毎週対象患者のリストアップを行っており、今回、ExcelVBAにより、リスト作成業務を自動化した。\n\n【対象と方法および仕様】毎週、NSTリストで抽出される患者データ2,000～3,000件を対象とした。VBAとはVisualBasic for Applicationsの略でExcelの他、Officeソフトに標準搭載されたプログラミング言語である。ExcelVBAにて必要な処理を記述することによって、業務の自動化が可能となる。従来は、検査システムによって抽出したデータから Conut Scoreを算出し、電子カルテから病棟患者一覧とNST介入中の患者を出力し、NST介入中患者を抽出およびマーキング、病棟を入力後、書式を整え印刷・病棟に配布していた。ExcelVBA により、これらの工程を自動化した。自動化前後で作業時間、正確性、再現性を比較した。\n\n【結果】NST患者リスト作成に要する時間は、自動化前は30分～60分以上を要していたが、自動化後は約5秒でリスト作成が完了し、印刷をする作業を含めても10分以内に全作業を終了させることが可能となった。正確性においては、従来は手入力による入力間違いや対象患者の見落としが発生していたが、自動化後はそれらがゼロとなった。また、従来見逃していた対象患者が検出されるケースも確認された。再現性についても、誰が操作しても同一のリストが作成され、業務の属人化防止につながった。さらに、空き時間の創出により、他業務への集中や教育・指導への時間確保が可能となった。\n\n【まとめ】ExcelVBA活用により、費用をかけずにNST業務の効率化と正確性および再現性の向上ができた。自動化による迅速性および正確性向上は、本来臨床検査技師が目指す使命である。検査業務以外の仕事においてこれらが達成できたことは、我々にとって大きな成果だと捉えている。今後も他業務への応用を図っていきたい。連絡先：054-254-4311(内線 2314）", "sid": "s63"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:10", "et": "11:19", "title": "動画QRコードを活用したアクションカードの導入", "sub": "―システム障害時における生理検査機能の維持を目指して―", "author": "岩井 由香利", "akana": "イワイ ユカリ", "affil": "藤田医科大学岡崎医療センター", "pref": "愛知県", "co": ["村田 有紀", "鈴木 優花", "荒川 彩未", "園田 明子", "西井 智香子", "北川 文彦"], "cokana": ["ムラタ ユキ", "スズキ ユウカ", "アラカワ アヤミ", "ソノダ アキコ", "ニシイ チカコ", "キタガワ フミヒコ"], "chairs": ["中河 竜也（富山県厚生農業協同組合連合会 高岡病院）"], "field": "管理運営", "cat1": "管理・教育", "cat2": "管理・運営", "no": 136, "pdf": "0136.pdf", "chkana": ["ナカガワ タツヤ"], "body": "【背景】当院は、2020年4月に開院した、三河地域の急性期医療を担う基幹病院である。災害発生時はもとより発生頻度の高いシステム障害時においても、検査機能を維持することは極めて重要である。しかし、システム障害時は通常の検査手順では対応が困難な場合があり、誰もが迷うことなく迅速・確実に対応できる体制の構築が急務であった。\n\n【目的】システム障害発生時に、生理検査室に所属する受付事務職員含む全ての要員が即座に対応可能となるよう、動画のQRコードを活用したアクションカードを新たに作成・導入した。その取組み内容と運用の実際について報告する。\n\n【取組み】システム障害時はオフラインとなり紙運用となるが、一部機器の手順は複雑で文章のみの操作マニュアルでは迅速な対応が困難と考えられた。そのため以下の手順でQRコード付きアクションカードを作成した。①煩雑な機器操作手順を動画で撮影。②院内システムの影響を受けない外部クラウドに動画を格納し、ダイレクトにリンクするQRコードを発行。③これらを組み込んだアクションカードをシステム障害時備品とまとめファイルケースに収納、所定位置に配置。④要員自身のスマートフォンで動画を確認し操作できる体制を整備。⑤障害時を想定した訓練を実施。⑥訓練後にアンケートを実施した。\n\n【結果】訓練後のアンケートでは、手順の煩雑な機器においては「動画があったので操作手順がわかりやすかった」という回答が得られ、文章のみでは把握し難い画面操作における動画のQRコードの有用性が高く評価された。\n\n【考察】QRコード付きアクションカードの導入は、システム障害時における生理検査機能の維持とレジリエンスを高める有効な手段となり得る。連絡先 0564-64-8182", "sid": "s22"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:19", "et": "11:28", "title": "上司と部下がよりよく協働するための視点", "sub": "～成人発達理論から考える臨床検査部門の関係性 ～", "author": "田中 浩一", "akana": "タナカ コウイチ", "affil": "JA愛知厚生連 豊田厚生病院", "pref": "愛知県", "co": ["木村 有里", "杉山 宗平", "宮地 文子"], "cokana": ["キムラ ユリ", "スギヤマ ソウヘイ", "ミヤチ フミコ"], "chairs": ["中河 竜也（富山県厚生農業協同組合連合会 高岡病院）"], "field": "管理運営", "cat1": "管理・教育", "cat2": "管理・運営", "no": 137, "pdf": "0137.pdf", "chkana": ["ナカガワ タツヤ"], "body": "【背景と目的】臨床検査部門では、上司と部下が協働しながら検査の質と安全を守っている。しかし、同じ目標を共有していても、意図のすれ違いから誤解や戸惑いが生じることがある。本発表は、『なぜ、部下とうまくいかないのか』の対人理解の知見を手がかりに、こうした“すれ違い”の背景にある心理的メカニズムを探り、成人発達理論（Kegan）を用いてその構造を再解釈することで、関係性向上につながる「気づき」を得ることを目的とした。\n\n【理論的背景と検討の枠組み】書籍の知見および成人発達理論を手がかりに、臨床検査技師の職場で起こり得る典型的なコミュニケーション場面（指導、評価、役割分担、トラブル対応など）を整理し、上司・部下の認知の違いに着目して考察を深めた。\n\n【新たに得られた視点】検討の結果、三つの“気づき”が得られた。第一に、同じ出来事でも意味づけが異なり、上司の「助言」が部下には「否定」と映るなど、双方の見えている世界が大きく異なる。第二に、期待は言語化しなければ伝わらず、上司は「自律性」を、部下は「明確な指示と安心感」を求める傾向がある。第三に、成人発達理論では、上司・部下の“ものの見方”が異なる発達段階にあると、同じ状況でも受け取り方が大きく変わる構造が示された。\n\n【考察と改善の方向性】これらは、関係性の問題が性格や能力でなく、“発達段階の違いによる認知のズレ”から生じることを示している。相互期待の言語化、心理的安全性を高めるフィードバック、発達段階に応じた指導、そしてメタ認知を育てる日常的な取り組みが有効と考えられた。\n\n【まとめ】成人発達理論による再解釈は、協働の質を見直す新たな視点を与えるものであり、“見えないズレ”に気づき互いの世界を理解し合うことが、より良い職場づくりに向けた重要な一歩となる可能性が示唆された。JA愛知厚生連豊田厚生 臨床検査室 0565-43-5000", "sid": "s22"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:28", "et": "11:37", "title": "若手の発想が検査室を支える", "sub": "人員不足を見据えた業務改善活動の試み", "author": "小荷田 麻妃", "akana": "コニタ アサヒ", "affil": "富山大学附属病院 検査・輸血細胞治療部", "pref": "富山県", "co": ["塩﨑 真弓", "横田 綾", "和田 暁法", "原田 健右", "森永 芳智", "佐藤 勉", "仁井見 英樹"], "cokana": ["シオザキ マユミ", "ヨコタ アヤ", "ワダ アキノリ", "ハラダ ケンウ", "モリナガ ヨシトモ", "サトウ ツトム", "ニイミ ヒデキ"], "chairs": ["中河 竜也（富山県厚生農業協同組合連合会 高岡病院）"], "field": "管理運営", "cat1": "管理・教育", "cat2": "管理・運営", "no": 138, "pdf": "0138.pdf", "chkana": ["ナカガワ タツヤ"], "body": "【はじめに】医療機関では人員不足が深刻化しており、限られた人員で業務を継続するためには、従来業務の見直しと改善が不可欠である。そのためには、業務改善を主体的に考え実行できる人材の育成が求められる。そこで当院では、若手スタッフ（35歳以下）を対象に、業務改善を検討するグループワークを実施した。今回、その実施手順、成果、および課題について報告する。\n\n【方法】各部門の若手スタッフから代表者を1名ずつ選出し、その中からリーダーを決定した。リーダーは業務改善の進め方を整理し、各部門の代表者に共有した。代表者は各部門でグループワークを実施した。課題は、「各部門で2～3名の休業者が生じた場合を想定し、35歳以下の要員で業務継続策を検討すること」と設定した。\n\n【結果】改善案の検討では、リーダーが若手スタッフに自由な発想を促したことで、多様な視点から提案が得られた。また、若手スタッフは検査件数、必要経費、業務の必要性を改めて見直し、それらを改善案の立案に活かすことができた。改善案は主任の意見を踏まえて整理され、最終的に業務の決定機関である運営会議で協議された結果、複数案が採択された。\n\n【考察】本取り組みにより、多数の業務改善案が創出され、その中から有効な案を選択・採用することができた。取り組みが有効に機能した主な要因は、あらかじめ業務改善の手順を体系的に整理し、明確化していた点にあると考えられる。これにより、マネジメント経験のないスタッフでもグループワークを円滑に遂行できた。また、「自由な発想」を重視したことや、若手スタッフが主体となったことは、柔軟で現場感覚を反映した提案につながった。一方で、言葉の定義や課題認識の違いから意見のすれ違いが生じる場面や、自身の意見が受け入れられない不安から発言を控える場面もみられた。これらの課題を次回のミーティングに活かし、より安心して意見を出せる環境づくりを進めたい。\n\n【結語】若手主体の取り組みは、業務改善の手順を明確化し、自由な発想を引き出すことで、改善案の創出と人材育成に有効であり、業務継続を支える可能性が示唆された。\n\n【連絡先：076-434-7741】", "sid": "s22"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:40", "et": "11:49", "title": "AIによる外来採血室混雑予測と業務最適化の取り組み", "sub": "", "author": "市岡 里奈", "akana": "イチオカ リナ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["石田 秀和", "中村 真大", "関根 綾子", "岡 有希", "大澤 徳子", "菊地 良介"], "cokana": ["イシダ ヒデカズ", "ナカムラ モトヒロ", "セキネ アヤコ", "オカ アキ", "オオザワ ノリコ", "キクチ リョウスケ"], "chairs": ["小川 哲（石川県立中央病院）"], "field": "管理運営", "cat1": "システム化", "cat2": "管理・運営", "no": 139, "pdf": "0139.pdf", "chkana": ["オガワ サトシ"], "body": "【目的】外来採血室は外来診療のワークフローにおける主要なボトルネックであり、午前を中心に発生する混雑と待ち時間の延長は、患者満足度の低下とスタッフ負担の増大を招く。当院は 1日約 1,300名の外来患者に対応しているが、従来の混雑対応は経験的判断に依存していた。本検討では、機械学習による混雑予測モデルを構築し、その予測情報に基づく採血業務の最適化を目的とした。\n\n【方法】機械学習ライブラリ（XGBoost）を用い、当院の採血ログデータ（2024年）から、日次採血患者数、時間帯別受付数、30分単位の待ち人数・待ち時間を予測する3種のモデルを構築した。説明変数には採血実績、カレンダー情報（曜日・祝日等）、気象データ（気象庁）、および30分前・60分前の受付数や移動平均などの時系列特徴量を用いた。性能は2025年1〜8月を遡及的検証、同年11月を前向き検証として、決定係数（R²）および平均平方二乗誤差（RMSE）で評価した。構築したモデルは、予測対象日や外来患者数の見込みを入力すると時間帯別の混雑状況を出力する対話型アプリケーションとして実装し、予測情報に基づく運用対応を試行した。\n\n【結果】前向き検証において時間帯別モデルは高い予測精度を示し、受付数 R²＝0.965（RMSE 4.2人）、待ち人数 R²＝0.990（RMSE 2.3人）、待ち時間 R²＝0.939（RMSE 2.6分）であった。日次採血患者数も R²＝0.768（RMSE 19.2人）と良好であった。この予測情報を運用へ適用し、予測待ち時間が30分を超える場合に臨時レーン（第10採血ブース）を稼働させた結果、金曜日の平均待ち時間を30分以内に維持できた。また水曜日では、臨時レーンの稼働に加え採血開始時刻を8時5分へ10分前倒しすることで、ピーク時間帯の処理能力の向上が認められた。これにより、事後対応に依存した従来の運用から、予測に基づき事前に人員・運用を調整する先回り型の対応へ転換できた。\n\n【考察】混雑予測に基づく先回りの運用対応により、経験に依存した採血業務をデータ駆動型の意思決定へ転換できたと考えられる。本手法は、待ち時間管理が課題となるCT/MRI検査や外来化学療法室など、リソース制約のある他部門への応用も期待される。連絡先：058-230-7259", "sid": "s25"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:49", "et": "11:58", "title": "有用なパニック値報告に向けての取り組み", "sub": "", "author": "加納 若奈", "akana": "カノウ ワカナ", "affil": "社会福祉法人 恩賜財団 済生会松阪市民病院", "pref": "三重県", "co": ["中島 佳那子", "田間 沙耶", "辻 佐江子", "西村 はるか", "宇城 研悟"], "cokana": ["ナカシマ カナコ", "タマ サヤ", "ツジ サエコ", "ニシムラ ハルカ", "ウシロ ケンゴ"], "chairs": ["小川 哲（石川県立中央病院）"], "field": "管理運営", "cat1": "その他", "cat2": "その他", "no": 140, "pdf": "0140.pdf", "chkana": ["オガワ サトシ"], "body": "【はじめに】パニック値は、「生命が危ぶまれるほど危険な状態にあることを示唆する異常値」であり、発覚後すみやかに医師へ直接報告するだけでなく、対応履歴などを明確にする必要があり、運用方法に関して各施設で様々な取り組みがなされている。当院では、検体検査の一部（血液・生化学・免疫検査）を隣接する松阪地区医師会臨床検査センターへ委託しており、パニック値報告についても一任していたが、臨床検査「パニック値」運用の提言書(2024年改訂版)をもとに、当院中央検査室によるカルテ記載を含むパニック値報告体制を構築し、2025年5月より運用を開始した。【目的】運用当初、医師への連絡方法やカルテ記載のマニュアルは作成したが、技師間で検体の状態や投薬状況、治療の影響など臨床経過に伴う結果値の変動に対する知識の差が大きく、不要な報告が散見された。今回、パニック値報告の除外する取り組みを行ったので報告する。\n\n【取り組み内容】患者の状態把握（心肺停止、透析、投薬状況など）、検体の状態（溶血、乳び、血小板凝集、フィブリン析出など）を把握した上で報告できるよう、当日のパニック値一覧を確認し、考慮すべきパニック値報告に対して報告者とディスカッションし、毎日終業時に行われている中央検査室全体のミーティングで情報共有を行った。\n\n【結果】2025年5月～2026年5月までの約１年間に確認されたパニック値は2081件であった。取り組み前である2025年 5月～2026年 2月ではパニック値 1561件に対し報告した件数は806件（51.6％）であったが、毎日情報共有を行う取り組みを行った後の2026年3月～5月ではパニック値520件に対し、報告した件数は226件（43.4％）となった。\n\n【考察】運用当初は報告項目の選別に技師間の差があったが、中央検査室全体や技師間での意見交換や情報共有を繰り返し行い、マニュアルを随時更新することで改善したと考える。今後の課題として、当院の設定パニック値が20項目と推奨されている項目より多いため、厳選していくべきだと考える。【結語】今後も業務改善を重ね、より意義のあるパニック値報告を行うために模索していきたい。連絡先：0598-23-1515", "sid": "s25"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:58", "et": "12:07", "title": "2型糖尿病患者における血清Galectin-3と腎機能低下との関連", "sub": "", "author": "神戸 歩", "akana": "カンベ アユム", "affil": "岐阜大学医学部附属病院 検査部", "pref": "岐阜県", "co": ["大橋 葉津希", "岡 有希", "立川 将也", "横堀 侑太", "牛丸 明香理", "吉沢 颯真", "菊地 良介"], "cokana": ["オオハシ ハヅキ", "オカ アキ", "タチカワ マサヤ", "ヨコボリ ユウタ", "ウシマル アカリ", "ヨシザワ ソウマ", "キクチ リョウスケ"], "chairs": ["小川 哲（石川県立中央病院）"], "field": "管理運営", "cat1": "基礎研究（検討）", "cat2": "その他の血清", "no": 141, "pdf": "0141.pdf", "chkana": ["オガワ サトシ"], "body": "【はじめに】糖尿病性腎症は末期腎不全の主要原因であり，腎線維化が病態進展に関与することが知られている．近年，Galectin-3（Gal-3）は腎線維化との関連が注目されているが，加齢に伴い上昇することも報告されている．本邦での2型糖尿病（T2DM）患者におけるGal-3濃度とeGFRをはじめとする患者特性との関連は十分に明らかではない．そこで本研究では，T2DM患者におけるGal-3濃度と各患者特性との関連を評価した．\n\n【対象と方法】本研究は，当院倫理委員会の承認を得て実施し，オプトアウトにより研究情報を公開した．対象は，T2DM患者80例とした．eGFR（mL/min/1.73m²）に基づきG1+G2群（≧60），G3a群（45–59），G3b+G4+G5群（＜45）の3群に分類した．Gal-3濃度は血清を用いてELISA法で測定した．Gal-3濃度と各患者特性との相関を検討し，eGFRに基づく3群間のGal-3濃度および各患者特性を比較した．また，年齢および尿酸（UA）を調整後，Gal-3濃度とeGFRとの関連を評価した．さらに，eGFR＜45を識別するGal-3濃度の診断能を検討した．統計解析にはSpearmanの順位相関係数，Mann–Whitney U検定，Kruskal-Wallis検定，重回帰分析およびROC解析を用い，P＜0.05を統計学的有意とした．\n\n【結果】Gal-3濃度は，年齢と弱い正の相関（r＝0.264, P＝0.018），eGFRと弱い負の相関（r＝-0.266, P＝0.017）を示した．群間比較では，Gal-3濃度に有意差を認め，eGFR低下に伴い高値を示した．さらに，年齢およびUAにも群間差を認めたが，Gal-3濃度は年齢およびUAを調整後もeGFRと有意に関連した（P＝0.008）．eGFR＜45を識別するGal-3濃度のAUCは0.772（95% CI：0.647–0.896, P＝0.008）であり，最適カットオフ値45.25 ng/mLにおける感度は88.9%，特異度は66.2%であった．\n\n【考察】本研究の結果，Gal-3濃度は加齢やUAの影響だけでは説明できない腎機能低下との関連が示唆された．Gal-3濃度は血清で測定可能であり，低侵襲な腎機能評価指標として活用できる可能性が示唆された．連絡先：058-230-6000 内線7251", "sid": "s25"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:10", "et": "10:19", "title": "臨地実習の主体性向上と目的意識の醸成に向けた取り組み", "sub": "第2報：教育効果の検証", "author": "仁科 正樹", "akana": "ニシナ マサキ", "affil": "独立行政法人 国立病院機構 三重中央医療センター", "pref": "三重県", "co": ["羽根 頼子"], "cokana": ["ハネ ヨリコ"], "chairs": ["大澤 徳子（岐阜大学医学部附属病院）"], "field": "教育", "cat1": "管理・教育", "cat2": "教育", "no": 142, "pdf": "0142.pdf", "chkana": ["オオザワ ノリコ"], "body": "【はじめに】臨地実習では、実習内容や評価基準の共有不足により、実習生は不安を抱え受動的な実習に陥りやすい。一方、指導者側も実習生の理解度や事前準備状況を十分に把握できないまま指導を行うことが多く、両者の認識には乖離が生じやすい。その結果、実習の目的意識が希薄となり主体的な行動を引き出すことが困難となる。本取り組みでは、第1報で構築した「学生が自ら計画・実施・評価し、次の課題へとつなげる段階的学習介入プログラム」を用い、実習生の主体性および目的意識に与える教育効果を検証した。\n\n【対象・介入内容】対象は、本取り組みに同意を得た臨地実習生5名とした。調査期間は2026年1月13日から3月18日までの45日間（休日を除く）とした。介入内容は、①心理的安全性教育、②毎日の目標設定、③臨床実習日誌の記載項目指定、④目標達成度と理解度の4段階評価、⑤個人面談・意識調査から構成し、得られたデータを記述的に分析した。\n\n【結果】当日の目標設定の実施率は73.3％～100％とばらつきがみられ、特に生理検査分野において実施率が低値であった。一方、臨床実習日誌の当日提出率は 100％であり、記載項目の明確化が学習内容の整理および作成効率の向上につながった。4段階自己評価では、生理検査において評価の収束がみられた一方、細菌検査では理解度の低い実習生が明確となり、個別指導の必要性が可視化された。全分野における自己評価の平均値は全員 3.8以上であったことから、学習到達度が一定水準に達していることが示された。\n\n【考察・結語】本介入により、毎日の目標設定と振り返りを通して、実習生が疑問点を自発的に言語化し行動に移す変化が示唆された。また、自己評価の可視化により理解度差が明確となり、指導者による支援の焦点化が可能となった。以上より本取り組みは臨地実習における主体性および目的意識の醸成に有効な教育方略となり得る。連絡先：059-259-1211", "sid": "s16"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:19", "et": "10:28", "title": "臨地実習における二層サイクル教育モデルの構築", "sub": "―PDCAとOODAの統合による学習効果の向上―", "author": "仁科 正樹", "akana": "ニシナ マサキ", "affil": "独立行政法人 国立病院機構 三重中央医療センター", "pref": "三重県", "co": ["羽根 頼子"], "cokana": ["ハネ ヨリコ"], "chairs": ["大澤 徳子（岐阜大学医学部附属病院）"], "field": "教育", "cat1": "管理・教育", "cat2": "教育", "no": 143, "pdf": "0143.pdf", "chkana": ["オオザワ ノリコ"], "body": "【背景】臨地実習は、学生が臨床検査技師としてのプロフェッショナルアイデンティティを確立する重要な期間である。しかし、現場では教科書的知識と実務の乖離、指導内容のばらつき、さらには学生の失敗への恐怖心が教育上の課題となっている。また、限られた期間での評価やレポート作成の効率化も求められている。\n\n【目的】臨地実習において、教育の質を担保する「PDCAサイクル」（以下 PDCA）と、学生が現場で即応力を養う「OODAループ」（以下 OODA）を二層構造で組み合わせた教育モデルを構築し、その有効性を検討した。\n\n【方法】臨地実習において、指導者と学生の役割を明確に分担した。指導者はPDCAを担い、実習ガイドラインに基づく実習計画（Plan）、計画に沿った指導（Do）、評価データの分析（Check）、および指導内容改善（Act）を行うことで環境の標準化を図った。一方、学生はOODAを基盤とし、実習開始前に目標を設定した。実習中は、生じた疑問、重要事項を観察・整理し、目標に対する達成度と理解度を自己評価した。これらを記録し実習レポートに反映させることで、レポート作成の効率化を図った。\n\n【結果】目標設定と自己評価の導入により、学生の学習課題が可視化され、主体性が向上した。指導方針の統一は学生の心理的負担が軽減し、OODAに基づく記録により、レポートの論理構成および記述の質が向上した。また、当日の振り返りをレポート作成に活用できたため、作成時間は大幅に短縮された。\n\n【考察】本モデルは、指導者がPDCAによって「安心して学べる環境」を担保することで、学生が OODA に基づく「主体的な判断」に集中できる環境に意義がある。さらに、目標設定と自己評価は、学生自身に PDCA の要素（Plan/Check）を回させる効果があり、OODAの実践を促進させるトリガーとして機能したと考えられた。\n\n【結語】指導者がPDCAで教育環境を整備し、学生がOODAと自己評価を通じて現場課題に主体的に取り組む二層サイクル教育モデルは、効率性と効果的な臨地実習手法として有用である。今後もこのモデルを通じ、高い判断力を備えた臨床検査技師の育成を目指す。 連絡先： 059-259-1211", "sid": "s16"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:28", "et": "10:37", "title": "テキストマイニングを用いた臨床検査技師養成における臨地実習前論述式試験の分析", "sub": "標準12誘導心電図および肺機能検査（スパイロメトリー）の指導重点項目の抽出", "author": "山田 愛佳", "akana": "ヤマダ アイカ", "affil": "金沢大学附属病院", "pref": "石川県", "co": ["油野 岳夫", "中田 晶子", "寺上 貴子", "中出 祐介"], "cokana": ["ユノ タケオ", "ナカタ マサコ", "テラカミ タカコ", "ナカデ ユウスケ"], "chairs": ["大澤 徳子（岐阜大学医学部附属病院）"], "field": "教育", "cat1": "管理・教育", "cat2": "教育", "no": 144, "pdf": "0144.pdf", "chkana": ["オオザワ ノリコ"], "body": "【背景】臨地実習ガイドライン2021（2023年改訂第2版）では、臨床検査技師養成における教育内容の高度化・標準化が求められている。一方、臨床現場では指導者の主観的評価で基準が曖昧かつ指導者の教育負担増大が課題であった。テキストマイニングは記述試験の解答から頻出語や共起ネットワークを分析する手法であり、指導重点項目を特定しこれらを解決する方法になりうる。\n\n【目的】標準12誘導心電図検査（以下、心電図）および肺機能検査（スパイロメトリー）に関する実習前論述式試験をテキストマイニング解析し、指導重点項目を特定する。\n\n【方法】2025年度に金沢大学附属病院で生理学的検査の臨地実習開始前の4年生38名を対象とした。臨地実習ガイドライン2021（第2版）の評価基準書（生理学的検査）の行動目標に基づき、Googleフォームを用いて論述式試験を実施した。回答を KH Coderでテキストマイニング解析し、頻出語分析やサブグラフ分析を用いた共起ネットワークを作成した。同一学生の回答中に複数回出現した抽出語も、重複とせず抽出した。\n\n【結果】心電図の目的に関する設問の頻出語分析では、「心臓」の出現は 38 件中 40 回（105％）、「検査」は 31 回（82％）、「異常」は17回（45％）、「動き」は16回（42％）であった。一方、「不整脈」は5回（13％）、「電気」の出現は2回（5.3％）であった。スパイロメトリーの呼吸指示に関する設問の共起ネットワークは、肺活量と努力性肺活量を区別するグループを確認出来なかった。\n\n【考察】心電図検査の本質は心臓の電気的活動を捉えることであるが、それを示す「電気」の出現率が低い一方で、心臓超音波検査の特徴である「動き」が頻出する傾向がみられた。スパイロメトリーにおいても検査種の特異性に関する理解不足が視覚的に示された。この結果から、各検査における本質的な目的を学生は混同していたことが推察された。そのため、この点に関し重点的に指導すべき項目であると考えられた。\n\n【結論】テキストマイニングによる分析は、実習前の習熟度を定量的に可視化し、客観的な指導重点項目の抽出に有用であった。連絡先：076-265-2000(内線 7183)", "sid": "s16"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:40", "et": "10:49", "title": "「最強チームをつくる」-検査室における弱さの開示と心理的安全性の醸成-", "sub": "", "author": "天野 雄介", "akana": "アマノ ユウスケ", "affil": "独立行政法人地域医療機能推進機構 中京病院", "pref": "愛知県", "co": ["市川 潤", "河内 誠", "濱田 智博", "佐藤 由佳", "野口 和希子", "鈴木 更織", "林 健太"], "cokana": ["イチカワ ジュン", "カワチ マコト", "ハマダ トモヒロ", "サトウ ユカ", "ノグチ ワキコ", "スズキ サオリ", "ハヤシ ケンタ"], "chairs": ["中出 祐介（金沢大学附属病院）"], "field": "教育", "cat1": "管理・教育", "cat2": "教育", "no": 145, "pdf": "0145.pdf", "chkana": ["ナカデ ユウスケ"], "body": "【はじめに】私たち臨床検査技師の業務は、検査値の誤りや検体の取り違いが患者の生命に直結するため、日常的に「完璧でなければならない」という強い行動規範が求められる。それゆえ現場では「弱さを見せる」ことに強い抵抗感が生じやすい。しかし、ダニエル・コイル著『最強チームをつくる方法』では、「弱さの開示」こそがチームの相互信頼と協力関係を築く起点であり、重大なエラーを防ぐためには、弱さを開示できる関係性と心理的安全性が必要不可欠であるとしている。本発表では、同書に示された「弱さの開示」を業務に照らし合わせ、自施設において試行した実践的アプローチとその成果について報告する。\n\n【方法】検査室におけるチーム形成の核心を「弱さの開示」と「心理的安全性」に定め、これらを高めるための実践的アプローチを行った。具体的には、まずリーダーである私自身が、日常業務や申し送りの際、自らの不安、判断の迷い、課題などを積極的に言語化・開示する「先行的な開示」を実践した。これによりメンバー間の対話を促す契機を創出し、安心して相談・発言ができる環境の醸成を図った。さらに日常業務のなかに「相互支援（フォローアップ）」や「定期的な振り返り（リフレクション）」を組み込み、スタッフの意識や行動の変化を観察・記録した。加えて検査室スタッフ8名に対し、アンケート調査を実施した。\n\n【結果】リーダーが弱さを開示することで、発言や相談への心理的ハードルが下がり、小さな不安や疑問も早期に共有できるようになるなど、コミュニケーションの活性化が見られた。またアンケート調査では、積極的な提案や後輩への関わり方の変化など、意識面・行動面の双方に前向きな影響があることが示された。\n\n【まとめ】検査室における「最強チームをつくるための視点」として以下の3点を提示する。1. 弱さの開示はチームの協力シグナルである。2. リーダーの先行的開示が「心理的安全性」の糸口となる。3. 相互支援と振り返りの仕組み化が医療安全を強固にする。検査室における「弱さのマネジメント」は、組織の心理的安全性を高め、相互支援を促進する有用なアプローチであると考えられた。連絡先：JCHO中京病院 検査部 052-691-7151", "sid": "s20"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:49", "et": "10:58", "title": "生化学・免疫血清検査臨地実習カリキュラム改訂後の運用と学生評価", "sub": "", "author": "井上 結以", "akana": "イノウエ ユイ", "affil": "藤田医科大学病院", "pref": "愛知県", "co": ["齊藤 翠", "岡庭 玲奈", "市川 勇斗", "星 雅人"], "cokana": ["サイトウ ミドリ", "オカニワ レナ", "イチカワ ハヤト", "ホシ マサト"], "chairs": ["中出 祐介（金沢大学附属病院）"], "field": "教育", "cat1": "管理・教育", "cat2": "教育", "no": 146, "pdf": "0146.pdf", "chkana": ["ナカデ ユウスケ"], "body": "【背景・目的】2021年の臨地実習ガイドライン改定に伴い、当院では 2023 年度より検体検査室の実習期間を短縮するカリキュラムの変更を行った。実習期間の短縮は学生の学習機会減少が懸念される一方、実習受け入れ側にとっても、限られた時間内で的確に指導しなければならないという負担が生じた。本研究は、学生アンケートの経年的な解析を通じて、持続可能で効率的な実習カリキュラムの構築と継続的な改善への足がかりとすることを目的とした。\n\n【実習の内容と対象・方法】 化学免疫検査室臨地実習では、精度管理、メンテナンス作業、血液ガス分析検査、採血室業務を中心に実施した。指導の効率化と通常業務への影響を最小限に抑える目的から、実際の作業風景や操作手順を撮影した動画を作成し、実習前の予備知識習得に活用した。その他に症例検討や検査データの解析、血糖測定なども実習に取り入れた。2023年度～2025年度の臨地実習生 合計321名を対象とし、実習最終日にアンケート調査を行った。そのアンケート調査をもとに、理解度や期間の適切性を経年的に比較するとともに、自由記述については内容を分析し課題や教育効果を抽出した。\n\n【結果】 実習期間が適切と回答した割合について、2023年度は67.3%にとどまったが、2024年度88.0%、2025年度83.5%へと向上した。実習内容の理解度はいずれの年度も90%以上と高い評価を得た。自由記述の内容分析では、2023年度にみられた「実務体験や解説の不足」という指摘に対し改善を行った結果、実務体験に関連する好意的な記述は2023年度の11.4%から2025年度には21.1%へと増加した。さらに、パニック値や溶血など業務に関連する記述を行った学生の割合も、2023年度、2024年度は約8%であったが、2025年度には15.0%へと増加した。一方で、学生の待機時間や動線、実習環境に関する新たな課題も抽出された。\n\n【考察・まとめ】 アンケートの結果より、短縮された期間内でも見学中心から実務体験を重視した参加型実習へ移行でき、教育効果が向上したことが示された。特に症例検討や実務体験の充実が臨床検査業務への理解向上に寄与した。今後は、今回明らかとなった新たな課題に対し、さらなる改善を図りたい。 連絡先：0562-93-2305", "sid": "s20"}, {"kind": "一般演題", "day": 1, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:58", "et": "11:07", "title": "臨地実習における産婦人科超音波検査講義の効果", "sub": "", "author": "小竹 沙夏", "akana": "オダケ サナ", "affil": "藤田医科大学病院", "pref": "愛知県", "co": ["伊藤 さつき", "古川 博", "水谷 優里", "杉山 博子", "朝田 和佳奈", "榊原 依里子", "星 雅人"], "cokana": ["イトウ サツキ", "フルカワ ヒロシ", "ミズタニ ユリ", "スギヤマ ヒロコ", "アサダ ワカナ", "サカキバラ エリコ", "ホシ マサト"], "chairs": ["中出 祐介（金沢大学附属病院）"], "field": "教育", "cat1": "管理・教育", "cat2": "教育", "no": 147, "pdf": "0147.pdf", "chkana": ["ナカデ ユウスケ"], "body": "【背景】当院の臨地実習教育プログラムにおいて、超音波検査は3領域（消化器、循環器、体表臓器）に限定しており、産婦人科領域については人員的都合により導入できていなかった。2025年度の人員拡大により産婦人科領域の教育も可能となったため、産婦人科領域も参画することになった。\n\n【目的】初年度の取り組みとして産婦人科領域の講義による学生指導を開始した。事前準備した教育プログラムと臨地実習生のニーズ確認を調査することを目的とした。\n\n【対象及び方法】2025年度に当院で臨地実習を行う医療科学部医療検査学科臨床検査プログラム3年生136人を対象に、アンケートは匿名かつ任意であること、実習成績には一切関与しないことを十分説明したのちにアンケート配布し、回答の得られた124名を対象とした。\n\n【結果】臨床検査技師でも産婦人科領域の超音波をすることがあると知っていたと答えたのは全体の47.6%で、半数以上が知らないことが分かった。また、来年度の臨地実習でも産婦人科領域に関する講義をするべきだと答えたのは全体の76.6%、強くするべきだとは思わないが講義で得られるものがあると思うと答えたのは23.4%で、不要に感じた臨地実習生はいなかった。さらに大学の授業でも産婦人科領域について勉強したほうがいいと答えたのは、そう思う・少しそう思うを合わせて95.2%で、大多数が産婦人科領域について知りたいという意欲を感じられる結果となった。\n\n【考察】大学のカリキュラムで産婦人科領域を学ぶ機会は極めて少ないため、学びの機会を得ることができてよかったと前向きな評価もある一方で、就職後に関わる機会の極めて少ない領域であり、検査を見学できないなら強く必要としないという意見もあった。他の3領域では検査見学を行なっているが、産婦人科領域は過去に患者が検査見学に難色を示した経緯があるため、今年度の検査見学は見送った。今後見学を取り入れるかについては関連職種と十分な協議を行った上で方針決定する必要がある。\n\n【連絡先】藤田医科大学病院臨床検査部生殖医療検査室0562-93-2111（代表）", "sid": "s20"}, {"kind": "一般演題", "day": 1, "ven": 2, "hall": "第２会場", "room": "第５会議室（２F）", "st": "09:00", "et": "09:09", "title": "Klebsiella pneumoniae臨床分離株の耐性化に関する研究", "sub": "", "author": "鈴木 万莉菜", "akana": "スズキ マリナ", "affil": "岐阜医療科学大学", "pref": null, "co": ["渡邊 日那", "加藤 璃々", "中嶋 小町", "野林 明日花", "杉村 柚", "齋木 萌衣", "中山 章文"], "cokana": ["ワタナベ ハルナ", "カトウ リリ", "ナカジマ コマチ", "ノバヤシ アスカ", "スギムラ ユズ", "サイキ メイ", "ナカヤマ アキフミ"], "chairs": ["森本 剛史（社会医療法人 蘇西厚生会 松波総合病院）"], "field": "学会", "cat1": "基礎研究（検討）", "cat2": "一般細菌", "no": 148, "pdf": "0148.pdf", "chkana": ["モリモト ツヨシ"], "body": "【はじめに】近年、腸内細菌目細菌の抗菌薬に対する耐性化が問題となっている。中でもカルバペネム系抗菌薬に耐性を示す Klebsiella pneumoniaeによる感染症において、薬剤感受性試験では「感性」の結果であるが、抗菌薬投与によっても除菌されず継続的に K. pneumoniae が検出されるケースが見られる。このことから、K. pneumoniaeに関するカルバペネム系抗菌薬に耐性化についての検討が求められている。\n\n【目的】本研究では、K. pneumoniaeのカルバペネム系抗菌薬に対する耐性化に関する特徴を調べるため、臨床分離株を用いた耐性化実験を実施した。\n\n【方法】薬剤感受性試験においてメロペネムに感性を示したK. pneumoniaeの8株について、8.0 mg/Lから0.03 mg/Lまでのメロペネムを含むミュラーヒントンブロスで、35±2 ℃で16から20時間培養後にMIC（最小発育阻止濃度）を判定し、Sub MIC濃度のブロスに発育した菌液を用いた継代培養を10日間実施した。\n\n【結果】耐性化実験を実施した8株のうち7株は、10日後のMICが1.0 mg/L以下であったが、1株に明らかな耐性化が認められ8.0 mg/LのMICを示した。\n\n【考察】耐性化を示した1株は、メロペネム投与後も除菌されず、継続してK. pneumoniaeが検出された症例由来株であった。以上より、微生物検査で感性と判定された菌株の中にも、生体内でメロペネム曝露により耐性化する集団が存在する可能性が示唆された。今後は対象株数を増やし、耐性化機序を含めて詳細に検討する予定である。連絡先：岐阜医療科学大学（0575-22-9401 内：521）中山章文 anakayama@u-gifu-ms.ac.jp", "sid": "s7"}, {"kind": "一般演題", "day": 1, "ven": 2, "hall": "第２会場", "room": "第５会議室（２F）", "st": "09:09", "et": "09:18", "title": "Reverse-CPCとロールプレイを取り入れた輸血当直卒後教育の試み", "sub": "", "author": "渡邊 日那", "akana": "ワタナベ ハルナ", "affil": "岐阜医療科学大学 保健科学部 臨床検査学科", "pref": null, "co": ["中嶋 小町", "鈴木 万莉菜", "加藤 璃々", "三宅 萌生", "中田 楓來", "早川 ゆうか", "中川 泰久"], "cokana": ["ナカジマ コマチ", "スズキ マリナ", "カトウ リリ", "ミヤケ メイ", "ナカダ カエラ", "ハヤカワ ユウカ", "ナカガワ ヤスヒサ"], "chairs": ["森本 剛史（社会医療法人 蘇西厚生会 松波総合病院）"], "field": "学会", "cat1": "その他", "cat2": "輸血", "no": 149, "pdf": "0149.pdf", "chkana": ["モリモト ツヨシ"], "body": "【背景】臨地実習巡回において，近年の新人は従来と比較し当直教育期間が延長していることが課題に挙げられた．特に ABO式血液型検査で異常反応を認めた際は，追加検査選択や結果解釈，医師報告などに苦慮する場面が多く，実践的な卒後教育の必要性が高まっている．\n\n【目的】輸血検査難解症例では，結果解釈や製剤選択において輸血サポーター，医師，血液センターとの連携が重要となる．大学の責務として卒後教育にて臨地実習等の関係ある施設への教育還元を行うため「当直時遭遇の ABO式血液型検査異常反応と対処方法」について研修を実施した．\n\n【方法】対象は本学および他学卒業者とした．4ブースに分かれ，ABO式血液型検査試験管法で異常反応を認めた場面，研修者はカルテ請求，輸血サポーター技師へ電話，担当医および日赤血液センターへの報告を，本学教員・学生とのロールプレイ形式で実施した．カルテ情報，血液・生化学・画像所見からReverse-CPCを行い，異常結果解釈のツールとした．症例は①マイコプラズマ肺炎→加温操作，②免疫不全→ウラ検査血漿量追加，③ABO不適合妊娠→直接抗グロブリン試験，④多発性骨髄腫→生理食塩液置換法とし，追加検査，製剤選択，医師報告まで行った．\n\n【結果】研修前アンケートでは，異常反応時の追加検査選択や医師・血液センター対応に不安を抱える参加者が多かった．研修後は，「異常反応時の考え方」「追加検査選択理由」「カルテ情報活用」について全員が理解できたと回答し，高い満足度を認めた．自由記載では，「疾患背景から異常反応を考察できた」「実践的で理解しやすかった」「医師報告の流れを体験できた」などの意見が得られた．\n\n【考察】本研修は検査手技のみならず，情報収集，追加検査，医師報告，血液センター対応まで含めた輸血当直業務を疑似体験でき，高い教育効果を認めた．また，Reverse-CPCとロールプレイ形式により，実践的思考力およびコミュニケーション能力向上にも寄与したと考えられた．大学が有する教育資源を活用した卒後教育支援として有用であり，継続的発展が必要と考えられた．岐阜医療科学大学 臨床検査学科 中川 泰久(E-mail: ynakagawa@u-gifu-ms.ac.jp TeL:0575-22-9401)", "sid": "s7"}, {"kind": "一般演題", "day": 1, "ven": 2, "hall": "第２会場", "room": "第５会議室（２F）", "st": "09:18", "et": "09:27", "title": "教育用模擬検体作製におけるIgG型不規則抗体の希釈溶媒に関する検討", "sub": "", "author": "市川 颯菜", "akana": "イチカワ ソナ", "affil": "岐阜医療科学大学 保健科学部 臨床検査学科", "pref": null, "co": ["河本 里奈", "中嶋 小町", "渡邊 日那", "下岡 宥斗", "中川 泰久"], "cokana": ["カワモト リナ", "ナカジマ コマチ", "ワタナベ ハルナ", "シモオカ ユウト", "ナカガワ ヤスヒサ"], "chairs": ["森本 剛史（社会医療法人 蘇西厚生会 松波総合病院）"], "field": "学会", "cat1": "基礎研究（検討）", "cat2": "輸血", "no": 150, "pdf": "0150.pdf", "chkana": ["モリモト ツヨシ"], "body": "【背景】模擬検体時，不規則抗体保有検体を生理食塩水で血漿希釈作製していたが，目的の凝集力価が得られない場合があり本検討の契機となった．そこで希釈溶媒の違いによる抗体反応性への影響を検討する必要があると考えた．\n\n【目的】各種溶媒で IgG 型不規則抗体保有血漿を希釈し，目的とする凝集力価が得られるよう，希釈溶媒液との相互性および蛋白成分の影響について検討した．\n\n【方法】E（Ee）または Jra抗原保有 O型赤血球 3種類を等量混和し，5％血球浮遊液を作製した．抗Eまたは抗Jra保有血漿を，生理食塩水（抗E-生，抗Jra-生），イムノザール（抗E-イ，抗Jra-イ），AB型新鮮凍結血漿製剤（抗E-血漿，抗 Jra-血漿）で等倍量希釈（2～4096倍）した．検査はPEG-IAT試験管法を用い，37℃15分加温後，抗ヒトIgG抗体（多特異性）により判定した．洗浄液は生理食塩水希釈系では生理食塩水，イムノザールおよび血漿希釈系ではイムノザールを使用した．各検討は3回実施した．また蛋白濃度の影響を検討するため，生理食塩水およびイムノザールに5％ウシアルブミンを添加し，同様に検討した．\n\n【結果】各溶媒での抗体価は，抗E-生128倍，抗E-イ256倍，抗 E-血漿 512倍であった．また抗 Jra-生 2048倍，抗Jra-イ 256倍，抗 Jra-血漿 1024倍となり，各希釈液で抗体価に差異を認めた．一方，ウシアルブミン添加系では，抗E-生256倍，抗E-イ512倍，抗Jra-生1024倍，抗Jra-イ2048倍となり，凝集終点延長を認めた．\n\n【考察】IgG抗体の凝集反応は，抗体量のみならず希釈液中の蛋白成分や反応増強効果の影響を受けると考えられた．AB型血漿およびアルブミン添加系で凝集終点延長を認めたことから，血漿蛋白が赤血球間距離やIgG感作効率に影響し，反応を増強した可能性が示唆された．一方，イムノザールは低イオン環境による感作促進作用を示すものの蛋白成分を含まないため，凝集終点延長への寄与は限定的と考えられた．以上より，教育用模擬検体作製においてイムノザールは目的とする抗体価を調整しやすく，再現性の高い希釈溶媒として有用である可能性が示唆された．岐阜医療科学大学 臨床検査学科 中川 泰久(E-mail: ynakagawa@u-gifu-ms.ac.jp TeL:0575-22-9401)", "sid": "s7"}, {"kind": "一般演題", "day": 1, "ven": 2, "hall": "第２会場", "room": "第５会議室（２F）", "st": "09:30", "et": "09:39", "title": "ダールのカルシウム染色液の染色性能の基礎的検討", "sub": "～ in vitroにおけるpHおよびカルシウム濃度依存性の検討 ～", "author": "林 英世", "akana": "ハヤシ ヒデトシ", "affil": "鈴鹿医療科学大学", "pref": null, "co": ["坂本 匡羽", "堀口 雄翔", "井上 駆", "小林 信博", "蜂須賀 大輔"], "cokana": ["サカモト キョウ", "ホリグチ ユウト", "イノウエ カケル", "コバヤシ ノブヒロ", "ハチスカ ダイスケ"], "chairs": ["乙訓 貴之（岐阜医療科学大学）"], "field": "学会", "cat1": "基礎研究（検討）", "cat2": "その他", "no": 151, "pdf": "0151.pdf", "chkana": ["オトクニ タカユキ"], "body": "【目的】カルシウム染色法の1つであるダールのカルシウム染色は関節液におけるハイドロキシアパタイト沈着症の診断や骨芽細胞の石灰化の可視化などに使用されている。本染色はカルシウムとのキレート結合により染色性を示し、特異性の高い染色法である。本検討では染色標本の解釈を補完するため、ダールのカルシウム染色をin vitro内でpHおよびカルシウム濃度の依存性を検証し染色性能を明らかにしたので報告する。\n\n【方法】①ダールのカルシウム染色至適pH決定：アリザリン赤S試薬をpH6.0、6.2、6.4、6.6、6.8に調整し、1.0×10-2M塩化カルシウム溶液と混和した。混合液にゼフィラミン溶液、1,2ジクロロエタン、飽和塩化カリウムを順次加え、アリザリン赤S-カルシウム錯体（以下:ARS-Ca錯体）を抽出し吸光度計にて分析した。②カルシウム検出限界能：予備実験により決定した至適 pH条件下で、カルシウム濃度を1.0×10-1M、1.0×10-2M、1.0×10-3M、1.0×10-4M、1.0×10-5M、1.0×10-6Mに変動させ、ARS-Ca錯体を抽出し同様に測定した。\n\n【結果】ダールのカルシウム染色至適 pHおよびカルシウム検出限界能の検討では再現性の評価のため、同様の実験を別日に計6回実施した。①至適pHの結果はpH6.0(0.944)、pH6.2(1.118)、pH6.4(1.234)、pH6.6(1.170)、pH6.8(1.048)であった。②カルシウム検出限界能では1.0×10-1M(1.046)、1.0×10-2M(1.038)、1.0×10-3M(1.018)、1.0×10-4M(0.921)、1.0×10-5M(0.908)、1.0×10-6M(0.867)となった。\n\n【考察】本検討によりダールのカルシウム染色は至適pH6.4の時に最もARS-Ca錯体が生成され、pH6.4から離れるにつれて錯体生成能は低下するため染色性も同様に低下すると考えられた。またカルシウム検出限界能では、1.0×10-3M と 1.0×10-4M の間に顕著な吸光度差を認めた。ダールのカルシウム染色は1.0×10-3M以上のカルシウムが存在しない場合では、偽陰性になる可能性が考えられた。\n\n【結語】本検討にてダールのカルシウム染色の性能を明らかにした。今後は関節液検体や病理標本に応用し、AI技術を用いた定量評価について検討する予定である。連絡先：059-383-9208", "sid": "s9"}, {"kind": "一般演題", "day": 1, "ven": 2, "hall": "第２会場", "room": "第５会議室（２F）", "st": "09
