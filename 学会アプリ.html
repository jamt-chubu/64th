<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3057">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中部圏支部医学検査学会">
<link rel="apple-touch-icon" href="icon-192.png">
<title>令和8年度日臨技中部圏支部医学検査学会（第64回）</title>
<style>
:root{
  --navy:#0f3057; --navy2:#1b4e7e; --bg:#f4f6fa; --card:#fff; --ink:#1e293b; --mut:#64748b;
  /* プログラム集 中表紙のセクション色 */
  --c-keynote:#F43445; --c-symp:#00B971; --c-ws:#01418D; --c-dept:#602677;
  --c-plan:#00C2DE; --c-lunch:#F9D716; --c-general:#FE8901; --c-cer:#475569; --c-social:#EC4899;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:74px}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#2a6f97 100%);color:#fff;padding:13px 14px 11px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(15,48,87,.35)}
header h1{font-size:13.5px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
header .sub{font-size:11px;opacity:.85;margin-top:2px}
.daytabs{display:flex;gap:8px;margin-top:10px}
.daytab{flex:1;border:none;border-radius:20px;padding:7px 0;font-size:13px;font-weight:700;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
.daytab.on{background:#fff;color:var(--navy)}
.infobar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.infobar::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;background:#e2e8f0;color:#334155;border-radius:16px;padding:8px 12px;white-space:nowrap;cursor:pointer;border:none;min-height:34px}
.chip.hasdoc{background:#dbeafe;color:#1e40af;font-weight:600}
/* 高さは画面サイズに応じてJSで再計算（「今の状況」欄の有無で変わるため） */
.tl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;height:calc(100dvh - 258px);min-height:260px;background:var(--card);margin:0 8px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
@supports not (height:100dvh){.tl-wrap{height:calc(100vh - 258px)}}
.tl{display:grid;grid-template-columns:44px repeat(6,120px);min-width:764px;position:relative}
.venhead{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:6px 2px;border-left:1px solid rgba(255,255,255,.15)}
.venhead.clickable{cursor:pointer;background:linear-gradient(180deg,#17568b,#0f3057)}
.venhead.clickable:active{background:#2a6f97}
.hlink{color:#bfe3ff;text-decoration:underline;text-underline-offset:2px}
.scopenote{font-size:11px;color:var(--mut);margin:2px 14px 0}
.actbtn.access{background:#ecfdf5;color:#065f46}
.venhead small{display:block;font-weight:400;font-size:9px;opacity:.8}
.corner{position:sticky;top:0;left:0;z-index:40;background:var(--navy)}
.timecol{position:sticky;left:0;z-index:20;background:#f8fafc;border-right:1px solid #e2e8f0}
.hmark{position:absolute;left:0;width:100%;font-size:9px;color:var(--mut);text-align:right;padding-right:4px;transform:translateY(-4px)}
.vencol{position:relative;border-left:1px solid #eef2f7;background:repeating-linear-gradient(to bottom,transparent 0,transparent 74px,#f1f5f9 74px,#f1f5f9 75px)}
.sess{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 4px;font-size:10px;line-height:1.22;overflow:hidden;color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sess .t{font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sess .tm{font-size:9px;opacity:.9}
.sess .sb{font-size:9px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess.tiny{padding:2px 4px;font-size:9.5px;display:flex;align-items:center}
.sess.tiny .t{-webkit-line-clamp:2}
.venbar{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.venbar::-webkit-scrollbar{display:none}
.nowbar{background:#fff;margin:8px 8px 6px;border-radius:12px;padding:8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nowlab{font-size:11px;font-weight:700;color:var(--mut);margin:2px 0 4px}
.nowitem{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:5px 2px;cursor:pointer;text-align:left;border-bottom:1px solid #f1f5f9}
.nowitem:last-child{border-bottom:none}
.nowdot{flex:none;width:8px;height:8px;border-radius:50%}
.nowtx{flex:1;min-width:0;font-size:12.5px;line-height:1.35;color:var(--ink)}
.nowtx small{display:block;font-size:10.5px;color:var(--mut);font-weight:400}
.aitem{background:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ahead{display:flex;align-items:baseline;gap:8px}
.ahead b{font-size:14px}
.ahead small{font-size:10.5px;color:var(--mut)}
.aaff{font-size:11px;color:var(--mut);margin:2px 0 5px}
.aent{display:block;width:100%;text-align:left;background:#f8fafc;border:none;border-radius:8px;padding:6px 8px;margin-top:4px;font-size:11.5px;color:var(--ink);cursor:pointer;line-height:1.4}
.arole{display:inline-block;background:var(--c-general);color:#fff;font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:5px}
.arole.rs{background:var(--navy)}
.aent.sess-ent{background:#eef4fb;font-weight:600}
.aent small{color:var(--mut);font-weight:400}
.gridbar{display:flex;align-items:center;gap:8px;padding:0 14px 6px}
.gbl{font-size:11px;color:var(--mut)}
.zoomctl{display:flex;gap:5px}
.zbtn{border:1.5px solid #cbd5e1;background:#fff;color:#475569;border-radius:14px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;min-height:32px}
.zbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sess .star{position:absolute;top:2px;right:3px;font-size:10px}
.sess .doc{position:absolute;bottom:2px;right:3px;font-size:9px}
.sess .memodot{position:absolute;bottom:2px;left:3px;font-size:9px}
.memomark{font-size:10px;color:#92400e;background:#fef3c7;border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700}
.memowrap{margin-top:14px;padding-top:12px;border-top:1px dashed #cbd5e1}
.memolab{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px;display:flex;align-items:center}
.memostat{margin-left:auto;font-size:10.5px;font-weight:400;color:#16a34a}
.memoin{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 11px;font-size:16px;line-height:1.55;
  font-family:inherit;resize:vertical;background:#fffbeb;color:var(--ink)}
.memoin:focus{outline:none;border-color:var(--navy);background:#fff}
.expbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 0}
.expbtn{flex:1 1 30%;min-width:104px;display:flex;align-items:center;justify-content:center;gap:4px;border:1.5px solid #cbd5e1;
  background:#fff;color:#334155;border-radius:11px;padding:11px 8px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center}
.expbtn.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.expnote{font-size:10.5px;color:var(--mut);padding:7px 14px 2px;line-height:1.6}
.nowline{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:25;pointer-events:none}
.search{margin:10px 12px 4px;display:flex}
/* iOS Safariは16px未満の入力欄でフォーカス時に自動ズームするため16pxを維持 */
.search input{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}
.catfilter{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.catfilter::-webkit-scrollbar{display:none}
.cbtn{flex:none;font-size:12px;border:1.5px solid #cbd5e1;background:#fff;color:#475569;border-radius:16px;padding:8px 13px;cursor:pointer;min-height:34px}
.cbtn.on{color:#fff;border-color:transparent}
.cards{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;border-left:5px solid #ccc}
.card .info{flex:1;min-width:0}
.card .cat{font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;display:inline-block}
.card h3{font-size:13.5px;margin-top:3px;line-height:1.4}
.card .meta{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.5}
.favbtn{border:none;background:none;font-size:22px;color:#cbd5e1;cursor:pointer;padding:2px}
.favbtn.on{color:#f59e0b}
.daylabel{font-size:12px;font-weight:700;color:var(--mut);margin:10px 14px 2px}
.conflict{font-size:10px;color:#dc2626;font-weight:700}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:40px 20px;line-height:1.9}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:7px 0 5px;font-size:9.5px;color:var(--mut);cursor:pointer;position:relative}
nav button .ic{font-size:19px;display:block}
nav button.on{color:var(--navy);font-weight:700}
nav .badge{position:absolute;top:3px;left:calc(50% + 6px);background:#ef4444;color:#fff;font-size:9px;border-radius:8px;min-width:15px;padding:1px 3px}
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:none;align-items:flex-end}
.ovl.show{display:flex}
.modalbox{background:#fff;width:100%;border-radius:18px 18px 0 0;max-height:90dvh;display:flex;flex-direction:column;animation:up .2s ease;overflow:hidden}
@supports not (max-height:90dvh){.modalbox{max-height:90vh}}
/* ボタンを内包できる高さを確保（絶対配置だと上下が切れるため通常配置にする） */
.mtop{flex:none;position:relative;display:flex;align-items:center;justify-content:flex-end;
  padding:14px 10px 9px;border-bottom:1px solid #eef2f7;background:#fff}
.grab{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:#cbd5e1}
.mclose{border:none;background:#eef2f7;color:var(--navy);font-size:13px;font-weight:700;
  border-radius:18px;padding:9px 15px;cursor:pointer;min-height:38px;line-height:1}
.mclose:active{background:#dbe4ee}
.modal{padding:14px 18px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.modal .cat{font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:2px 8px;display:inline-block}
.modal h2{font-size:17px;margin:8px 0 4px;line-height:1.45}
.modal .row{font-size:13px;color:#334155;margin-top:8px;display:flex;gap:8px;line-height:1.6}
.modal .row .ic2{flex:none}
.mfav{margin-top:14px;width:100%;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.mfav.on{background:#fef3c7;color:#92400e}
.paper{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #eef2f7;cursor:pointer}
.pno{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c-general);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pt{font-size:13px;font-weight:600;line-height:1.35}
.pa{font-size:11px;color:var(--mut);margin-top:2px}
.absbody{margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:13px;line-height:1.75}
.absbody p{text-align:justify;margin:6px 0}
.backbtn{border:none;background:#eef2f7;color:var(--navy);font-size:12px;font-weight:700;border-radius:8px;padding:6px 10px;cursor:pointer;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actbtn{flex:1 1 30%;min-width:110px;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;border:none;cursor:pointer;font-size:13px;font-weight:700;border-radius:12px;padding:12px 8px}
.actbtn.map{background:#e0f2fe;color:#075985}
.actbtn.guide{background:var(--navy);color:#fff}
.pdfbtn{flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--c-keynote);color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:13px 16px}
.loc-link{color:var(--navy);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}
.lightbox.show{display:flex}
.lbscroll{width:100%;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
/* 画像は画面に収まるサイズで表示し、＋で拡大。margin:autoで中央寄せ（overflow時も端までスクロール可） */
.lightbox img{display:block;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;background:#fff}
.lightbox img.zoomed{max-width:none;max-height:none}
.lbzoom{display:flex;gap:8px;margin-top:10px}
.lbzoom button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.lbhead{color:#fff;font-size:15px;font-weight:700;margin-bottom:8px;text-align:center}
.lbhint{color:#cbd5e1;font-size:11px;margin-top:10px}
.doclist{padding:8px 12px 16px;display:flex;flex-direction:column;gap:7px}
.doc-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:11px;padding:12px 13px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07);font-size:13.5px;font-weight:600}
.doc-item .ic3{font-size:19px}
.doc-item .arw{margin-left:auto;color:var(--mut);font-size:15px}
button.doc-item{width:100%;text-align:left;border:none;cursor:pointer;font-family:inherit}
.helpitem{border-top:1px solid #eef2f7;padding:11px 0}
.hhead{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.hico{font-size:17px}
.hbody{font-size:12.5px;color:#475569;line-height:1.75;margin-top:4px;padding-left:26px}
.sec{font-size:12px;font-weight:700;color:var(--mut);margin:12px 14px 2px}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 12px 12px}
.mapcell{background:#fff;border-radius:11px;padding:13px 8px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.07);border:none;color:var(--ink)}
.mapcell small{display:block;font-weight:400;font-size:10px;color:var(--mut);margin-top:3px}
.bg-general{background:var(--c-general)}.bg-symp{background:var(--c-symp)}.bg-keynote{background:var(--c-keynote)}
.bg-lunch{background:var(--c-lunch);color:#4a4000 !important}.bg-ws{background:var(--c-ws)}.bg-dept{background:var(--c-dept)}
.bg-cer{background:var(--c-cer)}.bg-plan{background:var(--c-plan)}.bg-social{background:var(--c-social)}
.bd-general{border-left-color:var(--c-general)}.bd-symp{border-left-color:var(--c-symp)}.bd-keynote{border-left-color:var(--c-keynote)}
.bd-lunch{border-left-color:var(--c-lunch)}.bd-ws{border-left-color:var(--c-ws)}.bd-dept{border-left-color:var(--c-dept)}
.bd-cer{border-left-color:var(--c-cer)}.bd-plan{border-left-color:var(--c-plan)}.bd-social{border-left-color:var(--c-social)}
</style>
</head>
<body>
<header>
  <h1>令和8年度 日臨技中部圏支部医学検査学会（第64回）</h1>
  <div class="sub">2026.10.31(土)–11.1(日)｜長良川国際会議場 <a class="hlink" href="https://www.g-ncc.jp/access/" target="_blank" rel="noopener">アクセス ↗</a></div>
  <div class="daytabs">
    <button class="daytab on" data-day="1" onclick="setDay(1)">10/31 (土)</button>
    <button class="daytab" data-day="2" onclick="setDay(2)">11/1 (日)</button>
  </div>
</header>

<div id="view-grid">
  <div id="nowbar"></div>
  <div class="infobar" id="infobar"></div>
  <div class="venbar" id="venbar"></div>
  <div class="gridbar"><span class="gbl">表示サイズ</span><span class="zoomctl" id="zoomctl"></span></div>
  <div class="tl-wrap"><div class="tl" id="tl"></div></div>
  <div class="lbhint" style="color:var(--mut);text-align:center;padding:8px">タップで詳細・抄録・会場マップ</div>
</div>

<div id="view-list" style="display:none">
  <div class="search"><input id="q" type="search" placeholder="演題名・演者・所属・抄録本文を検索（2日間横断）" oninput="renderList()"></div>
  <div class="scopenote" id="scopenote"></div>
  <div class="catfilter" id="catfilter"></div>
  <div class="cards" id="cards"></div>
</div>

<div id="view-my" style="display:none"><div id="mylist"></div></div>

<div id="view-idx" style="display:none">
  <div class="search"><input id="qa" type="search" placeholder="氏名・所属で絞り込み" oninput="renderIdx()"></div>
  <div class="scopenote" id="idxnote"></div>
  <div class="catfilter" id="kanarow"></div>
  <div class="doclist" id="authorlist"></div>
</div>

<div id="view-info" style="display:none">
  <div class="sec">アクセス</div>
  <div class="doclist" id="accesslist"></div>
  <div class="sec">はじめに</div>
  <div class="doclist">
    <button class="doc-item" onclick="openHelp()"><span class="ic3">💡</span>このアプリの使い方<span class="arw">›</span></button>
  </div>
  <div class="sec">会場案内</div>
  <div class="doclist" id="venueguide"></div>
  <div class="sec">会場までの経路（タップで拡大）</div>
  <div class="mapgrid" id="mapgrid"></div>
  <div class="sec">学会案内・資料</div>
  <div class="doclist" id="doclist"></div>
</div>

<nav>
  <button class="on" id="nav-grid" onclick="setView('grid')"><span class="ic">🗓</span>日程表</button>
  <button id="nav-list" onclick="setView('list')"><span class="ic">🔍</span>検索</button>
  <button id="nav-idx" onclick="setView('idx')"><span class="ic">👤</span>演者索引</button>
  <button id="nav-my" onclick="setView('my')"><span class="ic">★</span>マイ日程<span class="badge" id="favcount" style="display:none"></span></button>
  <button id="nav-info" onclick="setView('info')"><span class="ic">ℹ️</span>案内</button>
</nav>

<div class="ovl" id="ovl" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <div class="mtop" id="mtop">
      <span class="grab"></span>
      <button class="mclose" onclick="closeModal()" aria-label="閉じる">✕ 閉じる</button>
    </div>
    <div class="modal" id="modal"></div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeMap()">
  <div class="lbhead" id="lbhead"></div>
  <div class="lbscroll" id="lbscroll"><img id="lbimg" alt="会場マップ"></div>
  <div class="lbzoom">
    <button onclick="zoomMap(-1)">−</button><button onclick="zoomMap(1)">＋</button><button onclick="closeMap()">閉じる</button>
  </div>

:00", "ls": "18:00", "le": "20:00", "time": "18:00-20:00", "cat": "social", "title": "情報交換会", "sub": "", "chair": ""}, {"id": "s44", "day": 2, "ven": null, "area": "南玄関（1F）", "start": "08:30", "end": "14:00", "ls": "08:30", "le": "14:00", "time": "8:30-14:00", "cat": "info", "title": "学会受付", "sub": "", "chair": ""}, {"id": "s45", "day": 2, "ven": null, "area": "市民ギャラリー（1F）", "start": "09:00", "end": "15:00", "ls": "09:00", "le": "15:00", "time": "9:00-15:00", "cat": "info", "title": "機器・試薬展示", "sub": "", "chair": ""}, {"id": "s54", "day": 2, "ven": null, "area": "ロビーホール（2F）", "start": "10:00", "end": "14:00", "ls": "10:00", "le": "14:00", "time": "10:00-14:00", "cat": "info", "title": "検査と健康展", "sub": "", "chair": ""}, {"id": "sbus2", "day": 2, "ven": null, "area": "岐阜駅団体バス駐車場 ⇔ 長良川国際会議場", "start": "07:00", "end": "17:00", "ls": "07:00", "le": "17:00", "time": "7:00-17:00", "cat": "info", "title": "無料シャトルバス", "sub": "", "chair": ""}], PAPERS=[{"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "08:50", "et": "08:59", "title": "当院の喀痰培養検査で検出されたNocardia属菌について", "sub": "", "author": "林 夢矢", "akana": "ハヤシ ユメヤ", "affil": "社会医療法人畿内会 岡波総合病院", "pref": "三重県", "co": ["橋本 秀哉", "松島 志保", "原 貴久", "福井 花依"], "cokana": ["ハシモト ヒデヤ", "マツシマ シホ", "ハラ タカヒサ", "フクイ カイ"], "chairs": ["松田 唱吾（厚生連 知多厚生病院）"], "field": "微生物", "cat1": "症例", "cat2": "一般細菌", "no": 1, "pdf": "0001.pdf", "chkana": ["マツダ ショウゴ"], "body": "【はじめに】Nocardia属菌は偏性好気性のグラム陽性放線菌であり,土壌や植物などに生育し, 外傷による創部感染や吸入による肺炎と関連する.多くの症例で免疫抑制状態の背景を有するが,健常人も感染の可能性はある.今回の症例では喀痰のグラム染色で本菌の存在を疑い,Kinyoun染色により確認後,医師に推定菌種の報告を行った.また常在菌の発育阻害と,培養期間の延長により発育を認めたので報告する.\n\n【症例】持続する咳嗽を主訴として当院を受診した70代男性.画像検査で明瞭な肺炎像を認め,血液検査ではCRPの増加と白血球の増加を認め,肺炎治療のため入院となった.\n\n【微生物学的検査】喀痰の塗抹検査と一般細菌及び抗酸菌培養検査を実施した.入院時の喀痰塗抹検査で放線菌様の貪食像よりNocardia属菌を疑い,担当医へ報告を行った.培養検査では35℃で1週間の培養検査と並行して,KBディスクを用いて常在菌の発育阻害を狙い同条件で培養を実施した.阻止円内に発育したコロニーの塗抹標本に Gram 染色・Ziehl-Neelsen染色及び Kinyoun染色で確認後,純粋培養を行い,外部委託先で質量分析にてNocardia cyriacigeorgicaと同定され薬剤感受性検査も実施した.\n\n【考察】本症例で提出された喀痰はGeckler3で,塗抹検査で起炎菌と推定される放線菌様の貪食像を認めたが,同時に常在菌とみられる細菌が多く混入していた. Nocardia 属菌の喀痰培養での検出は,創部や膿などの検体と比較して特殊培地を用いない場合に培養が困難である.今回の症例では特殊培地を用いず常在菌の発育阻害という工夫によりNocardia 属菌の純粋培養が迅速に可能となり,結果報告までの期間を短縮できたといえる.今回の症例では確認検査での検出から工夫による分離培養同定と感受性検査が円滑に実施できたと考えられるが,最終報告までの間にSBT/PIPC投与による症状軽快で長期のST合剤治療等は検討されず,陰影残存するも患者は軽快退院となった.社会医療法人 畿内会 岡波総合病院 0595-21-3135中央検査部 林 夢矢", "sid": "s2"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "08:59", "et": "09:08", "title": "Lacticaseibacillus paracasei によるカテーテル関連血流感染の1症例", "sub": "", "author": "吉田 美穂", "akana": "ヨシダ ミホ", "affil": "名鉄病院", "pref": "愛知県", "co": ["池戸 政博", "竹内 優里"], "cokana": ["イケド マサヒロ", "タケウチ ユリ"], "chairs": ["松田 唱吾（厚生連 知多厚生病院）"], "field": "微生物", "cat1": "症例", "cat2": "一般細菌", "no": 2, "pdf": "0002.pdf", "chkana": ["マツダ ショウゴ"], "body": "【はじめに】Lacticaseibacillus paracaseiはヒトの口腔内や腸管，膣の常在菌叢を構成するグラム陽性桿菌である。近年ではプロバイオティクスとして用いられ，感染症の原因菌としての報告は稀である。今回我々はL. paracaseiによるカテーテル関連血流感染(CRBSI)を経験したので報告する。\n\n【症例】90歳代，女性。右結石性腎盂腎炎にて入院。来院時の血液培養よりESBL産生菌が検出され，MEPM，CMZ，T/Pが投与されていた。状態が安定し，経尿道的尿路結石砕石術を施行した。術後，血液培養より Candida albicansが検出され，MEPM，F-FLCZが投与されていたが，末梢静脈の確保が困難となり，鼠径部よりCVカテーテルが留置された。留置+14日後に発熱を認め，CRBSIが疑われた。翌日CVカテーテルが抜去され，カテーテル先端および血液培養2セットが提出された。血液培養およびカテーテル先端培養よりL. paracaseiが検出された。【微生物学的検査】グラム染色にて連鎖形成のあるグラム陽性短桿菌を認めたが，球菌か桿菌かの判別が困難であった。サブカルチャーは血液寒天培地を用いて5％CO 環境下で35℃48時間培養2を行い，非溶血性の白色小コロニーの発育を認めた。WalkAwayによるパネル同定は不能であったが，薬剤感受性検査においてVCMのMICが>16 ㎍/mLであったため，本質的に耐性を示す Leuconostoc spp.または Lactobacillusspp.が推定される旨を中間報告した。検査センターへ解析依頼し，MALDI-TOF MS にて L. paracasei と同定された。\n\n【考察】本菌を原因とする感染症の報告は乳酸菌飲料等を常飲する患者において散見されるが，本患者において摂取歴はなかった。患者は外科的処置後の免疫抑制状態にあり，便失禁も繰り返していたため，カテーテル刺入部である鼠経部が汚染され，本菌が留置カテーテルに定着した可能性が考えられる。また，複数の抗菌薬を使用し，これらの抗菌薬に耐性を示す本菌が選択された可能性がある。【結語】CRBSI の原因菌として頻度が高い病原体は CNS や MRSA，Enterococccus spp.であり，VCMが第一選択薬として推奨されている。しかし本菌はVCMに本質的に耐性を示すため，臨床側への速やかな情報提供が重要である。連絡先 052-551-6121(内線8306)", "sid": "s2"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:08", "et": "09:17", "title": "当院で分離したNocardia spp.の臨床微生物学的検討", "sub": "", "author": "田中 美優", "akana": "タナカ ミユウ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["森 まどか", "荒深 友菜", "山下 和輝", "岩井 遥奈", "大澤 稜", "建部 雅彦", "大西 紀之"], "cokana": ["モリ マドカ", "アラフカ ユウナ", "ヤマシタ カズキ", "イワイ ハルナ", "オオサワ リョウ", "タテベ マサヒコ", "オオニシ ノリユキ"], "chairs": ["松田 唱吾（厚生連 知多厚生病院）"], "field": "微生物", "cat1": "症例", "cat2": "一般細菌", "no": 3, "pdf": "0003.pdf", "chkana": ["マツダ ショウゴ"], "body": "Nocardia属は土壌や水など自然界に広く存在する好気性の放線菌であり，特に免疫不全患者において感染症を引き起こす病原体である。当院にて2020年から2026年の7年間で Nocardia属菌が分離された 10症例について臨床微生物学的検討を行った。全例が呼吸器検体からの検出であり，そのうち放線菌や真菌感染の疑いとして長期培養の依頼があったのは4例のみだった。塗抹検査にて分岐したグラム陽性桿菌を認めたものは9例であり，残りの1例は放線菌疑いの情報から延長培養を行い分離し得たものであった。4例はステロイド治療や汎血球減少などの免疫不全を有していた。複合感染は6例で糸状菌4例が最多であり，基礎疾患として肺抗酸菌症を有するものが3例あった。分離した菌株は全て当院にて質量分析装置（MALDI Biotyper）による同定を行い，5例は千葉大学真菌医学研究センターに遺伝子解析を依頼した。そのうち 3 例は質量分析の同定結果と一致し（N.pseudobrasiliensis：1件，N. cyriacigeorgica：2件），不一致の2件は質量分析でN. araoensis，N. novaと同定された菌株が，遺伝子解析ではそれぞれN. beijingensis，N. aobensisと同定されていた。Nocardia属は発育に時間を要する菌であり，塗抹標本から疑い菌を見つけて培養期間を延長することが分離に欠かせない。慢性呼吸器疾患や治療反応性の乏しい症例には肺抗酸菌症や真菌症に加えて，放線菌症が疑われる。そのため患者情報や治療経過を把握した上での塗抹の観察や，適切な培養検査を実施しなければならない。質量分析の同定性能には限界があるが日常検査の中で近縁種の報告まで可能であり，遺伝子解析と同様の結果が得られる菌種もあるため有用である。菌種によって薬剤感受性パターンが異なることが知られており，副作用の観点から ST合剤以外の薬剤を選択できるよう，より正確な菌名同定と薬剤感受性が実施できることが望ましいため，他施設と連携できる体制を整えることが重要である。地方独立行政法人 岐阜県総合医療センター 中央検査部微生物検査室（058-246-1111 内線：5112）", "sid": "s2"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:17", "et": "09:26", "title": "Campylobacter fetusによる感染性腹部大動脈瘤破裂の一例", "sub": "", "author": "荒深 友菜", "akana": "アラフカ ユウナ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["森 まどか", "山下 和輝", "岩井 遥奈", "田中 美優", "大澤 稜", "建部 雅彦", "大西 紀之"], "cokana": ["モリ マドカ", "ヤマシタ カズキ", "イワイ ハルナ", "タナカ ミユウ", "オオサワ リョウ", "タテベ マサヒコ", "オオニシ ノリユキ"], "chairs": ["松田 唱吾（厚生連 知多厚生病院）"], "field": "微生物", "cat1": "症例", "cat2": "一般細菌", "no": 4, "pdf": "0004.pdf", "chkana": ["マツダ ショウゴ"], "body": "【はじめに】Campylobacter fetus はグラム陰性らせん状小桿菌であり、特に基礎疾患を持つ易感染症患者や高齢者に菌血症や感染性動脈瘤などを引き起こすとされている。今回、感染性腹部大動脈瘤破裂患者の術中検体より、C. fetusを検出した症例を経験したので報告する。\n\n【症例】69歳男性。レバーとユッケを摂取した翌日より腹痛・下痢・微熱があり、その2週間後より背部痛を自覚した。左大腿前面の感覚がなくなり歩行困難となったため救急要請し、近医に搬送された。精査の結果、腹部大動脈瘤切迫破裂疑いと診断され、当院に転院搬送、腹部大動脈人工血管置換術が施行された。\n\n【細菌学的検査】提出された術中検体のグラム染色にて、らせん菌を疑うグラム陰性桿菌を認めたため、微好気培養を追加した。培養 2 日目にコロニーの発育を認め、質量分析装置 MALDIBiotyper(BRUKER)にてC. fetusと同定された。また前医にて採取された血液培養からもグラム陰性らせん菌が検出されたとの報告があった。後に外注検査にてC.fetusと同定されたが、当院にて入院初日と4日目に提出された血液培養は陰性であった。\n\n【治療経過】入院初日より、グラム染色の結果や病態から C. fetus を疑い、ABPCとGMによる治療が開始された。その後クレアチニンの上昇に伴いGMのみ中止し、血液培養陰性化から約6週間の抗菌薬加療が行われた後、退院となった。\n\n【まとめ】本症例では、術中検体のグラム染色にてグラム陰性らせん菌を認めたことにより、入院初日よりC. fetus を疑い治療を開始できた。今後も患者背景をふまえた総合的な視点で原因菌を考え、早期診断・治療につながる有用な検査を行っていきたい。地方独立行政法人 岐阜県総合医療センター 中央検査部微生物検査室（058-246-1111 内線 5112）", "sid": "s2"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:30", "et": "09:39", "title": "当院におけるバンコマイシン添加チョコレート寒天培地の導入効果", "sub": "", "author": "山崎 裕貴", "akana": "ヤマサキ ヒロキ", "affil": "社会医療法人 杏嶺会 一宮西病院", "pref": "愛知県", "co": ["川島 千亜紀", "田邉 詩有", "坂上 愛梨", "鈴木 彩加", "寺田 さと子", "林 晃司"], "cokana": ["カワシマ チアキ", "タナベ シユウ", "サカガミ アイリ", "スズキ アヤカ", "テラダ サトコ", "ハヤシ コウジ"], "chairs": ["原 祐樹（日本赤十字社愛知医療センター 名古屋第二病院）"], "field": "微生物", "cat1": "試薬・機器", "cat2": "一般細菌", "no": 5, "pdf": "0005.pdf", "chkana": ["ハラ ユウキ"], "body": "【はじめに】バンコマイシン添加チョコレート寒天培地（日本BD、以下VCMチョコ培地）は、グラム陽性菌の発育を抑制し、目的菌の視認性を高める選択培地である。当院では市中肺炎の主要な起因菌である Haemophillus influenzaeと Moraxella catarrhalis の検出率向上及び検査効率の改善を目的として、2023年4月より呼吸器系材料は、従来のチョコレート寒天培地を VCMチョコ培地へと置換している。今回、培地変更が上記2菌種の検出率に及ぼした影響を統計学的に検討した。\n\n【対象と方法】2017年1月から2026年3月までに当院へ提出された喀痰、咽頭拭い、吸引痰、気管支鏡（BF）吸引痰、鼻汁を対象とした。新型コロナウイルス流行による検出率の全国的変動を考慮し、2020年1月から2023年4月を除外した。チョコレート寒天培地を使用した2017年1月～2019年12月を「従来培地群」、VCMチョコ培地を使用した2023年5月～2026年3月を「VCM培地群」と定義し、H. influenzaeとM. catarrhalisの検出状況を比較した。解析にはカイ二乗検定を用いた。\n\n【結果】対象の材料全体におけるH. influenzae検出率は従来培地群 3.8％（401/10650）に対し、VCM 培地群 5.0％（682/13462）と有意に上昇した（ｐ＜0.0001）。M. catarrhalisにおいても従来培地群 2.9％（305/10650）に対し、VCM 培地群 4.0％（540/13462）と有意に上昇した（ｐ＜0.0001）。材料別では、両菌種ともに喀痰、咽頭ぬぐい、鼻汁でVCM培地群で有意な上昇（ｐ＜0.05）を認めたが、吸引痰、BF 吸引痰では有意差を認めなかった。また、喀痰ではGeckler 3での検出割合が増加した。\n\n【考察】VCMチョコ培地の導入は両菌種の検出率を有意に向上させた。特に常在菌の混入が避けられない上気道由来の材料において VCMの選択作用が効果的に機能したと考えられた。喀痰等の検体採取が困難な小児において、鼻汁や咽頭から病原菌を検出できる利点は大きい。また、夾雑菌が抑制され釣菌しやすくなることで、同定や薬剤感受性検査に移行しやすくなった。\n\n【結語】VCMチョコ培地は市中肺炎の主要な起因菌の検出率向上と業務の効率化に有用である。", "sid": "s10"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:39", "et": "09:48", "title": "血液培養陽性時間を用いた腸内細菌目細菌と緑膿菌鑑別の有用性", "sub": "", "author": "藤本 恵里奈", "akana": "フジモト エリナ", "affil": "公立陶生病院", "pref": "愛知県", "co": ["日置 達也", "位田 陽史", "廣瀬 明宏"], "cokana": ["ヒオキ タツヤ", "インデン キヨシ", "ヒロセ アキヒロ"], "chairs": ["原 祐樹（日本赤十字社愛知医療センター 名古屋第二病院）"], "field": "微生物", "cat1": "統計学", "cat2": "一般細菌", "no": 6, "pdf": "0006.pdf", "chkana": ["ハラ ユウキ"], "body": "【背景】菌血症患者の抗菌薬選択において、緑膿菌と腸内細菌目細菌の鑑別は重要である。今回、血液培養陽性時間やボトル情報により、緑膿菌の推定が可能であるか検討を行ったので報告する。\n\n【対象・方法】2023年3月～2025年9月の間に2セット提出された血液培養のうち、単一種のグラム陰性桿菌が同定された検体を対象とし、そのうち検出数が 10 株未満の菌種（全体の9.5％）は除外した。測定機種は BACT/ALERT VIRTUO（BIOMERIEUX社）を使用した。\n\n【結果】緑膿菌（n＝54）の好気ボトル陽性時間中央値は、16.5時間で、そのうち嫌気ボトルの陽性率は3.7％であった。腸内細菌目細菌（n=1279）の好気・嫌気ボトル陽性時間中央値はそれぞれ10.7時間と10.2時間であった。また、好気ボトルが先に陽性となった割合は全体の17％、2セットとも好気ボトルが先に陽性となった割合は10％であった。好気ボトルが先に陽性となった腸内細菌目細菌の好気ボトル陽性時間中央値は11.7時間、その後に嫌気ボトルが陽性となった検体（76/131）の嫌気ボトル陽性時間中央値は11.9時間で、好気ボトル陽性から 1時間以内に 69.7％、6時間以内で93.4％が陽転化し、最終的に好気ボトルのみ陽性となった検体は4.2％であった。\n\n【考察・まとめ】腸内細菌目細菌の83.1％は嫌気ボトルが好気ボトルより早く陽性となることや、好気ボトル陽性から数時間以内に嫌気ボトル陽性となるため、培養陽性時点で緑膿菌鑑別は比較的可能であると考えられる。しかし、腸内細菌目細菌のうち好気ボトルのみ陽性となる検体が全体の 4.2％確認されたこと、好気ボトル陽転化から嫌気ボトル陽性までに時間を有する検体が存在したこと、嫌気ボトルも陽性となる緑膿菌もあるため、グラム染色や患者背景などの所見も含め推測することが重要であると考えられる。\n\n【連絡先】公立陶生病院 細菌検査室 0561-82-5101", "sid": "s10"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:48", "et": "09:57", "title": "当院におけるStaphylococcus属菌血液培養陽性症例の起因菌判定とＰＣＲ実施状況", "sub": "", "author": "荒町 和音", "akana": "アラマチ カズネ", "affil": "岐阜県立多治見病院", "pref": "岐阜県", "co": ["八島 繁子", "長谷部 雅也", "髙橋 美沙紀", "可児 あかね", "大島 萌楓", "各務 志乃ぶ", "米澤 千佳子"], "cokana": ["ヤシマ シゲコ", "ハセベ マサヤ", "タカハシ ミサキ", "カニ アカネ", "オオシマ モエカ", "カカミ シノブ", "ヨネザワ チカコ"], "chairs": ["原 祐樹（日本赤十字社愛知医療センター 名古屋第二病院）"], "field": "微生物", "cat1": "統計学", "cat2": "一般細菌", "no": 7, "pdf": "0007.pdf", "chkana": ["ハラ ユウキ"], "body": "【はじめに】Staphylococcus aureus菌血症は様々な合併症を伴う重篤な疾患である。血液培養でグラム陽性ブドウ状球菌が発育した場合、汚染菌/起因菌を迅速に判定し、適切な抗菌薬を選択することが重要である。当院では2025年4月からASTに感染症医が加わり、血液培養陽性症例の評価を行っている。今回、当院における Staphylococcus属菌検出症例の起因菌判定とPCR実施状況を報告する。\n\n【方法】2025 年 4 月～2026 年 3 月に血液培養でStaphylococcus 属菌が初回検出された 104件を対象とした。血液培養陽性液から MRSA 関連遺伝子を検出するXpertMRSA/SA BC「セフィエド」（ベックマン・コールター、以下 PCR）を使用した。当院では24時間以内に陽性になった入院患者で、平日時間内に陽性報告した場合にPCRを実施し、MRSA、MSSA、mecAの結果を報告している。また、医師や薬剤師からの依頼がある場合も実施している。\n\n【結果】104件中 61件（58.7%）を起因菌、43件（41.3%）を汚染菌と判定した。MSSAおよびMRSAは全て起因菌であった。ASTカンファレンスで判定した起因菌のうち5件は、J-SIPHEの自動判定基準による判定で汚染菌となった。全てCNSで、1セットのみ陽性であった。PCRは37件で実施し、培養結果との不一致は無かった。37 件中 25 件（67.6%）が起因菌で、内訳は MSSA 17 件、 MRSA 4 件、CNS 4件であった。12件（32.4％）は汚染菌で、この菌に対する抗菌薬投与は無かった。25時間以降に陽性になった26件のうち4件で依頼を受けてPCRを実施し、3件が起因菌となった。\n\n【考察】PCR結果からMRSAを否定できた症例では、早期に狭域抗菌薬を選択できた。汚染菌と判断した症例では不要な抗菌薬投与を避けることができた。実施基準を満たさない症例でも医師や薬剤師からの依頼を受けて PCR を実施し、適切な抗菌薬使用につながった。また、ASTカンファレンスで患者の状態や処置内容なども考慮し、自動判定では拾えない起因菌を正しく判定できた。多職種連携により、PCR検査が有効活用されていると考えられる。岐阜県立多治見病院―0572-22-5311", "sid": "s10"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:57", "et": "10:06", "title": "当院におけるStreptococcus agalactiaeの検出状況", "sub": "", "author": "水野 光", "akana": "ミズノ ヒカル", "affil": "三重県立総合医療センター", "pref": "三重県", "co": ["高羽 桂", "田中 美月", "海住 博之", "坂下 文康"], "cokana": ["タカバ ケイ", "タナカ ミツキ", "カイジュウ ヒロユキ", "サカシタ フミヤス"], "chairs": ["原 祐樹（日本赤十字社愛知医療センター 名古屋第二病院）"], "field": "微生物", "cat1": "統計学", "cat2": "一般細菌", "no": 8, "pdf": "0008.pdf", "chkana": ["ハラ ユウキ"], "body": "【はじめに】Streptococcus agalactiae（Group B streptococcus: GBS）はLancefield分類 B群の溶血性レンサ球菌であり、ヒトの咽頭、腸管や女性の生殖器に常在する。新生児では敗血症や髄膜炎の侵襲性感染症の原因菌である。近年、高齢者や基礎疾患を有する成人の侵襲性感染症の原因菌としての報告も増加している。今回、当院におけるGBS検出状況を調査したので報告する。\n\n【対象と方法】2016年1月から2025年12月の10年間にGBSが検出された1291例を対象とした。β溶血を示すグラム陽性球菌に対して2016年～2021年3月までは、ストレプトLA NX「生研」（デンカ）を用いてLancefield B群抗原が陽性と確認できた菌株を、2022年4月以降はMALDIバイオタイパー（ブルカー）にてS. agalactiaeと同定された菌株をGBSと判断した。\n\n【結果】GBS の検出数の推移は、2016 年から 2025 年の順に（113/102/120/91/101/110/148/136/179/181 例）合計 1291 例と増加傾向を示した。検出された材料は腟分泌物 526 件（42.3％）、尿 304件（23.5％）、喀痰 202件（15.6％）、血液48件（3.7％）その他191件（14.4％）で、腟分泌物、尿で増加傾向が見られた。侵襲性感染症の推移は、（4/3/5/5/2/5/4/6/9/6例）の合計49例で、内訳は新生児3例、乳児1例、成人45例で、成人では60歳代以降で多くを占めた。GBS陽性妊婦384例から児への垂直伝播がみられたのは18例（5.2％）、そのうち感染症と診断されたのは3例（0.9％）で、侵襲性感染症は認められなかった。\n\n【結語】当院における GBS の動向は概ね文献等の報告に近いものであった。今後も新生児、60歳台以降を中心に侵襲性感染症の動向に注視していきたい。連絡先(059)345-2321(内線2272)", "sid": "s10"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:10", "et": "10:19", "title": "尿検査における細菌検出法の比較検討", "sub": "", "author": "竹内 健二", "akana": "タケウチ ケンジ", "affil": "社会福祉法人 恩賜財団 済生会 松阪総合病院", "pref": "三重県", "co": ["水野 愛海", "川口 香", "林 豊", "福本 義輝"], "cokana": ["ミズノ マナミ", "カワグチ カオル", "ハヤシ ユタカ", "フクモト ヨシテル"], "chairs": ["梅田 由佳（金沢市立病院）"], "field": "微生物", "cat1": "基礎研究（検討）", "cat2": "一般細菌", "no": 9, "pdf": "0009.pdf", "chkana": ["ウメダ ユカ"], "body": "【背景および目的】尿路感染症(urinary tract infection;以下UTI)は頻度の高い感染症のひとつである。UTIは敗血症等重症化する例もあり、原因菌の迅速な報告が重要である。短時間で細菌尿を証明する方法はグラム染色、フローサイトメトリー法を原理とした全自動尿中有形成分分析(以下FCM法)、尿沈渣目視法(以下目視法)などがある。グラム染色はUTI診断における標準検査であるが、グラム染色が24時間対応可能な施設は少なく、当院も目視法のみを実施しているのが現状である。今回我々は尿培養における細菌の同定結果とグラム染色、FCM法、目視法の判定結果を比較検討し一定の知見が得られたので報告する。\n\n【対象および方法】2023年 1月から 2023年 5月までに尿培養と尿沈渣検査が同日に依頼された744症例を対象とした。尿培養の同定結果に対して、グラム染色(n=744)、全自動尿中有形成分分析装置UF-5000におけるFCM法(n=328)および目視法(n=628)での感度、特異度および細胞形態に対しての陽性的中率を算出した。\n\n【結果】細菌尿に対する感度はグラム染色93.6%、FCM法95.9%、目視法 92.0％であった。特異度はグラム染色96.0%、FCM法 91.3%、目視法 85.2％であった。グラム染色における陽性的中率は陽性球菌 96.7%、陰性桿菌 94.2%、陽性桿菌 40.3%であった。FCM 法における陽性的中率はGram Positive84.5%、Gram Negative95.1、GramNeg/Pos76.0%であった。目視法における陽性的中率は球菌46.8%、桿菌92.6%、球菌+桿菌51.1%であった。\n\n【考察】グラム染色は不定な染色態度の桿菌を陽性桿菌と判定したことが低い的中率となった一因と考えられ、今後の検査精度の向上が課題となった。目視法は普段一般検査に携わらない多くの技師が判定するため、判定がバラツキ、低い的中率となったと考える。FCM法はグラム染色と同等の精度を示し、他の研究で報告されている成績と概ね一致した。FCM法を時間外検査に導入することで、経験に左右されず迅速かつ高い精度でUTIの診断が可能であると考えられた。また、当院における尿培養の約40％は陰性であるが、特異性の高いFCM法で UTIを除外し、不必要な尿培養の実施を見送ることも可能であると考えられた。", "sid": "s14"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:19", "et": "10:28", "title": "生物学的製剤投与下の患者が劇症型A群溶連菌に感染した事例", "sub": "", "author": "川畑 瑚夏", "akana": "カワバタ コナツ", "affil": "独立行政法人 地域医療機能推進機構 高岡ふしき病院", "pref": "富山県", "co": ["横川 伊都子"], "cokana": ["ヨコカワ イツコ"], "chairs": ["梅田 由佳（金沢市立病院）"], "field": "微生物", "cat1": "症例", "cat2": "一般細菌", "no": 10, "pdf": "0010.pdf", "chkana": ["ウメダ ユカ"], "body": "【はじめに】溶血性連鎖球菌は急性咽頭炎などを引き起こす細菌として知られているが稀に劇症型溶連菌感染症として重篤になる場合がある。今回は関節リウマチ治療のため生物学的製剤投与を行っていた患者での一例を経験したので報告する。\n\n【症例】75歳女性。関節リウマチより生物学的製剤を投与され糖尿病で通院中。転倒し顔面を打撲したためA病院を受診したが問題なく帰宅。その3日後より眼瞼が腫れ当院を受診。CT画像で頭蓋内異常なく自宅での経過観察となった。さらに3日後呼吸困難、腰背部痛出現のため再度外来を受診し呼吸不全で入院。発熱は無かった。【身体所見】胸部に発赤と呼吸音減弱を認め、CT画像では多量の左胸水を認めた。胸水の外観は膿性で細胞数は144156/μL内リンパ球57.5％、多核球42.5％だった。【微生物学的検査と経過】培養検査は入院時に喀痰、胸水、静脈血で実施。グラム染色の結果、胸水より連鎖状の陽性球菌を認めたため医師へ至急報告を行った。治療では入院日よりCEZが開始された。しかし当日夜間に敗血症性ショックとなり死亡。血液培養は入院2日目に陽性転化し胸水同様の連鎖状GPCが検出された。胸水、血液ともにヒツジ血液寒天培地でβ溶血を伴うコロニーの発育を認めた。連鎖球菌抗原キットを用いて血清型を調べたところA群に凝集反応を認めたため医師に報告を行った。後日富山県衛生研究所よりemm89型、speB、speC、speF陽性の結果を受け取った。【考察】今回感染の進行が早く死亡となってしまった要因として 1）生物学的製剤を使用していた患者であったこと2）検出菌株が強毒素のspeB、speCを有していたことの２点が考えられる。【結語】染色結果は迅速に報告されたが経過が早く治療まで至らなかった。患者背景と起因菌の関係性をより注視し正確で迅速な結果報告を行えるように努めていきたい。連絡先：JCHO高岡ふしき病院 0763-44-1181（代表）", "sid": "s14"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:28", "et": "10:37", "title": "ESBL産生能が異なる腸管出血性大腸菌O157が同一便検体から検出された１例", "sub": "", "author": "黒田 志保", "akana": "クロダ シホ", "affil": "磐田市立総合病院", "pref": "静岡県", "co": ["佐藤 政季", "杉江 昌男", "山﨑 啓介", "上村 のり子", "久留島 幸路"], "cokana": ["サトウ マサキ", "スギエ マサオ", "ヤマザキ ケイスケ", "ウエムラ ノリコ", "クルシマ ユキジ"], "chairs": ["梅田 由佳（金沢市立病院）"], "field": "微生物", "cat1": "症例", "cat2": "一般細菌", "no": 11, "pdf": "0011.pdf", "chkana": ["ウメダ ユカ"], "body": "【はじめに】大腸菌の基質特異性拡張型βラクタマーゼ（ESBL）産生率は増加傾向である一方、ESBL産生腸管出血性大腸菌(EHEC)の報告は少ない。今回、便培養でESBL産生能の異なる EHEC O157 が同時に分離された１例を経験したので報告する。\n\n【症例】80歳代女性。下腹部痛、下痢、血便にて当院救急外来に受診された。食中毒の原因となるエピソードがなく明らかな感染経路は不明であるが、ペットボトルに水をつぎ足しして飲んでいたとの申告があった。家族内には有症状者は見られなかった。\n\n【結果】便培養を実施し、クロモアガーSTEC培地に発育した藤色コロニーに対し同定検査を行い、Escherichia coliO157 VT-1＆VT-2が検出された。薬剤感受性検査で微量液体希釈法とESBL確認試験（CLSI法）結果が解離したことから、クロモアガーESBL 培地にて再分離し、非産生とESBL産生のEHEC O157:Ｈ７が検出された。MLVA解析では、非産生株のMLVA型は24m0600で、比較したESBL産生株はリピート数が１遺伝子座のみ異なっていた。ESBL産生O157株においてはPCR法でbla CTX-M-8 groupの遺伝子が検出された。また1週間後に実施した陰性確認の便培養で同 groupの遺伝子をもった ESBL産生大腸菌が検出された。\n\n【考察】ESBL遺伝子はプラスミドを介して菌間に移行することが知られている。検出されたEHEC O157の2株は同起源である可能性が非常に高くESBL遺伝子が本患者の感染過程で O157株の一部に伝播されたものと推測される。また O157株と本患者の大腸菌間で ESBL遺伝子が伝播されたものを捉えた可能性がある。重篤な症状を引き起こすESBL産生 EHECは抗菌薬の選択域が狭くなり治療が困難になることが懸念されており、的確な細菌培養検査が求められる。連絡先：0538-38-5000（内線2850）", "sid": "s14"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:37", "et": "10:46", "title": "血液培養陽性患者の特徴的検査所見に関する検討", "sub": "", "author": "小川 瑞稀", "akana": "オガワ ミズキ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["石田 秀和", "米玉利 準", "丹羽 麻由美", "市岡 里奈", "横山 颯大", "開原 弘充", "菊地 良介"], "cokana": ["イシダ ヒデカズ", "ヨネタマリ ジュン", "ニワ アユミ", "イチオカ リナ", "ヨコヤマ ソウダイ", "カイハラ ヒロミツ", "キクチ リョウスケ"], "chairs": ["梅田 由佳（金沢市立病院）"], "field": "微生物", "cat1": "統計学", "cat2": "その他の血清", "no": 12, "pdf": "0012.pdf", "chkana": ["ウメダ ユカ"], "body": "【目的】菌血症は重篤化しうる病態であるが、その標準的検査である血液培養は結果確定に時間を要する。血流への細菌侵入に対する宿主応答は免疫・炎症・栄養状態に反映され、これらを統合した栄養・炎症指標（NLR、PNI、NPAR）が報告されているが、その多くは感染症・敗血症の重症度や予後評価を目的としている。そのため、血液培養陽性そのものとの関連を患者単位かつ年齢調整下で体系的に検討した報告は限られる。そこで本研究では、血液培養結果に先行して得られる日常検査値および栄養・炎症指標と血液培養陽性との関連を検討した。\n\n【方法】2023年1月〜2026年5月に当院で血液培養が提出された 18 歳以上の患者を対象とした後方視的観察研究として実施した。全 8,869件からコンタミネーション・複数菌・酵母様真菌検出例を除外し、同一患者の重複を避けるため一患者一症例として扱った。陽性1例に対し陰性2例を年齢マッチし、主解析群（陽性 582例、陰性 1,164例）を構成した。血算・生化学検査値および各指標を用い、多変量ロジスティック回帰分析、四分位別陽性率、性別層別化解析を実施した。\n\n【結果】年齢中央値は陽性群・陰性群ともに74歳であった。主解析では好中球数高値、リンパ球数低値、単球数低値、血小板数低値、クレアチニン高値が血液培養陽性と独立して関連し、アルブミンおよびCRPに有意差は認められなかった。栄養・炎症指標モデルではNLR高値が独立して関連し、NPARは関連傾向がみられたが、PNIは独立して関連しなかった。四分位別解析ではNLR・NPARの高四分位群、PNIの低四分位群ほど陽性率が高かった。性別層別化解析では女性でリンパ球数低値、男性で単球数低値とクレアチニン高値が特徴的であった。\n\n【結語】血液培養陽性患者は年齢調整下でも好中球増加、リンパ球・単球低下、血小板低下、腎機能障害を伴う特徴的な所見を示した。NLR・PNI・NPARは陽性患者の免疫・栄養・炎症状態を層別化する補助的情報となる可能性がある。これらの所見は血液培養結果に先行して患者状態の評価を補助しうるが、予測指標の構築と検証は今後の課題であると考える。 連絡先：058-230-7259", "sid": "s14"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:50", "et": "10:59", "title": "平板培地が分離に有用であった結核菌群と非結核性抗酸菌の混合感染の1例", "sub": "", "author": "加藤 拓海", "akana": "カトウ タクミ", "affil": "地方独立行政法人 静岡県立病院機構 静岡県立総合病院", "pref": "静岡県", "co": ["大石 和伸", "栗岡 純子", "佐々木 理恵", "白川 るみ"], "cokana": ["オオイシ カズノブ", "クリオカ ジュンコ", "ササキ リエ", "シラカワ ルミ"], "chairs": ["齊藤 良子（富山赤十字病院）"], "field": "微生物", "cat1": "症例", "cat2": "抗酸菌", "no": 13, "pdf": "0013.pdf", "chkana": ["サイトウ リョウコ"], "body": "【はじめに】結核菌群と非結核性抗酸菌が同一検体から検出されることは多くはないが、薬剤感受性検査の正確な実施には菌種ごとの純培養分離が不可欠である。\n\n【症例】94歳女性。小児期に結核の既往歴あり。前医にて抗酸菌塗抹検査陽性、核酸増幅検査にて結核菌群及びMycobacteriumaviumが陽性であった。精査目的で当院へ紹介となった。\n\n【細菌学的所見】当院での抗酸菌塗抹検査は陽性（2＋）であり、核酸増幅検査では結核菌群及びM.aviumが陽性となった。前医情報を踏まえ混在を疑い、検体を液体培地（MIGITシステム）、固形培地（小川培地、ミドルブロック７H11）へ同時に接種した。液体培地は培養5日目で陽性化しチールネルゼン染色にて抗酸菌の存在を確認したが、キャピリア TB-Neo（タウンズ）は陰性であったため培養を継続し、培養7週目でキャピリア TB-Neo陽性となった。また平板培地では培養7週目に灰白色で乾燥、不規則な辺縁をしたR型コロニーと、白色～黄色調で平滑な2種類のコロニーを確認した。それぞれを質量分析装置にて同定した結果、結核菌群、M.aviumの両菌種であることを確認した。混在している状態では薬剤感受性の評価が困難であるため、純培養を行い菌種ごとに薬剤感受性検査を実施した。\n\n【考察】本症例では前医情報を踏まえ、検体接種の段階から複数の培地へ接種することで、明確にコロニー形態及び発育様式の差を捉えることが出来た。結核菌群と非結核性抗酸菌では発育速度に差があり、一般的に非結核性抗酸菌が検出された後に結核菌群が発育するため液体培地と小川培地のみでは混在を見逃す可能性がある。培養面積の大きい平板培地を併用し、肉眼的にコロニーを観察できるようにすることが重要であると考えられる。\n\n【結語】抗酸菌混合感染が疑われるような症例では、検体処理の段階から分離を意識した対応が、正確な菌種同定及び薬剤感受性検査に重要である。連絡054-247-6111（内線2251）", "sid": "s21"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:59", "et": "11:08", "title": "壊死性筋膜炎患者の組織培養より結核菌を検出した一例", "sub": "", "author": "佐々木 崇寿", "akana": "ササキ タカヒサ", "affil": "名古屋市立大学病院", "pref": "愛知県", "co": ["近藤 周平", "大池 知行", "井上 貴子"], "cokana": ["コンドウ シュウヘイ", "オオイケ トモユキ", "イノウエ タカコ"], "chairs": ["齊藤 良子（富山赤十字病院）"], "field": "微生物", "cat1": "症例", "cat2": "抗酸菌", "no": 14, "pdf": "0014.pdf", "chkana": ["サイトウ リョウコ"], "body": "【はじめに】結核菌は重篤な呼吸器感染症の原因菌であるが、皮膚軟部組織感染症の原因となることは稀である。今回、結核菌が関与したと考えられた壊死性筋膜炎（NF）の一例を経験したため報告する。\n\n【症例】40代女性。皮膚筋炎および間質性肺炎の既往があり、プレドニゾロン（PSL）20 mgで治療中であった。入院11日前より右上腕の発赤・腫脹を認め、右上腕丹毒の診断で入院した。セファゾリン、クリンダマイシン、ダプトマイシンで治療を開始し、血液と皮膚の培養が提出された。血液培養は陰性、皮膚培養では増菌培養で大腸菌を検出したが、丹毒の原因菌は特定できなかった。第10病日に皮膚所見の増悪を認め、皮膚筋炎の悪化によるものと判断されPSLは60 mgに増量された。抗菌薬投与を継続していたが、第 17病日頃より右上腕の壊死範囲が急速に拡大した。第21病日の試験切開で排膿を認め、NFと診断された。緊急切開排膿術を施行したが改善乏しく、第25病日に追加切開術を行った。\n\n【検査所見】皮膚切開時に採取された組織は、一般細菌検査として提出された。第21病日の検体では鏡検で菌を認めなかった。第25病日の検体では、グラム染色で染まらない桿状構造物を多数確認したため、チール・ネルゼン染色を実施したところ、抗酸菌を3 + 認めた。PCR検査を実施した結果、結核菌が陽性となった。翌日提出された喀痰からも蛍光塗抹±、PCR検査で結核菌を検出した。なお前医での検査でT-SPOT陽性であったため、入院前に3連痰の抗酸菌検査およびT-SPOTを実施していたが、いずれも陰性であった。\n\n【考察】本症例はT-SPOT陽性歴があり、入院前の喀痰検査は陰性で潜在性結核感染症と推察されたが、未治療であった。PSL増量に伴う免疫抑制により結核菌が肺で再活性化し、血行性またはリンパ行性に右上腕へ波及して NFを発症した可能性が高い。免疫抑制状態の患者で急速進行する NFを認めた場合、一般細菌のみならず抗酸菌感染も念頭に置いた検査が必要である。\n\n【連絡先】052-851-5511(内線：2121)", "sid": "s21"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:08", "et": "11:17", "title": "血液培養における嫌気ボトル採血量と嫌気性菌検出の関連", "sub": "", "author": "吉田 祐里菜", "akana": "ヨシダ ユリナ", "affil": "藤田医科大学病院", "pref": "愛知県", "co": ["東本 祐紀", "新谷 知世", "濱岸 真奈美", "星 雅人"], "cokana": ["ヒガシモト ユウキ", "シンタニ チヨ", "ハマギシ マナミ", "ホシ マサト"], "chairs": ["齊藤 良子（富山赤十字病院）"], "field": "微生物", "cat1": "統計学", "cat2": "嫌気性菌", "no": 15, "pdf": "0015.pdf", "chkana": ["サイトウ リョウコ"], "body": "【背景】血液培養では採血量が検出感度に影響する。採血量が少ない場合には好気ボトルへの接種が優先されることが推奨されているが、嫌気ボトルへの接種量低下により嫌気性菌の検出への影響が懸念される。嫌気性菌は血液培養陽性例の約 5％を占めるが、採血量と嫌気性菌各菌種の検出との関連について検討した報告は少ない。そこで今回、血液培養ボトルの採血量を調査し、嫌気性菌検出との関連について検討した。\n\n【対象】2025年4月1日～2026年3月31日に提出された血液培養ボトルのうち、好気・嫌気ボトル両方が提出され、平日日勤帯に血液培養ボトルの重量測定を実施した検体12,149件を対象とした。なお小児科、小児外科からの依頼検体及び小児ボトル使用検体は除外した。\n\n【方法】提出された血液培養ボトルの重量をデジタル重量計で測定し、採血量を算出した。測定機器はBD バクテック FX システム（日本 BD）を使用し、35℃、5日間培養した。嫌気性菌の検出件数は、汚染菌として扱われることが多いCutibacterium acnesを除外して集計した。\n\n【結果】対象期間の血液培養陽性例は1,508件（12.4%）、このうち嫌気性菌は 83件（5.3%）であった。嫌気ボトルの平均採血量は8.96±3.62 ml、採血量分布は8ml未満2,937件（24.2 %）、8－10 ml 5,936件（48.9 %）、10ml以上3,276件（27.0 %）であった。採血量別の嫌気性菌検出数（検出率）は、8 ml未満 26件（0.89 %）8-10 ml 40件（0.67 %）10 ml以上 17件（0.52 %）であり、群間に有意差は認めなかった（Fisher正確確率検定、P=0.2196）。検出頻度の高かった上位3種の検出数（検出率）は8ml 未満、8-10ml、10ml以上の順でそれぞれ Bacteroides 属 8 件（0.27 %）、11 件（0.19 %）、3件（0.09 %）、Clostridium属 1件（0.03 %）、11 件（0.10 %）、5 件（0.15 %）、Fusobacterium 属 2 件（0.07 %）、4件（0.07 %）、1件（0.03 %）であった。\n\n【考察】採血量と嫌気性菌全体の検出率の間に有意な関連は認めなかった。一方、Clostridium属では採血量区分が高くなるにつれて検出率の上昇傾向がみられた。菌種によって採血量の影響が異なる可能性があり、今後のさらなる検討が必要と考えられた。 【連絡】0562-93-2304", "sid": "s21"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:17", "et": "11:26", "title": "当院における複数菌菌血症での嫌気性菌分離状況", "sub": "過去２年間における検出菌種の解析", "author": "村松 早智子", "akana": "ムラマツ サチコ", "affil": "社会医療法人厚生会 中部国際医療センター", "pref": "岐阜県", "co": ["山口 明彦", "川本 怜子", "浅見 亜季", "西村 夏嬉", "渡邉 邦友"], "cokana": ["ヤマグチ アキヒコ", "カワモト リョウコ", "アサミ アキ", "ニシムラ ナツキ", "ワタナベ クニトモ"], "chairs": ["齊藤 良子（富山赤十字病院）"], "field": "微生物", "cat1": "統計学", "cat2": "嫌気性菌", "no": 16, "pdf": "0016.pdf", "chkana": ["サイトウ リョウコ"], "body": "【目的】 嫌気性菌は複数菌菌血症を引き起こしやすいことが知られている。本研究では，市中二次救急医療機関の単一施設における外来・救急患者を対象とし，嫌気性菌が関与する複数菌菌血症の検出状況を後向きに検討した。\n\n【方法】 2022年1月から2023年12月の2年間において，当院の外来および救急外来を受診し，血液培養検査によって菌血症と認められた症例を対象とした。血液培養装置はBACTEC FX（日本BD社），血液培養ボトルはBDバクテック23F好気用レズンボトルP，BDバクテック21F溶血タイプ嫌気用ボトルPを使用した。培養日数は最長7日間とし，陽性となったボトルは所定の方法でサブカルチャーした。菌種同定には，質量分析装置MALDI Biotyper Sirius（ブルカージャパン社）ver.11(10833)を用いた。\n\n【結果】 対象期間中に検出された菌株数および症例の内訳を調査し「単一菌菌血症」と「複数菌菌血症」に分類した。菌血症と認められたのは575症例であり，総検出菌株数は673株であった。症例の内訳は，全菌血症 575症例のうち嫌気性菌血症は56症例（56/575，9.7％）であった。全複数菌菌血症 72 症例のうち，嫌気性菌血症は 30 症例（30/72，41.7%）であった。単一菌菌血症503 症例のうち，嫌気性菌血症は26症例（26/503，5.2%）であった。一方，嫌気性菌総分離株 71 株のうち単一菌菌血症から 26 株（26/71，36.6％）が，複数菌菌血症から45株（45/71，63.4％）がそれぞれ分離された。\n\n【まとめ】 嫌気性菌は複数菌菌血症として検出され，その中でも菌種別ではClostridium perfringens が76.9%（10/13株）と高く，次いでBacteroides fragilis 33.3％（6/9株）であった。C.perfringensの同時分離菌としては，検出された12株のうちKlebsiella pneumoniae 44.4%（4件）, Escherichia coli33.3%（4件）が占めた。C.perfringens菌血症は稀ではあるが致死率は報告によっては 50％を超えることがあり最も重篤な菌血症の一つである。また MIHが発生するとさらに致死率は高くなるため検査現場においては臨床への迅速な同定結果の報告が重要である。中部国際医療センター臨床検査技術部村松早智子（代表：0574－66－1100 内線：4580）", "sid": "s21"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:30", "et": "11:39", "title": "蜂窩織炎様皮膚病変を契機に診断された播種性クリプトコッカス症", "sub": "", "author": "加藤 万里有", "akana": "カトウ マリア", "affil": "藤田医科大学病院", "pref": "愛知県", "co": ["東本 祐紀", "松井 建二郎", "下坂 寿希", "星 雅人"], "cokana": ["ヒガシモト ユウキ", "マツイ ケンジロウ", "シモサカ ヒサキ", "ホシ マサト"], "chairs": ["高羽 桂（三重県立総合医療センター）"], "field": "微生物", "cat1": "症例", "cat2": "真菌", "no": 17, "pdf": "0017.pdf", "chkana": ["タカバ ケイ"], "body": "【はじめに】クリプトコッカス症は、肺や中枢神経病変を主体とすることが多いが、皮膚病変を契機に診断されることがある。免疫不全患者では、菌血症や髄液への播種を伴う場合があり、早期診断と治療が重要である。今回、蜂窩織炎様皮膚病変を契機に診断された播種性クリプトコッカス症の1例を経験したため報告する。\n\n【症例】80代女性。強皮症のためステロイドを内服中。2週間前から右下腿の発赤と疼痛を自覚していた。車のドアに右下腿を挟んだことを契機に、予約外で皮膚科を受診した。同部位に挫創、血腫を認めたが、血液培養採取後に一時帰宅となった。翌日の再診時に発熱とCRPの上昇を認めたため蜂窩織炎が疑われ入院となり、セファゾリンの投与が開始された。\n\n【微生物学的検査・治療経過】血液培養2セット中、好気ボトル 2 本が採取 60 時間後に陽性となった。陽性ボトルの Gram染色で酵母様真菌を認め、クロムアガーカンジダ寒天培地（日本 BD）に分離培養した。培養翌日は微小コロニー、その翌日に淡桃色を帯びた白色コロニーが形成され、MALDI バイオタイパー（version 2023, Bruker） にてCryptococcus neoformansと同定された。Gram染色結果から、ミカファンギンが投与されたが、菌名報告後にアムホテリシンBおよびフルシトシンに変更された。さらに挫創部の皮膚生検、髄液検査が実施され、両検体からも同菌が検出された。また、治療開始1週間後に採取された血液培養で陰性が確認された。\n\n【考察】本症例は外傷後の蜂窩織炎として入院したが、血液培養で C. neoformans を同定したことを契機に皮膚生検と髄液検査が追加され、播種性クリプトコッカス症の診断に至った。本菌は初期治療で想定されにくく、菌種同定後に抗真菌薬の変更を要するために、迅速な同定が治療方針決定に重要である。免疫抑制患者で蜂窩織炎様皮膚病変をみとめた場合、血培培養の積極的な提出が望まれる。\n\n【結語】免疫抑制患者の蜂窩織炎様病変では、細菌感染症だけでなくC. neoformansも鑑別に挙げ、迅速な同定と播種性病変の検索が重要である。 連絡先：0562-93-2304", "sid": "s24"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:39", "et": "11:48", "title": "グラム染色所見とコロニー性状の乖離から二形性真菌を疑ったヒストプラズマ症の一例", "sub": "", "author": "森本 晃平", "akana": "モリモト コウヘイ", "affil": "富山大学附属病院 検査・輸血細胞治療部", "pref": "富山県", "co": ["杉江 和茂", "関口 敬文", "森田 未香", "横田 綾", "村井 佑至", "山本 善裕"], "cokana": ["スギエ カズシゲ", "セキグチ タカフミ", "モリタ ミカ", "ヨコタ アヤ", "ムライ ユウシ", "ヤマモト ヨシヒロ"], "chairs": ["高羽 桂（三重県立総合医療センター）"], "field": "微生物", "cat1": "症例", "cat2": "真菌", "no": 18, "pdf": "0018.pdf", "chkana": ["タカバ ケイ"], "body": "【はじめに】Histoplasma capsulatum は二形性真菌であり、自然環境では菌糸形、宿主内では酵母形を示す。土壌やコウモリ・鳥の糞中に広く分布し、分生子の吸入による経気道感染が主な感染経路である。流行地は熱帯・亜熱帯地域であり、本邦では主に輸入真菌症として遭遇する。今回、検査過程において二形性真菌を疑い対応した播種性ヒストプラズマ症の一例を経験したため報告する。\n\n【症例】外国籍の49歳男性。前額部のびらん・紅斑を主訴に近医皮膚科を受診し、細菌感染を疑われ抗菌薬含有軟膏およびテトラサイクリン系抗菌薬を投与されたが改善なく、潰瘍が出現したため20XX年1月26日に当院皮膚科を紹介受診した。皮膚検体の培養にて二形性真菌が疑われ、2月14日の感染症科紹介時に HIVスクリーニング陽性が判明した。2月16日には発熱および胸部不快感を認め、上部消化管内視鏡検査で食道カンジダ症と診断され、L-AMB投与が開始された。その後、皮膚およびリンパ節検体より発育した菌がH. capsulatumと同定され、播種性ヒストプラズマ症と確定診断された。\n\n【微生物学検査】皮膚検体のグラム染色にて酵母様真菌を認め、当初はマラセチア属を鑑別に挙げた。しかし、血液寒天培地上に糸状菌様コロニーが発育したため、ラクトフェノールコットンブルー染色を実施し糸状菌形態を確認した。これらの所見から輸入真菌症（二形性真菌）を疑い、速やかに主治医へ報告した。以降、検査室内感染のリスクを考慮し培地は密封管理とし、菌種同定は国立感染症研究所および千葉大学へ依頼した。前額部皮膚および後頚部リンパ節からH. capsulatumが分離され、尿中抗原も陽性であったことから播種性ヒストプラズマ症と診断された。\n\n【考察】輸入真菌症の原因菌はBSL3に分類され、通常の検査室での取り扱いには十分な注意が必要である。本症例では、グラム染色所見とコロニー性状の乖離に着目し、二形性真菌を疑うことができたため、その後の検査室内の感染対策を適切に行うことができた。国内で診断される二形性真菌症の多くは輸入例であり、患者の国籍や渡航歴の確認が診断の一助となる。＜連絡先：076-434-2315＞", "sid": "s24"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:48", "et": "11:57", "title": "Robotic Process Automationを用いた術前MRSAスクリーニングの自動報告体制の構築", "sub": "", "author": "杉山 裕衣", "akana": "スギヤマ ユイ", "affil": "JA愛知厚生連 豊田厚生病院", "pref": "愛知県", "co": ["杉山 宗平", "杉山 梨乃", "藤上 卓馬", "加藤 雄大", "松久保 修", "永田 悠起", "田中 浩一"], "cokana": ["スギヤマ ソウヘイ", "スギヤマ リノ", "フジカミ タクマ", "カトウ ユウタ", "マツクボ オサム", "ナガタ ユウキ", "タナカ コウイチ"], "chairs": ["高羽 桂（三重県立総合医療センター）"], "field": "微生物", "cat1": "システム化", "cat2": "ＭＲＳＡ", "no": 19, "pdf": "0019.pdf", "chkana": ["タカバ ケイ"], "body": "【はじめに】『MRSA感染症の診療ガイドライン2024』では、心臓手術、整形外科手術等の清潔手術の MRSA 除菌が推奨されているが、当院では、外来で実施したMRSAスクリーニング結果の把握は主治医に依存しており、情報が見落とされる可能性が懸念されていた。そこで今回、RPA（Robotic ProcessAutomation）を活用した自動報告システムを構築し、医療安全の向上を図ったので報告する。\n\n【方法】当院で使用している電子カルテ（HOPE/EGMAIN-GX）と感染管理システム（BactWeb）を介し、業務効率支援RPAソフト（WinActor）により自動報告システムを作成した。運用の流れは以下のとおりである。検査技師が同定・感受性検査を実施し、結果を電子カルテへ送信する。システムで毎日18時に新規発生情報のMRSAのうち、材料部位から『鼻腔粘液』を抽出し、「MRSAを検出した」と定型文を用いて、依頼医へメール送信と電子カルテTOP画面への記載を行う。2026年2月より本運用を開始した。\n\n【現状調査・結果】システム導入前の事前調査として、2025年2月1日〜2026年1月31日に実施したMRSAスクリーニング524件を対象とした。陽性は 14件（2.6%）であり、陽性例はすべて心臓血管外科または整形外科の術前患者であった。そのうち除菌施行は9件、未施行は5件（内訳：緊急手術、手術中止、期間不足、除菌後再陽性、不明）であった。なお、本運用開始後は陽性例の発生を認めていない。\n\n【考察】外来でのMRSA陽性例は、入院患者に比べICTの監視から外れやすく、さらに低頻度ゆえに、検査室や臨床現場で見落とされるリスクが高い。今回構築したシステムにより、365日自動での情報伝達経路が確立されたことは、医療安全を担保する上で極めて有意義である。実際の陽性例での稼働実績はまだ得られていないものの、システム自体は安定して動作しており、今後陽性例が発生した際の確実な情報共有と除菌施行率の向上に寄与することが期待される。連絡先：0565-43-5000（内線 2979）", "sid": "s24"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "12:00", "et": "12:09", "title": "検査部門間連携が抗菌薬変更に寄与した実例", "sub": "", "author": "谷藤 流空", "akana": "ヤトウ ルク", "affil": "静岡市立清水病院", "pref": "静岡県", "co": ["池ヶ谷 佳寿子", "府川 早樹子", "塩川 一樹", "須藤 淳", "望月 久仁子"], "cokana": ["イケガヤ カズコ", "フカワ サキコ", "シオカワ カズキ", "スドウ ジュン", "モチヅキ クニコ"], "chairs": ["新宮 歩（静岡県立静岡がんセンター）"], "field": "微生物", "cat1": "チーム医療", "cat2": "その他", "no": 20, "pdf": "0020.pdf", "chkana": ["シングウ アユミ"], "body": "【はじめに】臨床検査は多岐にわたる専門領域で構成されており、部門ごとに業務や配置場所が異なるため、日常的な関わりが限られる場合も少なくない。しかし、検査室内においても部門間で情報共有を行い、過去の症例などから得られた知見を共有・活用することは診療支援の質向上において重要であると考えられる。今回血液検査部門と細菌検査部門の連携により、臨床への適切な情報提供に繋がった症例を経験したので報告する。\n\n【症例】25歳、女性。当院にて急性虫垂炎と診断され、入院のうえ保存的治療が開始された。セフメタゾール（CMZ）を2日間投与後、3日目朝よりアモキシシリン水和物・クラブラン酸カリウム合剤（AMPC/CAV）とアモキシシリン（AMPC）内服へ変更予定となった。3日目朝の血液検査にて異型リンパ球12.5%を認め、血液検査部門より細菌検査部門へ異型リンパ球の出現およびペニシリン系抗菌薬の処方が予定されていることについて情報共有が行われた。過去の症例において異型リンパ球を認めた患者に対し、Epstein-Barr Virus（EBV）陽性判明前にAMPC/CVAおよびAMPCが処方され、その後発疹を認めた症例を経験していた。この症例を契機に、血液検査部門と細菌検査部門間で「EBV感染患者ではペニシリン系抗菌薬の投与は発疹リスクを伴うこと」が共有されていた。今回も同様の危険性が確認されたため、細菌検査部門より主治医へ連絡し、EBV PCR 検査の実施許可および結果判明まで抗菌薬内服を保留するように依頼した。その後、EBV PCR検査は陽性となり、処方抗菌薬はレボフロキサシン（LVFX）へ変更となった。\n\n【考察】本症例では当初EBV感染は臨床的に考慮されていなかった。しかし、血液検査部門から異型リンパ球出現および処方予定薬に関する情報共有が行われたことで、EBV感染を想起し速やかな追加検査および主治医への情報提供に繋げることができた。今回の経験から、臨床検査技師は各部門が個別に検査結果を報告するだけでなく、横断的に情報共有した上で、臨床的意義を踏まえて統合的に評価し、臨床に働きかけることが重要であると考えられた。連絡先：054-336-1111（内線2616）", "sid": "s27"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "12:09", "et": "12:18", "title": "FilmArray®消化管パネル検査が診断補助に有用であった赤痢アメーバ性腸炎の1症例", "sub": "", "author": "宮下 大地", "akana": "ミヤシタ ダイチ", "affil": "金沢大学附属病院", "pref": "石川県", "co": ["上地 幸平", "大谷 初美", "東 友子", "大谷 洸樹", "山﨑 大翔", "前河 晶子", "中出 祐介"], "cokana": ["ウエチ コウヘイ", "オオタニ ハツミ", "アズマ トモコ", "オオタニ ヒロキ", "ヤマザキ ヒロカ", "マエカワ アキコ", "ナカデ ユウスケ"], "chairs": ["新宮 歩（静岡県立静岡がんセンター）"], "field": "微生物", "cat1": "症例", "cat2": "その他の微生物", "no": 21, "pdf": "0021.pdf", "chkana": ["シングウ アユミ"], "body": "【はじめに】赤痢アメーバ（Entamoeba histolytica）性腸炎の診断には、糞便中からの虫体検出や血清抗体検査が用いられるが、いずれも検出感度や結果報告までの時間に課題がある。近年では多種類の消化管病原体を網羅的に検出できるFilmArray®消化管パネル検査が診断補助ツールとして注目されている。今回、SLE患者においてFilmArray®消化管パネル検査が赤痢アメーバ性腸炎の診断に有用であった症例を経験した。\n\n【症例】50歳代女性。SLEの既往あり。3年前に赤痢アメーバ性腸炎の治療歴あり。X-7日頃より右下腹部痛が出現し増悪したため、X日に精査加療目的で当院に入院となった。X+3日に下部消化管内視鏡検査を施行し回盲部から上行結腸に多発潰瘍を認め、生検組織のPAS染色で赤痢アメーバを疑う構造物を認めた。糞便検体を用いて直接塗抹ならびにMGL 法による検査を実施したが栄養体及びシストは検出されなかった。感染症科の依頼により残余検体を用いてFilmArray®消化管パネル検査を実施したところ E.histolytica が検出された。メトロニダゾールとパロモマイシンによる駆虫を施行した。治療により症状、炎症所見および画像所見は改善し退院となった。\n\n【考察】赤痢アメーバ性腸炎における糞便中の虫体検出、特に栄養体の検出には検体採取後、速やかな検査実施が求められる。本症例では虫体検出は陰性であったが、FilmArray®消化管パネル検査によりE. histolytica が検出され補助診断として有用であった。検査結果の信頼性には検体の採取・保存・運搬を含めた検査前プロセスが大きく影響する。迅速かつ正確な診断には適切な検査法の選択に加えて、検査プロセスの管理と検査室と臨床側の密接な連携が重要かつ不可欠であると考えられた。金沢大学附属病院検査部 – 076-265-2000 (代表)", "sid": "s27"}, {"kind": "一般演題", "day": 1, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "12:18", "et": "12:27", "title": "深層学習を用いた手指衛生評価の省力化への挑戦", "sub": "〜ハンドスタンプ検査をAIでもっとスマートに〜", "author": "曽我 英司", "akana": "ソガ エイジ", "affil": "総合病院中津川市民病院", "pref": "岐阜県", "co": ["市川 浩良"], "cokana": ["イチカワ ヒロヨシ"], "chairs": ["新宮 歩（静岡県立静岡がんセンター）"], "field": "微生物", "cat1": "システム化", "cat2": "感染制御チーム(ICT)", "no": 22, "pdf": "0022.pdf", "chkana": ["シングウ アユミ"], "body": "【はじめに】 肉眼では観察できない細菌を可視化するハンドスタンプ法による手指衛生評価は、医療従事者への手指衛生に対する意識向上に極めて有用な手法である。しかし、培地上のコロニーカウント作業は非常に煩雑であり、評価者間の目視による誤差の発生も避けられないため、検査の省力化と標準化が課題となっている。そこで本研究では、深層学習を用いた物体検出技術を活用し、コロニーカウント自動化による本課題の解決を試みた。\n\n【方法】 手指衛生評価に用いたハンドスタンプ画像40枚を対象とし、画像アノテーションツール（Roboflow）を用いて各コロニーに対する多角形アノテーションを実施した。密集により個々の識別が困難なものは癒合コロニーとして独立したクラスを定義し、学習データを最適化した。構築した深層学習モデルはPython環境下で実装し、推論時の信頼度閾値を最適化して自動カウントを実施した。この自動カウント値と、熟練した臨床検査技師による目視測定結果との相関性を比較検証した。\n\n【結果】 検証の結果、コロニー数が300個未満の画像において、自動カウント結果と目視結果は極めて高い相関（R²> 0.99）を示し、目視カウント数に対する回帰係数は0.92であった。全画像を対象とした解析においても R² > 0.86を維持した一方で、回帰係数は0.32に低下し、特に300個を超える過密画像において両者の数値の乖離が顕著となった。\n\n【考察・結語】 本AIモデルはコロニー数が300個未満の画像において極めて高い相関と実用的な回帰係数を示しており、検査の省力化と標準化に寄与する可能性が示唆された。過密画像における乖離（回帰係数の低下）の要因としては、癒合コロニーの増加および微小コロニーの検出限界が推察される。高度な重なりによりアルゴリズムの輪郭識別および重なり排除処理が困難となったことに加え、画像処理に伴う微細なコロニーの見逃しが影響した可能性が考えられる。今後は、癒合クラスの学習データ拡充と微小対象への検出感度向上等を通じて、さらなる精度向上と臨床現場での本格的な実用化を目指す。連絡先 0573-66-1251（内線2106）", "sid": "s27"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:00", "et": "09:09", "title": "膵リパーゼ測定におけるフッ素系溶剤AMOLEA AS300を用いたTG除去処理法の検討", "sub": "", "author": "黒田 烈志", "akana": "クロダ タケシ", "affil": "国立大学法人 名古屋大学医学部附属病院 検査部", "pref": "愛知県", "co": ["石川 裕介", "有馬 武史", "安岐 優伽", "鈴木 敦夫", "佐藤 浩司", "加留部 謙之輔"], "cokana": ["イシカワ ユウスケ", "アリマ タケシ", "アキ ユウカ", "スズキ アツオ", "サトウ コウジ", "カルべ ケンノスケ"], "chairs": ["伊藤 彰吾（春日井市民病院）"], "field": "臨床化学", "cat1": "試薬・機器", "cat2": "酵素", "no": 23, "pdf": "0023.pdf", "chkana": ["イトウ ショウゴ"], "body": "【背景・目的】合成基質法による膵リパーゼ（以下LIP）測定では、血清トリグリセライド（以下 TG）の影響により負の誤差を生じることが報告されている。我々は従来、高TG検体でのLIP測定に際し、混濁血清処理剤フリーゲンⅡ（シーメンス株式会社、以下フリーゲン）を用いてTG除去処理を行なっていたが、近年フリーゲンの入手が困難となった。そこで今回、フリーゲンの代替品としてフッ素系溶剤 AMOLEA AS-300（AGC 株式会社、以下アモレア）による TG除去処理が高 TG検体の LIP測定に適用可能か検討した。\n\n【方法】測定試薬にはシグナスオートLIP（シノテスト株式会社）を使用し、LABOSPECT008α（日立ハイテク株式会社）にて測定した。検討用試料として、検査後の残血清から作製したTG高値プール血清(TG: 335〜924mg/dL)を用いた。アモレアによるTG除去処理条件として、血清と処理剤との混合比（血清：処理剤＝1：1～10：1）、反応時間（0〜20分）、血清分離時の遠心時間（5〜20分）を検討し、TG除去率に基づいて最適条件を設定した。さらに、種々のTG濃度試料（49～688mg/dL, n=9）をアモレアあるいはフリーゲンで処理し、LIP測定値を比較した。なお、本検討は名古屋大学医学部生命倫理委員会の承認を得て実施した。（承認番号：2010-1038）\n\n【結果】混合比の検討では、血清比率の増加に伴い除去率が低下し、1:1 で 84.3±2.5％、10:1 では 67±4.2％であった。反応時間は混和直後（0分）のTG除去率は72.6±8.1％であり、20分後に89.2±0.3%と最大値を示した。遠心分離時間についても時間依存性にTG除去率の上昇を認めたが、10分で87.1±2.2と概ね頭打ちとなった。アモレア処理とフリーゲン処理によるLIP測定値の比較では、両者は良好な一致を示した。\n\n【考察】アモレアはフリーゲンと同等のTG除去性能を示し、高 TG検体における LIP測定への TGの干渉を軽減できることが示唆された。アモレアはフリーゲンの代替処理剤として有用である可能性が示された。連絡先：052-744-2588", "sid": "s48"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:09", "et": "09:18", "title": "新規測定試薬 LASAY オート KL-6(Ⅱ) の基礎的検討", "sub": "", "author": "早野 友亮", "akana": "ハヤノ ユウスケ", "affil": "JA岐阜厚生連 岐阜・西濃医療センター  西濃厚生病院", "pref": "岐阜県", "co": ["遠藤 彩音", "佐藤 匠"], "cokana": ["エンドウ アヤネ", "サトウ タクミ"], "chairs": ["伊藤 彰吾（春日井市民病院）"], "field": "免疫血清", "cat1": "試薬・機器", "cat2": "蛋白", "no": 24, "pdf": "0024.pdf", "chkana": ["イトウ ショウゴ"], "body": "【目的】KL-6は間質性肺炎の診断および病勢評価に有用な血清マーカーである。今回、KL-6の新規測定試薬であるLASAY オート KL-6(Ⅱ)(デンカ)の基礎性能を評価し、日常検査への適用可否を検討した。\n\n【方法】評価項目は、精度として併行精度および室内再現精度、検出性能としてLoB/LoD/LoQ、測定範囲の検証として希釈直線性、高濃度域でのプロゾーン効果、共存物質の影響、ならびに既存法であるナノピア KL-6(セキスイ)との2 法比較を行った。機器は BM 6070G (シスメックスBioMajesty)を使用した。\n\n【結果】併行精度はLowで平均370.4 U/mL、CV 1.08％、Highで平均1001.0 U/mL、CV 0.35％であった。室内再現精度はLowで平均359.6 U/mL、CV 0.96％、Highで平均991.1U/mL、CV 0.69％であり、いずれも良好な精度を示した。LoBは5.22 U/mL、LoDは11.52 U/mL、LoQは33.88 U/mLで、低濃度域での検出・定量性能を確認した。希釈直線性は 500 U/mLおよび 1000 U/mLで良好であり、5000 U/mLまでは決定係数R² = 0.9997と高い直線性を示したが、6250U/mLでは回収率 88.7％と低下を認めた。さらに高濃度域ではプロゾーン効果を認め、約9600 U/mL以上にてプロゾーンチェック機能が働いた。共存物質の影響は、アスコルビン酸、ビリルビン、溶血、乳びのいずれも許容範囲内であった。2法比較は 145検体で行い、相関係数 r = 0.994、回帰式y = 1.017x+9.05、総許容誤差TEa 18.0％であり、高い相関性と許容可能な誤差を示した。\n\n【まとめ】本試薬は精度、感度、相関性のいずれにおいても良好な成績を示した。\n\n【結語】KL-6 の日常検査に十分適用可能と考えられたが、5000U/mL以上の高濃度検体ではプロゾーンおよび回収率低下に留意し、希釈再測定が必要である。JA 岐阜厚生連 岐阜・西濃医療センター 西濃厚生病院連絡先：0585-36-1100(内線1050)", "sid": "s48"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:18", "et": "09:27", "title": "血清オートタキシン値と心エコー図指標との関連性の検討", "sub": "", "author": "神野 真司", "akana": "ジンノ シンジ", "affil": "藤田医科大学ばんたね病院", "pref": "愛知県", "co": ["伊藤 摩耶", "齋藤 邦子", "伊藤 裕安", "杉浦 縁"], "cokana": ["イトウ マヤ", "サイトウ クニコ", "イトウ ヒロヤス", "スギウラ ユカリ"], "chairs": ["伊藤 彰吾（春日井市民病院）"], "field": "臨床化学", "cat1": "その他", "cat2": "蛋白", "no": 25, "pdf": "0025.pdf", "chkana": ["イトウ ショウゴ"], "body": "【背景】オートタキシン（ATX）はリゾホスファチジン酸（LPA）産生に関与する分泌型糖蛋白である。ATXは肝線維化マーカーとして臨床応用されており、近年、汎用生化学自動分析装置で測定可能となったことで、迅速な結果報告と幅広い臨床応用が期待されている。本研究では、ATXと心エコー図指標との関連を検討し、ATXの新たな臨床的有用性を明らかにすることを目的とした。\n\n【方法】同日に血液検査および心エコー図検査を施行した152例を対象とした。ATXは ATXオートワコーを用いて測定し、各心エコー図指標との関連を評価した。左房圧（LAP）は、米国心エコー図学会の2025年改訂版左室拡張能評価ガイドラインに基づき正常群と上昇群に分類し、LAP上昇を目的事象としてATXの識別能をROC解析および多変量ロジスティック回帰分析により評価した。\n\n【結果】ATX は左室拡張能指標である E/ e’（ρ=0.309、p<0.001）、E/A（ρ=0.195、p=0.019）、左房容積係数（ρ=0.173、p=0.034）および三尖弁逆流最大血流速度（ρ=0.235、p=0.014）と有意な相関を認めた。一方、e’、左室駆出率、体表面積で除した左室容積および推定右房圧とは有意な相関を認めなかった。LAP正常群と上昇群におけるATXは、それぞれ 8.6（7.1–10.4）U/L、12.7（10.4–14.8）U/Lであり、LAP上昇群で有意に高値であった（p<0.001）。ROC 解析では AUC 0.87、カットオフ値 10.0 U/L、感度93%、特異度72%であった。多変量解析では、ATXは年齢、性別および体表面積で調整後も、LAP上昇と独立して関連した（オッズ比1.74、95%信頼区間1.38–2.29、p<0.001）。\n\n【考察】ATX/LPA系は線維化や組織リモデリングに関与することから、ATX高値は左室・左房のコンプライアンス低下を背景としたLAP上昇を反映している可能性がある。今後、左室・左房ストレイン解析を追加し、ATXと心筋および左房機能との関連をさらに検討する予定である。\n\n【結語】ATXはE/e’、E/A、左房容積係数および三尖弁逆流最大血流速度と関連し、LAP 上昇を良好に識別した。ATX は心エコー図で評価される左室充満圧上昇を反映する、新たな心血管バイオマーカーとなる可能性がある。臨床化学検査―052-323-5667", "sid": "s48"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:27", "et": "09:36", "title": "自動グリコヘモグロビン分析計HLC-723 GR01を用いたHbA1c測定法の比較検討", "sub": "", "author": "北野 紘美", "akana": "キタノ ヒロミ", "affil": "社会医療法人清光会 岐阜清流病院", "pref": "岐阜県", "co": ["岩瀬 莉乃", "末松 エリカ", "森 さゆり"], "cokana": ["イワセ リノ", "スエマツ エリカ", "モリ サユリ"], "chairs": ["伊藤 彰吾（春日井市民病院）"], "field": "臨床化学", "cat1": "基礎研究（検討）", "cat2": "糖", "no": 26, "pdf": "0026.pdf", "chkana": ["イトウ ショウゴ"], "body": "【はじめに】HbA1cは過去 1～2か月の血糖値を反映し，血糖コントロールの指標として用いられている．今回東ソー株式会社自動グリコヘモグロビン分析計HLC-723 GR01を導入するにあたり，酵素法との比較検討を行ったので報告する．\n\n【方法】当院でHbA1c測定依頼のあった192例の検体を対象に東ソー株式会社自動グリコヘモグロビン分析計 HLC-723 GR01（以下 HPLC 法）と，日立自動分析装置LABOSPECT006を用い、キャノンメディカルダイアグノスティックス株式会社製メタボリードHbA1c（以下酵素法）を使用し検討を行った．なお本検討は東ソー株式会社との共同研究であり，岐阜清流病院院内倫理委員会の承認を得て実施した．（承認番号：092）\n\n【結果】1.HPLC法･酵素法相関ｙ=0.923x+0.602 R2＝0.979（N=192）で全体的な相関は良好であった．2.HbFが2.0％以上の22検体について，F除去の有無による比較 F除去なし ｙ =0.863x+1.008 R2 ＝ 0.909 F 除 去 あ り ｙ=0.885x+1.040 R2＝0.930 HPLC法・酵素法の相関はほとんど差はなかった．3.Hb濃度とGR01 Total Areaの関係 ｙ=64.890x-0.092 R2＝0.896 強い相関を確認できた．4.初検Shortモード30秒で迅速結果報告が可能で，フラグ発生時のみ STAT 測定で容易に Long モード再検できる．低コストを維持できる．\n\n【まとめ】酵素法とHPLC法のHbA1cについて，全体的な相関は良好であった．HbFに着目した比較は困難であった．Hb濃度とTotal Areaの相関は良好であった．GR01では前処理不要の全血測定が可能で，Total Areaを外れた場合の再検や異常 Hbの検出が可能であり，より短時間での報告が可能であった．連絡先 058-239-8111（2860）", "sid": "s48"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:40", "et": "09:49", "title": "BCP対策におけるNX700の有用性の評価", "sub": "", "author": "高山 知子", "akana": "タカヤマ トモコ", "affil": "金沢大学附属病院検査部", "pref": "石川県", "co": ["奥泉 祐子", "中庄 沙樹", "竹本 賢一", "中出 祐介"], "cokana": ["オクイズミ ユウコ", "ナカショウ サキ", "タケモト ケンイチ", "ナカデ ユウスケ"], "chairs": ["田中 真知子（伊勢赤十字病院）"], "field": "臨床化学", "cat1": "試薬・機器", "cat2": "その他の化学", "no": 27, "pdf": "0027.pdf", "chkana": ["タナカ マチコ"], "body": "【はじめに】当院では、日常検査としてNH3測定に富士フイルム社製FDC NX700（以下NX700）を使用している。そのため、金沢大学病院事業継続計画書（BCP）には発災後の断水対策としてドライケムを用いることとなっている。\n\n【目的】BCP対策として使用するにあたりNX700と日常検査機器との一致性を評価する。\n\n【方法】生化学項目依頼検体の残余検体（血清）及び、ガス分析依頼検体の残余検体（血漿）を用いて、LABOSPECT008α（日立ハイテク）（以下H008α）とNX700との相関性を評価する。測定項目は UN、UA、CRE、Ca、Mg、IP、TP、ALB、T-Bil、D-Bil、AST、ALT、γ-GT、ALP、LD、CK、AMYの17項目とした。\n\n【結果】血清検体(ｎ=30)の回帰式、相関係数の一部を表に示す。T-Bilで4件の乖離検体がみられた。いずれも腎不全患者の検体であった。LDで300U/L以上の検体でばらつきがみられたがアイソザイムによる反応性が影響した可能性が考えられた。血漿検体も血清と同様な結果であった。\n\n【まとめ】NX700と日常検査機器との測定値は概ね良好な一致を示した。T-BilおよびLDのように一部注意を要する項目が認められたが、BCP発動時の代替測定機器として有用であることが示唆された。回帰式 相関係数UN y = 1.05x + 0.18 r = 1.000UA y = 1.01x + 0.06 r = 0.999CRE y = 1.02x - 0.11 r = 0.999Ca y = 1.02x - 0.54 r = 0.937IP y = 1.10x - 0.22 r = 0.994TP y = 1.02x - 0.16 r = 0.989ALB y = 1.07x - 0.30 r = 0.919T-Bil y = 0.97x - 0.07 r = 0.996AST y = 0.95x + 1.08 r = 1.000ALT y = 0.98x + 0.21 r = 0.999LD y = 1.18x - 46.4 r = 0.984CK y = 0.96x + 6.47 r = 0.998連絡先 076-265-2000（内線7163）", "sid": "s52"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:49", "et": "09:58", "title": "新規標準液を用いたCRP測定試薬『CRP－ラテックス X２「生研」NX』の基礎的検討", "sub": "", "author": "末松 エリカ", "akana": "スエマツ エリカ", "affil": "社会医療法人清光会 岐阜清流病院", "pref": "岐阜県", "co": ["北野 紘美", "岩瀬 莉乃", "森 さゆり"], "cokana": ["キタノ ヒロミ", "イワセ リノ", "モリ サユリ"], "chairs": ["田中 真知子（伊勢赤十字病院）"], "field": "臨床化学", "cat1": "試薬・機器", "cat2": "その他の化学", "no": 28, "pdf": "0028.pdf", "chkana": ["タナカ マチコ"], "body": "【はじめに】C反応性蛋白（C-reactive protein: CRP）は、炎症マーカーとして生体における炎症の程度や感染症の活動性を評価する指標として臨床の場で広く用いられている。今回、生化学自動分析装置更新に伴い、新たな標準液が上市されたCRP測定試薬CRP-ラテックス X2「生研」NXの基礎的検討を行ったので報告する。\n\n【方法】試薬：CRP-ラテックス X2「生研」NX（デンカ株式会社）。標準液：CRPNX標準液 WH（デンカ株式会社）。測定装置：LABOSPECT 006α（株式会社日立ハイテク）。検討内容：併行精度、希釈直線性、プロゾーン現象、検出限界、共存物質の影響、従来試薬との相関。相関データは、CRP測定依頼のあった患者の残余検体 90検体を対象として検討した。（倫理審査委員会承認No.096）\n\n【結果】併行精度：低濃度域は CV 1.636％、高濃度域はCV 1.025%と、良好な精度を示した。希釈直線性：40.0 mg/dLまで良好な直線性を認めた。プロゾーン現象：100.0 mg/dLまでプロゾーン現象を認めなかった。検出限界：2.6SD法で検出限界値として実測値0.0059 mg/dLを得た。共存物質の影響：溶血 500 mg/dL、ビリルビン30 mg/dL、乳び3000FTU、アスコルビン酸 50 mg/dL まで影響を認めなかった。従来試薬との相関：従来試薬LTオートワコーCRP-HSI（I 富士フイルム和光純薬株式会社）を LABOSPECT 006（株式会社日立ハイテク）で測定した結果、相関係数r = 0.998、回帰式Y = 0.958X + 0.163であった。\n\n【考察】CRP-ラテックス X2「生研」NXの基礎的検討は良好な結果であった。さらに、従来試薬の直線性が 35.0mg/dLであったのに対し、検討試薬では40.0 mg/dLまで直線性上限が拡張された。これにより、高値検体の再測定検体数の減少、結果報告時間の短縮が期待される。連絡先 058-239-8111（内線2860）", "sid": "s52"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "09:58", "et": "10:07", "title": "LABOSPECT006αへの機器更新と業務改善の取り組み", "sub": "", "author": "岩瀬 莉乃", "akana": "イワセ リノ", "affil": "社会医療法人清光会 岐阜清流病院", "pref": "岐阜県", "co": ["末松 エリカ", "北野 紘美", "森 さゆり"], "cokana": ["スエマツ エリカ", "キタノ ヒロミ", "モリ サユリ"], "chairs": ["田中 真知子（伊勢赤十字病院）"], "field": "臨床化学", "cat1": "試薬・機器", "cat2": "その他", "no": 29, "pdf": "0029.pdf", "chkana": ["タナカ マチコ"], "body": "【目的】生化学自動分析装置 LABOSPECT006 からLABOSPECT006αへの更新に伴い、処理能力維持の確認と日立運用サポートプラン導入による作業負担の軽減・業務改善についての取り組みを行ったので報告する。\n\n【方法】1.LABOSPECT006 と LABOSPECT006α において、検体を装置に架設後、検査システムから電子カルテヘ結果が送信されるまでのログを分析し、更新後も同等の処理能力が維持されているか確認した。（倫理委員会承認No.095）2.装置更新過程において、日立運用サポートプランを活用した運用見直しによる業務改善効果について、導入前後で分析を行った。\n\n【結果】1.検体処理時間は、LABOSPECT006が約 22分、LABOSPECT006αが約20分であった。2.①更新前：試薬選定・機器試薬検討内容の説明を受け十分な打ち合わせが出来た。②更新時：旧機器のパラメータや高濃度検体の再測定条件の確認と見直しが出来た。日常メンテナンスの実施時間設定の変更を行い日中の作業時間が大幅に短縮された。さらに、採血容器直接搭載の調整にて血清分注作業が不要となり感染対策・医療安全対策・作業負担の軽減に加え、分離容器のコストおよび廃棄物の削減効果が得られた。血清情報測定を生食で行い試薬削減となった。③更新後：院内基準範囲の根拠の確認や検査実績の項目依頼集計と定期採血予定から試薬交換推奨時期を算出したアラームを設定し、適切なタイミングでの試薬補充が可能となり未使用試薬の装置内滞留時間が短縮され試薬劣化防止につながった。④その後の定期訪問：試薬安定性や精度管理結果をもとにさらに試薬搭載条件の見直しや精度管理試料の管理改善にて安定した結果が得られた。\n\n【まとめ】LABOSPECT006αへの更新後も同等の処理能力が維持されていることが確認でき、変わらず正確な結果報告が可能となった。加えて、日立運用サポートプランを導入 したことで、更新前から現状に至るまでの疑問や課題を気軽に相談改善でき、作業負担の軽減と業務改善が達成され、経験が浅い人においても安心して機器更新を行えることが示唆された。連絡先：058-239-8111（2860）", "sid": "s52"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:07", "et": "10:16", "title": "ヘリコバクター・ピロリ抗体測定試薬の比較検討について", "sub": "", "author": "畠山 令", "akana": "ハタケヤマ リョウ", "affil": "ＮＴＴ東日本 伊豆病院", "pref": "静岡県", "co": ["吉岡 辰泰", "石井 浩崇", "岡﨑 陽子", "後藤 寛子", "加藤 貴紀"], "cokana": ["ヨシオカ タツヒロ", "イシイ ヒロタカ", "オカザキ ヨウコ", "ゴトウ ヒロコ", "カトウ タカノリ"], "chairs": ["田中 真知子（伊勢赤十字病院）"], "field": "臨床化学", "cat1": "試薬・機器", "cat2": "その他の化学", "no": 30, "pdf": "0030.pdf", "chkana": ["タナカ マチコ"], "body": "【背景・目的】ヘリコバクター・ピロリ（HP）抗体検査はABC分類による胃癌リスク層別化に用いられる。当院では2025年10月に抗体測定試薬を変更したため、変更前後で ABC分類および上部内視鏡所見との関連を比較検討した。\n\n【対象・方法】当院健診受診者のうち ABC分類および上部内視鏡検査を施行した症例を対象とし、旧試薬群と新試薬群で比較した。評価項目はABC分類の分布および内視鏡所見とした。\n\n【結果】試薬変更後、ABC 分類の分布に変化を認め、特に B群は 22例から 116例へ増加した。B群には内視鏡で明らかな異常を認めない症例が含まれた一方、C1～O1の萎縮所見を有する症例も増加した。またA群では萎縮所見を有する症例の割合が減少した。\n\n【考察】新試薬導入後、HP抗体陽性判定の増加に伴いABC分類ではB群が増加した。B群には内視鏡的異常を認めない症例が含まれる一方、萎縮所見を有する症例も増加していた。また、A群における萎縮所見例は減少しており、新試薬が従来A群に分類されていた一部のリスク症例をB群として再分類した可能性が考えられた。試薬変更は ABC分類による胃癌リスク評価に影響を及ぼす可能性があり、その特性を踏まえた結果の解釈が重要と考えられた。NTT伊豆病院検査室 055-978-2320", "sid": "s52"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:20", "et": "10:29", "title": "PIVKA-II測定試薬変更に伴うECLIA法とIEMA法の比較検討", "sub": "", "author": "中野 月穂", "akana": "ナカノ ツキホ", "affil": "学校法人順天堂 順天堂大学医学部附属静岡病院", "pref": "静岡県", "co": ["児玉 由美子", "芦川 直輝", "近藤 慶", "川久 由乃"], "cokana": ["コダマ ユミコ", "アシカワ ナオキ", "コンドウ ケイ", "カワク ヨシノ"], "chairs": ["佐々木 陽祐（聖隷浜松病院）"], "field": "免疫血清", "cat1": "試薬・機器", "cat2": "腫瘍マーカー", "no": 31, "pdf": "0031.pdf", "chkana": ["ササキ ヨウスケ"], "body": "【目的】PIVKA-Ⅱは肝細胞癌の診断および治療効果判定に用いられる重要な腫瘍マーカーとして広く臨床で利用されている。特にAFPと併用することで診断における感度および特異度の向上が期待されている。今回、新たにロシュ社のエクルーシス試薬 PIVKA-Ⅱを導入することになり、従来の測定試薬との比較検討を行った。\n\n【方法】2026年1月〜2月に当院で測定されたPIVKA-II検体のうち、ECLIA法、IEMA法、ならびにAFPの3項目が測定された 691 検体を対象とした。PIVKA-Ⅱは、cobas8000<e801> (ロシュ・ダイアグノスティックス株式会社、エクルーシス試薬 PIVKA-Ⅱ、ECLIA 法)および AIA-900(東ソー株式会社、Eテスト「TOSOH」Ⅱ(PIVKA-Ⅱ)、IEMA法)により測定した。AFPはcobas8000<e801> (エクルーシス試薬 AFPⅡ、ECLIA法)により測定した。カットオフ値は、ECLIA法 28.4 ng/mL、IEMA法 40 mAU/mL、AFP10 ng/mLとし、相関解析、一致率解析、陽性パターン分類を実施した。\n\n【結果】両測定系間の相関係数はr=0.802(p<0.001)と良好な相関を示した。PIVKA-II判定の一致率は95.8%(662検体)であり、不一致は4.2%(29検体)であった。ECLIA法/IEMA法測定値比の中央値は0.833であり、ECLIA法は平均10～20%低値を示す系統的差異が認められた。陽性パターン分類では、3項目全陽性が40検体(5.8%)、全陰性が522検体(75.5%)、PIVKA-II両陽性かつAFP陰性は57検体(8.2%)、AFPのみ陽性は43検体(6.2%)であった。また、測定系変更により陽性から陰性へ変化する検体が7例(1.0%)、陰性から陽性へ変化する検体が22例(3.2%)認められた。\n\n【考察】ECLIA法とIEMA法は高い相関と判定一致率を示し、同等の臨床的評価が可能と考えられた。ECLIA法が低値傾向を示す系統的差異が認められたが、測定原理および測定単位の相違によるものだと考えられた。特にカットオフ付近では判定変動に注意が必要であり、AFP併用は診断精度の向上に有用と考えられた。", "sid": "s55"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:29", "et": "10:38", "title": "HCG院内導入に向けた試薬基礎検討", "sub": "", "author": "後藤 真美", "akana": "ゴトウ マミ", "affil": "社会医療法人 蘇西厚生会 松波総合病院", "pref": "岐阜県", "co": ["林 みほ", "羽田野 美奈子", "森本 剛史", "後藤 幸雄", "菊地 良介"], "cokana": ["ハヤシ ミホ", "ハタノ ミナコ", "モリモト ツヨシ", "ゴトウ ユキオ", "キクチ リョウスケ"], "chairs": ["佐々木 陽祐（聖隷浜松病院）"], "field": "免疫血清", "cat1": "試薬・機器", "cat2": "内分泌", "no": 32, "pdf": "0032.pdf", "chkana": ["ササキ ヨウスケ"], "body": "【目的】HCGとは胎盤絨毛で生成、分泌される糖蛋白ホルモンであり、妊娠の早期診断や胎盤機能評価に有用な指標である。当院産婦人科より、不妊治療における迅速な治療方針決定を目的として、HCG 院内測定化の要望があった。一方、院内導入に際しては測定精度や外注検査との整合性を十分に評価することが重要である。今回、HCGの院内測定に向けた基礎的検討を行ったので報告する。\n\n【機器・試薬】測定機器はAccuraseed（富士フイルム和光純薬）を使用した。試薬はアキュラシードHCG（富士フイルム和光純薬）を用いた。対照法（外部委託）はCLEIA法とした。\n\n【方法と対象】診療目的で採血された患者残血清18検体および管理試料2濃度を対象とした。基礎的性能評価として、併行精度、日差再現性、希釈直線性、対照法との相関性について検討した。\n\n【結果】併行精度は2濃度の管理試料を用いて20回連続測定した結果、CVは3.3〜3.8％であった。日差再現性は2濃度の管理試料を20日間測定した結果、CVは3.6〜3.8％であった。直線性は y=0.988x-110.73、r=0.9989、対照法（外部委託）との相関は、y=1.015x-6.5363、r=1.000（n=18）であった。\n\n【考察】アキュラシード HCGは再現性および直線性などの基本的性能に優れており、対照法との相関性も良好であったことから、院内測定への導入に有用であると考えられた。\n\n【結語】従来の外部委託検査では結果報告までに2〜4日要していたが、Accuraseedは約10分で測定可能であり、迅速な結果報告による臨床現場への貢献が期待される。連絡先：058-388-0111（内線：2235）", "sid": "s55"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:38", "et": "10:47", "title": "マクロTSHによりTSH高値を呈し、SITSHとの鑑別を要した１例", "sub": "", "author": "樹 昇吾", "akana": "タツ ショウゴ", "affil": "地方独立行政法人 静岡県立病院機構 静岡県立総合病院", "pref": "静岡県", "co": ["青地 祐", "久住 裕俊", "村越 大輝", "北川 順子", "白川 るみ"], "cokana": ["アオチ ユウ", "クズミ ヒロトシ", "ムラコシ ダイキ", "キタガワ ジュンコ", "シラカワ ルミ"], "chairs": ["佐々木 陽祐（聖隷浜松病院）"], "field": "免疫血清", "cat1": "症例", "cat2": "内分泌", "no": 33, "pdf": "0033.pdf", "chkana": ["ササキ ヨウスケ"], "body": "【はじめに】下垂体から分泌されるTSHは、ネガティブ・フィードバック機構を介して甲状腺ホルモンを一定に保つ。甲状腺ホルモンが高値であるのにも関わらず TSH が抑制されない状態は「TSH不適切分泌症候群（SITSH）」と呼ばれ、甲状腺ホルモン不応症やTSH産生腫瘍との鑑別が問題となる。しかし、「真の SITSH」は 20％程度とされ、適切な診断のためには偽高値を除外することが重要である。今回我々は、マクロ TSHの影響により TSHが異常高値を示した症例を経験したので報告する。\n\n【症例】20歳代女性、20XX年10月近医にてTSH高値を指摘され、当院を紹介受診となった。受診時の測定値（機器名：Cobas8000）は、TSH：52.1 μIU/mL、FT3：3.0 pg/mL、FT4：1.34 ng/dLであり、臨床所見や超音波所見と乖離したTSHの異常高値を認めたため精査を行った。\n\n【精査方法】同日採取検体を用い、2ステップ法（機器名：ARCHITECT）による測定、25%PEG添加試験、プロテインG添加試験およびゲル濾過解析を実施した。\n\n【結果】2ステップ法による測定値はTSH27.1 μIU/mLであった。25%PEG添加試験およびプロテインG添加試験における回収率はそれぞれ 3％、13％であった。また、中性条件下のゲル濾過解析では、IgGより早い26.5分にTSHのピークを認めた。さらに、酸性条件下のゲル濾過解析により高分子画分のピークが消失したことから、マクロTSHの存在が確認された。\n\n【考察】添加試験での回収率低下と中性条件下のゲル濾過解析の結果から、IgG型の異好性抗体またはマクロTSHが存在している可能性が示唆された。酸性条件下の解析で複合体が解離したことから、マクロTSHによる偽高値であることが考えられる。また、2ステップ法の測定値も高値を示しており、一部の非特異的物質が除去されたものの、マクロ TSH の影響を完全には回避できない可能性が考えられた。\n\n【結語】TSH高値が臨床所見や超音波所見と矛盾する場合、マクロTSHなどの非特異的物質の可能性を考慮し、SITSH等との鑑別が重要である。連絡先:054-247-6111（内線2256）", "sid": "s55"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "10:47", "et": "10:56", "title": "血中ＴＡＲＣ測定における検体取り扱い条件の比較検討", "sub": "", "author": "下田 汐梨", "akana": "シモダ シオリ", "affil": "愛知医科大学病院", "pref": "愛知県", "co": ["鈴木 崇峰", "藤巻 恵理子", "高尾 晶子", "塚本 実奈子", "谷 浩也"], "cokana": ["スズキ タカミネ", "フジマキ エリコ", "タカオ アキコ", "ツカモト ミナコ", "タニ ヒロヤ"], "chairs": ["佐々木 陽祐（聖隷浜松病院）"], "field": "免疫血清", "cat1": "基礎研究（検討）", "cat2": "アレルギー", "no": 34, "pdf": "0034.pdf", "chkana": ["ササキ ヨウスケ"], "body": "【目的】TARCはアトピー性皮膚炎の有用なバイオマーカーである。血清中のTARCは血小板由来の成分が相当量含まれ、検体前処理における血小板活性化条件が測定値に影響すると推測される。今回、採血管種および検体取り扱い条件の違いによるTARC測定値の変動比較を目的として検討したので報告する。【対象】健常被検者3名に、採血管A（分離剤あり、凝固促進剤あり、トロンビンあり）、採血管B（分離剤あり、凝固促進剤あり、トロンビンなし）、採血管C（分離剤なし、凝固促進剤なし、トロンビンなし）で採血した。測定装置はHISCL-5000（Sysmex社）を使用した。【方法】採血管A・B・Cの検体を用いて、①採血管種と遠心前静置時間（凝固確認後 0h・3h・6h 静置し、3500g・8分で遠心分離）の比較、②血清保存条件（①の血清を各々-20℃・4℃で24h・48h保存後測定）の比較をした。【結果】①採血管Cは0h静置検体の値と比較し、3h・6h静置検体の値に上昇傾向を認めた。一方、採血管Aは被験者 3人のうち 1名において 0h静置検体の値と比較し、3h・6h静置検体の値に低下傾向を認めた。また、採血管Bは被験者3人のうち1名において0h静置検体の値と比較し、3h・6h静置検体の値に低下傾向を認めた。②-20℃保存条件下では、3h・6h静置検体で48h保存後測定値に有意な低下を認めた（p<0.05）。4℃保存条件下では、3h静置検体で48h保存後測定値に有意な低下を認めた（p<0.05）。【考察】方法①より、採血管Cでは時間経過に伴う血小板活性化の持続によりTARC放出量が増加したため、全血放置時間が長いほど値が上昇したと考えられる。一方、採血管A・Bでは凝固促進剤やトロンビンにより、血小板活性化およびそれに伴う TARC放出量に差が生じたことで 0h静置検体より値が低下したと考えられる。方法②より、TARCは低分子タンパク質であるケモカインの一種であり、全血放置や室温放置により分解・失活するため、値が低下した可能性がある。以上より、理想的な検体取り扱い方法は、分離剤、凝固促進剤等を含まない採血管を使用し、凝固確認後速やかに遠心分離した血清を測定することである。遠心後速やかに測定ができない場合には、-20℃または4℃保存で24h以内に測定することが望ましい。連絡先：0561-62-3311", "sid": "s55"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:00", "et": "11:09", "title": "KL-6、SP-D院内導入に向けた試薬検討", "sub": "", "author": "宇野 ともか", "akana": "ウノ トモカ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["仲本 知代", "波多野 柚月", "松雪 貴哉", "八竹 基哉", "安藤 航平", "石田 秀和", "長屋 麻紀"], "cokana": ["ナカモト トモヨ", "ハタノ ユヅキ", "マツユキ タカヤ", "ヤチク モトヤ", "アンドウ コウヘイ", "イシダ ヒデカズ", "ナガヤ マキ"], "chairs": ["清水 賢樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "免疫血清", "cat1": "試薬・機器", "cat2": "その他の血清", "no": 35, "pdf": "0035.pdf", "chkana": ["シミズ ケンキ"], "body": "【はじめに】シアル化糖鎖抗原(KL-6)およびサーファクタントプロテインD(SP-D)は、間質性肺炎をはじめとするびまん性肺疾患の診断や病勢評価に有用な血清マーカーとして広く用いられている。院内導入は迅速な結果報告や診療支援の向上に有用であると考えられるが、その前提として測定精度や再現性などの性能評価を事前に十分検討することが重要である。今回、従来外注検査として運用していたKL-6、SP-Dの院内導入に向け試薬の基礎的性能評価を行ったので報告する。【対象と方法】2025年2月に外注検査にてKL-6、SP-Dを同時測定した35検体、精度管理試料3濃度、既知濃度試料およびプール血清3濃度を対象とした。測定機器は LABOSPECT008α(日立ハイテク)を使用した。試薬はナノピア KL-6 およびナノピア SP-D(ともに積水メディカル)を用いた。基礎的性能評価として、①併行精度②室内再現精度③検出限界④外注検査との相関性⑤検体保存安定性について検討した。【結果】①併行精度：精度管理試料 3 濃度を各 20 回測定した CV％は KL-6 が 0.55～2.91％、SP-Dが0.57～4.48％であった。②室内再現精度：精度管理試料 2濃度を 10日間二重測定した CV%は KL-6が0.74～1.05％、SP-Dが0.99～4.28％であった。③検出限界：既知濃度試料を段階希釈し 2.6SD 法で評価した結果、KL-6、SP-Dともに添付文書下限値以下を検出できることを確認した。④外注検査との相関性：KL-6は相関係数r＝0.960、回帰式y＝1.02x+2.90、SP-Dは相関係数r＝0.995、回帰式 y＝0.87x+7.61であった。⑤検体保存安定性：プール血清3濃度を室温、冷蔵、凍結の各保存条件で10日間測定した。室温保存でKL-6は約30%、SP-Dは約20％の上昇を認めたが、冷蔵、凍結保存は10日間の安定性が確認された。【考察】併行精度、室内再現精度、検出限界はいずれも良好であり、KL-6、SP-Dともに安定した測定性能を示した。外注検査との相関はKL-6では良好であったが、SP-Dでは回帰式の傾きが0.87と乖離を認めた。室温保存で上昇を認めたことからも、SP-Dで認めた乖離は保存安定性の影響が一因と考察され、検体は冷蔵または凍結保存することが望ましいと考えられた。連絡先：058-246-1111(2676)", "sid": "s59"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:09", "et": "11:18", "title": "急激な貧血の進行を認めDonath-Landsteiner試験が陽性を示したPCHの一例", "sub": "", "author": "松尾 早也伽", "akana": "マツオ サヤカ", "affil": "藤田学園 藤田医科大学ばんたね病院", "pref": "愛知県", "co": ["杉浦 縁", "三輪 美奈子", "田中 葵彩"], "cokana": ["スギウラ ユカリ", "ミワ ミナコ", "タナカ アオイ"], "chairs": ["清水 賢樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "免疫血清", "cat1": "症例", "cat2": "自己免疫", "no": 36, "pdf": "0036.pdf", "chkana": ["シミズ ケンキ"], "body": "【はじめに】発作性寒冷ヘモグロビン尿症（PCH）は、Donath-Landsteiner抗体（DL抗体）により血管内溶血を惹起する稀な自己免疫性溶血性貧血（AIHA）である。今回我々は、急性腎不全を合併するほどの急激な溶血を認め、早期のDL試験実施により診断に至った貴重な症例を経験したので報告する。\n\n【症例】50代男性。既往歴特記事項なし。冬期に上気道炎発症後、ゴルフ、バイクによるツーリングと寒冷刺激を受け、その翌日倦怠感と褐色尿を自覚した。近医に受診し黄疸と肝酵素上昇を指摘され当院に紹介受診された。著明な貧血、肉眼的血尿、および生化学検査における LDH上昇、間接ビリルビン優位の黄疸、ハプトグロビン低下、尿潜血陽性の所見から、溶血性貧血を強く疑い精査を施行した。直接抗グロブリン試験は、抗IgG弱陽性、抗補体3＋、DL試験陽性、寒冷凝集素価は4倍と正常範囲内であり、PNH（発作性夜間ヘモグロビン尿症）マーカー、マイコプラズマ抗体、その他ウイルス感染症は陰性であったことよりPCHと診断された。網赤血球数は正常範囲内であり、末梢血液塗抹標本にて破砕赤血球(-)、球状赤血球がわずかに認められた。軽度の脾腫を認めたが胆石(-)であった。血液検査にて著明な溶血性貧血の所見（初診時Hb 10.8 g/dLから2日後に6.7 g/dLへ急落）と肉眼的血尿、急性腎不全を認め、一時的に血液透析が施行された。\n\n【経過・結語】 本症例は副腎皮質ステロイド治療、輸血療法を要さず、保存的加療と透析により貧血・腎機能ともに改善し退院となった。退院発症2か月後のDL試験は陰性化した。PCHの溶血は非常に急激かつ一過性であり、急性腎不全など重篤な合併症を伴う。病勢のピークを逃さずに早期からDL試験を含む多角的な溶血精査を行うこと、また迅速に検査対応できる体制を維持することの重要性が示唆された。", "sid": "s59"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:18", "et": "11:27", "title": "ＳＡＲＳ－ＣｏＶ－２抗原定量検査における判定保留域の臨床的意義", "sub": "小児領域における検討", "author": "鈴木 大智", "akana": "スズキ ダイチ", "affil": "静岡市立清水病院", "pref": "静岡県", "co": ["池ヶ谷 佳寿子", "谷藤 流空", "大瀧 南海子", "佐々木 克寿", "望月 久仁子"], "cokana": ["イケガヤ カズコ", "ヤトウ ルク", "オオタキ ナミコ", "ササキ カツヒサ", "モチヅキ クニコ"], "chairs": ["清水 賢樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "免疫血清", "cat1": "その他", "cat2": "その他", "no": 37, "pdf": "0037.pdf", "chkana": ["シミズ ケンキ"], "body": "【目的】COVID-19において陽性・陰性の正確な判定は適切な感染対策を行う上で重要である。当院ではHISCL-5000SARS-CoV-2 Ag試薬によるCOVID-19検査において、現在カットオフインデックス（以下C.O.I.）1.0～14.9を判定保留と報告している。本研究では判定保留域に含まれる小児症例の特徴を解析し、臨床的意義を検討した。\n\n【方法】2023/3～2026/4に当院で SARS-CoV-2抗原定量検査を実施した15,785例を対象とした。判定保留例を抽出し、年齢群別（0～5歳、6～14歳、15歳以上）の判定保留率を比較した。比較にはFisherの正確確率検定を用いた。また、電子カルテから最終診断を調査し、COVID-19陰性例をウイルス性呼吸器疾患群、細菌性呼吸器疾患群、その他疾患群に分類した。さらに、COVID-19陽性例と陰性例で年齢、当日体温、最高体温および C.O.I.値を比較した。また、年齢、当日体温、最高体温および性別と C.O.I.値との関連を評価した。比較にはMann–Whitney U検定およびSpearman順位相関係数を用いた。統計解析にはEZR1.68を使用し、有意水準はp <0.05とした。\n\n【結果】全例のうち判定保留は410例（2.6％）であった。判定保留率は0～5歳で8.4%、6～14歳で3.7%、15歳以上で2.1%であり、年齢群間で有意差を認めた（p <0.001）。0～5歳は15歳以上と比較して判定保留となるオッズ比が4.2倍（95%CI：3.23–5.41）であった。小児判定保留 103例のうちCOVID-19陽性は6例（5.8%）、陰性は97例（94.2%）であった。陰性例ではウイルス性呼吸器疾患群が77.3％を占めた。COVID-19陽性例と陰性例の年齢、当日体温、最高体温および C.O.I.値に有意差は認められなかった。また、年齢、当日体温、最高体温および性別と C.O.I.値との間にも有意な相関を認めなかった。\n\n【考察】判定保留域は乳幼児に多く認められた。小児判定保留例の多くは COVID-19陰性であったが、COVID-19陽性例も含まれていた。判定保留域を一律に陽性または陰性として扱うことは過剰診断あるいは見逃しにつながる可能性があり、追加検査や臨床情報を組み合わせて評価する運用の妥当性が示唆された。連絡先：054-336-1111（内線：2614）", "sid": "s59"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:27", "et": "11:36", "title": "臨床検査値の季節変動", "sub": "–65項目・約1,800万件の測定値を対象とした横断的解析–", "author": "備後 心花", "akana": "ビンゴ ミハナ", "affil": "岡崎市民病院", "pref": "愛知県", "co": ["天野 剛介", "榊原 穂乃花", "神倉 耀", "白井 洸羊", "稲吉 雅美", "野口 和希子"], "cokana": ["アマノ コウスケ", "サカキバラ ホノカ", "カミクラ ヨウ", "シライ コウヨウ", "イナヨシ マサミ", "ノグチ ワキコ"], "chairs": ["清水 賢樹（富山県厚生農業協同組合連合会 高岡病院）"], "field": "臨床化学", "cat1": "その他", "cat2": "その他", "no": 38, "pdf": "0038.pdf", "chkana": ["シミズ ケンキ"], "body": "背景）糖代謝関連検査や脂質系検査を含む複数の臨床検査値において、季節変動が報告されている。しかし、幅広い検査項目を同一の指標で横断的に評価した報告は限られており、各検査項目における季節変動の有無や相対的な大きさは十分に明らかになっていない。本研究では、市中病院における実臨床データを用いて、臨床検査値の季節変動について網羅的に解析した。目的）日常診療の臨床検査項目の季節変動を横断的に評価し、検査項目間で変動強度を比較すること。対象）対象の検査項目は、生化学検査、免疫検査、血液検査、血液ガス検査などのうち、日常診療で頻用される65項目とした。抽出期間は 2022 年 1 月～2025 年 12 月とした。解析対象は、期間中の検査オーダー約 85万件に含まれる、臨床検査値約1,800万件であった。方法）各項目について月別中央値を算出した。「月別中央値の最大値と最小値の差を、当該項目の全期間における四分位範囲（IQR）で除した値」を、季節変動指数（SeasonalVariation Index：SVI）と定義した。SVIに基づき各検査項目の季節変動強度を評価し、SVI>0.10を季節変動ありと探索的に定義した。結果）季節変動の大きさは項目により異なった。尿浸透圧が最も高いSVI（0.52）を示し、次いでHbA1c（0.20）、HDLコレステロール（0.17）、尿中クレアチニン（0.17）などが高値を示した。合計29項目でSVIが0.10を超えていた。糖代謝関連項目では、血糖値および HbA1c が冬季に高値、夏季に低値を示す一貫した季節性を認めた。また、尿浸透圧や尿中クレアチニンなど、体液調節や尿濃縮に関連する項目にも季節変動が認められ、水分摂取状態や尿濃縮・希釈の変化が関与している可能性が示唆された。結論）実臨床の大規模データを用いた解析により、多くの検査項目に季節変動を認めた。季節変動の強度およびパターンは検査項目ごとに異なり、とくに糖代謝、脂質代謝、体液調節に関連する項目で顕著であった。季節変動は検査値解釈の潜在的な交絡因子となり得るため、臨床検査結果を評価する際にはその影響を考慮する必要がある。TEL: 0564(21)8111 E-mail: kensaka@okazakihospital.jp", "sid": "s59"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:40", "et": "11:49", "title": "「Alinity Anti-HCV Next」の基礎的検討", "sub": "", "author": "荻原 実玖", "akana": "オギハラ ミク", "affil": "掛川市袋井市病院企業団 中東遠総合医療センター", "pref": "静岡県", "co": ["大塚 美和", "石川 秀和", "村松 すみれ", "尻無濵 真子"], "cokana": ["オオツカ ミワ", "イシカワ ヒデカズ", "ムラマツ スミレ", "シナシハマ マコ"], "chairs": ["高山 知子（金沢大学附属病院）"], "field": "免疫血清", "cat1": "試薬・機器", "cat2": "肝炎ウイルス", "no": 39, "pdf": "0039.pdf", "chkana": ["タカヤマ トモコ"], "body": "【目的】C型肝炎のスクリーニング検査は、HCV抗体を測定する方法が一般的である。現在当院では抗 HCV 抗体検出試薬「Alinity Anti-HCV」(以下HCV Ab・アボット)を使用している。今回新しく抗HCV試薬「Alinity Anti-HCV Next」（以下Aniti-HCV Next）が発売された。現行品と比較して院内導入時基礎検討を実施し、結果を報告する。\n\n【方法】化学発光免疫測定法を原理とする測定機器「Alinity i」を用いて測定を行った。測定項目をミラー化している2台分（1号機、2 号機）の検討を同条件で行った。両試薬ともに1.0S/CO未満を陰性、1.0S/CO以上を陽性の判定基準とした。①正確性について、純正キャリブレータ（Anti-HCV NextCallibrator)測定と純正コントロール試料（Anti-HCV NextControls)測定を行った。②機器間の併行精度について、純正コントロール試料2濃度分をそれぞれ20回分測定し、1号機2号機間で確認をした。③同時再現性について、純正コントロール試料 2 濃度と、キャノンメディカル社ACCURAN810コントロール試料（陽性・陰性）を測定し比較検討を行った。④判定一致率について、血清 33検体について Aniti-HCV Nextを用いて測定し、HCV Ab・アボットと比較した。\n\n【結果・考察】①純正キャリブレータ、純正コントロールは、Aniti-HCVNext での測定で表示範囲内の値であることを確認した。②1号機陰性試料CVが18.7%、陽性試料CVが1.5%であった。また、2号機の陰性試料CVが20.0％、陽性試料CVが1.5%であった。両号機間でバラつきがないことを確認した。③両コントロール試料ともに表示範囲内であることを確認した。④HCV Ab・アボットと Anti-HCV Nextの試薬間での判定一致率は81.8％だった。陽性一致率は37.5％、陰性一致率は96.0％だった。以上の結果から「Aniti-HCV Next」は、現試薬と同様、C型肝炎患者のスクリーニング検査として拾い上げに有効だと考察する。連絡先0537-21-5555（内線22219）", "sid": "s64"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:49", "et": "11:58", "title": "HCV抗体陽性症例におけるHCV抗原測定の有用性の検討", "sub": "", "author": "小澤 朋佳", "akana": "コザワ トモカ", "affil": "三重大学医学部附属病院", "pref": "三重県", "co": ["坂口 茜", "下仮屋 雄二", "杉本 和史"], "cokana": ["サカグチ アカネ", "シモカリヤ ユウジ", "スギモト カズシ"], "chairs": ["高山 知子（金沢大学附属病院）"], "field": "免疫血清", "cat1": "試薬・機器", "cat2": "肝炎ウイルス", "no": 40, "pdf": "0040.pdf", "chkana": ["タカヤマ トモコ"], "body": "【目的】C型肝炎のスクリーニングには HCV抗体が用いられているが、過去の感染歴や治療歴の影響で抗体が陽性となるため、現在も感染が継続している症例の特定にはHCV RNAの測定が必要となる。しかし、HCV RNAの測定は外注検査を要する場合が多く、結果判明までの時間やコストに課題がある。一方、HCV抗原測定は院内免疫分析装置で迅速な判定が可能である。本研究では、HCV抗体陽性者におけるHCV抗原測定の有用性を検討した。\n\n【方法】2025年 9月から 2026年 2月末までに当院において HCV抗体を測定し、陽性であった症例のうち、残余検体を保存ができた症例について HCV抗原の測定を行った。測定機器には生化学・免疫インテグレーション装置Alinity iシステム CI (アボットジャパン合同会社)を使用し、測定試薬としてHCV Ab・アボット、HCV Ag・アボットを使用した。HCV抗体は1.0 S/CO以上、HCV抗原は3 fmol/L以上を陽性とした。\n\n【結果】期間中に6129症例に対してHCV抗体が測定され、119例（1.94％）が陽性であった。そのうち113検体についてHCV抗原の測定を行い、12例（10.6%）が陽性であった。抗原陽性者の抗原量は最小値が 15.59fmol/L、最大値は13619fmol/Lで中央値は3030fmol/Lだった。抗原陽性者のHCV RNAは全例陽性で、有意な正の相関を示した（r=0.919,p<0.01）。また、抗原陽性例における HCV RNA の最小値は3.7logIU/mlであった。\n\n【考察】HCV抗原は院内免疫装置で迅速に測定可能であり、本研究において抗原陽性例はHCV RNAと良好な相関を示した。また、比較的低値の RNA量を有する症例においても検出が可能であった。 以上のことから、既存のHCV抗体と組み合わせることで、院内での迅速な感染判定や精査が必要な症例の拾い上げに有用な検査法であると考えられた。小澤 朋佳三重大学医学部附属病院 検査部059-231-5162t-kozawa@med.mie-u.ac.jp", "sid": "s64"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "11:58", "et": "12:07", "title": "Alinity i を用いた新規Anti-HCV・アボットの基礎的・臨床的性能評価", "sub": "", "author": "野村 ひろみ", "akana": "ノムラ ヒロミ", "affil": "独立行政法人 国立病院機構 金沢医療センター", "pref": "石川県", "co": ["塚本 雄介", "細江 祐月", "谷口 容", "浅香 敏之", "中田 聡子", "黒瀬 望"], "cokana": ["ツカモト ユウスケ", "ホソエ ユヅキ", "タニグチ ヨウ", "アサカ トシユキ", "ナカダ サトコ", "クロセ ノゾム"], "chairs": ["高山 知子（金沢大学附属病院）"], "field": "免疫血清", "cat1": "基礎研究（検討）", "cat2": "肝炎ウイルス", "no": 41, "pdf": "0041.pdf", "chkana": ["タカヤマ トモコ"], "body": "【背景・目的】C型肝炎（HCV）罹患者数は、抗ウイルス薬の進歩により減少傾向にあるが、現在でも感染の自覚のない場合や未受診の患者がいるなど、依然として課題が残っている。今回検討する新規試薬は従来試薬より検出感度の向上、偽陽性の低減された設計となっており、当院では5月下旬に切り替えた。今回我々は新規試薬の基礎的検討及び臨床的性能評価を行ったので報告する。\n\n【検討対象と方法】対象は2026年3月から同年4月までのHCV抗体検査実施検体から 31件を抽出し、従来 HCV Ab・アボットと新規Anti-HCV・アボットの2試薬、機器はAlinity i（すべてアボット合同株式会社）を以下の方法に用いた。①変動係数（CV）：陽性コントロール（陰性コントロールは添付文書に基づき対象外）を用いて、1日1回（N=1）15日間測定した。②判定一致度：陽性・陰性・全体一致率③相関性：定量値を用いる。これらついて検討した。\n\n【結果】①CV値は従来 3.61%、新規で 3.87%であった。②全体一致率は87.1%、陽性一致率85.7%、陰性一致率88.2%であった。従来と新規で判定結果の乖離が4例（従来陰性・新規陽性が2例、従来陽性・新規陰性が2例）認められた。③新規は従来と比較して陽性例の数値が高値化し、陰性例では低値化する傾向が見られ、相関係数は0.795であった。\n\n【評価】新規試薬は従来試薬と比較し、同等の再現性を有し、判定一致度も良好であったことから、試薬の切り替えは妥当であると考えられた。定量値において測定値の傾向に差があるため、当院では時系列でのデータ評価に関し切り替え前に臨床側に周知をし、理解が得られたためスムーズに移行することができた。しかしながら判定結果の乖離は、切り替え後4件報告されている。PCR検査での確認が望ましいが、その伝達方法は検討中である。", "sid": "s64"}, {"kind": "一般演題", "day": 2, "ven": 3, "hall": "第３会場", "room": "大会議室A（４F）", "st": "12:07", "et": "12:16", "title": "梅毒定性検査にて非特異反
