応を認めた一症例", "sub": "", "author": "伊藤 桃佳", "akana": "イトウ モモカ", "affil": "JA愛知厚生連 江南厚生病院", "pref": "愛知県", "co": ["小林 茉穂", "林 美月", "原田 康夫", "舟橋 恵二", "井口 光孝"], "cokana": ["コバヤシ マホ", "ハヤシ ミツキ", "ハラダ ヤスオ", "フナハシ ケイジ", "イグチ ミツタカ"], "chairs": ["高山 知子（金沢大学附属病院）"], "field": "免疫血清", "cat1": "症例", "cat2": "その他の血清", "no": 42, "pdf": "0042.pdf", "chkana": ["タカヤマ トモコ"], "body": "【はじめに】 当院では、RPR、TPAb定性検査はラテックス凝集免疫比濁(LATIA)法による非トリポネーマ脂質抗体キット「メディエース RPR (積水メディカル株式会社)」およびトレポネーマ抗体キット「メディエースⓇ TPLA (積水メディカル株式会社)」を用い、自動分析装置「TBA-FX8 (キヤノンメディカル株式会社)」で測定を行っている。今回、TPAb定性検査に関してLATIA法と化学発光酵素免疫測定(CLEIA)法で測定した結果が乖離した症例を経験したため報告する。\n\n【症例】 20代女性。20XX年5月、発疹を伴う発熱を主訴に当院を紹介受診した。頸部リンパ節腫大と軽度の肝障害を認め、血液像(自動機械法)では異型リンパ球の出現が示唆された。ウイルス感染症疑いで追加検査を行い、HSV、CMV、EBVが既感染を示す結果であったが、RPR陽性(3.3R.U.)、TPAb陽性(709.5 T.U.)と梅毒陽性を示す結果となり精査を実施した。RPRは炭末凝集法「RPRテスト 三光(積水メディカル)」にて実施し結果は陰性、TPAbは特異性を検証するため中和試験を実施し中和率 80.7%と陽性を示す結果となった。 2 週間後の再検査にて、RPR 陰性(0.0R.U.)、TPAb陽性(36.5 T.U.)と抗体価の著減を認めた。感染症内科と協議し、非特異反応を視野にTPAbについて他法(CLEIA法)にて確認検査を実施することとした。試薬および機器は「ルミパルスプレストTP、ルミパルスL2400(富士レビオ)」を用い、結果は陰性(0.1 C.O.I)となった。過去の病歴ならびに臨床経過を含め、LATIA法におけるTPAb偽陽性が強く疑われた。\n\n【考察】 両法の乖離は、試薬中の抗原組成や反応過程の相違に伴う非特異反応が要因として挙げられる。本症例では、短期間にてTPAb値が著減したことから、ウイルス感染を契機に一過性に産生された交差反応性抗体による偽陽性である可能性が高いと考えられる。若年層における梅毒感染が急増する昨今、スクリーニング検査における偽陽性リスクを熟知し、臨床側との綿密な情報共有と検証を通じて、適切な検査結果を提供していくことが重要である。連絡先：0587-51-3333（内線：2359）", "sid": "s64"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "08:50", "et": "08:59", "title": "STAT3変異を認めたT細胞大顆粒リンパ性白血病の1症例", "sub": "", "author": "永谷 大輔", "akana": "ナガタニ ダイスケ", "affil": "静岡県立 静岡がんセンターSRL", "pref": "静岡県", "co": ["南 勇輝", "池内 直美", "伊達 諒", "梁瀬 博文"], "cokana": ["ミナミ ユウキ", "イケウチ ナオミ", "ダテ リョウ", "ヤナセ ヒロフミ"], "chairs": ["渡邊 宜典（岐阜市民病院）"], "field": "血液", "cat1": "症例", "cat2": "血液一般", "no": 43, "pdf": "0043.pdf", "chkana": ["ワタナベ タカノリ"], "body": "【はじめに】T細胞大顆粒リンパ性白血病(以下T-LGLL)は、明らかな原因のない6ヵ月以上持続する末梢血の顆粒リンパ球増殖症で絶対数が2000～20000/μLとされ、免疫刺激の持続が著明な好中球減少や貧血に関与する。STAT3変異はT‑LGLLに特異的な分子マーカーとして注目され、補助診断における有用性が期待されている。\n\n【症例】40代男性、10年前に健診でリンパ球絶対数の増加を指摘され、慢性リンパ性白血病(以下CLL)疑いで経過観察となっていた。2ヶ月ほど前から易疲労感が増悪し、CTにて中等度の脾腫を認め、精査・加療目的にて当院紹介。\n\n【検査所見】末梢血：WBC 9500/μL、Hb 7.8g/dL、PLT24.2×104/μL、Reti 2.4% 血液像目視：Stab 0.0%、Seg 4.5%、Eo 0.0%、Ba 0.0%、Mo 4.5%、Ly 89.5%、Aty-Ly 0.5%、Lyの 75.5%に大顆粒リンパ球(以下 LGL)を認める(LGL#6591/μL)。生化免疫学検査：LD 235U/L、CRP 0.02mg/dL、sIL2R 446U/mL 骨髄像所見：リンパ球系細胞を50.2%認め、リンパ球の 60.6%に LGLを認める。FCM：gate(1)58.0%細胞 集 団 CD2(99.2%), CD3(98.6%),CD4(15.8%),CD5(68.9%),CD7(96.3%), CD8(82.9%),CD11c(53.8%),CD16(40.1%),CD56(5.1%), TCR-αβ(96.5%), cyCD3(97.5%) 染色体検査：47,XY,+Y[1]/46,XY[19] T細胞レセプターβ鎖Cβ1再構成：遺伝子再構成あり ヘムサイト：STAT3変異あり\n\n【考察】STAT3変異を認めたT-LGLLを経験した。LGLには、T細胞と NK細胞があり、T細胞性が T-LGLLに相当し、NK 細胞性は慢性 NK 細胞リンパ増殖異常症(以下CLPD-NK)に相当する。形態から両者の鑑別は難しく、細胞の起源、分子学的特徴、臨床像が重要となる。両者はSTAT3変異による経路活性が明らかにされ、T-LGLLは30～40%に認め、CLPD-NKよりも頻度が高い。STAT3変異を認めるT-LGLLは、好中球減少や関節リウマチを高頻度で認めることが報告されている。本症例では形態からT-LGLLと CLPD-NKの鑑別が困難であったが、STAT3変異の検出がT-LGLLの診断を支持し、併発した好中球減少とも一致した。STAT3変異解析が補助診断および臨床評価に有用であることが示唆された。連絡先：055-980-5686", "sid": "s3"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "08:59", "et": "09:08", "title": "DI-60と目視法における白血球分画の互換性評価", "sub": "", "author": "加藤 洋平", "akana": "カトウ ヨウヘイ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["石田 真理子", "上野 嘉彦", "坪井 由佳里", "安藤 穂乃実", "牛丸 明香理", "岡 有希", "菊地 良介"], "cokana": ["イシダ マリコ", "ウエノ ヨシヒコ", "ツボイ ユカリ", "アンドウ ホノミ", "ウシマル アカリ", "オカ アキ", "キクチ リョウスケ"], "chairs": ["渡邊 宜典（岐阜市民病院）"], "field": "血液", "cat1": "試薬・機器", "cat2": "血液一般", "no": 44, "pdf": "0044.pdf", "chkana": ["ワタナベ タカノリ"], "body": "【はじめに】血液像自動分析装置DI-60（Sysmex社）の機器・目視間比較は百分率（％）評価が主流だが、臨床判断には絶対数（×10^9/L）の評価も不可欠である。本研究では百分率と絶対数の両面から相関分析およびBland-Altman分析を用い、DI-60と目視法の互換性を検討した。\n\n【対象および方法】当院検査室で目視確認を行った末梢血塗抹標本223検体を対象とし、骨髄芽球、前骨髄球、骨髄球、後骨髄球、好中球、分葉核球、桿状核球、リンパ球、単球、好酸球、好塩基球についてDI-60と目視法の百分率と絶対数を算出した。相関性をピアソンの相関係数と回帰式で評価し、Bland-Altman解析により2法間の系統誤差を評価した。【結果】骨髄芽球・骨髄球は百分率・絶対数ともに良好な相関性を示した。好中球・分葉核球・リンパ球・好酸球は百分率で、単球・後骨髄球は絶対数で良好な相関性を示したが、一方の指標で相関性がやや低い傾向であった。好塩基球・前骨髄球・桿状核球は両指標とも他の項目に比べて相関性が低かった。回帰式の傾きから、好酸球（絶対数）や好塩基球（百分率）、前骨髄球（絶対数）、後骨髄球（絶対数）でDI-60の高値傾向を認めた。Bland-Altman解析では、いずれの細胞でも高値領域で拡大する比例誤差を認めた。【考察】良好な相関性を示した細胞でも傾きから系統誤差が示唆された。これはDI-60の固定スキャンエリアと、標本上の細胞分布の偏りを目視で柔軟に補正する分類プロセスの差異に起因すると考えられる。前骨髄球や好塩基球などの低検出頻度細胞では、200カウント法における1個差（0.5％）が絶対数換算で大きな差となるため、相関性低下の一因になったと考えられた。両指標で相関性が低かった桿状核球については、分葉核球との境界判定に主観的な要素が入りやすく、さらにモニター観察という観察媒体の違いも加わり、乖離が大きくなった可能性が考えられた。また、Bland-Altman解析でみられた比例誤差は、白血球高値症例では百分率のわずかな差が絶対数では大きくなることを示しており、異常高値症例では目視確認の重要性が示唆された。【結語】DI-60の特性を踏まえた目視確認の運用は、効率的な検査運用に有用であると考えられた。", "sid": "s3"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "09:08", "et": "09:17", "title": "当院における検体搬送システム導入による血液検査業務への効果", "sub": "", "author": "国枝 桃子", "akana": "クニエダ モモコ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["棚橋 高大", "後藤 雪乃", "市原 稜子", "八竹 基哉", "池場 映里奈", "大西 紀之", "長屋 麻紀"], "cokana": ["タナハシ タカヒロ", "ゴトウ ユキノ", "イチハラ リョウコ", "ヤチク モトヤ", "イケバ エリナ", "オオニシ ノリユキ", "ナガヤ マキ"], "chairs": ["渡邊 宜典（岐阜市民病院）"], "field": "血液", "cat1": "システム化", "cat2": "血液一般", "no": 45, "pdf": "0045.pdf", "chkana": ["ワタナベ タカノリ"], "body": "【背景】当院は2024年に検体検査室拡張工事及び検査機器更新を行い2025年1月より血液検体搬送システムを導入した。今回、検体搬送システムの導入前後の比較検証から、血液検査業務の改善を認めたので報告する。\n\n【導入機器】検体搬送システムIDS-CLAS X-1(IDS社)、バーコードターミナル BT-50、多項目自動血球分析装置XR-9000、塗抹標本作成装置 SP-50、検体並び替え装置TS-10(全てSysmex社)。\n\n【導入効果】検体搬送システム導入により微量検体を除く血液検査検体の受付、機器への架設、測定、血液塗抹標本作成・染色、収納及び精度管理物質測定が自動化された。導入前に技師が手作業で行っていた架設、収納等の業務を自動化したことによりルーチン帯での技師の業務は主に検査結果の確認や血液像の鏡検となった。これにより、事務作業等を時間内に行うことが可能となった。検体検査室における時間外は導入前の2024年1月から2024年12月までの月平均が99.1時間、導入後の2025年1月から2025年12また、以前は早出勤務者で担当していた染色液の調製、装置の準備等の業務が、システム導入後はタッチパネル操作のみとなったため、夜勤者でも準備可能となり、早出勤務者の1名削減に繋がった。また、検体検査室における早出勤務者の定時帰宅率は統計を開始した 2024 年 4 月から2024 年 12 月までの月平均が 37.83%、導入後の 2025 年 1月から2025年12月までの月平均が75.52%であり増加した。\n\n【結語】検体搬送システム導入による自動化により早出勤務者削減や時間外業務削減、早出勤務者の定時帰宅率増加など、業務改善を行うことが可能となった。今後は検体検査室全体として業務の効率化を図り、タスクシフト/シェア、多職種連携の業務等に積極的に携わっていきたい。\n\n【連絡先】058-246-1111(内線：2675 国枝)", "sid": "s3"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "09:17", "et": "09:26", "title": "検査部からの進言が契機となり早期診断に至ったヘアリー細胞白血病の一例", "sub": "", "author": "梶本 幸伸", "akana": "カジモト ユキノブ", "affil": "浜松医科大学医学部附属病院", "pref": "静岡県", "co": ["荻谷 健也", "村田 亘", "伊藤 結衣", "齋藤 実菜", "新関 紀康", "小谷内 克弥", "山下 計太"], "cokana": ["オギタニ ケンヤ", "ムラタ ワタル", "イトウ ユイ", "サイトウ ミナ", "ニイゼキ ノリヤス", "コヤウチ カツヤ", "ヤマシタ ケイタ"], "chairs": ["渡邊 宜典（岐阜市民病院）"], "field": "血液", "cat1": "症例", "cat2": "血液一般", "no": 46, "pdf": "0046.pdf", "chkana": ["ワタナベ タカノリ"], "body": "【背景】古典的ヘアリー細胞白血病（Hairy Cell Leukemia：HCL）は，末梢血・骨髄に出現する有毛細胞と進行性の汎血球減少を特徴とする稀な成熟B細胞性腫瘍である．今回，汎血球減少と骨髄塗抹標本上の異常細胞所見から検査部が追加検査を提案し，早期診断に至った古典的HCL症例を経験したため報告する．\n\n【症例】70歳代女性．5ヶ月前から進行する汎血球減少を認め，他科より精査目的で血液内科受診となった．末梢血検査では，WBC 3,070/μL，RBC 304×10⁴/μL，Hb 11.0 g/dL(前回値10.5g/dL)，PLT 7.5×10⁴/μLと3系統の血球減少を認めた．MCV 111 fLと大球性貧血認め，白血球分画では単球1.0%，リンパ球72.3％，好中球14.1％であり，単球と好中球の減少を認めた．LDH は 181 U/L と基準範囲内であり，CRP上昇も認めなかった．\n\n【検査所見】骨髄所見は，細胞密度やや低形成，3血球系統の減少を認めた．核形不整や切れ込み，核分葉傾向を有し，小型核小体を伴う中～大型の異常細胞が27.0％を占めていた．同細胞はペルオキシダーゼ染色およびエステラーゼ二重染色ともに陰性であった．典型的な有毛細胞にみられる細胞質突起は必ずしも明瞭ではなかったが，異常リンパ球性病変を疑い，sIL-2R追加測定を実施し 14282 U/mLと著増を示した．上記所見よりHCL疑い，担当医にBRAFV600Eを提案した．FCMではCD19，CD20，CD22，CD79a陽性の成熟B細胞形質を示し，CD11c，CD25，CD123(20%程度)の共発現を認めた．骨髄生検では線維化を伴う異型リンパ球の増生を認めた．遺伝子検査でBRAF V600E変異陽性が確認され，古典的HCLと確定診断された．\n\n【まとめ】本症例では，原因不明の汎血球減少に対し，骨髄塗抹標本上の異常リンパ球性病変を捉え，検査部から追加検査（sIL-2R測定およびBRAF V600E変異解析）を提案したことが，古典的ヘアリー細胞白血病の早期診断につながった．稀少血液疾患の診断支援において，検査部から積極的な情報提供と診断支援が重要であると考えられた．連絡先： 053-435-2111（内線2787）", "sid": "s3"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "09:30", "et": "09:39", "title": "混合型AIHAが血算に影響を与えた1例", "sub": "", "author": "佐野 沙耶香", "akana": "サノ サヤカ", "affil": "富山赤十字病院", "pref": "富山県", "co": ["高木 美希男", "金瀬 彩佳", "嶋田 孝紀"], "cokana": ["タカギ ミキオ", "カナセ アヤカ", "シマダ タカノリ"], "chairs": ["佐藤 聖子（藤田医科大学病院）"], "field": "血液", "cat1": "症例", "cat2": "血液一般", "no": 47, "pdf": "0047.pdf", "chkana": ["サトウ セイコ"], "body": "【はじめに】自己免疫性溶血性貧血(AIHA)は赤血球膜上の抗原に対する自己抗体が産生され、赤血球が破壊されることで貧血をきたす疾患である。AIHAは抗体の至適温度から温式AIHAと冷式AIHAに分類される。今回我々は室温での赤血球凝集が自動血球計数装置による血算の測定に影響を及ぼした混合型AIHAの１例を経験したので報告する。\n\n【症例】30代女性。前日に他院を受診し発熱、黄疸、貧血、ビリルビンとLDHの上昇を認め、溶血性貧血が疑われていた。当院血液内科に紹介受診予定であったが、症状増悪、体動困難となり当院に救急搬送された。\n\n【検査所見】来院時血液検査のWBC：15.0×10⁹/L、Hb：5.0g/dL、PLT：345×10⁹/L、Ret：15.98％、LDH：736U/L、TB：3.6mg/dL。血算の初検でMCHC：49.9％、赤血球凝集を認めたため加温・5 倍希釈を実施したところ MCHC は40.7％であった。そこで、血算の検体を遠心し、血漿を希釈液で置換したところMCHCが34.9％となった。血液像所見では有核赤血球が25個/100WBC、赤血球凝集、球状赤血球、多染性赤血球を認めた。直接クームス試験は抗IgG強陽性、抗補体弱陽性。寒冷凝集反応は32倍であった。\n\n【経過】混合型AIHA疑いで入院し、翌日からステロイドで治療を開始。20日後の採血でHb：8.9g/dLと軽快し、退院となった。その後は外来受診でフォローされている。\n\n【考察】AIHAは自己抗体の出現を共通とする疾患だが、症状の強さや抗体の性状は様々である。今回の症例は抗補体弱陽性であったが赤血球凝集が見られ、自動血球計数装置におけるRBC、Hb、MCVの測定への影響が加温や5倍希釈だけでは取り除けなかった。AIHAではビリルビンの上昇による色調変化や幼弱鉄芽球の増加、赤血球凝集など多くの要因が測定値に影響を与える可能性がある。それらの影響があると考えられた場合には血漿を希釈液で置換することが有効な対応の1つとして挙げられるのではないかと思われた。連絡先：076-433-2463", "sid": "s11"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "09:39", "et": "09:48", "title": "血漿浸透圧低下に伴う全自動血球分析装置XN-9100のHt値偽低値に関する検討", "sub": "－ミクロヘマトクリット法との比較－", "author": "宮川 花穂", "akana": "ミヤガワ カホ", "affil": "安城更生病院", "pref": "愛知県", "co": ["山本 喜之", "杉浦 記弘", "大島 真歩", "井田 乃恵", "矢島 優里", "藤瀬 萌杏", "永田 篤志"], "cokana": ["ヤマモト ヨシユキ", "スギウラ ノリヒロ", "オオシマ マホ", "イダ ノエ", "ヤジマ ユウリ", "フジセ モア", "ナガタ アツシ"], "chairs": ["佐藤 聖子（藤田医科大学病院）"], "field": "血液", "cat1": "基礎研究（検討）", "cat2": "血液一般", "no": 48, "pdf": "0048.pdf", "chkana": ["サトウ セイコ"], "body": "【はじめに】低 Na血症の患者検体では血漿浸透圧が低下し、XN-9100において赤血球の膨化が不十分な状態でHt値が測定され、MCHCが偽高値を示すことが報告されている。今回、低Na血症患者を対象に、XN-9100によるHt値とミクロヘマトクリット法によるHt値を比較し、低Na血症が測定値に及ぼす影響について検討した。【対象と方法】当院に提出された、患者検体55例を対象とし、血清Na値により①120mmol/L未満（10例）、②121～137mmol/L（15例）、③138～145mmol/L（30例）の3群に分類した。Ht値はXN-9100とミクロヘマトクリット法で測定し、各群における測定法間の比較を行った。（Wilcoxon 符号付順位検定）また、各群の測定法間における Ht 値の差を 3 群間で比較した。（Steel-Dwass検定）【結果】各群において測定方法によるHt 値を比較した結果、①②③群いずれも有意差を認めた（P<0.05）。さらに3群間の測定法間におけるHt値差の比較を行ったところ、①群と③群、②群と③群で有意差を認めた。（P＜0.05）【考察】一般的にミクロヘマトクリット法におけるHt値は、血漿成分の巻き込み（トラップドプラズマ）の影響により、全自動血球分析装置による測定値よりも1～3％程度高値を示すことが知られている。③群は両測定法間の差が 3％以内であったことから、トラップドプラズマによる影響と考えられた。一方で①②群は、ミクロヘマトクリット法のHt値の方が3％以上高値（約10％）のため浸透圧差による影響が大きいと考えられた。また、低Na群（①および②）と正常対照群（③）の比較では、測定法間のHt値の乖離に有意な差を認めたことから、低Na血症に伴う浸透圧低下により、XN-9100で算出されるHt値が低値を示す可能性が示唆された。【結語】今回の検討により、XN-9100でMCHCの偽高値が疑われた場合には、血清検体の Na値を確認することが臨床への適切な結果報告やアドバイスサービスに繋がると考えられた。また、ミクロヘマトクリット法は誤差要因も存在するが、測定試薬の浸透圧の影響を受けずに Ht値を算出することができるため、低Na血症患者におけるHt値の妥当性評価において有用な検証手段であると考えられた。 連絡先：0566-75-2111", "sid": "s11"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "09:48", "et": "09:57", "title": "末梢血液塗抹標本における破砕赤血球の報告が人工血管再置換術の契機になった1症例", "sub": "", "author": "安藤 穂乃実", "akana": "アンドウ ホノミ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["石田 真理子", "坪井 由佳里", "牛丸 明香理", "加藤 洋平", "上野 嘉彦", "岡 有希", "菊地 良介"], "cokana": ["イシダ マリコ", "ツボイ ユカリ", "ウシマル アカリ", "カトウ ヨウヘイ", "ウエノ ヨシヒコ", "オカ アキ", "キクチ リョウスケ"], "chairs": ["佐藤 聖子（藤田医科大学病院）"], "field": "血液", "cat1": "症例", "cat2": "血液一般", "no": 49, "pdf": "0049.pdf", "chkana": ["サトウ セイコ"], "body": "【はじめに】破砕赤血球は、播種性血管内凝固（DIC）や血栓性血小板減少性紫斑病（TTP）、人工弁置換術後などの機械的溶血で認められることが知られている。今回、末梢血液塗抹標本での破砕赤血球確認を契機に、人工血管再置換術につながった1例を経験したので報告する。\n\n【症例】50歳代男性。X年 12月、突然の背部痛を主訴に当院へ救急搬送された。造影CT検査にて上行から腹部大動脈に及ぶ急性大動脈解離を認め、上行弓部大動脈置換術が施行された。術後経過は良好であったが、第12病日にHb 6.8 g/dLと高度貧血を認めた。赤血球輸血後も改善乏しく、当院血液・感染症内科にて原因精査が行われた。\n\n【検査結果】WBC 5.57×10³/μL、RBC 3.16×10⁶/μL、Hb 9.4g/dL(輸血後)、MCV 94.9 fL、PLT 281×10³/μL、Reti 8.78％、AST 52 U/L、LD 1733 U/L。末梢血液塗抹標本にて破砕赤血球を認めた。尿定性検査では蛋白（1+）、潜血（2+）、尿沈渣では赤血球<1 / HPF、尿細管上皮細胞 20-29 / HPF、硝子円柱 100-999 / WF、上皮円柱 30-99 / WFを認めた。\n\n【経過】破砕赤血球の出現より機械的溶血が疑われたが、血小板減少は認めなかった。人工血管置換術後であるため、精査目的として心エコー図検査が施行された。左室駆出率64％と心機能は良好であったが、吻合部人工血管内に乱流を認め、造影CT検査にて、フェルトの翻転による人工血管狭窄が確認された。溶血性貧血進行による多臓器不全が危惧され、第29病日に人工血管再置換術が施行された。\n\n【考察】破砕赤血球はDIC、TTPや人工弁関連溶血で認められることが知られるが、人工血管狭窄による機械的溶血は稀である。本合併症が発生すると重篤な転帰をたどる可能性があり、早期診断が望ましい。今回、末梢血液塗抹標本での破砕赤血球確認を契機に原因検索が行われ、人工血管狭窄の診断および再手術につながった。この経験から、心臓血管手術後に破砕赤血球を認めた際には、生理検査部門と速やかに情報共有を行うことが重要と考えられた。\n\n【結語】心臓血管手術後に破砕赤血球を認めた場合、人工血管狭窄による機械的溶血を念頭に置く必要がある。末梢血液塗抹標本の観察と部門間連携は、早期対応および重篤化回避に有用と考えられた。 (連絡先：058-230-7253)", "sid": "s11"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "09:57", "et": "10:06", "title": "XR-9000搬送接続GR01によるHbA1c検査運用とTAT短縮効果", "sub": "", "author": "織田 花菜", "akana": "オダ カナ", "affil": "株式会社 グッドライフデザイン", "pref": "愛知県", "co": ["水嶋 文乃", "梅田 彩", "下村 美幸", "立松 寛美", "佐藤 文明", "吉森 之恵", "余語 保則"], "cokana": ["ミズシマ フミノ", "ウメダ アヤ", "シモムラ ミユキ", "タテマツ ヒロミ", "サトウ フミアキ", "ヨシモリ ユキエ", "ヨゴ ヤスノリ"], "chairs": ["佐藤 聖子（藤田医科大学病院）"], "field": "血液", "cat1": "試薬・機器", "cat2": "糖", "no": 50, "pdf": "0050.pdf", "chkana": ["サトウ セイコ"], "body": "【はじめに】当施設では2026年2月にHbA1c測定装置及び搬送システムを更新した。その運用と導入効果について報告する。【導入前】HbA1cはEDTA-2K血（NaF加）を測定材料とし、遠心分離後にアークレイ社 ADAMS A1c HA-8182にて血漿血糖と同一搬送ライン上で測定していた。再検時は検査システム上で再検を指示し、検体格納庫から搬送ライン経由で検査機器へ検体を搬送していた。CBCはシスメックス社XR-9000にてEDTA-2K血を測定材料として測定していた。【導入後】XR-9000の末端に東ソー社HLC-723GR01（以下GR01）を接続した。検体はバーコードターミナルBT-50で受付後、CBC測定及び血液塗抹標本作製を実施する。その後検体並び替え装置TS-10にてCBC依頼のみの検体を収納し、HbA1c依頼のある検体は収納せず後続のGR01へ搬送する運用とした。HbA1cの再検の必要性はGR01の測定値及びフラグ情報を基にシステム上で判断し、再検の必要な検体のみTS-10の再検検体ラックに搬出する。QC測定については 1日 2回、Shortモードと Longモードの 2モード実施している。また、GR01のバージョンアップに伴い、測定モードの自動切り替えが実装可能である。\n\n【検討内容】GR01導入前後のHbA1cとCBCのTAT変化（到着～結果報告）、及び運用変更後の課題を分析した。【結果】HbA1cのTATは17分0秒から8分7秒となり8分53秒短縮した。GR01導入前後でCBCのTATに差はなく導入の影響を認めなかった。またTS-10により再検検体が一目瞭然となり、素早い再検が可能となった。GR01のバージョンアップに伴う測定モードの自動切り替えは、検査システムの再構築が必要であること、切り替えの必要な検体が少ないこと、QC試料として設定したラベルについて順次対応予定であることを鑑みて現時点では運用を見送った。\n\n【考察】HbA1c測定前の遠心工程廃止及びTS-10による再検検体の明確化により CBC 運用へ影響することなくHbA1cのTAT短縮を実現した。今後はモード切り替えの自動化に関するさらなる機能改善にも期待したい。連絡先：0565-25-3165", "sid": "s11"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "10:10", "et": "10:19", "title": "APTTクロスミキシングテストにおける各種判定法の診断能についての比較検討", "sub": "", "author": "武村 友貴", "akana": "タケムラ ユウキ", "affil": "公立陶生病院 臨床検査部", "pref": "愛知県", "co": ["竹内 達哉", "鈴木 秀幸", "鈴木 久美子", "梶口 智弘", "中村 美子"], "cokana": ["タケウチ タツヤ", "スズキ ヒデユキ", "スズキ クミコ", "カジグチ トモヒロ", "ナカムラ ヨシコ"], "chairs": ["広瀬 逸子（社会医療法人峰和会 鈴鹿回生病院）"], "field": "血液", "cat1": "基礎研究（検討）", "cat2": "凝固・線溶", "no": 51, "pdf": "0051.pdf", "chkana": ["ヒロセ イツコ"], "body": "【緒言】APTT クロスミキシングテスト（以下,CMT）はAPTT延長症例の鑑別に用いられる検査である。近年,その判定には Rosner index（ICA法）に加え,WaS法,ALD50法,重み付き調和平均を用いた判定方法,など複数の定量指標が報告されている。しかし,これらのCutoff値や有用性は試薬や測定条件に依存するため自施設での検証が必要である。一方,APTT-SP（Werfen）を用いた検討はこれまで報告が少ない。そこで本研究では,APTT-SPを用いたCMTにおいて各判定法の診断能を比較検討した。\n\n【対象と方法】2013年6月から2023年5月に当院でCMTを実施した176例を後方視的に検討した。判定法は波形パターン法,ICA法,ALD50法,重み付き調和平均を用いた判定方法（混和直後：IHMi, 2時間加温：IHMd）とした。対象をLA陽性（LA群）,凝固因子欠乏（FD群）,凝固因子インヒビター（INH群）に分類したが,INH群は1例と少数であったため,主にLA群およびFD群を対象に解析した。群間比較にはMann-Whitney U検定,診断能評価にはROC解析を用いた。\n\n【結果】すべての定量指標において LA群と FD群の間に有意差を認めた（p<0.05）。ROC 解析では,IHMi が最も高い AUC を示し（AUC=0.857）,次いで ICA 法であった（AUC=0.841）。LA検出において IHMiは感度 72.0%,特異度94.7%（Cutoff値:1.02）,ICA法は感度79.2%,特異度84.0%（Cutoff値:11.7）であった。\n\n【考察】ROC解析において,IHMiは最も高いAUCを示し,特に特異度に優れていた。一方,ICA法は感度と特異度のバランスに優れる傾向が認められた。このように各判定法には異なる特性があり,CMTの結果解釈には単一の指標のみで判定するのではなく,波形パターン法,ICA法,およびIHMi等の数値判定法を相補的に組み合わせて評価することがCMTの信頼性向上に寄与する可能性が示唆された。\n\n【結論】APTT-SPを用いた CMTにおいて、各判定法は異なる検出特性を示した。各判定法の特性を理解し,波形パターン法と複数の定量法を併用することは,本検査の信頼性を高める上で有用である。連絡先：0561-82-5101(内線：4111)", "sid": "s15"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "10:19", "et": "10:28", "title": "医原性血胸を契機として診断された後天性血友病Aの1症例", "sub": "", "author": "松尾 そら", "akana": "マツオ ソラ", "affil": "医療法人 豊田会 刈谷豊田総合病院", "pref": "愛知県", "co": ["大嶋 剛史", "伊藤 英史", "佐藤 彩", "藤原 妙", "糠野 珠里"], "cokana": ["オオシマ タケシ", "イトウ エイジ", "サトウ アヤ", "フジワラ タエ", "ヌカノ ジュリ"], "chairs": ["広瀬 逸子（社会医療法人峰和会 鈴鹿回生病院）"], "field": "血液", "cat1": "症例", "cat2": "凝固・線溶", "no": 52, "pdf": "0052.pdf", "chkana": ["ヒロセ イツコ"], "body": "【はじめに】後天性血友病A(acquired hemophilia A：AHA)とは、後天的に凝固第VIII因子に対する自己抗体ができることで重篤な出血症状をきたす疾患である。本症の発症率は人口100万人当たり年間約1.5人であり、稀な疾患と認識されているが、近年増加傾向にある。今回、医原性血胸を契機として後天性血友病Aと診断された症例を経験したので報告する。\n\n【症例】50代女性。既往歴：虫垂炎、高血圧症。前医にて細菌性胸膜炎が疑われ、胸腔穿刺が行われた。その後、肋間動静脈損傷および胸腔内出血による出血性ショックが疑われ、当院に転院搬送・開胸血腫除去術が行われた。\n\n【来院時検査所見】WBC 17.5×103/μL、RBC 3.50×106/μL、Hb 10.4g/dL、Ht 29.4%、PLT 127×103/μL、PT 14.6秒、APTT 56.2秒、FIB 340mg/dL\n\n【経過】術後もAPTT延長を認めたため、精査として各種検査が実施された。クロスミキシング試験はインヒビターパターンであった。第VIII因子インヒビターは2 BU/mLであり、第VIII因子活性が４％と低値であったため、後天性血友病Aと診断された。ステロイド治療が開始され、APTTは著明に改善し（表１）、第VIII因子インヒビターは陰性化、第VIII因子活性も次第に正常化し、退院となった。表1 APTT（秒）の推移0病日目 2病日目 14病日目 19病日目 34病日目（転院 (治療開 (治療開当日） 始5日) 始20日)56.2 74.2 102.5 71.0 38.8\n\n【まとめ】AHAは死亡率が約25%と高く、早期診断・治療が重要である。本症例は、APTT過延長に対し、血友病A・B、抗リン脂質抗体症候群、大量出血後の希釈性凝固障害など様々な病態の可能性が考慮され、速やかに検査が実施されたことが早期診断に繋がった。今回の経験を通じて、APTT延長症例に遭遇した際には、AHAを含めた幅広い鑑別を念頭に置き、必要に応じて追加検査を提案するなど、診療に寄与していきたい。 連絡先: 0566-25-2948", "sid": "s15"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "10:28", "et": "10:37", "title": "凝固波形解析に基づく採血管内凝固検出機能の性能評価", "sub": "", "author": "山口 莉那", "akana": "ヤマグチ リナ", "affil": "国立大学法人 名古屋大学医学部附属病院", "pref": "愛知県", "co": ["城田 紗希", "鷹羽 美穂", "安岐 優伽", "西 圭祐", "田渕 有香", "黒野 浩司", "鈴木 敦夫"], "cokana": ["シロタ サキ", "タカバ ミホ", "アキ ユウカ", "ニシ ケイスケ", "タブチ ユカ", "クロノ ヒロシ", "スズキ アツオ"], "chairs": ["広瀬 逸子（社会医療法人峰和会 鈴鹿回生病院）"], "field": "血液", "cat1": "試薬・機器", "cat2": "凝固・線溶", "no": 53, "pdf": "0053.pdf", "chkana": ["ヒロセ イツコ"], "body": "【背景】凝血学的検査において検体の採血管内凝固は測定結果に大きな影響を及ぼし、時として誤った病態解釈を招く可能性がある。肉眼で視認しうる凝血塊がある場合は測定前に排除できるが、実際には目視による確認のみで全ての採血管内凝固を捉えることはできない。今回、凝固波形解析に基づいて新たに開発された採血管内凝固の検出機能について、その性能評価を行ったので報告する。\n\n【方法】名古屋大学医学部附属病院において採血管内凝固が認められた検体およびその再採血検体計20ペア40検体を対象とした（名古屋大学医学部生命倫理委員会承認：2022-0317）。当該機能を搭載した全自動血液凝固測定装置CN-6000にて、レボヘムPTおよびレボヘムAPTT SLA（いずれもシスメックス社）を用いてPT, APTTを測定し、「採血管内凝固疑い」フラグの出現の有無を確認した。また、採血管内凝固によって変動する分子マーカー（トロンビン・アンチトロンビン複合体：TAT、フィブリンモノマー複合体：FMC）の変化についても検証した。さらに、溶血の影響およびエミシズマブ投与による偽陽性発生頻度についても検証を行った。\n\n【結果】採血管内凝固を認めた20検体のうち、採血管内凝固疑いとしてフラッギングされたものは 17 検体であった。一方、再採血検体でも採血管内凝固フラグが付与された検体は2件認められたが、ほか18検体ではフラッギングされなかった。また、溶血を認めるものの採血管内凝固を認めなかった4検体ではすべてフラグが付与されなかったが、採血管内凝固を認めないエミシズマブ投与患者7検体ではすべて採血管内凝固のフラグが付与され偽陽性となった。\n\n【考察】採血管内凝固検体でフラッギングされなかった3件はいずれもTATおよびFMCの異常高値を認めており、再採血では低値であったため偽陰性と考えられた。採血管内凝固では溶血を伴う場合があるが、今回の検討では、溶血そのものによる偽陽性は認められなかった。本機能は日常業務において採血管内凝固検体を早期に発見するための有用な手がかりとなると考えられた。一方、エミシズマブ投与症例では偽陽性を生じる可能性が示唆され、これは実運用上での注意点となると考えられた。連絡先-0527442588", "sid": "s15"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "10:40", "et": "10:49", "title": "新規第Ⅷ・Ⅸ凝固因子ｷｯﾄ｢ｺｱｸﾞﾋﾟｱ 欠乏血漿FⅧ｣｢ｺｱｸﾞﾋﾟｱ 欠乏血漿FⅨ｣の基礎性能評価", "sub": "", "author": "仲上 祐也", "akana": "ナカガミ ユウヤ", "affil": "愛知医科大学病院", "pref": "愛知県", "co": ["坂野 容菜", "榎本 めぐみ", "塚本 実奈子", "小川 実加", "中山 享之"], "cokana": ["バンノ ヒロナ", "エノモト メグミ", "ツカモト ミナコ", "オガワ ミカ", "ナカヤマ タカユキ"], "chairs": ["山﨑 啓介（磐田市立総合病院）"], "field": "血液", "cat1": "試薬・機器", "cat2": "凝固・線溶", "no": 54, "pdf": "0054.pdf", "chkana": ["ヤマザキ ケイスケ"], "body": "【目的】第Ⅷ凝固因子(以下、FⅧ）、第Ⅸ凝固因子(以下、FⅨ)測定は、血友病の診断や凝固因子補充療法のモニタリングとして有用である。今回、積水メディカル株式会社の新規第Ⅷ凝固因子キット｢コアグピア 欠乏血漿 FⅧ｣と第Ⅸ凝固因子キット｢コアグピア 欠乏血漿 FⅨ｣について、基礎性能評価の機会を得たので報告する。\n\n【方法】血液凝固自動分析装置CP3000、コアグピア用コントロールP-N(F)Ⅰ･Ⅱ(以下、CPⅠ･CPⅡ)、コアグピアAPTT-NAPTT試薬、塩化カルシウム液((株)積水メディカル）と患者血漿を用い1)併行精度、2)日内再現性、3)オンボード安定性、4)相関性について検討した。対照欠乏血漿として、現行キット(トロンボチェック血液凝固第Ⅷ･Ⅸ因子定量キット((株)シスメックス))を使用した。\n\n【結果】1)併行精度:CPⅠ･CPⅡを 10回連続測定した結果、CVはFⅧ:CPⅠ 2.09％、CPⅡ 2.13％、FⅨ:CPⅠ 1.32％、CPⅡ1.88％であった。2)日内再現性:調整後冷蔵保管した欠乏血漿を用い、調整直後と 4 時間後、調整直後と 8 時間後のCPⅠ･CPⅡ測定値でCVを算出した結果、4時間後FⅧ:CPⅠ0.00％、CPⅡ 1.33％、FⅨ:CPⅠ 0.67％、CPⅡ 0.57％、8時間後 FⅧ:CPⅠ 1.17％、CPⅡ 0.44％、FⅨ:CPⅠ 0.67％、CPⅡ0.00％であった。3)オンボード安定性:調整後装置内(室温)で保管した欠乏血漿を用い、調整直後と4時間後、調整直後と8時間後のCPⅠ･CPⅡ測定値でCVを算出した結果、4時間後FⅧ:CPⅠ 5.26％、CPⅡ 2.21％、FⅨ:CPⅠ 9.89％、CPⅡ7.82％、8時間後FⅧでCPⅠ 16.98％、CPⅡ 11.62％、FⅨ:CPⅠ26.36％、CPⅡ 27.05％であった。4)相関性:患者血漿30件にて相関性を確認した結果、FⅧは回帰式y=1.15x-7.64、相関係数r=0.99、FⅨはy=0.98x+10.50、r=0.97であった。\n\n【考察・結論】検討キットの基礎性能は概ね良好であり、測定時以外は冷蔵保存が必要と考えられた。相関性の検討においてFⅧの低濃度領域で低値傾向が見られたが、検討キットは標準物質の低値域での設定ポイントが多く、より精度よく測定できたものと考えられた。FⅨの加算誤差は標準物質の違いも一因であると推察されるため、院内導入の際は注意が必要と考えられた。連絡先：0561-62-3311", "sid": "s19"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "10:49", "et": "10:58", "title": "CS-5100におけるナノピアP-FDPとナノピアDダイマーの基礎検討及びTATの比較", "sub": "", "author": "鳥谷 周平", "akana": "トヤ シュウヘイ", "affil": "掛川市袋井市病院企業団 中東遠総合医療センター", "pref": "静岡県", "co": ["大塚 美和", "髙坂 仁美", "平山 すみれ", "村松 すみれ", "尻無濵 真子", "大石 藍", "山下 紗奈"], "cokana": ["オオツカ ミワ", "コウサカ ヒトミ", "ヒラヤマ スミレ", "ムラマツ スミレ", "シナシハマ マコ", "オオイシ アイ", "ヤマシタ サナ"], "chairs": ["山﨑 啓介（磐田市立総合病院）"], "field": "血液", "cat1": "基礎研究（検討）", "cat2": "凝固・線溶", "no": 55, "pdf": "0055.pdf", "chkana": ["ヤマザキ ケイスケ"], "body": "[はじめに] FDP・Dダイマーは播種性血管内凝固や静脈血栓症の診断、および凝固・線溶亢進状態を知るマーカーとして用いられている。今回、積水メディカルのFDP とDダイマーの試薬検討、およびターンアラウンドタイム（TAT）測定を行ったので報告する。[対象および方法]測定機器はSysmexのCS-5100を使い、検討試薬は積水メディカルのナノピアP-FDPとナノピアDダイマーを用いた。従来試薬はSysmexのリアスオートP-FDPとリアスオートDダイマーネオである。使用した検体は検査依頼があり研究の同意を得られた外来患者と入院患者の3.2%クエン酸ナトリウム加静脈血漿を用いた。[結果]併行精度は精度管理用試料2濃度を用い10回測定し、FDPはCV1.11～1.40%、 DダイマーはCV0.00～1.04%であった。日差再現性は精度管理試料2濃度を26日間2重測定し、FDPはCV3.82～3.92%、DダイマーはCV2.95～3.70%であった。希釈直線性は高値試料を段階希釈し、添付文書記載の測定上限である FDP:120μg/mL,DD:60μg/mL まで期待値に対する相対比が100±15%であることを確認した。従来試薬との相関は FDPでy=0.8546x+0.04, r=0.9805, Dダイマーでy=0.5983x+0.47, r=0.9839であった。FDPを5検体測定したときのTATは検討試薬で442秒、従来試薬で588秒であり、Dダイマーを10検体測定したときのTATは検討試薬で472秒、従来試薬で677秒であった。また同条件で、積水メディカルの CP3000αにて検討試薬を測定した TATは、FDPは531秒、Dダイマーは560秒であった。[結論] CS-5100におけるナノピアP-FDPとナノピアDダイマーの基礎検討結果は良好であり、従来試薬に比べTATが短縮された。また、異なる機器で測定したときにTATの違いがみられ、CS-5100で検討試薬を使用した場合はより迅速な結果報告ができることが期待された。掛川市袋井市病院企業団 中東遠総合医療センター0537-21-5555検体検査室(内線番号:22218)", "sid": "s19"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "10:58", "et": "11:07", "title": "APTT試薬のリン脂質濃度が測定結果に与える影響について", "sub": "", "author": "大家 純奈", "akana": "オオイエ ジュンナ", "affil": "", "pref": "愛知県", "co": ["佐藤 聖子", "安藤 紗緒里", "磯貝 奈美", "横井 浩幸", "星 雅人"], "cokana": ["サトウ セイコ", "アンドウ サオリ", "イソガイ ナミ", "ヨコイ ヒロユキ", "ホシ マサト"], "chairs": ["山﨑 啓介（磐田市立総合病院）"], "field": "血液", "cat1": "試薬・機器", "cat2": "凝固・線溶", "no": 56, "pdf": "0056.pdf", "chkana": ["ヤマザキ ケイスケ"], "body": "【背景】活性化部分トロンボプラスチン時間（APTT）は内因系凝固因子の異常を評価するスクリーニング検査として広く利用されている。一方、各社のAPTT試薬は主原料であるリン脂質の由来や活性化剤の種類が異なることに起因して凝固異常症への感受性が大きく異なることが知られている。特にループスアンチコアグラント（LA）はリン脂質依存性の凝固阻害因子であり、試薬中リン脂質濃度との関連が深いと考えられる。また、炎症マーカーである CRPはAPTTに影響を及ぼす可能性があり、検査結果における解釈を難しくする一因となり得る。本研究では、APTT試薬のリン脂質濃度に着目し、凝固時間、LA感受性およびCRP 高値検体における測定値への影響について検討を行った。\n\n【方法】コアグジェネシス APTT(PHC株式会社)をベースとし、活性化剤濃度一定の条件下で、リン脂質濃度のみを変化させた4種類（対標準比×2.0、×1.0、×0.6、×0.3）の試薬を調製した。測定は全自動血液凝固測定装置 STACIACN10(PHC 株式会社)を用いて実施した。検討項目として、以下の内容を実施した。①リン脂質濃度と凝固時間の関係（正常及び異常コントロール血漿と正常検体）②併行精度（正常及び異常コントロール血漿）③LA感受性（市販LAコントロール血漿及びLA陽性検体）④CRP高値検体を用いた相関性評価（CRP高値36検体）\n\n【結果・考察】リン脂質濃度と凝固時間の関係では、正常域では、リン脂質濃度を増減させると凝固時間は軽微に延長傾向が得られた。異常域では、リン脂質濃度の低下に伴いAPTTは延長傾向を示した。併行精度は全ての試薬で良好であった。LA 検体では、リン脂質濃度の低下に伴いAPTTは顕著に延長し、低リン脂質試薬ほど LAに対する感受性が高い結果となった。CRP高値検体では、リン脂質濃度が低い試薬で一部APTT延長が認められ、試薬間の相関係数は低下する傾向を示したが、CRP濃度とAPTTの間に明確な関連は認められなかった。以上より、APTT試薬のリン脂質濃度はLA検出感度に強く影響することが分かった。CRP高値検体については、今後、臨床検体数を増やしたさらなる評価が必要である。（0562-93-2307）", "sid": "s19"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "13:40", "et": "13:49", "title": "当院で経験した遺伝性乳癌、父子で乳癌を発症した1症例", "sub": "", "author": "稲垣 裕介", "akana": "イナガキ ユウスケ", "affil": "公立西知多総合病院", "pref": "愛知県", "co": ["磯貝 柚夏", "大嶋 楓", "早川 真紀子", "角屋 雅路", "吉本 尚子"], "cokana": ["イソガイ ユウカ", "オオシマ カエデ", "ハヤカワ マキコ", "カドヤ マサジ", "ヨシモト ナオコ"], "chairs": ["佐藤 龍哉（学校法人順天堂 順天堂大学医学部附属静岡病院）"], "field": "病理", "cat1": "症例", "cat2": "その他の病理", "no": 57, "pdf": "0057.pdf", "chkana": ["サトウ リュウヤ"], "body": "【はじめに】乳がんは全体の約 10％前後が遺伝性によるものと考えられ、遺伝の多くにはBRCA1遺伝子またはBRCA2遺伝子が関与していると考えられている。BRCA遺伝子が関与する乳がんはHBOC（遺伝性乳がん卵巣がん）と呼ばれており、当院で実施したBRCA遺伝子検査425名（2019年6月～）のうち25名（陽性率約5.9％）がBRCA遺伝子陽性であった。今回、父子ともに乳癌を罹患し、どちらもBRCA遺伝子陽性であった男性乳癌の1症例を経験したので報告する。\n\n【症例】症例は40歳代男性（息子）。2023年5月に左胸のしこりに気づき当院乳腺外科を受診。精査の結果、両側乳癌であり、全乳腺切除術が施行された。両側ともに病理組織診断はInvasive ductal carcinomaであった。ホルモンレセプターについては両側ER,PgR陽性、HER2陰性（FISH実施）であり、左側についてはリンパ節転移も認められた。80歳代男性（父）は2026年3月、子息の術後約3年後に右胸のしこりに気づき、当院乳腺外科を受診。精査の結果 Invasiveductal carcinomaであった。ホルモンレセプターについてはER、PgR陽性、HER2陰性（FISH実施）であった。\n\n【結果】BRCA遺伝子検査の結果、父子ともに BRCA2遺伝子に変異が認められた。そのなかでもバリアントは両者ともにc.9117G>A(p.Pro3039Pro)の変異と一致しており、遺伝性乳癌であることがうかがえた。現在までに高リスク群に該当する膵癌や前立腺癌、皮膚がんの兆候は認められず、父子ともに継続してフォローされている。\n\n【まとめ】今回、BRCA遺伝子変異による男性の遺伝性乳がんを経験した。短期間に親子で罹患する症例、特に男性乳癌については初めて経験しBRCA遺伝子の重要性を改めて認識する機会となった。公立西知多総合病院 臨床検査科 病理検査室0562-33-5500（代表）", "sid": "s73"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "13:49", "et": "13:58", "title": "子宮内膜FFPE検体を用いたPCR検査により診断確定に至った結核性子宮内膜炎の一例", "sub": "", "author": "大澤 明弘", "akana": "オオサワ アキヒロ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["平野 康智"], "cokana": ["ヒラノ ヤストモ"], "chairs": ["佐藤 龍哉（学校法人順天堂 順天堂大学医学部附属静岡病院）"], "field": "病理", "cat1": "遺伝子検査", "cat2": "その他の病理", "no": 58, "pdf": "0058.pdf", "chkana": ["サトウ リュウヤ"], "body": "不妊症や習慣性流産の原因として、結核性子宮内膜炎は稀ではあるものの鑑別すべき疾患の一つである。子宮内膜FFPE検体を用いたPCR検査により診断確定に至った結核性子宮内膜炎の一例について報告する。32 歳、女性。X-２年、感冒を契機に左胸水を指摘され、当院呼吸器内科を受診。T-SPOT陽性、非結核性抗酸菌抗体(MAC)陽性のため、肺結核を疑い、抗酸菌連続三回喀痰試験（三連痰）を予定するも、喀痰採取困難で中止。肺炎随伴胸水、膿胸への治療により、症状の改善が認められたため、無治療経過観察とした。X年、高度生殖補助医療(ART)で妊娠成立し、近医で定期健診を受けていた。妊娠12週、性器出血と子宮頚管長の短縮を認め、当院産婦人科紹介受診。切迫流産の診断で緊急入院となった。妊娠16週、胎盤辺縁に血腫の形成を認め、性器出血および子宮収縮の増加を認めることから、妊娠継続困難と判断され、妊娠17週、流産となった。産後3か月、慢性子宮内膜炎の評価目的に子宮内膜組織診を実施した。組織学的に、高度の炎症細胞浸潤とともに、多核巨細胞を含む類上皮肉芽腫の形成を認めるものの、この時点では、Ziehl-Neelsen染色で抗酸菌を確認できなかった。既往歴と病理組織学的所見から、結核性子宮内膜炎の可能性を考慮し、FFPE 検体にて PCR 検査を行った。Mycobacterium tuberculosisと一致する塩基配列を認め、結核菌による子宮内膜炎の可能性が高いと考えられた。PCR検査結果を受け、再度標本の確認を行ったところ、数個の抗酸菌を認めたことより、結核性子宮内膜炎の診断が確定した。結核性子宮内膜炎は稀な疾患であり、検査前には、結核の関与を強くは疑っていなかったため、細菌学的検査は未実施であった。病理組織検索において、抗酸菌染色のみでは感度が低く、また菌種同定が困難である。このような症例では、FFPE検体を用いた PCR検査が M. tuberculosisの診断に有用である。岐阜県総合医療センター 病理部058-246-1111（内線7819）", "sid": "s73"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "13:58", "et": "14:07", "title": "病理検査室における録画システムによる医療安全の取り組み", "sub": "", "author": "髙橋 羽菜", "akana": "タカハシ ハナ", "affil": "社会福祉法人聖隷福祉事業団 総合病院 聖隷三方原病院", "pref": "静岡県", "co": ["小泉 崚", "福田 淳"], "cokana": ["コイズミ リョウ", "フクダ アツシ"], "chairs": ["佐藤 龍哉（学校法人順天堂 順天堂大学医学部附属静岡病院）"], "field": "病理", "cat1": "その他", "cat2": "その他の病理", "no": 59, "pdf": "0059.pdf", "chkana": ["サトウ リュウヤ"], "body": "【はじめに】病理組織検査は、患者より採取した組織を標本化し確定診断を行う重要な検査である。しかし、標本作製工程には手作業が多く含まれており、ヒューマンエラーによる検体取り違えや処理過程での確認不足が診断精度に影響を及ぼす危険性がある。当院では2021年より、切出し作業時にデジタルカメラを用いてカセット投入前の検体状態を静止画として記録していたが、さらなる医療安全およびトレーサビリティ向上を目的として、2023年に動画記録カメラシステムを導入した。今回、録画システム導入後の運用面および医療安全面での有用性について報告する。\n\n【導入機器】㈱常光製動画記録カメラシステムを導入した。本システムは撮影用カメラ、記録用ハードディスクおよびモニターで構成される。\n\n【方法】撮影用カメラを病理医による切出しエリア、技師による切出し介助エリア、細胞診検体処理エリアに各1台設置し、作業全体が確認可能となるよう配置した。また、切出し介助エリアには依頼箋内容を確認可能とするため追加で1台設置した。映像はモニター上でリアルタイムおよび過去記録の確認が可能であり、録画データは約3か月間保存される設定とした。録画時間は、病理医切出しエリアおよび細胞診検体処理エリアを8時30分から19時まで、切出し介助エリアを8時30分から23時までとした。\n\n【結果・まとめ】録画システム導入により、検体処理過程における作業状況の即時確認が可能となり、問題発生時の原因検索および状況把握を迅速に行うことができた。また、切出し以降の工程で確認事項が生じた際にも、録画映像を用いることで検体取り扱い状況の追跡が可能となり、トレーサビリティが大幅に向上した。さらに、作業工程の可視化によりスタッフ間での確認意識が向上し、検体取り違え防止に対する安全管理体制の強化につながった。聖隷三方原病院－053-436-1251（内線3550）", "sid": "s73"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "14:10", "et": "14:19", "title": "当院における子宮内膜細胞診でATEC-Aと判定した症例の後方視的検討", "sub": "", "author": "村瀬 華", "akana": "ムラセ ハナ", "affil": "藤田医科大学ばんたね病院 病理部", "pref": "愛知県", "co": ["川島 佳晃", "中嶋 綾香", "岡部 麻子", "浦野 誠"], "cokana": ["カワシマ ヨシアキ", "ナカジマ アヤカ", "オカベ アサコ", "ウラノ マコト"], "chairs": ["片桐 恭雄（岐阜大学医学部附属病院）"], "field": "細胞", "cat1": "基礎研究（検討）", "cat2": "細胞検査", "no": 60, "pdf": "0060.pdf", "chkana": ["カタギリ ヤスオ"], "body": "【はじめに】子宮内膜細胞診の判定は、従来より3段階分類(陰性・疑陽性・陽性)が広く使用されているが、当院では2020年11月から記述式内膜細胞診報告様式を導入した。今回、細胞 診 で Atypical endometrial cells, cannot exclude atypicalendometrial hyperplasia or more (3段階分類で疑陽性相当、以下 ATEC-A)と判定した症例に関して後方視的に検討し、診断精度の評価を行った。\n\n【対象】2020年11月から2025年12月までにATEC-Aと判定した症例のうち、組織診で確定診断されている35症例を対象とした。\n\n【方法】細胞診で ATEC-A と判定した後に実施された組織診断(生検・手術)を抽出した。また、ATEC-Aと判定した症例を細胞検査士3名で再鏡検し、判定の妥当性について検討した。\n\n【結果】ATEC-Aと判定した症例の組織診断は良性 19例(54.3%)、良悪性境界病変4例(11.4%)、悪性12例(34.3%)であった。良性症例の内訳は正常内膜が 16例、子宮内膜腺間質破綻が1例、子宮留膿腫が1例、不規則増殖内膜が1例であった。良悪性境界病変症例の内訳は子宮内膜異型増殖症が4例であった。悪性の内訳は類内膜癌11例、子宮頸部扁平上皮癌の浸潤が1例であった。また、再鏡検をした結果、3例がAtypical endometrial cells, ofundetermined significance （3 段階分類で疑陽性相当、ATEC-US)、3例が悪性相当と考えられた。\n\n【考察】ATEC-Aは子宮内膜異型増殖症以上を除外できない場合に用いる判定である。当院では ATEC-A と判定した症例の45.7%がその後の組織診で良悪性境界病変以上であった。組織診が良性であった症例をATEC-Aと判定した要因としては、炎症、薬物治療、ホルモン環境異常に伴う化生性変化などの細胞を過剰判定していたことが考えられる。今後も継続的に細胞診と組織診の結果を比較検討し、診断精度向上に努めていきたい。 連絡先:052-323-5665", "sid": "s77"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "14:19", "et": "14:28", "title": "当院における乳腺VAB検体の固定後ホルマリン液を用いた細胞診の教育への活用", "sub": "", "author": "末武 祐介", "akana": "スエタケ ユウスケ", "affil": "高山赤十字病院", "pref": "岐阜県", "co": ["池尾 玲那", "道下 博史"], "cokana": ["イケオ レイナ", "ミチシタ ヒロフミ"], "chairs": ["片桐 恭雄（岐阜大学医学部附属病院）"], "field": "細胞", "cat1": "基礎研究（検討）", "cat2": "細胞検査", "no": 61, "pdf": "0061.pdf", "chkana": ["カタギリ ヤスオ"], "body": "【はじめに】全国的に乳腺穿刺吸引細胞診の減少により日常業務の中で乳腺細胞診の標本を鏡検する機会が減少している。当院においても穿刺吸引細胞診からコア針生検、吸引式乳房組織生検（以下、VAB）に置き換わり、乳腺の症例を鏡検する機会が減少している。そこで、VABの固定後の残検体が細胞診の教育に有用であるか検討を行ったので報告する。\n\n【対象】2025年12月～2026年5月までに当院で行われた乳腺VAB検体23例。内訳は非腫瘍性病変3例、腫瘍性病変20例（良性腫瘍3例、悪性腫瘍17例）。\n\n【方法】乳腺VAB検体固定後の10％中性緩衝ホルマリン液を材料とした。VAB検体を取り出した後の固定容器から残ホルマリン液 10ml を 2 本分注し、片方を①、他方を2000rpm5分遠心し上清除去後にBDサイトリッチレッド保存液を混和した浮遊液を②とし、それぞれLBC標本（BDSurePath法）を作製した。①②の細胞像を比較、またそれぞれ細胞所見を観察し、検体の適否、良悪性の判定を行い、組織診断と比較した。\n\n【結果】①②ともにホルマリン固定の影響を受けていたが①はより顕著で、核の詳細な観察が困難な症例もあった。また②は溶血により背景の観察が容易で細胞量も多く全体的に観察に優れていた。非腫瘍性病変の3例、良性腫瘍の2例、悪性腫瘍の11例は細胞量が多く良悪鑑別の判定が可能であり、組織診の良悪性の診断と一致した。一方、残りの7例は細胞量が少なく良悪の判定は困難であった。\n\n【考察および結語】今回の検討により、乳腺 VAB検体の残液でもサイトリッチレッド液により背景が浄化され細胞像が明瞭となり、良悪性の鑑別が可能であることが示された。一方で、ホルマリン固定の影響のため通常の乳腺細胞診標本とは異なる視点での観察が必要と考えられた。また病理医からは組織標本完成前に細胞像を確認できることから、免疫染色実施の判断に有用であるとの意見が得られた。乳腺細胞診症例が減少する中、本手法は教育資源として有用である可能性があり、今後さらに症例を蓄積して検討を継続したい。連絡先0577-32-1111（内線3254）", "sid": "s77"}, {"kind": "一般演題", "day": 2, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "14:28", "et": "14:37", "title": "甲状腺低分化癌の細胞形態的検討", "sub": "", "author": "石井 辰弥", "akana": "イシイ タツヤ", "affil": "大垣市民病院", "pref": "岐阜県", "co": ["児玉 千里", "疋田 朝美", "山本 光", "羽田 萌香", "加藤 莉奈", "北條 亮祐", "立川 悠太"], "cokana": ["コダマ チサト", "ヒキダ アサミ", "ヤマモト ヒカル", "ハダ モエカ", "カトウ リナ", "ホウジョウ リョウスケ", "タチカワ ユウタ"], "chairs": ["片桐 恭雄（岐阜大学医学部附属病院）"], "field": "細胞", "cat1": "基礎研究（検討）", "cat2": "細胞検査", "no": 62, "pdf": "0062.pdf", "chkana": ["カタギリ ヤスオ"], "body": "【はじめに】甲状腺低分化癌(Poorly differentiated thyroid carcinoma:PDTC)お よ び 甲 状 腺 未 分 化 癌 (thyroid undifferentiatedcarcinoma:TUC)は、乳頭癌や濾胞癌などの高分化癌と比べ急速な増大と転移を示す予後不良な腫瘍である。国内外の研究によってその細胞形態的特徴や他腫瘍との鑑別点が明らかになってきているが、細胞診での術前診断は難易度が高いとされている。今回、当院で組織学的に診断されたPDTCおよびTUCについて細胞形態的に組織型推定につながる所見の検討を行ったため報告する。\n\n【対象および方法】当院にて2015年から2025年の10年間で病理組織検査にて PDTC または TUC と診断された症例の中で、術前に甲状腺穿刺吸引細胞診が実施されていた 10症例を対象とした。染色標本を再鏡検し、①背景(壊死、コロイドの有無)、②出現パターン(STIパターン、濾胞構造、乳頭様構造)、③核所見(クロマチンパターン、核溝、核内細胞質封入体、核小体)、④異常核分裂像の有無について比較検討した。\n\n【結果】検討対象とした症例を特徴ごとに大別すると、3症例には顕著な核異型を示す異型細胞が認められ、背景の壊死や核分裂像の所見とともに、TUCを示唆する所見がみられた。3症例は乳頭癌に特徴的な所見がみられたが、PDTCを示唆する所見はみられなかった。2症例は集塊構造や核所見に高分化癌を示唆する所見がみられたが、一部のクロマチンや出現パターンにPDTCを示唆する所見がみられた。1症例は壊死性背景と少数の異型細胞がみられ、1症例は細胞成分過少のため検体不適正だった。\n\n【考察】TUC は細胞異型が顕著であるため高悪性度癌を推定することは難しくないが、PDTCについては乳頭癌などの高分化成分と同時に観察されるケースが少なくないため、低分化成分を示唆する所見を注意深く観察することが必要である。\n\n【連絡先】大垣市民病医院 病理細胞診室 0584-81-3341(内線1281)", "sid": "s77"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:00", "et": "11:09", "title": "ISO認定取得を契機としたマッソン・トリクローム染色における劇物削減と手順の標準化", "sub": "", "author": "栗本 幸奈", "akana": "クリモト ユキナ", "affil": "社会医療法人 蘇西厚生会 松波総合病院", "pref": "岐阜県", "co": ["藏辻 賢", "渡邊 望愛", "小澤 香那", "吉田 怜花", "栗本 真由美", "大野 あけみ", "丹羽 莉子"], "cokana": ["クラツジ ケン", "ワタナベ ノア", "コザワ カナ", "ヨシダ レイカ", "クリモト マユミ", "オオノ アケミ", "ニワ リコ"], "chairs": ["清水 雅彦（富山県立中央病院）"], "field": "病理", "cat1": "基礎研究（検討）", "cat2": "病理組織検査全般", "no": 63, "pdf": "0063.pdf", "chkana": ["シミズ マサヒコ"], "body": "マッソン・トリクローム（MT）染色は組織部位を3つの色で染め分ける染色で、様々な疾患の繊維化の観察など組織検査において比較的利用頻度の多い染色である。当院の現行手順では、第1・第2媒染剤に劇物（重クロム酸カリウム、ピクリン酸等）を使用していたが、出典や参考文献が不明確で根拠に乏しく、安全性と標準化の面で課題があった。今回、ISO認定取得を機に、劇物の削減による安全性向上と、根拠ある標準手順への移行を目的に検討を行ったので報告する。方法として、ホルマリン固定組織2例（剖検検体；正常肝臓・正常腎臓）を用い、現行手順と劇物を代替した新手順を実施し、染色性を比較した。新手順は『染色法のすべて（医歯薬出版）』に基づき、第 2媒染剤をピクリン酸アルコールから2.5％リンタングステン酸（PTA）水溶液および 2.5％リンモリブデン酸（PMA）水溶液の等量混合液に変更した。その他、現行手順と乖離のある手順に関しても文献に基づく手順に変更した。染色性の評価は、細胞質（赤色）と膠原線維（青色）のコントラストが良好かどうかを基準とした。結果、全症例において、新手順は現行手順と同等以上の染色性を示し、診断に寄与する十分な品質が得られた。以上により、新手順への移行は、劇物が削減され安全性が向上し、根拠が不明確な手順から文献に基づいた標準手順となることで、信頼性の高い検査体制の構築につながったと考えられる。ISO認定取得は、安全管理や長年慣習化していた不安定要素の多い手順を見直す貴重な契機となり、全ての劇物を代替するには至らなかったものの、本検討は極めて有意義な結果を得られた。今後は、代替に至らなかった劇物についての検討を継続することに加え、他の特殊染色工程においても同様の検証を行い、より安全で標準化された作業環境の構築を目指したい。松波総合病院 中央検査室 栗本幸奈058-388-0111（内線：3150）y.kurimoto9@gmail.com", "sid": "s62"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:09", "et": "11:18", "title": "当院での術中迅速病理組織標本作製におけるタスクシフトの取り組みと成果", "sub": "", "author": "瀬嵜 翔太", "akana": "セザキ ショウタ", "affil": "聖隷浜松病院", "pref": "静岡県", "co": ["石田 悠希", "水野 章吾", "加藤 好洋", "宮崎 恵子", "直田 健太郎"], "cokana": ["イシダ ユウキ", "ミズノ ショウゴ", "カトウ ヨシヒロ", "ミヤザキ ケイコ", "ナオダ ケンタロウ"], "chairs": ["清水 雅彦（富山県立中央病院）"], "field": "病理", "cat1": "管理・教育", "cat2": "病理組織検査全般", "no": 64, "pdf": "0064.pdf", "chkana": ["シミズ マサヒコ"], "body": "【背景】働き方改革を背景に、当院病理検査室では病理医から臨床検査技師へのタスクシフトを推進している。当院では常勤病理医1名で年間約14,000件の組織診断と約500件の術中迅速組織診断に対応しており、業務負担の軽減が課題となっている。その対策として、組織診の切り出しにおけるタスクシフトは2021年より実施しており、更なる負担軽減策として、術中迅速組織標本作製における切り出しのタスクシフトの実践とその運用体制を構築したので報告する。\n\n【方法】2024年4月より、術中迅速組織標本作製における切り出しのタスクシフト導入を開始した。導入にあたり標準マニュアルを作成し、解剖学的知識や切り出しに関する問題演習を行うことで、各スタッフの知識向上を図った。さらに、病理医および認定病理検査技師が連携し、スタッフへ教育・指導を行った。対象は迅速件数の多いセンチネルリンパ節、脳腫瘍、婦人科腫瘍（子宮体癌、卵巣腫瘍など）を中心に進めた。また半年ごとに症例の見直しを行い、切り出し内容および診断結果のフィードバックを通じてスタッフの知識定着を実施した。\n\n【結果】従来は迅速検体到着後、病理医へ連絡し、切出対応のための到着を待機していたが、本取り組みにより技師主体で迅速に切り出しを開始できる体制を確立した。これにより、病理医は他業務を中断することなく、術中迅速組織診断に専念でき、業務負担の軽減に寄与した。タスクシフト実施率は2024年度303件/508件（59.6％）、2025年度は 347件/522件（66.4％）であった。品質面では、センチネルリンパ節において凍結標本と永久標本の診断一致率は、導入前が97.9％、導入後は98.1％であり、導入前後で診断一致率に大きな差は認められなかった。脳腫瘍や婦人科腫瘍に関しても、診断上重大な不一致例は認めなかった。\n\n【総括】技師主体の体制を構築したことで、術中迅速組織標本作製における切り出しタスクシフト運用が可能となった。今後は現在の品質を保ちつつ対象検体を拡大し、更なる病理医業務負担の軽減に努めたい。聖隷浜松病院 臨床検査部 連絡先053-474-5875", "sid": "s62"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:18", "et": "11:27", "title": "レーザーカセット印刷装置を用いた印刷面の耐久性についての検討", "sub": "レーザー方式の異なる２機種（C100 ・ MCP-L1）の検討", "author": "堀 有輝", "akana": "ホリ ユウキ", "affil": "株式会社 中部パソロジー", "pref": "岐阜県", "co": ["中本 菜乃葉", "宮本 有理", "青木 亮吾", "大鹿 均"], "cokana": ["ナカモト ナノハ", "ミヤモト ユリ", "アオキ リョウゴ", "オオシカ ヒトシ"], "chairs": ["清水 雅彦（富山県立中央病院）"], "field": "病理", "cat1": "試薬・機器", "cat2": "病理組織検査全般", "no": 65, "pdf": "0065.pdf", "chkana": ["シミズ マサヒコ"], "body": "【はじめに】当施設では2025年1月にDAKEWE社製レーザーカセット印刷装置（C100）を導入した。前回の中部圏支部学会では、酸性脱灰液が同機の印字面に与える影響を報告し、レーザー用カセットで印字が薄くなるものの実業務への支障はないことを示した。しかし、他施設より経時的な退色による判別困難の懸念が挙げられたため、今回は光曝露による経年劣化の影響を追加検証したので報告する。\n\n【方法】対象はアジア器材製カセット 3 種（標準タイプであるSakuraオートライト用、およびレーザー印字機用の旧・新ロット）とした。印字装置は当施設のC100、および比較として MCP-L1（松波硝子：岐阜市民病院にて印字）を用いた。試料は未処理群（B群）と、前回退色がみられたカルキトックス（和光純薬）に48時間浸漬した脱灰処理群（A群）を用意した。各群を0週（対照：室内保管）から5週までの時系列に分け、1〜5週群は直射日光の当たる屋外軒下に静置した。この環境は5月の岐阜県のUVインデックス8（屋外直達日照：約100 W/㎡）を基準とし、室内環境（1 W/㎡未満）における経年変化の加速曝露試験と位置付けた。各設定週においてカセットを回収し、肉眼評価および二次元バーコード読み取りによる実用性評価を行った。\n\n【結果】開始1週目より標準カセットを除くカセットにおいて退色が認められ、2週経過時点で退色の進行はほぼ停止した。なお、いずれの条件および期間においても、二次元バーコードの読み取り精度は維持された。\n\n【まとめ】本検討において、標準カセットへの影響は認められなかった。レーザー用カセットでは、含有する発色剤が脱灰液や紫外線等の自然光による還元作用を受け退色する。しかし、実運用では印字後速やかに光の影響を受けない暗所へ保管されるため、今回検討した印刷装置やカセットについては、脱灰直後に印字判別が可能であれば、長期的な実業務に支障をきたす可能性は極めて低いと推測される。株式会社中部パソロジー 058-201-1750", "sid": "s62"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:27", "et": "11:36", "title": "新病理システムにおける検体照合機能導入の有効性の検討", "sub": "", "author": "河嵜 優菜", "akana": "カワサキ ユウナ", "affil": "岐阜市民病院", "pref": "岐阜県", "co": ["青木 亮吾", "成瀨 諒太", "伊藤 里紗", "丹羽 理代子", "後藤 美香"], "cokana": ["アオキ リョウゴ", "ナルセ リョウタ", "イトウ リサ", "ニワ リヨコ", "ゴトウ ミカ"], "chairs": ["清水 雅彦（富山県立中央病院）"], "field": "病理", "cat1": "システム化", "cat2": "病理組織検査全般", "no": 66, "pdf": "0066.pdf", "chkana": ["シミズ マサヒコ"], "body": "【背景】病理検査における検体取り違えは、診断結果に影響を及ぼす可能性があり、医療安全上重要な課題である。病理検査では複数の工程を経て標本が作製されるため、検体・ブロック・スライドの識別操作が多く、ヒューマンエラーが発生し易い。当施設では2024年に新病理システムを導入し、受付・切り出し・薄切工程におけるバーコードを用いた検体照合機能の有効性を検討した。\n\n【方法】検体照合機能導入前10年間(2014年~2023年)及び導入後 2年間(2024年~2025年)に発生したインシデントを後ろ向きに集計し、導入の有効性を評価した。対象は当院病理部門におけるインシデント報告とし、①受付②切り出し③包埋④薄切⑤提出の5工程におけるインシデント件数及び、この5工程を検体照合機能導入の有無で分類した時のインシデント件数を比較した。\n\n【結果】検体照合機能導入前後のインシデント件数を比較すると、①受付:2 件から 0 件、②切り出し:2 件から 0 件、③包埋:3件から0件、④薄切:2件から0件、⑤提出:2件から1件であった。照合機能を導入した①受付②切り出し④薄切では、インシデントが無くなり、照合機能を導入していない③包埋⑤提出ではインシデントが残存した。\n\n【考察】①受付②切り出し④薄切工程では、複数の識別対象を扱うため、目視確認のみでは確認漏れや取り違えが生じていた。検体照合機能の導入により作業が単純化し、作業者の注意力に依存していた確認作業がシステム上で担保され、ヒューマンエラーの低減に繋がったと考えられる。一方で、検体照合機能を導入していない③包埋⑤提出工程ではインシデントが残存しており、システム介入の有無がインシデント発生状況に影響した可能性があると考えられる。検体照合機能導入後2年しか経過していないため、今後もインシデント発生状況をモニタリングしていく必要がある。また、検体照合機能を導入していない工程についても、照合機能の追加・工程の見直しを行う必要がある。\n\n【結語】検体照合機能は病理検査工程におけるヒューマンエラー低減及び医療安全向上に寄与した可能性が示唆された。連絡先:058-251-1101 (内線:4030)", "sid": "s62"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:40", "et": "11:49", "title": "原因不明な血球貪食症候群の1剖検例", "sub": "", "author": "⻆谷 茉里恵", "akana": "カドヤ マリエ", "affil": "社会福祉法人 恩賜財団 済生会 松阪総合病院", "pref": "三重県", "co": ["山本 雄一", "丸井 理恵子", "林 豊", "福本 義輝"], "cokana": ["ヤマモト ユウイチ", "マルイ リエコ", "ハヤシ ユタカ", "フクモト ヨシテル"], "chairs": ["市川 孝昭（鈴鹿中央総合病院）"], "field": "病理", "cat1": "症例", "cat2": "病理組織検査全般", "no": 67, "pdf": "0067.pdf", "chkana": ["イチカワ タカアキ"], "body": "【はじめに】血球貪食症候群（以下HPS）とは活性化マクロファージによる血球の貪食を特徴とし、高熱、血球減少、凝固異常、肝障害等の症状を呈し、しばしば致死的な経過をたどる。今回我々は、臨床的にリンパ腫関連血球貪食症候群（LAHS）が疑われたものの、病理解剖においてもHPS発症の原因疾患の特定に至らなかった1例を経験したので報告する。\n\n【症例】74歳・男性。発熱持続しADLが低下したため当院 ER を受診。熱源精査にて入院となった。フェリチン45759.2 ng/mL、sIL2R 39786 U/mL と高値を示し、血小板3×10⁴/μLと低値を認めた。血球貪食症候群の診断基準5/8項目を満たした。EBV、CMV、HIV、HTLV1、膠原病に対する抗体検査結果からは血球貪食症候群の原因は特定できなかった。画像所見から著明な肝脾腫を認めたが、明らかなリンパ節腫脹を認めなかったため、血管内リンパ腫が鑑別疾患に挙げられた。診断目的にランダム皮膚生検が施行されたが、リンパ腫細胞は検出できなかった。後にステロイド療法が施行されたが永眠され、死因特定の目的で病理解剖が行われた。\n\n【解剖組織所見】病理解剖において骨髄、肝、脾でCD68陽性の貪食像を認めた。一方、皮膚を含め、各臓器でリンパ腫細胞は認めなかった。またEBER-ISHなどから感染症の所見も得られなかった。腎臓の間質に尿細管壊死、糸球体にフィブリン血栓が認められ、急性腎障害と診断された。\n\n【考察】本症例では血球貪食像が一部で認められた。しかしHPSに特異的な所見ではないことや、何視野に何個、血球貪食像があれば該当するといった定量的な診断基準もないことから病理所見のみで HPS を診断するのは困難であり、臨床の判断基準と病理所見での総合評価が重要であると考えられた。病理解剖を含めた精査においても原因疾患の特定には至らなかったことから感染症を含む何らかの疾患に伴うHPSの可能性が示唆された。発熱及び臓器不全に関しては、免疫系の過剰な活性化による炎症性サイトカインが制御不能に放出され、サイトカインストームが引き起こされたと考えられた。内線272", "sid": "s66"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:49", "et": "11:58", "title": "浸潤性乳癌におけるHER2評価の検討", "sub": "IHCスコアおよびFISH・DISH法の比較", "author": "菅原 雅", "akana": "スガワラ ミヤビ", "affil": "トヨタ記念病院", "pref": "愛知県", "co": ["和出 弘章", "竹田 美帆", "佐原 晴人", "川口 規子", "小笠原 将人", "杉本 邦彦"], "cokana": ["ワデ ヒロアキ", "タケダ ミホ", "サハラ ハルヒト", "カワグチ ノリコ", "オガサワラ マサト", "スギモト クニヒコ"], "chairs": ["市川 孝昭（鈴鹿中央総合病院）"], "field": "病理", "cat1": "基礎研究（検討）", "cat2": "免疫組織化学", "no": 68, "pdf": "0068.pdf", "chkana": ["イチカワ タカアキ"], "body": "【はじめに】近年、浸潤性乳癌のHER2低発現・超低発現におけるトラスツズマブデルクステカン(T-DXd)の登場により、HER2におけるコンパニオン診断の重要性が高まっている。当院では従来 Bondポリマーシステム HER2テスト(Leica社)を利用していたが、外注検査を併用し対応していた。その後、2025年4月にBench Mark ULTRA PLUS(ロシュ・ダイアグノスティクス社)を増設し、ベンタナ ultraView パスウェーHER2(4B5)の院内測定を開始した。また、同年8月にはベンタナインフォームDual ISH HER2キット(DISH)法を導入した。今回、DISH法の院内導入に伴い、IHC法による HER2 スコアおよび ISH における FISH と DISHの検査成績について後方的に検討した。\n\n【方法】2024年4月～2025年3月において浸潤性乳癌と診断され、HER2(IHC)を実施した 139 症例と 2025 年 8 月～2026年 3月までに HER2（4B5）を実施した 181症例における HER2 スコア分布を比較した。また各期間においてIHC2+症例に対し施行したFISH法41例とDISH法41例の結果を比較した。倫理委員会（整理番号R584）\n\n【結果】HER2(IHC)におけるスコア分布については Leica社0: 9例、1+: 67例、2+: 46例、3+: 17例。ロシュ社0: 30例、1+: 95 例、2+: 41 例、3+: 15 例であり Leica 社に比し、ロシュ社ではスコア0の割合が高かった。ISH法の検査成績についてはFISH法陰性34例、陽性4例、グループ 4 が 3 例。DISH 法陰性 33 例、陽性 8 例であり、分布に有意差を認めなかった。\n\n【考察】HER2（4B5）においてスコア0の割合が増加した背景として、超低発現（0+膜染色あり）の適応拡大の影響が示唆された。DISHでは技師 2名による判定後、病理医とのディスカッションを経て総合的に判定を行っている。外注検査での FISH検査では、グループ 4の報告で留まる場合が稀にあるものの、内製でのDISH検査ではグループ4の際にも「追加検討のアルゴリズム（乳癌HER2病理診断ガイドライン第 2版）」に基づき、最終的な判定まで行うことできる。確定診断に用いられるISH法において、明確で迅速な検査結果の提供は治療方針の早期選択に大いに貢献できるものと考えられた。 0565-28-0100(内線7238)", "sid": "s66"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "11:58", "et": "12:07", "title": "医療DXに関連した術中迅速遠隔病理診断の導入について", "sub": "", "author": "市岡 健人", "akana": "イチオカ ケント", "affil": "JA岐阜県厚生連  飛騨医療センター 久美愛厚生病院", "pref": "岐阜県", "co": ["岡村 明彦", "丹羽 慶樹", "中切 健太", "大栗田 香織", "永縄 雄一", "小林 聡", "加留部 謙之輔"], "cokana": ["オカムラ アキヒコ", "ニワ ヨシキ", "ナカギリ ケンタ", "オオクリタ カオリ", "ナガナワ ユウイチ", "コバヤシ サトシ", "カルベ ケンノスケ"], "chairs": ["市川 孝昭（鈴鹿中央総合病院）"], "field": "病理", "cat1": "システム化", "cat2": "その他", "no": 69, "pdf": "0069.pdf", "chkana": ["イチカワ タカアキ"], "body": "【はじめに】国内の病理専門医は非常に少なく、地域格差も大きな課題である。当院においても常勤病理医不在であり、従来は週1回非常勤病理医の勤務に合わせ、術中迅速診断を実施していた。医療DXはデジタル技術を活用した診療や業務効率化、医療の質向上を目指す取り組みとして注目されている。術中迅速診断においても、クラウド技術を用いることで遠隔地の病理医への診断依頼が可能となった。本システム導入により手術日程の制約解消が期待される。今回、我々は術中迅速遠隔病理診断導入の機会を得たので報告する。\n\n【方法】術中迅速遠隔病理診断導入にあたり、（1）人員（2）機器（3）通信環境の整備を行った。（1）名古屋大学医学部附属病院の協力を得て、術中迅速遠隔病理診断を担当する病理医を確保した。当院では臨床検査技師 2名で対応。（2）WSI（Whole Slide Imaging）として、管理医療機器クラスⅡ対応の NanoZoomer S20MD（浜松ホトニクス社製）、NAS（Network Attached Storage）（BUFFALO 社製）を新規購入した。（3）PaLaNA Cloud Service（一般社団法人PaLaNA Initiative）を採用した。二要素認証とゼロトラストネットワークアクセス（ZTNA）を導入し、セキュリティ対策を行った。\n\n【結果】導入前：69件/年、導入後：59件/年であり、そのうち術中迅速遠隔病理診断23件/年。実施臓器は肺、乳腺、胆管、その他。術中迅速遠隔病理診断導入により、従来困難であった日程や急を要する症例への対応が可能となり、手術精度の向上に寄与した。懸念事項であったバーチャルスライドアップロードに要する時間も許容範囲内であった。\n\n【考察】手術日程の制約や、天候による交通遅延の影響が解消されたことで、患者状態に合わせた柔軟な手術日の決定が可能となり、患者の利益向上に寄与したと考えられる。検査科においても、特定日に件数が集中し業務負担が大きかったが、実施日が分散したことで業務負担軽減に繋がった。\n\n【連絡先】JA岐阜厚生連 飛騨医療センター久美愛厚生病院0577-32-1115", "sid": "s66"}, {"kind": "一般演題", "day": 2, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "12:07", "et": "12:16", "title": "当院のAmoyDx®肺癌マルチ遺伝子PCRパネルの院内実施導入の課題抽出について", "sub": "", "author": "川村 勇人", "akana": "カワムラ ユウト", "affil": "岐阜大学医学部附属病院 病理部", "pref": "岐阜県", "co": ["中川 篤", "片桐 恭雄", "東 正子", "菊地 良介"], "cokana": ["ナカガワ アツシ", "カタギリ ヤスオ", "アズマ マサコ", "キクチ リョウスケ"], "chairs": ["市川 孝昭（鈴鹿中央総合病院）"], "field": "病理", "cat1": "その他", "cat2": "その他", "no": 70, "pdf": "0070.pdf", "chkana": ["イチカワ タカアキ"], "body": "【背景】肺癌患者の治療方針決定に対する遺伝子関連検査の件数は増加傾向にある。当院では、AmoyDx®肺癌マルチ遺伝子PCRパネル (Amoy検査)を2025年4月より院内導入した。\n\n【導入に向けた目標】検査を導入するにあたり、主に3点の目標を掲げた。①Turn-Around-Time (TAT)：外部委託よりも短い日数で結果報告すること。②薄切枚数及び範囲指定：無駄のない適切な組織量を決定すること。③ランニングコスト：3件以上同時に検査すること。\n\n【結果】ランニングコストを抑えるには3件以上同時に検査することが必要であったが、3件以上の検体が集まるまで検査を保留にするとTATが長くなるという問題が生じた。そこで臨床との協議を重ね、院内Amoy検査依頼受入期間を2週間に設定し、期間内に3件未満であっても検査を実施することとした。一方で、検査を依頼する日によっては外部委託した方が結果報告が早いこともあり、臨床には外部委託と院内検査の両方から選択できるようにし、治療開始時期の遅延の影響を最小限に抑えるよう調整した。また、検査精度を担保するため、核酸抽出後に核酸濃度を測定することで、必要検体量の推測が可能となった。特にRNAに関しては、外部委託のうち約 40％が「推奨濃度未満であり参考値」と報告されていたが、院内Amoy検査実施分のうち推奨濃度未満で参考値の報告をしたことは一度もなかった。\n\n【まとめ】呼吸器領域において遺伝子関連検査は重要なものとなっているが、検体の状態によっては検査項目を限定せざるを得ないことがある。当院で実施するAmoy検査においては、外部委託時よりも検体の使用量が減少し、かつ解析成功率が格段に向上した。一方で、患者がより早く治療を受けるために、TATの改善は今後の課題である。連絡先：058-230-7244", "sid": "s66"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:20", "et": "11:29", "title": "小児発症の高安動脈炎に合併した急性心筋梗塞の１例", "sub": "－de Winter Pattern および Shark fin signを認めた例－", "author": "新家 加奈子", "akana": "シンケ カナコ", "affil": "三重大学医学部附属病院", "pref": "三重県", "co": ["渡邊 孝康", "中山 裕介", "岡本 季苗", "下仮屋 雄二", "杉浦 英美喜", "杉本 和史"], "cokana": ["ワタナベ タカヤス", "ナカヤマ ユウスケ", "オカモト キナ", "シモカリヤ ユウジ", "スギウラ エミヨ", "スギモト カズシ"], "chairs": ["小川 剛汰（島田市立総合医療センター）"], "field": "生理", "cat1": "症例", "cat2": "心電図・その他生理学検査", "no": 71, "pdf": "0071.pdf", "chkana": ["オガワ コウタ"], "body": "【はじめに】高安動脈炎は若年女性に好発し, 大動脈およびその基幹動脈, 冠動脈, 肺動脈に炎症をきたす原因不明の血管炎である. 小児発症例は稀とされる. 今回, 本疾患に罹患した 10 代男児が急性心筋梗塞を合併し, 経過中の12 誘導心電図(ECG)において de Winter Pattern およびShark fin signを認めた稀少な症例を経験したため報告する.\n\n【症例】10代男児. 既往歴は片頭痛. 小学校で掃除後に頭痛, 腹痛, 胸痛を訴え意識消失し, 心肺停止状態となった.救急隊到着時は死戦期呼吸, 心電図は無脈性電気活動の状態であった. 当院搬送後, 心停止の原因として急性心筋梗塞が疑われ, 緊急冠動脈造影検査(eCAG)が施行された.\n\n【検査所見】救急外来でのECG (発症後41分)：洞調律, 心拍数 112bpm, de Winter Pattern を認めた. アンギオ室でのECG (発症後 82 分) : 異所性心房調律, 心拍数 78bpm, Ⅰ,aVL, V4～V6誘導でShark fin signを認め, 心室頻拍に移行した. eCAG : 左冠動脈主幹部に血栓性完全閉塞を認め, 経皮的冠動脈インターベンションが施行された.\n\n【経過】精査で右外頚動脈閉塞および右冠動脈, 左回旋枝,腹腔動脈, 上腸間膜動脈, 右腎動脈に狭窄が確認された.更に 18F-FDG-PET/CTにおいて病変部位に一致する集積を認めたため, 高安動脈炎と診断され治療が開始された.\n\n【考察】小児発症の急性心筋梗塞の病因として, 冠動脈の先天性異常や川崎病が挙げられるが, 本症例のような高安動脈炎も念頭に置く必要がある. 経過中のECGで認めたdeWinter Pattern は急性前壁心筋梗塞患者の早期に認められる所見であり, 左前下行枝近位部病変を示唆する. また,Shark fin signはST上昇型心筋梗塞の中でも, 本症例のような左冠動脈主幹部病変や左前下行枝近位部病変に関連し,重症心室不整脈と心原性ショックのリスクが高いことを示唆する稀少な所見である. これら 2つの特徴的な心電図サインは, 急性心筋梗塞の超急性期に左前下行枝近位部の亜閉塞から左冠動脈主幹部閉塞へ短時間で進展した病態を捉えたものと考える.\n\n【結語】小児発症の高安動脈炎に急性心筋梗塞を合併し,稀少な心電図変化を捉えた症例であるため報告する.連絡先：059‐231‐5244 (心電図室直通)", "sid": "s23"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:29", "et": "11:38", "title": "7日間ホルター心電計のランプ表示設定変更による影響の検討", "sub": "", "author": "吉田 希実", "akana": "ヨシダ キミ", "affil": "社会医療法人厚生会 中部国際医療センター", "pref": "岐阜県", "co": ["山口 明彦", "中田 万紀", "澤本 真吾", "澤田 美佳里", "安藤 志歩香", "森田 朋輝", "鈴木 敦"], "cokana": ["ヤマグチ アキヒコ", "ナカダ マキ", "サワモト シンゴ", "サワダ ミカリ", "アンドウ シホカ", "モリタ トモキ", "スズキ アツシ"], "chairs": ["小川 剛汰（島田市立総合医療センター）"], "field": "生理", "cat1": "試薬・機器", "cat2": "心電図・その他生理学検査", "no": 72, "pdf": "0072.pdf", "chkana": ["オガワ コウタ"], "body": "【背景】当院ではRootiRx（セティ社）を2025年6月より7日間ホルター心電計として採用した。本機種は、最長7日間の連続測定が可能な小型・軽量のホルター心電計である。しかしながら、記録不良時のランプ表示が明瞭に点灯するため患者からの問い合わせ件数が多く対応に苦慮する問題も発生している。そこで、患者からの問い合わせ軽減を目的としたランプ表示設定変更による影響を検討した。\n\n【対象及び方法】対象は 2025年 7月～2026年 5月に実施した 221 例（男性 117 例、平均年齢 65.6±16.8 歳）とし、そのうち設定変更前は157例、変更後は64例とした。記録不良時のランプ表示設定は、変更前は記録異常時に赤ランプが継続点灯する設定（設定①）、変更後はボタン押下時のみ状態表示を行う設定（設定②）とし、設定②では患者へ1日1回以上の自己確認を指導した。この変更前後における記録日数及びデータの有効性を比較検討した。データの有効性とは、総記録時間のうちノイズやフラット波形など解析不能時間を除外し、正常に心電図波形が取得され解析に利用可能であったデータの割合と定義した。\n\n【結果及び考察】記録日数では設定変更前が平均6.8日に対し、変更後は平均 6.9日と有意に延長した（p＜0.03）。これは設定①において、記録異常時に赤ランプが継続点灯することで電池消費が増加し、7日間未満で記録終了する症例がみられたためと考えられた。また、データの有効性では、変更前が平均92.6％に対し、変更後は平均95.1％と有意に改善した（p＜0.03）。これは、設定②では患者自身による確認操作を導入したことで、記録異常に早期対応できたことが要因と考えられた。一方、変更前に多かったランプ表示や記録状態に関する患者からの問い合わせは、変更後には認められなかった。\n\n【結語】本機種の表示設定変更は、患者からの問い合わせ軽減効果だけでなく、記録時間延長とデータの有効性の向上に寄与したといえる。連絡先ー0574-66-1100", "sid": "s23"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:38", "et": "11:47", "title": "生理検査レポートにおける報告書既読管理の取り組みについて", "sub": "", "author": "太田 恭平", "akana": "オオタ キョウヘイ", "affil": "富山市民病院", "pref": "富山県", "co": ["林 宏", "村椿 智佳子", "真田 かおり", "大下 恵", "橋北 和弥"], "cokana": ["ハヤシ ヒロシ", "ムラツバキ チカコ", "サナダ カオリ", "オオシタ メグミ", "ハシキタ カズヤ"], "chairs": ["小川 剛汰（島田市立総合医療センター）"], "field": "生理", "cat1": "その他", "cat2": "その他", "no": 73, "pdf": "0073.pdf", "chkana": ["オガワ コウタ"], "body": "【はじめに】2022年度診療報酬改定において「報告書管理体制加算」が新設され、当院では2023年４月より「報告書確認対策チーム」を発足した。生理検査レポートは「報告書管理体制加算」対象外ではあるが、確認漏れにより追加検査や迅速な処置・治療の遅延につながる重要な報告書として、2023年6月より生理機能検査レポートも管理対象に加えた。今回その取り組みの現状について報告する。【方法】管理対象は超音波検査を含む11種の生理検査レポートと し た 。 管 理 方 法 は 診 療 支 援 シ ス テ ム（CITAClinicalFinder）を利用した。検査実施後、レポート作成と同時に依頼医へ報告通知され、医師がレポートを閲覧し、既読ボタンを押すことで報告書の確認が完了となる。未読レポートに対しては、次の手順で管理を行った。①1週間未読：電子カルテメッセージで第1報、②2週間未読：第 2 報として電子カルテメッセージで催促と注意喚起、③3週間未読：依頼医の所属する診療部長へ未読医師リストを報告し、是正を依頼。これにより、依頼医に未読レポートを確実に確認してもらい、意識改善を促す体制を構築した。【結果】管理開始前は、依頼医に報告書の既読管理を委ねていたが、対策チームの発足で既読管理のバックアップができるようになった。未読レポートの現状（2026年6月25日）としては、1週間以上未読が５件、うち2週間以上未読が１件だった。管理開始以降、レポートの確認漏れに起因する重大なアクシデントの報告はない。【考察】未読レポートの発生要因として、非常勤医・異動等の勤務状況が挙げられた。過去にはレポート未読により、治療の遅延を及ぼした事例もあり、医師同士の密な連携や対策チームからのサポートが重要と考えられた。一方、レポートは閲覧しているが、既読操作を行わないために発生する未読レポートも存在した。よって、医師に運用を遵守してもらうことで対応の必要な未読レポートに絞り込め、迅速な対応や対策チームの負担軽減につながると考えられた。【まとめ】生理検査レポートにおける既読管理の取り組みについて報告した。報告書の管理が個人から組織的な管理体制となり、報告書確認の確実性が向上し、医療安全の強化につながった。代表076-422-1112（内線2232）", "sid": "s23"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:50", "et": "11:59", "title": "当院の生理検査室における術中神経モニタリングの取り組みについて", "sub": "", "author": "小出 彩名", "akana": "コイデ アヤナ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["松岡 真生", "大宮 琉奈", "三田村 有梨", "小路 達也", "飯田 佳子", "青木 美由紀", "長屋 麻紀"], "cokana": ["マツオカ マイ", "オオミヤ ルナ", "ミタムラ ユリ", "ショウジ タツヤ", "イイダ ケイコ", "アオキ ミユキ", "ナガヤ マキ"], "chairs": ["神谷 敏之（社会医療法人 蘇西厚生会 松波総合病院）"], "field": "生理", "cat1": "管理・教育", "cat2": "心電図・その他生理学検査", "no": 74, "pdf": "0074.pdf", "chkana": ["カミヤ トシユキ"], "body": "【はじめに】近年、医師の働き方改革としてタスク・シフト/シェアが推進され、これに伴い検査技師が実施可能な業務も拡大された。当院でも臨床工学部からの要望により、術中神経モニタリングを行うこととなった。その経緯と取り組み、今後の課題について報告する。【経緯】当院の術中神経モニタリングはこれまで医師が針電極の装着、臨床工学技士が針電極を除く電極の装着およびモニタリングを行っていた。法令改正によって検査技師が針電極を装着することが可能になったこともあり、業務を検査技師に引き継ぎたいと臨床工学部より要望があった。【取り組みと実績】当院で実施している術中神経モニタリングは脳神経外科と整形外科より依頼され、多くの術式を経験することが必要である。そのため、勉強会等で知識を得るとともに、臨床工学技士の指導のもと手術室での見学および研修を2名で開始した。また、検査室内での勉強会等で症例を共有し、様々な場面に対応できるようにしている。その後の検査技師教育では先に研修を開始した検査技師それぞれに付いて学び、現在は3名で実施している。検査技師のみでモニタリング業務が実施可能になった後、これまで医師が行っていた針電極の装着も医師の指導のもと開始した。2024年4月から2026年4月までの件数は、脳神経外科MEP 16件、BCR 8件、AMR 1件、整形外科MEP 16件、XLIF 8件の総件数49件であり、そのうち13件の手術で検査技師が針電極の装着に関わった。タスク・シフト/シェアにより他職種の業務軽減だけでなく、針電極の装着を検査技師が行うことで手技や波形の均質化が図られ、精度の安定化も期待できる。【今後の課題】現在 3名でモニタリング業務を行なっているが、他の検査業務との兼ね合いや緊急手術で術中神経モニタリングが必要となった際に人員を確保するのが困難な場合も多くあるため、担当者の増員が必要である。また、タスク・シフト/シェア以降実施経験のない、もしくは少ないモニタリングもあるためより多く経験を積む必要がある。【結語】担当者を増やすとともに、知識と経験を積み重ね精度の高い術中神経モニタリングを実施できるようにしていきたい。岐阜県総合医療センター生理検査室 058-246-1111(2653)", "sid": "s26"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "11:59", "et": "12:08", "title": "心電計における内部精度管理を実施することで測定環境の見直しを行えた事例", "sub": "", "author": "山中 美波", "akana": "ヤマナカ ミナミ", "affil": "社会福祉法人 恩賜財団 済生会松阪市民病院", "pref": "三重県", "co": ["井田 葉津季", "西尾 美帆", "中島 佳那子", "西村 はるか", "宇城 研悟"], "cokana": ["イダ ハヅキ", "ニシオ ミホ", "ナカシマ カナコ", "ニシムラ ハルカ", "ウシロ ケンゴ"], "chairs": ["神谷 敏之（社会医療法人 蘇西厚生会 松波総合病院）"], "field": "生理", "cat1": "精度管理", "cat2": "心電図・その他生理学検査", "no": 75, "pdf": "0075.pdf", "chkana": ["カミヤ トシユキ"], "body": "【はじめに】心電計の精度を担保するためには、機器点検だけでなく、内部精度管理を行う必要がある。当院においてこれまで標準物質による機器の内部精度管理は、呼吸機能検査機器しか行えていなかった。今回、心電計の新規購入を機に、標準物質による内部精度管理を始めた。【目的】心電計における標準物質（ECGチェッカ）を用いた内部精度管理の実施により、測定環境見直しの必要性に気づけたことを経験したので報告する。【方法】新たに導入した心電計①、②（共に日本光電工業株式会社製ECG‐2550）に対しECGチェッカAX-301Dを使用し、毎朝始業前に誘導コードを含めた心電計の動作点検及び内部精度管理を施行。尚、ECGチェッカは心電図検査を行うときに使用するベッド上に設置し測定した。【結果】心電計①は感度・周波数特性ともに規格内であったが、心電計②は感度のみ規格を外れることが多かった。原因検索のため、心電計の電極不良や機器の破損を確認したが異常は指摘できなかった。心電計②の周囲には、総合呼吸抵抗測定装置や呼気一酸化窒素測定装置などの検査機器があったため、周辺機器の電源をすべて切りプラグを抜いて、再度内部精度管理を行ったがやはり規格外であった。そこで電動ベッドのプラグを抜き、内部精度管理を行ってみると感度も規格内となった。\n\n【考察】当院では中央検査室で心電図検査を行う際は、いずれも電動ベッドで検査を行っているが、今回心電計②のみにおいて感度が規格外となった。心電計①の検査時に使用している電動ベッド上にECGチェッカを設置し、心電計②の内部精度管理を行ってみると規格内の結果となり、心電計②で検査をする際の電動ベッドに問題があることが推測された。現在、心電計②で検査を行う場合、電動ベッドのプラグを抜き検査を行っているが、病棟や電動ベッドを使用していない救急外来においても、今後測定環境の確認が必要であると思われる。【結語】内部精度管理を実施することで、人体や結果には影響しない程度ではあるが、交流障害の混入に気付き測定環境の見直しを行うことができた。内部精度管理を行うことは、機器の精度管理のみならず、周囲の測定環境をも整えることにつながる。連絡先：0598-23-1515（内線 2240）", "sid": "s26"}, {"kind": "一般演題", "day": 1, "ven": 4, "hall": "第４会場", "room": "大会議室B（４F）", "st": "12:08", "et": "12:17", "title": "Ⅱ度Wenckebach型洞房ブロックを鑑別し得た一例", "sub": "", "author": "土屋 実生", "akana": "ツチヤ ミウ", "affil": "大垣市民病院", "pref": "岐阜県", "co": ["今吉 由美", "伊藤 知子", "神谷 嘉彦", "清水 繁行", "西村 拓摩", "山田 直弥"], "cokana": ["イマヨシ ユミ", "イトウ トモコ", "カミヤ ヨシヒコ", "シミズ シゲユキ", "ニシムラ タクマ", "ヤマダ ナオヤ"], "chairs": ["神谷 敏之（社会医療法人 蘇西厚生会 松波総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心電図・その他生理学検査", "no": 76, "pdf": "0076.pdf", "chkana": ["カミヤ トシユキ"], "body": "【背景】洞房ブロック(SAB)は洞結節-心房間の伝導障害である。Ⅱ度 SAB は心電図上で鑑別可能で Mobitz 型とWenckebach型に分類される。今回、ホルター心電図でⅡ度Wenckebach型SABを鑑別し得た一例を報告する。\n\n【症例】70 歳代男性。既往歴は高血圧、発作性心房細動(PAF)。PAFに対してカテーテルアブレーション施行歴がある。術後フォローアップ目的でホルター心電図を施行。\n\n【心電図所見と臨床経過】ホルター心電図は終日洞調律。RR間隔延長が散見され、いずれもRR間隔延長部分にP波は認められなかった。RR間隔比 175%以上は 95件あり、内訳は洞停止(2.3-4.5sec)、PAC with block、その他であった。その他に分類したRR間隔延長部分では、PP間隔が徐々に短縮し、その後にP-QRS波が欠落するものと、P-QRS波が欠落する前後で PP間隔が整数倍になっているものがあり、これらをSAB疑いとした。最大4.5secの洞停止が認められ、患者のふらつき症状と一致したため後日ペースメーカ植込み術(PMI)を施行した。PMI後ふらつき症状は消失した。\n\n【総括】SABは洞不全症候群(SSS)のRubenstein分類Ⅱ群に該当する。心電図で確認されるⅡ度 SAB は Mobitz 型とWenckebach 型に分類され、Mobitz 型は突然洞房伝導が途絶するため、P-QRS波が欠落した際の PP間隔は洞調律時の整数倍となる。Wenckebach型は洞房伝導時間が漸増後途絶するが、伸び率は漸減するため、PP間隔が徐々に短縮した後、長いPP間隔が出現する。本症例はP波を伴わないRR間隔の延長を認め、PP間隔の変動の特徴から洞不整は否定され、また洞停止を認めたためⅡ度以上のSABが疑われた。Ⅱ度 Wenckebach型 SABは臨床的意義がないとされているが、PAC with blockや洞性不整脈との鑑別は必要と考える。SSSの一般的な原因には虚血性疾患や特発性変性が挙げられる。本症例では、それらの確証は得られなかった。一方で、PAF治療歴や高血圧の背景により、組織や電気的な変化、加齢による変化も加わることで、洞結節周囲の伝導機能に影響を及ぼした可能性があると考えられる。\n\n【結語】ホルター心電図解析で、Ⅱ度 Wenckebach型 SABを鑑別し得た一例を経験した。\n\n【連絡先】0584-81-3341(内線 1269)", "sid": "s26"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "08:50", "et": "08:59", "title": "脳波上で低振幅背景活動を示したNPSLEの症例", "sub": "", "author": "渡邉 颯真", "akana": "ワタナベ ソウマ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["伊藤 亜子", "井戸 捺海", "出口 和樹", "大島 康平", "髙田 彩永", "大澤 徳子", "菊地 良介"], "cokana": ["イトウ アコ", "イド ナツミ", "デグチ カズキ", "オオシマ コウヘイ", "タカダ アヤエ", "オオザワ ノリコ", "キクチ リョウスケ"], "chairs": ["鍋谷 洋介（トヨタ記念病院）"], "field": "生理", "cat1": "症例", "cat2": "脳波", "no": 77, "pdf": "0077.pdf", "chkana": ["ナベタニ ヨウスケ"], "body": "【 背 景 】 神 経 精 神 性 全 身 性 エ リ テ マ ト ー デ ス（neuropsychiatric systemic lupus erythematosus：NPSLE）は，全身性エリテマトーデスに伴う中枢神経病変であり，意識障害，精神症状，けいれんなど多彩な神経症状を呈する。脳波所見としては全般性徐波化が認められることが報告されている。今回，脳波検査において全般性に低振幅背景活動を示したNPSLEの症例を経験したため報告する。\n\n【症例】10代男性。20XX年X月下旬から発熱・倦怠感・脱毛・皮膚紅斑の症状が出現し，当院を受診後，精査目的で入院となった。血液検査では補体低下・血球減少・ANA陽性・DNA 抗体陽性を認め，SLE と診断された。しかし，神経症状として不安症状が出現したため，NPSLEを疑い中枢神経病変の評価目的として脳波検査を実施した。\n\n【結果】入院5日目の脳波検査では，覚醒時背景活動は後頭部優位の7–8Hzと軽度の徐波化を認めたが，明らかな全般性高振幅徐波は認めなかった。全誘導で20–40μV程度の低振幅傾向を示し，全体として活動性の低い脳波であった。また開眼によるα波抑制は不良であり，てんかん性放電は認めなかった。入院19日目の脳波検査では，後頭部優位律動は年齢相応の周波数に回復し，振幅もやや低めではあるが正常化した。\n\n【考察】NPSLEの診断は，特異的検査が存在しないため症状および各種検査所見を総合して行われる。脳波検査では全般性の徐波が代表的所見とされるが，本症例では若年者にもかかわらず背景活動が全般性に低振幅であり，老年性変化に類似した低活動性の脳波を呈した点が特徴的であった。このような低振幅化は，NPSLEにおける脳機能異常の多様性を示唆する所見の一つである可能性があると考えられる。\n\n【結語】NPSLEにおける脳波異常は徐波化のみならず，背景活動の低振幅化として出現する可能性がある。脳波所見の解釈には臨床症状との対比および経時的評価が重要である。連絡先：058-230-6000", "sid": "s5"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "08:59", "et": "09:08", "title": "不安特性と感覚情報処理との関連", "sub": "― 変化関連脳活動の抑制を用いた検討 ―", "author": "岡本 季苗", "akana": "オカモト キナ", "affil": "三重大学医学部附属病院", "pref": "三重県", "co": ["久富 一毅", "渡邊 孝康", "中山 裕介", "新家 加奈子", "下仮屋 雄二", "杉本 和史", "元村 英史"], "cokana": ["ヒサトミ カズキ", "ワタナベ タカヤス", "ナカヤマ ユウスケ", "シンケ カナコ", "シモカリヤ ユウジ", "スギモト カズシ", "モトムラ エイシ"], "chairs": ["鍋谷 洋介（トヨタ記念病院）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "脳波", "no": 78, "pdf": "0078.pdf", "chkana": ["ナベタニ ヨウスケ"], "body": "【はじめに】取り巻く環境の変化を速やかに捉える変化応答とあふれる情報の入力制御は、ともに基本的かつ重要な感覚情報処理活動である。連続音の音特性が変化すると、40～280 ms遅れて3相性の後期活動が誘発される。我々はこの変化関連脳活動振幅を指標とし、短潜時（50 ms）の脳内抑制系を評価する実験系を確立している。変化応答と感覚情報の入力制御は生存の上で極めて重要だとすると、不安とこれらの脳波指標に関連があると考えた。感覚情報処理に関わる抑制回路はいくつも存在し、長潜時（600 ms）の抑制系に関しては、ペアパルス刺激を用いた研究で不安とP50振幅抑制に関する報告がある。本研究では、自己記入式評価尺度である State-Trait Anxiety Inventory (STAI) を用い、不安が変化関連脳活動とその短潜時抑制に及ぼす影響を検証した。\n\n【方法】健常者55人を対象とし、高不安群、中間群と低不安群の3群に分類した。音刺激は100 Hzのクリック連発音(持続時間: 650 ms)を用いた。変化関連脳活動は物理的変化量や先行刺激の呈示時間による影響をうけるため、単一刺激条件では変化検出能を十分に評価できない。テスト刺激は音開始から400 ms後に音圧を10 dB増加させる基準テスト刺激、その他の音圧変化（+3, ＋5 dB）と先行刺激時間（50, 100 ms）のテスト刺激とした。更にコントロール刺激と330, 340, 350の3連続クリック音の音圧を10 dB下げたプレパルス刺激を加えた刺激音をランダムに呈示し、被験者には音刺激を無視するように指示した。Fz電極で記録された各テスト刺激に対する変化関連脳活動振幅を測定し、更にプレパルスによる抑制率を算出した。\n\n【結果】3群間に変化関連脳活動振幅には差がみられなかったが、プレパルス抑制率には有意差を認め、不安が強いほどプレパルス抑制率は低くなり、高不安群と低不安群の間で有意差を認めた。\n\n【考察】本研究結果と従来の報告と合わせ、少なくとも短潜時、長潜時のふたつの抑制系に不安が影響するようである。不安が強い状態では、意識的な制御ができない知覚・探知の段階において感覚情報のスムーズな処理が容易ではない可能性が示唆された。 連絡先 059-231-5244", "sid": "s5"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "09:08", "et": "09:17", "title": "音刺激により多彩な発作時脳波を捕捉した症候性てんかんの一例", "sub": "", "author": "坪井 日茉里", "akana": "ツボイ ヒマリ", "affil": "藤田医科大学病院 臨床検査部", "pref": "愛知県", "co": ["前田 圭介", "細田 奈未", "福本 純一", "工藤 千明", "藤田 志保", "刑部 恵介", "星 雅人"], "cokana": ["マエダ ケイスケ", "ホソダ ナミ", "フクモト ジュンイチ", "クドウ チアキ", "フジタ シホ", "オサカベ ケイスケ", "ホシ マサト"], "chairs": ["鍋谷 洋介（トヨタ記念病院）"], "field": "生理", "cat1": "症例", "cat2": "脳波", "no": 79, "pdf": "0079.pdf", "chkana": ["ナベタニ ヨウスケ"], "body": "【背景】発作時脳波は、てんかん性発作と非てんかん性発作の鑑別に有用であり、診断や治療方針が大きく進展・転換されることもあるため、発作時脳波を補足することは重要である。しかし、通常の検査時間内に発作を補足することは困難な場合が多い。今回我々は、特定の音刺激により誘発される症候性てんかんに対し、事前の詳細な臨床情報の共有により、多彩な発作時脳波を記録し得た一例を経験したので報告する。\n\n【症例】10代、女児。汎発性腹膜炎の術中心停止を契機とした低酸素脳症後より、症候性てんかんおよびミオクローヌス様運動を認めた。薬剤調整目的の発作時脳波記録のために脳波検査を施行した。発作補足のため、医師および患者付き添い者から発作情報を事前に詳細に聴取し、検査担当者間で共有した上で検査を実施した。\n\n【脳波所見】背景脳波は低振幅で不規則、発作間歇期は睡眠時に前頭部優位の棘徐波複合を認めた。音刺激により誘発される発作やミオクローヌスを複数補足することができ、発作時にはそれに対応した脳波変化を確認した。発作 1：アラーム音刺激により口部自動症が出現し、これに一致して全般性θ律動が誘発された。発作 2：非刺激下における無症候性発作では、前頭部優位のθ律動を認めた。発作3：突発的な金属音により誘発された発作では、驚愕反応に続き、叫声と共に顔面の左方回旋および四肢硬直が観察された。脳波変化は前頭部の徐波に始まり、回旋および硬直時には脳波活動の抑制がみられた。その後は左前頭部主体の高振幅鋭徐波複合が出現し、これに一致するミオクロニー発作が観察された。\n\n【結語】本症例は、音刺激の種類に応じた発作時脳波パターンの相違に加え、無症候性発作も認めるなど、多彩な発作関連所見が得られた一例であった。医師および患者家族から発作時の環境や刺激の特性、発作形態を共有することで、発作時脳波の補足が可能となった。本症例から、効率的な発作時脳波の補足において、臨床検査技師による能動的な情報収集と共有が重要であることが改めて示唆された。連絡先：藤田医科大学病院 臨床検査部TEL 0562-93-2296", "sid": "s5"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "09:17", "et": "09:26", "title": "SEEG（定位的頭蓋内脳波）が有用であった難治性てんかんの1例", "sub": "", "author": "鈴木 碧", "akana": "スズキ アオイ", "affil": "社会福祉法人聖隷福祉事業団 総合病院 聖隷三方原病院", "pref": "静岡県", "co": ["岡田 真実", "谷髙 由利子", "金子 洋子", "福田 淳"], "cokana": ["オカダ マコト", "ヤタカ ユリコ", "カネコ ヨウコ", "フクダ アツシ"], "chairs": ["鍋谷 洋介（トヨタ記念病院）"], "field": "生理", "cat1": "症例", "cat2": "脳波", "no": 80, "pdf": "0080.pdf", "chkana": ["ナベタニ ヨウスケ"], "body": "【背景】難治性てんかんにおいて発作焦点の同定は外科的治療の適応判断に重要である。従来の頭蓋内脳波検査は開頭による電極留置を要するが、2020年に保険収載されたSEEG（定位的頭蓋内脳波）は開頭を必要とせず、患者負担が少ない。今回、SEEGにより発作焦点を同定し得た難治性てんかんの1例を経験したため報告する。\n\n【症例】患者は10歳代後半男性。4歳よりてんかん発作を認め、以後複数の抗てんかん薬を試みるも発作の完全抑制には至っていなかった。MRIでは両側大脳半球に限局性構造異常を認め、結節の存在が示唆された。当院で実施した長時間ビデオ脳波検査では左側頭葉の結節付近に焦点が推定されたが特定には至らなかった。\n\n【方法・経過】発作焦点の同定を目的にSEEGを施行した。検査技師は、SEEG電極留置術時の術中脳波モニタリングに立ち会い、帰室後よりSEEGモニタリングを開始した。モニタリング期間中は毎日脳波波形を確認し、発作およびてんかん性放電の有無を評価して医師へ報告した。また、病室での電極状態の確認を行うなど、病棟看護師と連携しながら継続的なモニタリングを実施した。\n\n【結果】SEEGモニタリング中に 6回の過運動発作を認め、いずれも左側頭葉結節または左側頭葉先端から開始する発作時脳波を認めた。その後、医師が実施した発作誘発検査により、左側頭葉結節への刺激でてんかん波が誘発され、発作焦点は左側頭葉結節と同定した。今年3月に発作焦点切除術が行われ、術後2ヶ月時点で再発作を認めていない。\n\n【考察・結論】本症例では、長時間ビデオ脳波検査のみでは発作焦点の特定が困難であったが、SEEGにより焦点を同定することができ、外科的治療方針の決定に大きく寄与した。SEEGは難治性てんかんの焦点特定において極めて有用な手段であると考えられた。連絡先：053-436-1251（内線3560）", "sid": "s5"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "09:30", "et": "09:39", "title": "１２誘導心電図自動計測値による心房細動・心房期外収縮多発の鑑別に関する検討", "sub": "", "author": "飯野 天翔", "akana": "イイノ タカト", "affil": "一般財団法人 富士脳障害研究所付属病院", "pref": "静岡県", "co": ["杉山 聡"], "cokana": ["スギヤマ サトシ"], "chairs": ["三田村 有梨（地方独立行政法人 岐阜県総合医療センター）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "心電図・その他生理学検査", "no": 81, "pdf": "0081.pdf", "chkana": ["ミタムラ ユリ"], "body": "【はじめに】心房細動(Af)は、脳梗塞や心不全、全死亡のリスク上昇につながる疾患である。早期発見は臨床上重要だが、発作性心房細動(pAf)は検査時に発見できない場合も多い。心房期外収縮（PAC）が多発する場合も、Afへ移行するリスクがあり、早期発見が望ましい。検出方法やリスク診断として Holter心電図や AI心電図がある。しかし、Holter心電図は患者負担がゼロでない点や、台数に限りがある点、AI心電図は専用機器を購入する必要がある等の欠点が存在する。そこで、12誘導心電図の記録のみでAfをより効率的に予見するスクリーニング手法の検討を目的として、本研究を開始した。\n\n【方法】当院で実施したHolter心電図の解析結果、12誘導心電図の自動計測値を抽出しHolter心電図解析結果で、pAfが30秒以上の症例をAf群、PACが1000回以上の症例をPAC多発群、それ以外を対照群として群間の有意差を検討した。\n\n【結果】Af群に対し、それ以外の群を比較した場合、P波持続時間（133ms vs 115ms）をはじめ、4つの単一指標でp≦0.001 だった。PAC 多発群と対照群では、年齢でp<0.001、PR/P持続時間比（1.7 vs 1.5）をはじめでp<0.05だった。また、PAC多発群では、それ以外の群と比較しaVR P波陰性振幅（-59.9μV vs -72.4μV）が縮小する傾向を認めた。\n\n【考察】Af群では、4つの単一指標でp≦0.001となり、自動計測値でも強い有意差を認めた。PAC多発群と対照群の比較でaVR P波陰性振幅が縮小しており、対照群+Af群と比較しても同様の有意差を認めるため、PAC 多発のみかpAfに至っているかの鑑別の補助指標になると考えられる。有意差を認めていても群間の平均値や中央値の差が、0.04秒×0.1 mVに満たない指標が多く、自動解析による細かな計測で有意差を見いだせたと考えられる。\n\n【結語】12誘導心電図であっても、詳細な計測データを取得することでpAfやPAC多発症例の心電図変化を捉え、患者の鑑別ができる可能性を示唆している。今後はN数を増やし妥当性検証をしていきたい。富士脳障害研究所附属病院 - 0544-23-5155（内線580）", "sid": "s13"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "09:39", "et": "09:48", "title": "外傷性気胸を伴う心筋梗塞が検査技師の迅速なフィードバックにより診断に至った症例", "sub": "", "author": "坂本 悠斗", "akana": "サカモト ユウト", "affil": "日本赤十字社愛知医療センター 名古屋第二病院", "pref": "愛知県", "co": ["石神 弘子", "織田 典子", "枝光 泰聖", "岩田 英紘", "近藤 規明", "杉野 裕志"], "cokana": ["イシガミ ヒロコ", "オリタ ノリコ", "エダミツ ヤスマサ", "イワタ ヒデヒロ", "コンドウ ノリアキ", "スギノ ヒロシ"], "chairs": ["三田村 有梨（地方独立行政法人 岐阜県総合医療センター）"], "field": "生理", "cat1": "症例", "cat2": "心電図・その他生理学検査", "no": 82, "pdf": "0082.pdf", "chkana": ["ミタムラ ユリ"], "body": "【はじめに】気胸では特徴的な心電図変化を呈するが虚血性変化を伴った場合、その心電図判読は容易ではない。今回、外傷性気胸を伴う患者において臨床検査技師からの迅速なフィードバックを契機に診断に至った症例を経験したため報告する。\n\n【症例】60歳代男性。バイク運転中の単独転倒により左肩を強打。他院で外傷性気胸、肋骨骨折および左鎖骨骨折と診断され、胸部外傷管理目的に当院へ紹介受診となった。救急外来で全身評価および検査を行ったところ、状態は安定しており、一時帰宅となった。翌日の外来受診時の心電図検査でR波増高不良、Ⅱ、Ⅲ、aVf、V3-6のST上昇を認め、臨床検査技師よりパニック値として速やかに主治医へ報告するとともに心エコー検査の追加を提案した。骨折に伴う肩を中心とした痛みはあるが胸痛の自覚はなかった。前日の救急外来で記録された心電図とは著変なかった。血液検査でCK上昇を認めていたが心筋マーカーは未測定であった。パニック値報告後に追加検査が実施され、トロポニン T は0.760ng/mLと高値、心エコー検査で心尖部壁運動低下および心基部過収縮を認めた。たこつぼ型心筋症が疑われたが急性冠症候群も否定できず精査を行った。冠動脈造影でLAD 遠位部に責任病変を確認し急性心筋梗塞と診断され、経皮的冠動脈インターベンションにより血行再建を得た。\n\n【考察】本症例では、気胸を伴う胸部外傷手術前に心電図検査を実施していたが、外傷による疼痛は認められたものの、冠疾患を疑うような胸痛が認めなかったことから、初期評価では循環器疾患の可能性が十分に考慮されず、急性心筋梗塞の診断に至らなかった。翌日の再評価の際、臨床検査技師からの迅速なフィードバックにより追加検査が実施され、診断・治療に繋がったと考えられる。\n\n【結語】本症例は気胸を伴う外傷患者においても循環器疾患を鑑別に含める重要性を示すとともに、臨床検査技師による異常所見の検出と迅速なフィードバックが診断の転機となり得ることを示唆した。連絡先：052-832-1121（内線73606）", "sid": "s13"}, {"kind": "一般演題", "day": 1, "ven": 6, "hall": "第６会場", "room": "国際会議室（５F）", "st": "09:48", "et": "09:57", "title": "長時間ホルター心電図とヘッドアップティルト試験により診断に至った反射性失神の一例", "sub": "", "author": "磯村 優", "akana": "イソムラ ユウ", "affil": "医療法人 豊田会 刈谷豊田総合病院", "pref": "愛知県", "co": ["鈴木 優大", "伊藤 英史", "大嶋 剛史"], "cokana": ["スズキ ユウダイ", "イトウ エイジ", "オオシマ タケシ"], "chairs": ["三田村 有梨（地方独立行政法人 岐阜県総合医療センター）"], "field": "生理", "cat1": "症例", "cat2": "心電図・その他生理学検査", "no": 83, "pdf": "0083.pdf", "chkana": ["ミタムラ ユリ"], "body": "[はじめに] 反射性失神は、失神原因の約半数を占める。ヘッドアップティルト試験(head up tilt test：HUT)は、反射性失神の診断および病型分類に有用な検査である。今回、病歴聴取および 24時間ホルター心電図では診断に至らなかったが、長時間ホルター心電図と HUTの併用により確定診断に至った症例を経験したので報告する。[患者背景] 53歳男性。再発性失神を主訴に来院した。初発は2024年12月、自動車運転中の意識消失であった。その後、飲酒後や勤務中にも同様の発作を認め、計3回の失神を繰り返した。心エコーおよび24時間ホルター心電図では正常範囲内であった。終夜睡眠ポリソムノグラフィーでは軽症睡眠時無呼吸症候群(AHI=9.1)であり、関与は否定的であった。臨床経過および検査所見から反射性失神を疑い、さらなる精査を行った。[方法・結果] 原因精査のため長時間ホルター心電図（JSR株式会社Heartnote）を6日間施行したところ、最長4.43秒の洞停止を認めた。発作との明確な関連を特定するため、HUTを実施した。5分間の安静臥位後、60°で5分、70°で20分の立位負荷を行い、その後ニトロール錠 5mgを舌下投与した。投与 10 分後に血圧低下（138/100 → 86/61mmHg）および心拍数低下（93 → 40 /分）を認め、同時に洞停止と意識消失を生じたため検査を中止し臥位とした。以上より混合型反射性失神と診断に至った。治療として起立調節訓練を開始後、再発を認めていない。[考察] 本症例では、長時間ホルター心電図で異常所見を捉え、HUT併用により失神の発生機序と病型分類を明確に特定し得た。原因不明の失神に対し、多面的な生理機能評価を組み合わせる重要性が示唆された。臨床検査技師は、それぞれの検査特性を理解し、医師へ積極的に提案する役割が求められる。また、HUTのようなリスクを伴う検査の実施体制を整備・運用することは、検査技師の専門性を示すとともに、病院全体の診断精度向上に直結すると考える。連絡先：0566-25-8117", "sid": "s13"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:00", "et": "09:09", "title": "Vector Flow Mappingを用いて評価した左室のEnergy Lossと年齢の関係", "sub": "", "author": "津田 恵里花", "akana": "ツダ エリカ", "affil": "藤田医科大学病院 臨床検査部", "pref": "愛知県", "co": ["杉本 恵子", "杉山 博子", "東本 文香", "前田 圭介", "刑部 恵介", "市野 直浩"], "cokana": ["スギモト ケイコ", "スギヤマ ヒロコ", "ヒガシモト アヤカ", "マエダ ケイスケ", "オサカベ ケイスケ", "イチノ ナオヒロ"], "chairs": ["関根 綾子（岐阜大学医学部附属病院）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "心臓超音波", "no": 84, "pdf": "0084.pdf", "chkana": ["セキネ アヤコ"], "body": "【目的】Vector Flow Mapping（VFM）を用いて解析した左室のエネルギー損失(Energy Loss: EL)と年齢との関係を検討した。\n\n【対象】2020年7月～2024年2月に検査を施行しVFM解析可能な心エコー画像が得られ、明らかな心血管疾患が認められなかった35例と健常ボランティア9例の計44例(男性31例、女性13例、平均年齢54±19歳)を対象とした。\n\n【方法】心尖部左室長軸カラードプラ画像を DAS-RS1(富士フイルムヘルスケア社製)に取り込み、3心拍分のELを解析した。拡張期(d)および収縮期(s)の EL の面積総和値(AUC)の平均値(ELd AUC、ELs AUC)と Peak 値の平均値(ELd Peak、ELs Peak)を算出し、年齢との関係を検討した。\n\n【結果】拡張期と収縮期において年齢とELd、ELsの関係を検討したところ、ELd AUC(自然対数) (r = 0.27 , p < 0.05)、ELs AUC(r = 0.42 , p < 0.05)、ELs AUC(自然対数)(r = 0.59 , p< 0.001)、ELs Peak(r = 0.38 , p < 0.05)、ELs Peak(自然対数) (r= 0.57 , p < 0.001)で正の相関が認められた。また ELAUC(d/s)(r = -0.49 , p < 0.001)、EL AUC (d/s) (自然対数) (r =-0.46 , p < 0.05)、EL Peak(d/s)(r = -0.47 , p < 0.05)、ELPeak(d/s) (自然対数) (r = -0.50 , p < 0.001)で負の相関が認められた。心機能変化が生じ始めるとされる50歳を境界として若年群と高齢群に分類し、さらに、それぞれをELd AUCの中央値(7.5 J/m³)で2群に分類し検討を行った。その結果、若年群では心拍数(64.4±8.3 vs. 88.3±16.4 bpm , p < 0.01)、左室収縮末期径(34.0±1.9 vs. 30.1±4.1 mm , p < 0.05)、Ｅ波(67.4±13.1 vs. 91.8±20.2 cm/sec ,p < 0.05)、Ａ波(34.3±5.8 vs.55.6±15.1 cm/sec , p < 0.01)、E/e’(4.3±1.9 vs. 7.7±2.4,p < 0.05)で有意差が認められた。高齢群では下大静脈径(5.5±1.2 vs.6.9±1.4 mm , p < 0.01)で有意差が認められた。\n\n【考察・結語】健常者における ELは拡張期・収縮期ともに年齢と相関が認められたが、拡張期のELでは収縮期のELよりばらつきが大きく、年齢以外の因子の関与が示唆された。これらの結果は、ELと心疾患の関連を検討する際に有用となる可能性がある。連絡先 0562-93-2203", "sid": "s50"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:09", "et": "09:18", "title": "一過性プロテインS活性低下の関与が示唆された若年性心筋梗塞の一例", "sub": "", "author": "米山 里恵", "akana": "ヨネヤマ リエ", "affil": "地方独立行政法人 岐阜県総合医療センター", "pref": "岐阜県", "co": ["長屋 麻紀", "森島 妃那子", "林 和花", "林 大貴", "大塚 真子", "稲田 隆行", "山本 育美"], "cokana": ["ナガヤ マキ", "モリシマ ヒナコ", "ハヤシ アエカ", "ハヤシ ダイキ", "オオツカ マコ", "イナダ タカユキ", "ヤマモト イクミ"], "chairs": ["関根 綾子（岐阜大学医学部附属病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 85, "pdf": "0085.pdf", "chkana": ["セキネ アヤコ"], "body": "【症例】20代女性｡20XX年8月から月経不順に対し低用量経口避妊薬内服中｡同月下旬から息切れ､動悸を認め当院救急外来受診｡来院時の心電図は洞調律、心雑音は認めなかった｡血液検査でトロポニンI､CK､CKMB､NT-proBNPの上昇を認めた。虚血性心疾患の精査目的で行われた心臓CT検査は有意な狭窄を認めず経過観察目的で入院となった。経胸壁心エコー図検査はLVEF=56%(MOD法)､前壁中隔の壁運動低下、心筋シンチグラフィは前壁と下壁に取り込み低下を認めた｡低用量経口避妊薬内服歴より、プロテインS活性・抗原量低下を疑い測定を実施、活性及び抗原量は低下していた。凝固検査の異常は認めなかった。血管超音波検査も異常は認めなかった｡心筋梗塞の可能性が高く､心筋保護薬､β 遮断薬等の治療を開始した｡低用量経口避妊薬内服中止後の血液検査でプロテインＳ活性・抗原量は正常化した。心筋逸脱酵素は低下し､その他合併症も認めず経過良好で退院となった。\n\n【考察】本症例はプロテインS活性低下が示唆された冠動脈閉塞を伴わない心筋梗塞(myocardial infaction withnon-obstructive coronary arteries:MINOCA) が 疑 わ れ た ｡MINOCA は心外膜冠動脈に 50%以上の有意狭窄を認めない心筋障害で、急性心筋梗塞全体の約10%を占めるとされる｡原因として冠攣縮、プラーク破綻､突発性冠動脈解離、微小循環障害､冠動脈塞栓などが知られている。これらの背景因子として血栓性素因の関与も報告され、MINOCAの約14〜25%に認められる。その中でもプロテインS欠乏は稀である。低用量経口避妊薬に含まれるエストロゲンはプロテインS低下および減少を介して過凝固状態を来すと報告されている｡本症例では明らかな血栓は認めなかったが､一過性のプロテインS低下による血栓性機序が冠微小循環障害に関与した可能性が示唆された｡先天性プロテイン S欠乏症も鑑別に挙げられるが遺伝子検査は未施行であり､内服中止後にプロテインSが正常化したことから薬剤性の可能性が高いと考えられた｡若年女性の MINOCA は、低用量経口避妊薬に伴う一過性の血栓性素因の関与を考慮することが重要である。岐阜県総合医療センター-058-246-1111", "sid": "s50"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:18", "et": "09:27", "title": "心臓超音波で指摘できた大動脈弁の特殊弁尖形態異常を呈した２症例", "sub": "", "author": "藤原 真喜", "akana": "フジハラ マキ", "affil": "大垣市民病院", "pref": "岐阜県", "co": ["近藤 遼佳", "安田 慈", "北洞 久美子", "長谷川 千恵", "橋ノ口 由美子"], "cokana": ["コンドウ ハルカ", "ヤスダ シゲル", "キタホラ クミコ", "ハセガワ チエ", "ハシノクチ ユミコ"], "chairs": ["関根 綾子（岐阜大学医学部附属病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 86, "pdf": "0086.pdf", "chkana": ["セキネ アヤコ"], "body": "大動脈弁における先天性心疾患の１つとして、二尖弁などの弁尖形態異常があげられる。年齢を重ねるにつれて、大動脈弁狭窄症や大動脈弁閉鎖不全を引き起こす可能性があり、心不全を契機に発見されることもある。四尖弁は非常にまれな疾患である。二尖弁では癒合(raphe)の数や位置により3タイプに分類するSievers分類(Type 0-2)、四尖弁では各弁尖の相対的な大きさや形により７タイプに分類するHurwitzらの分類(Type A-G)が広く用いられている。症例１:70歳男性。心室性期外収縮で外来経過観察中であった。20xx-7年の経胸壁心臓超音波検査(以下、TTE)で左心系の拡大と中-高度大動脈弁逆流を認めた。その時に四尖弁も指摘されたが左室収縮能(以下、LVEF)は保たれており、引き続き外来経過観察となった。20xx年に行われたTTEでLVEF42％と低下、左室拡張末期径(以下、LVDd)48.8mmと以前より拡大傾向であったため精査目的で経食道超音波検査(以下、TEE)が行われた。TEEの結果、中等度の大動脈弁逆流と副冠尖と思われる余剰弁尖を含めた4枚の弁尖を認めた。Hurwitzらの分類でType Aと考えられた。症例２:81歳男性。息切れを主訴に当院受診。心電図は洞調律、胸部レントゲン検査で心拡大と胸水貯留を認めた。TTEではLVEF44％と低下、LVDｄ58.0mmと左室拡大、中-高度大動脈弁逆流を認め、心不全加療目的で入院となった。心臓カテーテル検査では冠動脈造影に異常はなく、大動脈造影で高度大動脈弁逆流を認めた。TEEでは、右冠尖-無冠尖間に完全癒合、無冠尖-左冠尖間に不完全癒合を認め、Sievers分類でType 2に近いと考えられた。心不全が軽快して退院、後日大動脈弁置換術が行われた。術中所見もTEEの所見と同様であった。考察:大動脈弁の形態を正確に評価することは治療方針に影響を与える可能性があり重要である。今回の2症例において、弁尖の形態異常を指摘し、詳細な評価を実施できたため、超音波検査は治療方針決定に有用であった。", "sid": "s50"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:27", "et": "09:36", "title": "拡張期優位血流を呈したバルサルバ洞動脈瘤破裂の一例", "sub": "", "author": "居原田 舞子", "akana": "イハラダ マイコ", "affil": "社会医療法人厚生会 中部国際医療センター", "pref": "岐阜県", "co": ["鈴木 敦", "吉賀 葵", "中田 万紀", "安藤 志歩香", "松田 奈々香", "森田 朋輝", "青山 琢磨"], "cokana": ["スズキ アツシ", "ヨシガ アオイ", "ナカダ マキ", "アンドウ シホカ", "マツダ ナナカ", "モリタ トモキ", "アオヤマ タクマ"], "chairs": ["関根 綾子（岐阜大学医学部附属病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 87, "pdf": "0087.pdf", "chkana": ["セキネ アヤコ"], "body": "【はじめに】バルサルバ洞動脈瘤は比較的稀な疾患であり、動脈瘤が破裂することにより症状が出現し発見されることが多い。今回、呼吸苦を主訴に紹介されたバルサルバ洞動脈瘤破裂の一症例を経験したので報告する。\n\n【症例】50代男性。1週間前より呼吸苦を自覚し前医を受診した。既往歴は特記すべきことなし。\n\n【心エコー図検査所見】経胸壁心エコー図検査にて、大動脈から右室へ流入する異常血流（Ao→RV）を認めた。拡張期に最大流速 4.84 m/s（最大圧較差 93.7 mmHg）と高流速を認め、Qp/Qs は 1.7 であった。左室拡張末期径（LVDd）58 mm、左房径（LAD）42 mm、左房容積係数（LAVI）41 mL/m²と左心系の拡大を認めた。左室駆出率（EF）は56％と保たれていた。三尖弁逆流はtrivialであり、右室拡張末期面積（RVEDA）の軽度拡大を認めたが、右心系収縮能は保たれており、明らかな右室圧負荷所見は認めなかった。精査目的に施行された経食道心エコー図検査では、大動脈弁右冠尖近傍に右室へ交通する破裂孔を認めた。カラードプラ法ではAo→RVの連続性短絡血流を確認した。収縮期には右冠尖が破裂孔を被覆するように可動し血流は減弱し、拡張期に増強する特徴的な血流動態を呈していた。\n\n【治療と経過】当院心臓血管外科にてバルサルバ洞動脈瘤破裂に対しパッチ閉鎖術を施行した。術中、大動脈弁右冠尖近傍に広がる動脈瘤を認めた。術後の心エコー図検査では短絡血流は消失し、左室拡張末期径（LVDd）は 51 mm、左房径（LAD）は38 mm、左房容積係数（LAVI）は27 mL/m²と改善を認め、経過良好であった。\n\n【まとめ】本症例では、収縮期に右冠尖が破裂孔を被覆することで拡張期優位の血流パターンを呈したと考えられた。短絡血流の時相変化に加え、大動脈弁近傍の弁尖動態を丁寧に観察することが重要であった。連絡先（0574-66-1100）", "sid": "s50"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:40", "et": "09:49", "title": "心房中隔脂肪性肥大を早期に指摘し得た１例", "sub": "", "author": "半田 希空", "akana": "ハンダ ノア", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["関根 綾子", "伊藤 亜衣梨", "加藤 遼", "中森 恵", "中村 真大", "中山 純里", "菊地 良介"], "cokana": ["セキネ アヤコ", "イトウ アイリ", "カトウ ハルカ", "ナカモリ メグミ", "ナカムラ モトヒロ", "ナカヤマ ジュリ", "キクチ リョウスケ"], "chairs": ["岸江 知哉（社会福祉法人 恩賜財団 済生会 松阪総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 88, "pdf": "0088.pdf", "chkana": ["キシエ トモヤ"], "body": "【はじめに】心房中隔脂肪性肥大(Lipomatous Hypertrophyof the Interatrial Septum : LHIS）は，心房中隔に脂肪組織が蓄積する病変であり，被膜を持たない腫瘍様増殖を特徴とする。高齢者や肥満者に多いとされ，基本的に良性疾患であるが，突然死や不整脈との関連も報告されている。\n\n【症例】60歳代女性。 20XX年，ふらつきを主訴に他院を受診，精査目的で当院脳神経内科へ紹介となった。小脳性運動失調症の精査過程で施行されたPET-CT検査にて心房中隔に結節状の18F-fluorodeoxyglucose（FDG）集積を認め，循環器内科へ紹介となった。\n\n【検査所見】経胸壁心エコー図検査（TTE）では，左室駆出率は70％であり，明らかな弁膜症は認められなかった。心房中隔に約10mmの肥厚所見を認めた。経食道心エコー図検査（TEE）でも，同様に心房中隔に約10mmの肥厚を認めた。また，卵円窩の肥厚は認められず，明らかなシャント血流は指摘されなかった。心臓単純 CT検査では，心房中隔に脂肪増生を伴う壁肥厚を認めた。心内膜脂肪と比較し，やや混濁する脂肪織であった。FDG-PETとのfusion画像では，脂肪増生に一致したFDG集積を認め，LHISと矛盾しない所見であった。\n\n【考察】LHISのTTEによる診断基準は心房中隔の肥厚が15mm以上で，卵円窩を通過する断面で特徴的なダンベル様の形態を示すとされる。本症例は厚さ10mmであったが，CTやFDG-PETの所見がLHISに矛盾せず，LHISと診断した。従来の診断基準は1983年頃に示されたもので，以後改定されていない。当時は画像解像度が低いため15mm以上でなければ診断困難であった可能性があるが，近年は CTやPETなどの画像診断能向上により，より早期段階で診断可能となったと考えられる。一般にTTEで心房中隔は心尖部四腔断面で評価困難な場合が多いが，心窩部アプローチにより比較的明瞭に描出できる。多断面評価で心房中隔肥厚を疑った場合，15mm未満であってもLHISを念頭にCTなど他モダリティでの追加評価を行う必要性が示唆された。\n\n【結語】稀な LHISの症例を経験した。TTEにおける心房中隔の多断面評価に加え，従来基準にとらわれない評価の必要性が示唆された。（連絡先058-230-7261）", "sid": "s53"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:49", "et": "09:58", "title": "下壁心筋梗塞に合併した心室中隔穿孔の一症例", "sub": "", "author": "市川 隼也", "akana": "イチカワ ジュンヤ", "affil": "三重県厚生農業協同組合連合会 松阪中央総合病院", "pref": "三重県", "co": ["山中 良之", "中西 繁夫", "林 美和", "石河 智子", "藪田 憲一", "上阪 浩矛"], "cokana": ["ヤマナカ ヨシユキ", "ナカニシ シゲオ", "ハヤシ ミワ", "イシカワ トモコ", "ヤブタ ケンイチ", "ウエサカ ヒロム"], "chairs": ["岸江 知哉（社会福祉法人 恩賜財団 済生会 松阪総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 89, "pdf": "0089.pdf", "chkana": ["キシエ トモヤ"], "body": "【はじめに】心室中隔穿孔（VSP）は、心筋梗塞の機械的合併症において全体の約0.2%と頻度が低く、内科的治療予後が不良な病態のため、早期発見と外科的修復が重要である。また前壁中隔梗塞では心室中隔心尖部に生じるのに対して、下壁梗塞では心室中隔基部に生じることが多い。心室中隔基部の VSP は解剖学的に複雑な形態を呈しやすいため、手術難易度が高いとされる。今回、心エコーにて発見された、下壁梗塞後の心室中隔基部に生じたVSPに対し､外科的修復が行われた一例を経験したため報告する。\n\n【症例】60歳代 男性\n\n【主訴】胸部不快感、軽労作呼吸苦\n\n【既往歴】高血圧・糖尿病・左下肢閉塞性動脈硬化症\n\n【現病歴】20xx年5月初旬、胸部不快感を自覚し、その3週間後、軽労作時の呼吸困難感を訴えた。他院において両側胸水貯留、心拡大を認めたため、当院に救急搬送された。\n\n【身体所見】BP 133/70mmHg、HR 120回/分、SpO₂ 97％\n\n【検査所見】トロポニンI 279 pg/ml、BNP 1783.9 pg/ml、 CK143 U/I\n\n【心電図所見】Ⅱ、Ⅲ、aVF誘導でST上昇、陰性T波\n\n【経過】入院時心エコー所見は、心室中隔基部に心室瘤、菲薄化を認めたが、VSP は認めず、Apical～Base Inferiorはsevere hypokinesis～akinesisであり、Modified Simpson法：EF 56.3%であった。入院翌週、収縮期心雑音を認めたため再度心エコー検査を実施すると、心室中隔基部の心室瘤にVSPを認めた。穿孔径φ23mm、LV to RVシャント血流速は 3.5m/sec、QP/QSは 2.1であった。VSP発覚翌週、VSPパッチ閉鎖術、三尖弁形成を行った。術後は経過良好で、術後リハビリを継続中である。\n\n【考察】本症例のVSPは下壁梗塞に合併した希少な例であった。下壁梗塞に生じるVSPは心室中隔基部に発生する頻度が高い報告があり、本例もその傾向と一致した。\n\n【結語】今回我々は心筋梗塞の経過観察中に発症した心室中隔基部のVSPに、心エコー検査が有用であった一例を経験した。心室瘤を認めた場合、VSPを念頭に置いて心エコー検査による経過観察が重要であると思われた。連絡先－0598-21-5252(内線：2875)", "sid": "s53"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "09:58", "et": "10:07", "title": "特徴的所見を捉えることが有用であった心房中隔脂肪性肥大の一例", "sub": "", "author": "伊藤 杏奈", "akana": "イトウ アンナ", "affil": "JA愛知厚生連 江南厚生病院", "pref": "愛知県", "co": ["小島 光司", "伊藤 智恵", "伊藤 康生", "舟橋 恵二", "榊原 慶祐", "髙田 康信"], "cokana": ["コジマ コウジ", "イトウ チエ", "イトウ ヤスオ", "フナハシ ケイジ", "サカキバラ ケイスケ", "タカダ ヤスノブ"], "chairs": ["岸江 知哉（社会福祉法人 恩賜財団 済生会 松阪総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 90, "pdf": "0090.pdf", "chkana": ["キシエ トモヤ"], "body": "【はじめに】心房中隔脂肪性肥大（LHAS）は心臓良性腫瘍の約10％という稀な疾患である．心エコー図検査（UCG）における診断基準は，心房中隔の肥厚が15mm以上であること，卵円窩は侵されず特徴的なダンベル様形態を有することなどとされている．今回，軽度の心房中隔肥厚であったが UCGにて特徴的な所見を捉えることにより，他の画像検査と併せてLHASと診断された症例を経験したので報告する.\n\n【症例】患者は 70代女性.インフルエンザ感染に伴う肺炎により当院を受診された方．経過観察を目的に実施されたPET検査により，心房中隔への放射性物質集積を指摘された．精査目的にUCG及びMRI検査を実施した．\n\n【UCG所見】左室収縮能は良好である．軽度の僧帽弁及び三尖弁，肺動脈弁逆流症を認めるが心拡大は認めない．心窩部アプローチにおいて心房中隔に最大11mmの肥厚を認める. 卵円窩肥厚は認めず心房中隔はダンベル様形態を呈する.\n\n【MRI所見】心房中隔の腫瘤様構造を認める．同部は T1・T2強調画像にて軽度高信号を認め，周波数選択的脂肪抑制法において信号低下を認める.\n\n【経過】MRI検査及びUCGにて心房肥大を認め，LHASと診断された．現在は経過良好であり，経過観察中である．\n\n【考察】本症例は心房中隔のダンベル様肥厚という特徴的な所見を示しているが，心房中隔肥厚が軽度であることから非典型的なLHASと考える．本症例のように診断基準に満たない軽度の心房中隔肥厚の場合では，心窩部アプローチによる心房中隔のダンベル様肥厚の検出が有用であり，その他画像検査と併せて臨床判断に寄与することが可能と考える.\n\n【まとめ】心房中隔肥厚が軽度である非典型的LHASの場合，心房中隔のダンベル様肥厚を捉えることで臨床診断の一助となることが示唆された． 連絡先：0587-51-3333", "sid": "s53"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:07", "et": "10:16", "title": "経胸壁心エコー図における非典型的短絡血流を呈したロングトンネル卵円孔開存の1例", "sub": "", "author": "中村 真大", "akana": "ナカムラ モトヒロ", "affil": "岐阜大学医学部附属病院", "pref": "岐阜県", "co": ["関根 綾子", "伊藤 亜衣梨", "加藤 遼", "加藤 憂朔", "中森 恵", "中山 純里", "菊地 良介"], "cokana": ["セキネ アヤコ", "イトウ アイリ", "カトウ ハルカ", "カトウ ユウサク", "ナカモリ メグミ", "ナカヤマ ジュリ", "キクチ リョウスケ"], "chairs": ["岸江 知哉（社会福祉法人 恩賜財団 済生会 松阪総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 91, "pdf": "0091.pdf", "chkana": ["キシエ トモヤ"], "body": "【背景】卵円孔開存（PFO）は成人の約20％に認められる心房中隔の形態異常であり，奇異性脳塞栓の原因として重要である．今回，経胸壁心エコー図（TTE）で評価に苦慮したロングトンネルPFOの一例を経験したので報告する．\n\n【症例】70歳代女性．20XX年3枝病変を伴う狭心症および重症大動脈弁狭窄症に対し，大動脈弁置換術，冠動脈バイパス術および PFO閉鎖術が施行され，経過観察目的でTTEを施行した．\n\n【心エコー図所見】検査時，上室性期外収縮二段脈であった．左室駆出率は61%で正常範囲内であり，僧帽弁両尖の弁輪部に石灰化を認め，軽度〜中等度の僧帽弁狭窄および左房拡大を認めた．三尖弁逆流は軽度で，最大三尖弁逆流速度は2.9m/sであった．カラードプラ法にて左房から右房への短絡血流を認めた．また，大動脈弁レベル短軸断面にて，収縮期に大動脈近傍から心房中隔に沿って心房天蓋へ向かう異常血流を認めたが，TTEのみでは起源の特定に至らなかった．後日施行した経食道心エコー図（TEE）にて，心房中隔の重なりが14mmと長いトンネル状構造を認め，ロングトンネルを伴うPFOおよび可動性心房中隔と診断された．\n\n【考察】本症例では，外科的PFO閉鎖術後であったが，非リウマチ性（あるいは石灰化性）僧帽弁狭窄の進行による左房拡大，左房圧上昇を契機に左→右短絡血流が顕在化した可能性が考えられた．一般に心房中隔の重なるトンネル長が10mm以上の場合をロングトンネルとよぶ．ロングトンネルPFOは解剖学的に複雑な形態を有することが報告されている．外科的閉鎖後においても、弁膜症などによる血行動態変化がPFOを再顕在化させうること，そして，ロングトンネルPFOは，短絡血流が非典型的な血流として観察されることを念頭に置き，総合的な評価を行うことが重要であると考えられた．（連絡先058-230-7261）", "sid": "s53"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:20", "et": "10:29", "title": "心不全を契機に発見された左房内悪性腫瘍の一症例", "sub": "", "author": "進士 祐希", "akana": "シンジ ユウキ", "affil": "地方独立行政法人知多半島総合医療機構 知多半島総合医療センター", "pref": "愛知県", "co": ["磯貝 美帆", "小山 裕香", "小泉 由喜奈", "花井 甲太郎", "宮地 千恵子"], "cokana": ["イソガイ ミホ", "コヤマ ヒロカ", "コイズミ ユキナ", "ハナイ コウタロウ", "ミヤジ チエコ"], "chairs": ["鈴木 駿輔（地方独立行政法人 静岡県立病院機構 静岡県立総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 92, "pdf": "0092.pdf", "chkana": ["スズキ シュンスケ"], "body": "【はじめに】心臓腫瘍は塞栓症や心不全等を契機に発見されることも多く，心臓超音波検査の果たす役割は大きい．今回我々は，左房内腫瘍により僧帽弁狭窄様の急激な血行動態破綻をきたし，術後の病理組織学的検査にて極めて稀な悪性腫瘍と診断された症例を経験したため報告する．\n\n【症例】40歳代女性．既往歴：喘息，高血圧．息切れを主訴に近医を受診，両側肺浸潤影を認め当院紹介．肺炎疑いで外来経過観察中，徐々に症状が増悪し精査目的にて入院となった．血液検査でBNP 562.7pg/mLと上昇，胸部X線で心拡大を認めたため，心臓超音波検査を施行した．\n\n【入院時心臓超音波検査】左房後壁に付着する最大径53.8×32.1mmの可動性のある腫瘍性病変を認めた．拡張期に腫瘍が僧帽弁口に陥入しており，平均左房―左室間圧較差は 16.2mmHg で重度の僧帽弁狭窄が示唆された．また，推定右室収縮期圧70.9mmHgと高値を示し，左室中隔の圧排を伴っていた． LVEF59.5%で左室収縮能は正常範囲であった．\n\n【経過】腫瘍による急性心不全と診断され，第7病日に腫瘍摘出手術と三尖弁輪形成術を施行．第20病日の心臓超音波検査では左房内異常構造物は認めず，左心房拡大や推定右室収縮期圧（20mmHg）の改善を認めた．術後病理組織学的検査の結果，極めて稀な悪性筋周皮腫（Malignantmyopericytoma）と確定診断された．\n\n【考察】左房内腫瘍の約9割は良性の粘液腫であり，卵円窩付近から発生することが典型的である．しかし本症例では，腫瘍は左房後壁側に認め，好発部位とは異なっていた．典型的な粘液種と異なる所見を認めた場合，悪性腫瘍の可能性を排除せず，入念な発生部位の観察や血行動態を迅速に臨床へ報告することが必要である．このような希少な悪性腫瘍において，迅速な病態把握と治療介入が救命において極めて重要であり，心臓超音波検査はその第一選択として不可欠な役割を担うと考えられた．\n\n【結語】今回我々は，急性心不全の原因特定から緊急手術に至るまで，心臓超音波検査が有用であった左房内悪性筋周皮腫の一例を経験した．連絡先：0569-89-0515（内線2021）", "sid": "s56"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:29", "et": "10:38", "title": "非典型的形態を呈し、鑑別に苦慮した心臓腫瘍の1例", "sub": "", "author": "北川 健太", "akana": "キタガワ ケンタ", "affil": "富山県厚生農業協同組合連合会 高岡病院", "pref": "富山県", "co": ["新保 美穂", "中出 慧", "上野 剛志", "金森 隆樹"], "cokana": ["シンボ ミホ", "ナカデ ケイ", "ウエノ タケシ", "カナモリ タカキ"], "chairs": ["鈴木 駿輔（地方独立行政法人 静岡県立病院機構 静岡県立総合病院）"], "field": "生理", "cat1": "症例", "cat2": "心臓超音波", "no": 93, "pdf": "0093.pdf", "chkana": ["スズキ シュンスケ"], "body": "【はじめに】原発性心臓腫瘍は約 75～85％が良性腫瘍で、粘液腫、脂肪腫、乳頭状線維弾性腫などがある。また左房粘液腫は最も多い良性心臓腫瘍であり、約 50%を占める。今回我々は、脳梗塞を契機に発見され特異な形態から鑑別に苦慮した心臓腫瘍の１例を経験したため報告する。\n\n【症例】57歳、男性 【主訴】呂律不良\n\n【既往歴/併存症】なし\n\n【現病歴】20XX年6月 呂律不良を職場で指摘されたため救急受診。神経診察で運動性失語を認め、頭部CTでは右前頭葉皮質の不明瞭化および前頭葉一部に低吸収域を認め急性期脳梗塞と診断し、同日入院。長期の喫煙歴および高血圧の指摘などアテローム血栓素因を認め、心電図で心房細動等を認めないため非心原性脳梗塞として加療となった。\n\n【来院時心電図所見】洞調律（74bpm）、ST-T変化なし\n\n【超音波所見】心原性脳梗塞の除外目的にて第六病日に心臓超音波を行った結果、左房内、卵円窩に付着する3～4cmの可動性構造物を認めた。ベッド仰臥位による検査施行のため有茎性の有無は描出困難であったが、形態は紐状で嵌頓所見は認めなかった。また左房内血栓も考えられた。\n\n【経過】多発脳梗塞を発症しており心原性塞栓と考えられ、経食道心臓超音波検査も検討されたが、再塞栓症のリスクが極めて高く致死的となる可能性があるため早急に緊急手術が必要と判断された。第八病日に心臓超音波検査と頭部CT再検となり、同日胸腔鏡下左房内腫瘍切除術が施行された。\n\n【考察】本症例の可動性構造物は紐状を呈していたため、ランブル疣贅や乳頭状線維弾性腫も鑑別にあがったが弁や弁近傍の心内膜からではなく、卵円窩付近から起始する可動性構造物であった。腫瘤の性状も脆弱であり左房から左室への順方向血流による持続的な牽引で形態が引き延ばされ紐状となることも推測された。\n\n【まとめ】非典型的形態を呈し、左房内血栓や索状病変などとの鑑別に苦慮した心臓腫瘍の１例を経験した。臨床側への迅速な情報提供を行ったことで、再塞栓症などの病態悪化を防ぐことに繋がった。", "sid": "s56"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:38", "et": "10:47", "title": "心臓超音波診断装置における自動計測機能の検討", "sub": "", "author": "村上 若菜", "akana": "ムラカミ ワカナ", "affil": "富山県厚生農業協同組合連合会 高岡病院", "pref": "富山県", "co": ["中出 慧", "北川 健太", "新保 美穂", "上野 剛志", "金森 隆樹"], "cokana": ["ナカデ ケイ", "キタガワ ケンタ", "シンボ ミホ", "ウエノ タケシ", "カナモリ タカキ"], "chairs": ["鈴木 駿輔（地方独立行政法人 静岡県立病院機構 静岡県立総合病院）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "心臓超音波", "no": 94, "pdf": "0094.pdf", "chkana": ["スズキ シュンスケ"], "body": "【はじめに】Auto EFは自動で心内膜がトレースされ、Disk法での左室収縮能（LVEF）計測を簡便に行うことができる機能である。技師間差の低減や検査時間の短縮が期待されるが、トレースが不完全な場合は検者の補正が必要となる。そこで今回、Auto EFと用手法での計測によるLVEF（以下Manual EF）を比較し、両者の測定値の差とAuto EFにおいて補正を必要とする症例の特徴について検討した。\n\n【対象と方法】対象は、心エコー図検査で心内膜の描出が比較的良好であった36例（左室壁運動異常12例、左室壁肥大3例、左室拡大5例を含む）である。装置はGE healthcare社の超音波診断装置Vivid E95 Ulutra edition R6を使用した。各症例において、心尖部二腔像および四腔像を描出し、2拍分の動画を超音波診断装置に保存した。動画を用いてManual EFとAuto EFを算出し、両者を比較した。\n\n【結果】Auto EFは Manual EFに対して低値を示す傾向を認めた。特に EFの差が大きい症例では、心内膜の自動トレースに明らかな誤差が認められた。トレースの不正確な部分は下壁、側壁、心尖部に多く見られ、肉柱や乳頭筋、腱索等を誤ってトレースしている症例が多かった。また、正常例と左室壁運動異常や左室壁肥大を伴う症例との間で、これらの傾向に有意な差は認められなかった。\n\n【考察と結論】本検討において、Auto EFは Manual EFと比較して低値となる傾向を認めた。Manual EFとの差が生じる要因としては、装置の心内膜認識が不十分であり、正確なトレースが行われていないことが考えられた。実際の心内膜とトレース位置の誤差は、下壁、側壁、心尖部で多く認められたが、これらは一般的に心内膜の描出が不良になりやすい部分である。また、左室壁運動異常や左室壁肥大の有無でこの特徴に大きく差が認められなかった。Auto EFは技師間差の低減や検査時間の短縮が期待される一方、検者による補正が必要である。最小限の補正でAutoEFを使用するためには、心内膜の描出を良好に記録することがトレース位置の精度の向上に最も重要である。連絡先：富山県厚生連高岡病院 0766-21-3930（内線3451）", "sid": "s56"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "10:47", "et": "10:56", "title": "Act ratioによる頸動脈狭窄の評価", "sub": "", "author": "佐藤 菜月", "akana": "サトウ ナツキ", "affil": "地方独立行政法人 静岡市立静岡病院", "pref": "静岡県", "co": ["佐野 史江", "楠山 美保", "鈴木 崇浩", "西野 諒", "中西 加奈", "尾崎 雅"], "cokana": ["サノ フミエ", "クスヤマ ミホ", "スズキ タカヒロ", "ニシノ リョウ", "ナカニシ カナ", "オザキ ミヤビ"], "chairs": ["鈴木 駿輔（地方独立行政法人 静岡県立病院機構 静岡県立総合病院）"], "field": "生理", "cat1": "基礎研究（検討）", "cat2": "その他の超音波", "no": 95, "pdf": "0095.pdf", "chkana": ["スズキ シュンスケ"], "body": "【目的】収縮期加速時間比（Act ratio）を用いた評価が「頸動脈病変の標準的評価法追補版2025」（日本超音波医学会）において提唱されたため、当検査室において導入可能か検討する。\n\n【対象】2025年10月7日から31日までに頸動脈超音波検査を施行した99名（男性58名、女性41名）、平均年齢72±14歳、検査件数197件（左右各1件としてカウント）。Area法による測定困難例は対象外とした。使用装置：Aplioi800およびi700（Canon製）。\n\n【方法】未治療血管を対象にArea法による狭窄の有無を正診とし、Act ratioによる狭窄判定について感度および特異度を算出した。\n\n【結果】検討の結果、感度52％、特異度72％であった。感度が低値のため再教育を実施し、測定手技の標準化を行った。追加検討として2025年11月17日から12月11日までの92名（男性67名、女性25名）、平均年齢75±11歳、検査件数184件を対象とした結果、感度59％、特異度81％となった。\n\n【考察】追加検討により感度、特異度がいずれも改善し、測定手技の標準化が精度向上に不可欠であることが示された。経験の浅い技師は描出不良がAct ratio測定に影響した症例が認められ、個人の技術向上が重要と考えられた。また、頸動脈の走行や分岐には個人差があり、解剖学的要因により描出困難となる症例も少なくない。このような場合には、他のモダリティによる狭窄評価も検討する必要がある。さらに、Area法は NASCET法と比較して狭窄を大きく評価する傾向があり、感度低値の一因と考えられた。測定手技の準拠により感度の上昇を認めたが、検査室で導入するためには低い結果となった。\n\n【結語】Act ratioはガイドラインに準拠した測定が不可欠である。一方、導入のためにはArea法に基づく適切なカットオフ値の検討を要する。連絡先 054-253-3125", "sid": "s56"}, {"kind": "一般演題", "day": 2, "ven": 5, "hall": "第５会場", "room": "大会議室C（４F）", "st": "11:00", "et": "11:09", "title": "整形外科術前検査におけるDダイマーと下肢静脈エコーの必要性の有無", "sub": "", "author": "寺田 彩葉", "akana": "テラダ アヤハ", "affil": "社会医療法人清光会 岐阜清流病院", "pref": "岐阜県", "co": ["興戸 友里", "中谷 恭子", "細川 愛子"], "cokana": ["オキド ユリ", "ナカタニ キョウコ", "ホソカワ アイコ"], "chairs": ["元地 進（医療法人社団 浅ノ川 浅ノ川総合病院）"], "field": "生理", "cat1": "統計学", "cat2": "その他の超音波", "no": 96, "pdf": "0096.pdf", "chkana": ["モトチ ススム"], "body": "【はじめに】整形外科下肢手術による合併症の一つに深部静脈血栓症(DVT)がある。当院では骨折や、人工関節置換術などの術前検査において DVTのスクリーニングとして Dダイマーの測定
